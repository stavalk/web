name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be used directly in `if`; probe first and expose as step output.
      # Gracefully skip the whole deploy when missing (no red X on forks/unconfigured repos).
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to auto-deploy."
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      # wrangler.jsonc is not committed; generate it from the committed placeholder template
      # and inject the real production resource ids from repo Variables:
      # CF_PROD_D1_ID / CF_PROD_KV_ID (required), CF_PROD_DOMAIN (optional).
      - if: steps.guard.outputs.enabled == 'true'
        name: Generate wrangler.jsonc
        env:
          CF_PROD_D1_ID: ${{ vars.CF_PROD_D1_ID }}
          CF_PROD_KV_ID: ${{ vars.CF_PROD_KV_ID }}
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: node .github/scripts/gen-wrangler.mjs
      # @cloudflare/vite-plugin bakes the bindings for the environment selected by
      # CLOUDFLARE_ENV at build time into dist/server/wrangler.json; `wrangler deploy`
      # reads that artifact, so the environment is chosen during build.
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm build
        env:
          CLOUDFLARE_ENV: production
      # Apply D1 migrations with the same production credentials before deploy so new code
      # never writes to missing columns (idempotent; no-op when there are no new migrations).
      - name: Apply D1 migrations
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROD_D1_NAME: ${{ vars.CF_PROD_D1_NAME }}
        run: npx wrangler d1 migrations apply "${CF_PROD_D1_NAME:-stavalk-db-prod}" --env production --remote
      # A missing Vectorize index makes deploy fail immediately (code 10159), so create the
      # three indexes idempotently first (top-level/staging/production bindings each refer to
      # one). wrangler answers "already exists"/duplicate_name; detect and skip those.
      - name: Ensure Vectorize indexes exist (idempotent)
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_VECTORIZE_INDEX: ${{ vars.CF_VECTORIZE_INDEX }}
        run: |
          set -e
          create_index() {
            local name="$1"; shift
            if npx wrangler vectorize create "$name" --dimensions=1024 --metric=cosine \
              --config wrangler.example.jsonc "$@" > /tmp/vz.log 2>&1; then
              echo "created $name"
            elif grep -qiE 'already exists|duplicate_name' /tmp/vz.log; then
              echo "exists (skip) $name"
            else
              cat /tmp/vz.log
              exit 1
            fi
          }
          IDX="${CF_VECTORIZE_INDEX:-stavalk-knowledge}"
          create_index "$IDX"
          create_index "$IDX-staging"
          create_index "$IDX-prod"
      # Site media (videos/PDFs/quality photos) stays in the repo as source files, but the
      # references already point at CDN links (https://assets.Stavalk.com/site/*). Upload
      # BEFORE deploy so the CDN links are reachable the moment new code goes live; --missing
      # is idempotent and only PUTs absent objects. Skipped (no red X) when R2 perms are absent.
      - name: Upload site assets to R2 (before deploy)
        if: steps.guard.outputs.enabled == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upload-site-assets.mjs --http --missing
      - name: Deploy to Cloudflare
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      # After each deploy, sync GitHub Secrets to Worker secrets (single source of truth; no
      # manual `wrangler secret put`). Keys unset/empty on GitHub are skipped (existing
      # Cloudflare values are preserved); to "delete" a key, blank it on GitHub first, then
      # clear it on the Cloudflare side.
      # After deploy, purge the CDN cache: marketing HTML is cached at the edge for 1 hour
      # (max-age=3600). Not purging would leave the window serving HTML that references
      # replaced hash assets (404). The token needs Zone-level Cache Purge permission;
      # absent zone/permission => skip without a red X.
      - name: Purge CDN cache
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          CDN_ZONE="${CF_PROD_DOMAIN:-Stavalk.com}"
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZHTTP=$(curl -sS -o /tmp/zones.json -w '%{http_code}' \
            "$API/zones?name=$CDN_ZONE&per_page=1" -H "$AUTH")
          if [ "$ZHTTP" != "200" ]; then
            echo "::notice::Zone lookup failed (HTTP $ZHTTP) - skip cache purge"
            exit 0
          fi
          ZID=$(jq -r '.result[0].id // ""' /tmp/zones.json)
          if [ -z "$ZID" ]; then
            echo "::notice::Zone $CDN_ZONE not in this account - skip cache purge"
            exit 0
          fi
          PHTTP=$(curl -sS -o /tmp/purge.json -w '%{http_code}' -X POST \
            "$API/zones/$ZID/purge_cache" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')
          if [ "$PHTTP" = "200" ] && jq -e '.success == true' /tmp/purge.json >/dev/null 2>&1; then
            echo "::notice::CDN cache purged - visitors hit the freshly deployed version"
          else
            echo "::notice::Cache purge skipped (HTTP $PHTTP) - token needs Zone + Cache Purge permission"
          fi
      # The cache is now empty and the hourly cron only warms once, so the cold window would
      # hit the Worker directly (TTFB 2-6s). Warm the edge immediately after deploy: fetch the
      # origin once (first render + waitUntil writes the cache), then sleep and confirm the hit.
      - name: Warm edge cache
        if: steps.guard.outputs.enabled == 'true'
        env:
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          CDN_ORIGIN="https://${CF_PROD_DOMAIN:-Stavalk.com}"
          for p in / /es /fr; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$CDN_ORIGIN$p")
            echo "warm $p first pass -> HTTP $code"
            sleep 2
            code2=$(curl -sS -o /dev/null -w '%{http_code}' "$CDN_ORIGIN$p")
            echo "warm $p second pass -> HTTP $code2"
          done
      - name: Sync Worker secrets
        if: steps.guard.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}
        run: |
          jq -n '{
            BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET,
            BETTER_AUTH_URL: env.BETTER_AUTH_URL,
            RESEND_API_KEY: env.RESEND_API_KEY,
            EMAIL_FROM: env.EMAIL_FROM,
            GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET,
            GITHUB_CLIENT_ID: env.GITHUB_CLIENT_ID,
            GITHUB_CLIENT_SECRET: env.GITHUB_CLIENT_SECRET,
            TURNSTILE_SITE_KEY: env.TURNSTILE_SITE_KEY,
            TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY,
            ADMIN_EMAILS: env.ADMIN_EMAILS,
            CF_ANALYTICS_TOKEN: env.CF_ANALYTICS_TOKEN,
            SENTRY_DSN: env.SENTRY_DSN,
            RESEND_AUDIENCE_ID: env.RESEND_AUDIENCE_ID,
            REINDEX_TOKEN: env.REINDEX_TOKEN
          } | with_entries(select(.value != null and .value != ""))' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json --env production
      # No manual upload workflow needed for new images: every deploy
      # backfills R2-missing objects (--missing only PUTs absent keys; existing
      # ones are skipped). Skipped when R2 credentials are absent.
      - name: Backfill missing images to R2
        if: steps.guard.outputs.enabled == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upload-stavalk-images.mjs --http --missing --src scripts/stavalk-images