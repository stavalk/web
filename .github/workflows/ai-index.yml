name: AI Index (Vectorize)
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  ensure-and-rebuild:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Secrets cannot be used directly in `if`; probe first and expose as step output
      # (same guard pattern as deploy.yml, avoids a red X on every run).
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping AI index steps."
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      # Indexes are account-level resources; the environment only affects the bound
      # index_name naming (all three are declared in wrangler.example.jsonc). Use the template
      # config; placeholders do not affect vectorize commands. Create is idempotent: respond to
      # "already exists"/duplicate_name and skip.
      - if: steps.guard.outputs.enabled == 'true'
        name: Ensure Vectorize indexes exist (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_VECTORIZE_INDEX: ${{ vars.CF_VECTORIZE_INDEX }}
        run: |
          set -e
          create_index() {
            local name="$1"; shift
            if npx wrangler vectorize create "$name" --dimensions=1024 --metric=cosine \
              --config wrangler.example.jsonc "$@" > /tmp/vz.log 2>&1; then
              echo "created $name"
            elif grep -qiE 'already exists|duplicate_name' /tmp/vz.log; then
              echo "exists (skip) $name"
            else
              cat /tmp/vz.log
              exit 1
            fi
          }
          IDX="${CF_VECTORIZE_INDEX:-stavalk-knowledge}"
          create_index "$IDX"
          create_index "$IDX-staging"
          create_index "$IDX-prod"
      # Rebuild the index right after deploy (/api/reindex is gated by the REINDEX_TOKEN on
      # the Worker). deploy.yml's secret sync step already pushed that token to the Worker.
      # Missing token => graceful skip; the daily 03:00 cron still rebuilds as a fallback.
      - if: steps.guard.outputs.enabled == 'true'
        name: Rebuild AI index on production
        env:
          REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          if [ -z "$REINDEX_TOKEN" ] || [ -z "$CF_PROD_DOMAIN" ]; then
            echo "::notice::REINDEX_TOKEN and CF_PROD_DOMAIN must both be set; skipping index rebuild (daily 03:00 cron will rebuild)."
            exit 0
          fi
          DOMAIN="${CF_PROD_DOMAIN:-Stavalk.com}"
          HTTP=$(curl -sS -o /tmp/reindex.json -w '%{http_code}' -X POST \
            "https://$DOMAIN/api/reindex" \
            -H "Authorization: Bearer $REINDEX_TOKEN")
          if [ "$HTTP" != "200" ]; then
            echo "::error::reindex failed (HTTP $HTTP): $(cat /tmp/reindex.json)"
            exit 1
          fi
          echo "reindex stats: $(cat /tmp/reindex.json)"
          jq -e '.ok == true and (.stats | type == "array" and length > 0)' /tmp/reindex.json
      # End-to-end smoke test: the public endpoint should return ok=true whether it serves
      # AI or falls back to FAQ mode.
      - if: steps.guard.outputs.enabled == 'true'
        name: Smoke-test the assistant endpoint
        env:
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          if [ -z "$CF_PROD_DOMAIN" ]; then
            echo "::notice::CF_PROD_DOMAIN not set; assistant smoke test skipped."
            exit 0
          fi
          DOMAIN="${CF_PROD_DOMAIN:-Stavalk.com}"
          HTTP=$(curl -sS -o /tmp/ask.json -w '%{http_code}' -X POST \
            "https://$DOMAIN/api/ask" \
            -H 'content-type: application/json' \
            -d '{"question":"What is your MOQ?","locale":"en"}')
          if [ "$HTTP" != "200" ] || ! jq -e '.ok == true' /tmp/ask.json >/dev/null; then
            echo "::error::ask smoke test failed (HTTP $HTTP): $(cat /tmp/ask.json)"
            exit 1
          fi
          echo "ask mode: $(jq -r '.mode' /tmp/ask.json)"