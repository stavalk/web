faqs:
  tagline: FAQ
  title: Questions fréquentes sur le contrôle qualité des étaux d'établi
  items:
    - q: "Comment Stavalk contrôle-t-il la qualité des étaux d'établi ?"
      a: "La qualité est contrôlée par l'inspection des matières entrantes, l'inspection de fonderie et de forgeage, la vérification d'usinage CNC, le contrôle du traitement thermique, les contrôles qualité d'assemblage, les essais finaux du produit, l'inspection du conditionnement et la traçabilité de production — chacun exécuté selon des échantillons, des spécifications et des critères d'inspection approuvés par le projet."
    - q: "Quelles inspections qualité sont effectuées pendant la production des étaux d'établi ?"
      a: "Les inspections incluent la vérification des matériaux, l'inspection de fonderie, l'inspection de forgeage, les contrôles d'usinage, l'essai de dureté du traitement thermique, la vérification de l'assemblage, l'essai de force de serrage, l'essai de dureté des mâchoires, la vérification du couple de rotation, l'inspection de l'apparence et la vérification du conditionnement."
    - q: "Les clients OEM peuvent-ils demander les enregistrements d'inspection des étaux d'établi ?"
      a: "Oui. Les enregistrements d'inspection et la documentation qualité peuvent être fournis selon les exigences du projet et les accords qualité clients, y compris des échantillons de rapports d'inspection avant expédition."
    - q: "Comment l'usine assure-t-elle la cohérence de la production OEM ?"
      a: "La cohérence de production est maintenue grâce aux échantillons approuvés, aux spécifications techniques, aux points de contrôle de fabrication, aux procédures d'inspection et aux processus de contrôle qualité documentés reliés à chaque commande."
    - q: "Puis-je organiser une inspection tierce partie par SGS, TÜV, BV ou Intertek ?"
      a: "Oui. Nous accueillons les inspecteurs tiers avec une zone d'inspection dédiée, des dynamomètres calibrés, des duromètres, des notes d'inspection pré-remplies et des enregistrements accessibles. Partagez votre spécification, votre échantillon approuvé, vos graphismes, vos exigences d'emballage et vos critères de défaut — ou utilisez notre modèle de note d'inspection tierce partie."
    - q: "Comment les modifications de graphismes, de BOM ou d'emballage sont-elles traitées pendant la production ?"
      a: "Les modifications sont enregistrées dans notre journal de contrôle des modifications avec la révision documentaire affectée, le résumé de modification, la raison, l'évaluation d'impact, le statut d'approbation client et le lot effectif. Les versions obsolètes sont retirées afin que la production et l'inspection utilisent toujours les documents approuvés en vigueur."
    - q: "L'usine soutient-elle les projets d'étaux d'établi personnalisés ?"
      a: "Oui. Les projets OEM/ODM d'étaux d'établi personnalisés sont soutenus selon les spécifications du client, les exigences de graphismes, les configurations d'accessoires et les besoins d'emballage, avec des critères d'inspection spécifiques au projet convenus avant la production."
    - q: "Un étau d'établi défectueux peut-il être repris à l'usine ?"
      a: "Oui — sous conditions contrôlées. L'étau est placé sur HOLD et relié à un NCR, le défaut est localisé avec une méthode de diagnostic approuvée, et la reprise ne procède qu'après autorisation QC/Ingénierie et uniquement dans les classes de défaut approuvées pour la reprise. L'étau est ensuite ré-inspecté selon les mêmes critères d'acceptation qu'un produit conforme avant libération."
    - q: "Combien de fois l'usine peut-elle reprendre un étau ?"
      a: "Un emplacement unique peut être repris une fois sous une instruction autorisée. Si la ré-inspection échoue encore, l'étau est escaladé pour remplacement, rejet, mise au rebut ou concession client — la reprise répétée sans approbation documentée n'est pas permise."

