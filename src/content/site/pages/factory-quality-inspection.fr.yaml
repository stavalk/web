hero:
  tagline: Inspection et assurance qualité
  title: Contrôle qualité des étaux d'établi personnalisés
  subtitle: "Stavalk applique des critères d'inspection spécifiques au projet tout au long de la préparation des matériaux, de la fonderie, du forgeage, de l'usinage CNC, du traitement thermique, de l'assemblage, des essais finaux, de l'emballage et de l'autorisation d'expédition. Les exigences qualité sont gérées dynamiquement en fonction de l'échantillon approuvé, de la spécification technique, de l'épreuve des graphismes, de la nomenclature (BOM) et des normes d'emballage convenues pour chaque commande OEM/ODM."
  actions:
    - text: Télécharger le pack d'assurance qualité
      variant: primary
      href: 'https://assets.Stavalk.com/site/downloads/STAVALK_Quality_Inspection_Standards.pdf?dl=1'
    - text: "Télécharger l'échantillon de pack qualité (PDF)"
      href: 'https://assets.Stavalk.com/site/downloads/STAVALK_Bench_Vise_Quality_Documentation_Pack.pdf?dl=1'
    - text: Demander des informations qualité OEM
      href: /fr/contact

answer:
  label: 'Réponse directe'
  text: "Stavalk contrôle la qualité des étaux d'établi par un système d'inspection à 7 portes : contrôle des matières entrantes (IQC), inspection de fonderie et de forgeage en cours de fabrication, vérification d'usinage CNC, contrôle du traitement thermique, contrôle qualité d'assemblage (IPQC), essais finaux du produit (FQC), et conditionnement et autorisation avant expédition (OQC). Chaque commande est inspectée par rapport à l'échantillon approuvé, à la spécification technique, à l'épreuve des graphismes, à la BOM et aux normes d'emballage, avec essais de force de serrage, vérification de la dureté des mâchoires, contrôle du couple de rotation de la base, précision dimensionnelle, confirmation des accessoires et traçabilité des lots. Les articles échouant aux critères d'acceptation sont placés sous blocage ou quarantaine contrôlée, repris uniquement sous instructions approuvées et ré-inspectés avant l'autorisation de libération."
  verified: '2026-09'

intro: "Notre système qualité est conçu pour les projets OEM/ODM : les critères d'inspection sont définis par commande, documentés et suivis par les équipes de production et de qualité de la matière entrante au conditionnement. Cela maintient l'alignement des attentes qualité entre l'usine et votre marque, du premier échantillon aux expéditions de conteneurs complets."

scope_note:
  tagline: Périmètre
  title: Critères d'inspection spécifiques au projet
  body: |
    Les spécifications qualité peuvent varier selon la construction de l'étau (par ex. usage léger à mâchoires 2″–5″, usage moyen 6″–8″, usage lourd 8″–10″, étaux pour tubes, étaux spéciaux), l'usage final prévu, les réglementations du marché cible et les paramètres approuvés par le client. L'autorisation de libération finale est strictement basée sur les critères d'inspection documentés convenus pour la commande.

stages:
  tagline: Cadre qualité
  title: Notre système de vérification qualité en 7 étapes
  subtitle: Une boucle QC complète de l'arrivée de la matière première à l'autorisation d'expédition.
  steps:
    - title: '1. Contrôle des matières entrantes (IQC)'
      desc: "Les matériaux et composants achetés sont vérifiés par rapport aux spécifications approuvées et aux échantillons de référence avant d'entrer sur la ligne de production. Les corps en fonte grise HT200/HT250 sont vérifiés pour la composition chimique, la résistance à la traction et la porosité de surface. Les composants en acier forgé 45# sont vérifiés pour la structure du grain, la dureté et les tolérances dimensionnelles. Les mâchoires en acier durci GCr15/Cr12MoV sont vérifiées pour la composition de l'alliage, le potentiel de dureté et la finition de surface. La quincaillerie, les fixations et les matériaux de revêtement sont appariés pour la quantité, la couleur, la marque, la précision du code-barres et la version des graphismes par rapport à la BOM approuvée."
    - title: '2. Inspection de fonderie et de forgeage'
      desc: "Les corps en fer coulé sont inspectés pour l'intégrité du moule, la température de coulée, le placement des masselottes et la solidification de la coulée. Les noyaux en sable vert et en sable aggloméré à la résine sont vérifiés pour la précision dimensionnelle et la finition de surface. Les composants en acier forgé sont vérifiés pour l'alignement de la matrice, la température de forgeage, l'ébavurage et la constance du poids par rapport aux dessins approuvés."
    - title: '3. Vérification d''usinage CNC (IPQC)'
      desc: "Les étapes critiques d'usinage sont inspectées pour détecter les non-conformités avant que les composants ne passent aux postes de travail suivants. Le fraisage du siège des mâchoires est vérifié pour la planéité, le parallélisme et la rugosité de surface par rapport aux dessins techniques approuvés. Le filetage et le perçage sont vérifiés pour le pas, la profondeur et la concentricité. L'usinage de la base pivotante est vérifié pour la fluidité de rotation, la position des crans et l'alignement des trous de montage."
    - title: '4. Contrôle du traitement thermique'
      desc: "Les composants traités thermiquement subissent une vérification obligatoire de dureté et métallurgique avant assemblage. Les mâchoires (GCr15/Cr12MoV) sont trempées et revenues pour atteindre une dureté de 58–62 HRC, vérifiée avec des duromètres calibrés. Les corps en fonte reçoivent un traitement de détente des contraintes pour garantir la stabilité dimensionnelle. Les composants en acier forgé reçoivent une trempe superficielle là où c'est spécifié. Tous les enregistrements de traitement thermique sont journalisés par lot avec les courbes de température et les temps de maintien."
    - title: '5. Contrôle qualité de l''assemblage'
      desc: "Les étaux terminés subissent une vérification d'assemblage avant les essais finaux. La rotation de la base pivotante est vérifiée pour un fonctionnement fluide et l'enclenchement des crans. Les mécanismes à dégagement rapide sont testés pour la force d'enclenchement et de désenclenchement. Les surfaces d'enclume sont vérifiées pour la planéité et la dureté. Le couple de serrage des boulons, le fonctionnement de la manivelle et l'alignement des mâchoires sont vérifiés selon les spécifications d'assemblage."
    - title: '6. Essais finaux du produit (FQC)'
      desc: "Les étaux terminés subissent des essais fonctionnels et structurels obligatoires avant l'approbation du conditionnement. La force de serrage est mesurée à la capacité nominale avec des dynamomètres calibrés. Le parallélisme des mâchoires est vérifié sous charge avec des comparateurs à cadran. Le couple de rotation de la base est testé sur toute la plage de rotation. L'essai de durabilité par cycles simule plus de 10 000 opérations d'ouverture-fermeture. L'essai de brouillard salin (48 h ou plus) vérifie l'intégrité du revêtement de surface sur peinture, poudre ou parkérisation."
    - title: '7. Conditionnement et autorisation avant expédition (OQC)'
      desc: "Une vérification complète avant expédition garantit zéro écart de configuration SKU ou de marques d'expédition. La complétude du kit recoupe l'étau, les fixations de montage, le manuel d'instructions et les accessoires spécifiques au client par rapport à la BOM de commande. Les contrôles d'emballage et de code-barres vérifient les marques des cartons, les étiquettes SKU, la lisibilité des code-barres, la langue du manuel et l'intégrité structurelle du carton. Les commandes ne sont libérées qu'après la signature de l'audit final d'emballage par un personnel qualité autorisé."

inspection_points:
  tagline: Couverture d'inspection
  title: Points de contrôle d'inspection clés
  subtitle: Chaque point de contrôle est exécuté selon des critères d'acceptation documentés convenus par commande.
  features:
    - icon: A
      icon_bg: blue
      title: Vérification de la force de serrage
      desc: "Les étaux terminés sont testés à la force de serrage nominale avec des dynamomètres calibrés. Les lectures de force sont enregistrées par unité et comparées à la spécification minimale. Tout étau dont la capacité nominale n'est pas atteinte est rejeté et acheminé vers le processus de non-conformité."
    - icon: B
      icon_bg: green
      title: Inspection visuelle et dimensionnelle
      desc: "Les étaux sont inspectés sous un éclairage adapté pour la finition de surface, les défauts de fonderie, les traces d'usinage, l'uniformité du revêtement, les rayures, la contamination et l'alignement de l'assemblage. Les dimensions clés et les positions des mâchoires sont vérifiées par rapport aux dessins ou spécifications approuvés."
    - icon: C
      icon_bg: purple
      title: Vérification des accessoires et de l'emballage
      desc: "La configuration complète du produit est vérifiée avant expédition : modèle d'étau, base pivotante, fixations de montage, manuel d'instructions et accessoires spécifiques au client — chacun apparié à l'échantillon approuvé, aux dessins et à la BOM."
    - icon: D
      icon_bg: orange
      title: Conditionnement et autorisation d'expédition
      desc: "Les unités emballées sont vérifiées pour la configuration SKU, la complétude des accessoires, les étiquettes produit, les informations de code-barres, la version du manuel, le marquage du carton, la quantité de conditionnement et l'état du carton. L'autorisation d'expédition n'est donnée qu'après complétion de toutes les exigences d'inspection et de conditionnement."

traceability_intro:
  tagline: Traçabilité des lots
  title: Système de traçabilité au niveau du projet et du lot
  body: |
    Chaque commande d'étau personnalisé est gérée sous un code projet unifié reliant les spécifications techniques, la BOM approuvée, les révisions de graphismes, les numéros de lot des matériaux, les références de conditionnement et les enregistrements d'inspection. Les enregistrements de production et d'inspection sont conservés par le projet et le lot de production applicables, et chaque lot peut être relié à la spécification produit approuvée, à la BOM, aux graphismes et aux références de conditionnement.

    Cela soutient une revue efficace de la configuration produit, du statut d'inspection et du périmètre affecté lorsqu'un problème qualité est identifié — du produit fini aux enregistrements sources en utilisant l'identification de l'étau ou du carton.

traceability_chain:
  tagline: Chaîne de traçabilité
  title: Du code projet à l'autorisation d'expédition
  subtitle: Une chaîne de références contrôlées de la confirmation de commande à l'expédition autorisée.
  steps:
    - step: '01'
      title: Code projet
      desc: Référence de projet unifiée qui relie chaque document contrôlé à la commande.
    - step: '02'
      title: Révisions de documents
      desc: Niveaux de révision actuels de la spécification, de la BOM, des graphismes et du conditionnement — seules les versions approuvées sont valides pour la production.
    - step: '03'
      title: Lot et matériaux
      desc: Lots de matériaux et de composants enregistrés contre le lot de production.
    - step: '04'
      title: Enregistrements d'inspection
      desc: Résultats d'inspection IQC, de fonderie, d'usinage, de traitement thermique, d'assemblage, finale et de conditionnement par lot.
    - step: '05'
      title: Conditionnement et libération
      desc: Lot de conditionnement, statut de clôture NCR et résumé d'autorisation d'expédition.

traceability_sample:
  tagline: Échantillon anonymisé
  title: Enregistrement de contrôle de traçabilité (Démo)
  body: |
    Les valeurs de démonstration sont affichées à titre d'illustration uniquement — les noms de clients, numéros de bons de commande, graphismes personnalisés, données fournisseurs et informations commerciales sont supprimés pour protéger la confidentialité.

    - **Fabricant :** Stavalk (Qingdao, Chine)
    - **Code projet :** DEMO-VISE-2026-01
    - **Référence SKU :** DEMO-BV-600
    - **Lot de production :** BATCH-SEP-01
    - **Révision Spécification / BOM / Graphismes :** Rev B / Rev C / Rev B
    - **Essai de force de serrage :** RÉUSSI — conservé par lot
    - **Statut d'inspection :** RÉUSSI
    - **Statut d'expédition :** LIBÉRÉ

quarantine_intro:
  tagline: Contrôle des non-conformités
  title: Contrôle des produits non conformes et mise en quarantaine
  body: |
    Les produits ou composants qui ne respectent pas les critères d'acceptation définis sont clairement identifiés et placés sous statut de blocage ou de quarantaine contrôlé. Ils ne peuvent pas passer à l'étape de production suivante, au conditionnement ou à l'expédition jusqu'à ce qu'une disposition autorisée soit complétée. La reprise est effectuée sous instructions approuvées et reliée à l'enregistrement de non-conformité concerné ; les articles repris sont ré-inspectés selon les exigences de projet applicables avant la libération qualité.

quarantine_flow:
  tagline: Flux de contrôle en 7 étapes
  title: Que se passe-t-il lorsqu'une non-conformité est trouvée
  subtitle: Identifier, contrôler, corriger, vérifier — puis libérer ou rejeter. Le produit non conforme ne retourne jamais dans la production ou le conditionnement sans contrôle.
  steps:
    - step: '01'
      title: Identifier
      desc: La non-conformité est enregistrée contre le produit, le SKU, le lot ou l'étape de processus affecté.
    - step: '02'
      title: Étiqueter
      desc: Les articles affectés sont clairement identifiés avec des étiquettes de statut contrôlées — HOLD, QUARANTINE ou REJECTED.
    - step: '03'
      title: Mettre en quarantaine
      desc: Les articles sont séparés dans une zone de quarantaine physiquement contrôlée ou contrôlée par système pour empêcher toute utilisation ou expédition involontaire.
    - step: '04'
      title: Évaluer le périmètre
      desc: Le périmètre affecté est revu par lot, étape de processus, lot de matériau et révision de document.
    - step: '05'
      title: Reprendre / remplacer
      desc: La correction n'est permise que par une disposition approuvée et une instruction de travail contrôlée.
    - step: '06'
      title: Ré-inspecter
      desc: Les articles corrigés sont ré-inspectés selon les critères d'acceptation applicables avant libération.
    - step: '07'
      title: Libérer ou rejeter
      desc: Seul le produit conforme autorisé passe au conditionnement ou à l'autorisation d'expédition.

quarantine_evidence:
  tagline: Sur le sol d'usine
  title: Essais contrôlés et quarantaine en pratique
  subtitle: Les photos de notre atelier de Qingdao montrent comment le contrôle de statut et les enregistrements d'inspection sont appliqués sur site.
  features:
    - image: https://assets.Stavalk.com/site/quality/qc-hold-quarantine-station.avif
      alt: Feuilles de contrôle QC et étiquettes de statut de blocage contrôlé au poste d'inspection de l'usine
      title: Poste de blocage et de quarantaine
      desc: "Poste d'inspection avec feuilles de contrôle QC et étiquetage de statut. Tout article échouant aux critères d'acceptation est étiqueté, enregistré et déplacé en quarantaine — il ne peut pas passer au conditionnement jusqu'à ce qu'une disposition autorisée et une ré-inspection obligatoire soient complétées."
    - image: https://assets.Stavalk.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Démonstration en atelier de la séparation de quarantaine contrôlée dans l'usine de Qingdao
      title: Démonstration de la zone de quarantaine
      desc: "Photo de démonstration de l'atelier montrant comment fonctionne la séparation de quarantaine contrôlée sur site : les unités séparées sont maintenues sous contrôle de statut jusqu'à ce qu'une disposition autorisée soit complétée."

rework_intro:
  tagline: Gouvernance de la reprise
  title: Gouvernance contrôlée des non-conformités et de la reprise
  body: |
    Chez Stavalk, la reprise est définie strictement comme la restauration d'une unité non conforme à la pleine conformité avec sa spécification d'ingénierie d'origine — pas comme un correctif rapide. Tout étau identifié avec une non-conformité de qualité est placé sous blocage contrôlé et relié à un Rapport de Non-Conformité (NCR) avant tout traitement ultérieur ; la source du défaut est localisée et enregistrée en utilisant la méthode de diagnostic approuvée.

    La reprise ne peut avoir lieu que lorsque le défaut est dans le périmètre de reprise approuvé et qu'une méthode autorisée est disponible. L'instruction de reprise identifie le produit, le lot, l'emplacement du défaut, le matériau approuvé, la méthode, les conditions requises et le périmètre de ré-inspection. Après le processus requis, l'étau est ré-inspecté selon les mêmes critères d'acceptation applicables qu'un produit conforme — la reprise ne réduit jamais la norme d'acceptation. L'échec de la ré-inspection exige une nouvelle disposition d'ingénierie et de qualité ; la reprise répétée n'est pas permise sans approbation documentée.

rework_decision:
  tagline: Flux interactif
  title: Flux de décision de reprise — cliquez sur n'importe quel nœud
  subtitle: Suivez comment une non-conformité est traitée de la détection à la libération ou à la mise au rebut. Cliquez sur un nœud pour développer les exigences de contrôle à cette étape.
  nodes:
    - id: detect
      type: start
      label: Défaut détecté
      detail: "Une non-conformité de qualité est identifiée lors de l'inspection — échec de force de serrage, dureté de mâchoire inférieure à la spécification, défaut de surface ou défaut de fabrication connexe."
    - id: hold
      type: step
      label: Arrêt de ligne · étiquette HOLD · NCR
      detail: "Le traitement s'arrête. L'identifiant de l'étau, le code produit, le lot, le poste de travail, la date et l'inspecteur sont enregistrés ; une étiquette HOLD / QUARANTINE est apposée et un NCR est ouvert contre la révision de spécification applicable."
    - id: locate
      type: step
      label: Localiser la source du défaut
      detail: "Le défaut est localisé avec la méthode approuvée — inspection visuelle, essai de dureté calibré, mesure dimensionnelle ou essai de force avec des équipements calibrés."
    - id: classify
      type: step
      label: Classifier le défaut (A–G)
      detail: "Le défaut est classé contre la matrice d'approbation : A finition de surface, B dimensionnel, C dureté, D force de serrage, E mécanisme pivotant, F revêtement, G structurel."
    - id: authorize
      type: decision
      label: Reprise autorisée ?
      yes: rework
      no: escalate
      detail: "La QC confirme la catégorie de défaut et l'Ingénierie examine si l'étau peut être restauré à sa spécification d'origine. L'autorisation enregistre la carte de méthode, les matériaux, les conditions et le périmètre de ré-inspection — ou achemine vers le remplacement, le rejet, la mise au rebut ou la concession client."
    - id: rework
      type: step
      label: Reprise contrôlée
      detail: "Exécutée uniquement dans la limite de défaut approuvée en utilisant la carte de méthode, le lot de matériau et l'outillage approuvés — sans jamais modifier les dimensions, la construction, la finition de surface ou les exigences d'emballage."
    - id: cure
      type: step
      label: Processus et stabilisation
      detail: "L'étau reste sur HOLD pendant le processus de reprise défini par l'instruction de matériau et de processus approuvée, puis reçoit un pré-contrôle visuel et dimensionnel."
    - id: reinspect
      type: decision
      label: Ré-inspection réussie ?
      yes: release
      no: escalate
      detail: "L'étau est testé selon les critères de ré-inspection approuvés par le projet et l'échec d'origine plus toutes les caractéristiques potentiellement affectées sont re-vérifiés — force de serrage, dureté de mâchoire, précision dimensionnelle, intégrité du revêtement et apparence. La reprise ne réduit jamais la norme d'acceptation."
    - id: release
      type: release
      label: Libération qualité
      detail: "La Qualité revoit le NCR clôturé, l'enregistrement de reprise et le résultat de ré-inspection et autorise la libération. Aucun étau repris n'est conditionné ou expédié sans libération qualité autorisée."
    - id: escalate
      type: escalate
      label: Escalader — remplacer / mettre au rebut / concession
      detail: "Pas de reprise répétée sans approbation documentée. L'étau achemine vers le remplacement, le rejet, la mise au rebut ou une concession écrite du client lorsqu'il ne peut pas être restauré à la spécification d'origine."

defect_matrix:
  tagline: Classification des défauts
  title: Matrice de classification des défauts et d'approbation
  subtitle: Tous les défauts ne sont pas repris — chaque défaut est classé et sa disposition approuvée au bon niveau, de l'inspecteur QC au directeur d'usine.
  headers:
    category: Catégorie de défaut
    area: Zone typique
    eligibility: Éligibilité à la reprise
    approval: Approbation requise
  rows:
    - category: 'Classe A — Finition de surface'
      area: 'Surface de fonderie, surface usinée, finition du revêtement'
      eligibility: 'Reprise standard autorisée'
      approval: 'Inspecteur QC'
    - category: 'Classe B — Dimensionnel'
      area: 'Parallélisme des mâchoires, diamètre d''alésage, pas de filetage'
      eligibility: "Reprise évaluée selon la carte de méthode approuvée"
      approval: 'QC + Ingénierie'
    - category: 'Classe C — Dureté'
      area: "Dureté de mâchoire inférieure à la spécification de 58 HRC"
      eligibility: "Autorisé uniquement quand un nouveau traitement thermique est possible"
      approval: 'QC + Ingénierie'
    - category: 'Classe D — Force de serrage'
      area: 'Sortie de force inférieure à la capacité nominale'
      eligibility: "Haut risque ; disposition d'ingénierie stricte requise"
      approval: 'Ingénierie + Responsable QA'
    - category: 'Classe E — Mécanisme pivotant'
      area: "Rotation de la base, crans, défaillance du dégagement rapide"
      eligibility: "Reprise standard non autorisée — remplacement ou revue de cause racine"
      approval: 'Responsable QA + Concession client'
    - category: 'Classe F — Revêtement'
      area: "Défauts de peinture, de poudre ou de parkérisation"
      eligibility: "Re-revêtement dans les paramètres approuvés"
      approval: 'QA principal / Ingénierie'
    - category: 'Classe G — Structurel'
      area: 'Fissure de fonderie, défaut de forgeage, déformation du corps'
      eligibility: "Reprise non autorisée — remplacement, mise au rebut ou concession écrite du client"
      approval: 'Responsable qualité + Approbation client'

rework_flow:
  tagline: Boucle fermée en 7 étapes
  title: Flux de travail de reprise contrôlée — de la détection à la libération ou à la mise au rebut
  subtitle: "Chaque reprise suit la même boucle contrôlée : détecter, mettre en quarantaine, diagnostiquer, autoriser, reprendre, ré-inspecter, libérer."
  steps:
    - step: '01'
      title: Détection, arrêt de ligne et quarantaine
      desc: "Le traitement s'arrête immédiatement sur l'étau affecté. L'identifiant de l'étau, le code produit, le lot, le poste de travail, la date et l'inspecteur sont enregistrés, une étiquette HOLD / QUARANTINE est apposée et un NCR est ouvert contre la révision de spécification applicable."
    - step: '02'
      title: Diagnostic systématique du défaut
      desc: "Le défaut est localisé avec la méthode approuvée — inspection visuelle, essai de dureté calibré, mesure dimensionnelle ou essai de force. L'emplacement suspect est marqué sans endommager le produit."
    - step: '03'
      title: Disposition et autorisation d'ingénierie
      desc: "La QC confirme la catégorie de défaut et l'Ingénierie examine si l'étau peut être restauré à sa spécification d'origine. Une autorisation de reprise référençant le NCR enregistre la méthode, les matériaux, les conditions et le périmètre de ré-inspection approuvés — ou assigne le remplacement, le rejet, la mise au rebut ou la concession client."
    - step: '04'
      title: Exécution de la reprise contrôlée
      desc: "La reprise est exécutée uniquement dans la limite de défaut approuvée, en utilisant la carte de méthode, le lot de matériau et l'outillage approuvés. Les dimensions, la finition de surface, la fonction mécanique et les exigences d'emballage de l'étau ne sont jamais modifiées."
    - step: '05'
      title: Finalisation du processus et pré-contrôle
      desc: "L'étau repris reste en statut HOLD pendant le processus de reprise défini par les instructions approuvées, puis reçoit un pré-contrôle visuel et dimensionnel avant la ré-inspection."
    - step: '06'
      title: Ré-inspection et test de preuve
      desc: "L'étau est testé selon les critères de ré-inspection approuvés par le projet et l'échec d'origine plus toutes les caractéristiques potentiellement affectées sont re-vérifiés : force de serrage, dureté de mâchoire, précision dimensionnelle, fonction de rotation, intégrité du revêtement et apparence. La reprise ne réduit jamais la norme d'acceptation."
    - step: '07'
      title: Libération QA ou disposition finale
      desc: "La Qualité revoit le NCR complété, l'enregistrement de reprise et le résultat de ré-inspection, puis autorise la libération — ou escalade vers le remplacement, le rejet, la mise au rebut ou la concession client. Aucun étau repris n'est conditionné ou expédié sans libération qualité autorisée."

quality_safeguards:
  tagline: Garde-fous qualité
  title: Règles anti-erreur qui protègent votre marque
  subtitle: Contrôles durs qui empêchent les boucles de réparation non contrôlées — une reprise documentée par défaut, des seuils d'alerte au niveau du lot, une instrumentation calibrée et des conditions de test contrôlées.
  features:
    - icon: 1
      icon_bg: blue
      title: Une reprise par défaut
      desc: "Un emplacement unique peut être repris une fois sous une instruction autorisée. Si la ré-inspection échoue encore, l'étau est escaladé pour remplacement, rejet, mise au rebut ou concession client — la reprise répétée sans approbation documentée n'est pas permise."
    - icon: 2
      icon_bg: green
      title: Alerte de lot et arrêt de ligne
      desc: "Lorsque la non-conformité dans un lot de production dépasse le seuil fixé par l'ingénierie, la ligne est arrêtée et l'Ingénierie examine la cause — lot de matériau, conditions de processus et enregistrements — avant la reprise de la production."
    - icon: 3
      icon_bg: purple
      title: Instrumentation calibrée
      desc: "Les dynamomètres, duromètres, pieds à coulisse et clés dynamométriques utilisés pour les essais sont contrôlés et calibrés par des laboratoires tiers dans leur période de validité, avec le statut d'étalonnage visible dans la zone d'inspection."
    - icon: 4
      icon_bg: orange
      title: Conditions de test contrôlées
      desc: "Les zones de test sont maintenues dans un environnement contrôlé afin que les résultats ne soient pas affectés par les variations de température entre le jour et la nuit."

rework_boundaries:
  tagline: Périmètre et limites
  title: Ce que ce système ne couvre pas
  body: |
    Le système de contrôle de la reprise s'applique aux étaux d'établi terminés ou en cours fabriqué identifiés avec des défauts dimensionnels, de dureté, de force, de revêtement ou structurels avant l'autorisation d'expédition. Il n'autorise pas les modifications de la construction, des matériaux, de la finition de surface, de la configuration produit ou des exigences client approuvés, et il ne couvre pas :

    - Les produits déjà expédiés ou dans les canaux clients.
    - Les dommages structurels ou déformations du corps non évalués par l'Ingénierie.
    - Les défauts de fonderie généralisés, les défauts de forgeage ou les défauts pouvant affecter la sécurité.
    - Les projets où la reprise n'est pas permise : échantillons approuvés par le client, unités de certification ou d'essai.
    - Les projets avec des processus clients propriétaires, des matériaux spéciaux ou des exigences de réparation spéciales.
    - Les défauts récurrents qui ne peuvent pas être localisés, ou les étaux échouant de nouveau après reprise.

    Tout écart par rapport aux spécifications client exige une revue d'ingénierie documentée et, le cas échéant, une approbation écrite du client. Les étaux qui ne peuvent pas être restaurés à leur spécification d'origine ne sont libérés que sous une concession explicite du client — jamais par la production seule.

method_cards:
  tagline: Système de cartes de méthode
  title: Index des cartes de méthode de reprise contrôlée
  subtitle: "L'instruction générale contrôle le processus ; les cartes de méthode contrôlent l'opération. L'instruction de reprise (WI-QC-RW-001) référence les cartes de méthode MC-RW-01 à MC-RW-06, plus MC-RW-00 pour la mise au rebut et le rejet obligatoires."
  headers:
    code: Carte de méthode
    defect: Classe de défaut
    scope: Périmètre d'application
    controls: Contrôles d'ingénierie clés
    approval: Autorité de signature
  rows:
    - code: MC-RW-01
      defect: Classe A (finition de surface)
      scope: "Restaurations de rectification et de polissage de surface"
      controls: "Meule calibrée, vitesse d'avance contrôlée, rugosimètre"
      approval: 'Inspecteur QC'
    - code: MC-RW-02
      defect: Classe B (dimensionnel)
      scope: "Ré-usinage CNC des sièges de mâchoires et des alésages"
      controls: "Mesure par coordonnées, fixation contrôlée, paramètres de coupe approuvés"
      approval: 'QC + Ingénierie'
    - code: MC-RW-03
      defect: Classe C (dureté)
      scope: 'Nouveau traitement thermique des mâchoires'
      controls: 'Température de four contrôlée, milieu de trempe, cycle de revenu postérieur'
      approval: 'QC + Ingénierie'
    - code: MC-RW-04
      defect: Classe D (force de serrage)
      scope: "Re-filetage et correction de l'alignement des mâchoires"
      controls: "Serrage contrôlé en couple, vérification d'alignement au comparateur à cadran"
      approval: 'Ingénierie + Responsable QA'
    - code: MC-RW-05
      defect: Classe E (mécanisme pivotant)
      scope: "Ré-usinage de la base et réparation des crans"
      controls: "Gabarit de précision, réglage de couple contrôlé, essai de force d'enclenchement"
      approval: 'QC + Ingénierie'
    - code: MC-RW-06
      defect: Classe F (revêtement)
      scope: "Re-revêtement de surface (peinture, poudre, parkérisation)"
      controls: 'Préparation de surface, épaisseur d''application contrôlée, cycle de durcissement'
      approval: "Ingénieur en chef"
    - code: MC-RW-00
      defect: Classe G (critique / structurel)
      scope: 'Mise au rebut obligatoire et destruction physique'
      controls: "Coupure physique pour éviter le mélange, enregistrement de mise au rebut, revue de cause racine interdépartementale"
      approval: "Directeur d'usine"

inspector_friendly:
  tagline: Inspection tierce partie
  title: Protocole adapté aux inspecteurs
  body: |
    Nous fournissons une zone d'inspection dédiée avec des dynamomètres calibrés, des duromètres, des instruments de mesure de précision et des Notes d'inspection pré-remplies afin que les agences tierces (SGS, TÜV, BV, Intertek) puissent compléter l'inspection avant expédition efficacement — économisant vos frais d'inspection.

    Chaque note résume les révisions documentaires applicables, la référence d'échantillon approuvée, les contrôles critiques pour la qualité, le niveau d'échantillonnage convenu, les tests fonctionnels et les exigences d'emballage et de code-barres pour le bon de commande. Les quantités, la qualité, le conditionnement et les éléments de sécurité de base spécifiés sont vérifiés par rapport aux références de projet approuvées — pas de chasse aux documents de dernière minute sur site.

