faqs:
  tagline: FAQ
  title: Frequently Asked Questions About Bench Vise Quality Control
  items:
    - q: 'How does Stavalk control bench vise quality?'
      a: 'Quality is controlled through incoming material inspection, casting and forging inspection, CNC machining verification, heat treatment control, assembly quality checks, final product testing, packing inspection, and production traceability — each executed against project-approved samples, specifications, and inspection criteria.'
    - q: 'What quality inspections are performed during bench vise production?'
      a: 'Inspections include material verification, casting inspection, forging inspection, machining checks, heat treatment hardness testing, assembly verification, clamping force testing, jaw hardness testing, swivel torque verification, appearance inspection, and packing verification.'
    - q: 'Can OEM customers request bench vise inspection records?'
      a: 'Yes. Inspection records and quality documentation can be provided according to project requirements and customer quality agreements, including sample pre-shipment inspection reports.'
    - q: 'How does the factory ensure OEM production consistency?'
      a: 'Production consistency is maintained through approved samples, technical specifications, manufacturing checkpoints, inspection procedures, and documented quality control processes linked to each order.'
    - q: 'Can I arrange third-party inspection by SGS, TÜV, BV, or Intertek?'
      a: 'Yes. We host third-party inspectors with a dedicated inspection area, calibrated force gauges, hardness testers, pre-filled inspection briefs, and accessible records. Share your specification, approved sample, artwork, packaging requirements, and defect criteria — or use our Third-Party Inspection Brief template.'
    - q: 'How are artwork, BOM, or packaging changes handled during production?'
      a: 'Changes are logged in our Change Control Log with the affected document revision, change summary, reason, impact assessment, customer approval status, and effective batch. Obsolete versions are withdrawn so production and inspection always use the current approved documents.'
    - q: 'Does the factory support customized bench vise projects?'
      a: 'Yes. Customized bench vise OEM/ODM projects are supported based on customer specifications, artwork requirements, accessory configurations, and packaging needs, with project-specific inspection criteria agreed before production.'
    - q: 'Can a defective bench vise be reworked at the factory?'
      a: 'Yes — under controlled conditions. The vise is placed on HOLD and linked to an NCR, the defect is located with an approved diagnostic method, and rework proceeds only after QC/Engineering authorization and only within the defect classes approved for rework. The vise is then re-inspected against the same acceptance criteria as a conforming product before release.'
    - q: 'How many times can the factory rework a vise?'
      a: 'A single location may be reworked once under an authorized instruction. If re-inspection still fails, the vise is escalated for replacement, rejection, scrap, or customer concession — repeated rework without documented approval is not permitted.'

