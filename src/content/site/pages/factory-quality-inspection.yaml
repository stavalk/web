answer:
  label: 'Straight answer'
  text: 'Stavalk controls bench vise quality through a 7-stage inspection gate system: incoming material control (IQC), in-process casting and forging inspection, CNC machining verification, heat treatment control, assembly quality control (IPQC), final product testing (FQC), and packing and pre-shipment release (OQC). Every order is inspected against the approved sample, technical specification, artwork proof, BOM, and packaging standards, with clamping force testing, jaw hardness verification, swivel torque checks, dimensional accuracy, accessory confirmation, and batch traceability. Items failing acceptance criteria are placed under controlled hold or quarantine, reworked only under approved instructions, and re-inspected before authorized release.'
  verified: '2026-09'

intro: 'Our quality system is built for OEM/ODM projects: inspection criteria are defined per order, documented, and followed by production and quality teams from incoming material to packing. This keeps quality expectations aligned between the factory and your brand from the first sample to full container shipments.'

scope_note:
  tagline: Scope
  title: Project-Specific Inspection Criteria
  body: |
    Quality specifications may vary depending on vise construction (e.g., light-duty 4″–5″ jaws, medium-duty 6″–8″, heavy-duty 8″–10″, pipe vises, specialty vises), intended end-use, target market regulations, and customer-approved parameters. Final release authorization is strictly based on the documented inspection criteria agreed upon for the order.

stages:
  tagline: Quality Framework
  title: Our 7-Stage Quality Verification System
  subtitle: A complete QC loop from raw material arrival to shipment release.
  steps:
    - title: '1. Incoming Material Control (IQC)'
      desc: 'Raw materials and purchased components are checked against approved specifications and reference samples before entering the production line. HT200/HT250 gray cast iron bodies are verified for chemical composition, tensile strength, and surface porosity. 45# forged steel components are checked for grain structure, hardness, and dimensional tolerances. GCr15/Cr12MoV hardened steel jaw inserts are verified for alloy composition, hardness potential, and surface finish. Hardware, fasteners, and coating materials are matched for quantity, colour, branding, barcode accuracy, and artwork version against the approved BOM.'
    - title: '2. Casting & Forging Inspection'
      desc: 'Sand-cast iron bodies are inspected for mould integrity, pour temperature, riser placement, and gate solidification. Green sand and resin-bonded sand cores are checked for dimensional accuracy and surface finish. Forged steel components are verified for die alignment, forging temperature, flash trimming, and weight consistency against approved drawings.'
    - title: '3. CNC Machining Verification (IPQC)'
      desc: 'Critical machining steps are inspected to catch non-conformities before components move to subsequent workstations. Jaw seat milling is verified for flatness, parallelism, and surface roughness against approved technical drawings. Thread cutting and bore drilling are checked for pitch accuracy, depth, and concentricity. Swivel base machining is verified for rotation smoothness, detent positioning, and mounting hole alignment.'
    - title: '4. Heat Treatment Control'
      desc: 'Heat-treated components undergo mandatory hardness and metallurgical verification before assembly. Jaw inserts (GCr15/Cr12MoV) are quenched and tempered to achieve 58–62 HRC hardness, verified with calibrated hardness testers. Cast iron bodies are stress-relieved to ensure dimensional stability. Forged steel components receive surface hardening where specified. All heat treatment records are logged per batch with temperature curves and hold times.'
    - title: '5. Assembly Quality Control'
      desc: 'Completed vises undergo assembly verification before final testing. Swivel base rotation is checked for smooth operation and detent engagement. Quick-release mechanisms are tested for engagement and disengagement force. Anvil back surfaces are verified for flatness and hardness. Bolt torque, handle operation, and jaw alignment are verified against assembly specifications.'
    - title: '6. Final Product Testing (FQC)'
      desc: 'Completed vises undergo mandatory functional and structural testing before packaging approval. Clamping force is measured at the rated capacity using calibrated force gauges. Jaw parallelism is verified under load with dial indicators. Swivel torque is tested across the full rotation range. Cycle durability testing simulates 10,000+ open-close operations. Salt spray testing (48h+) verifies surface coating integrity on paint, powder coat, or Parkerized finishes.'
    - title: '7. Packing & Pre-Shipment Release (OQC)'
      desc: 'Comprehensive pre-shipment verification ensures zero mismatch in SKU configuration or shipping marks. Kit completeness cross-checks vise, mounting hardware, instruction manual, and customer-specific accessories against the order BOM. Packaging and barcode checks verify carton marks, SKU labels, barcode readability, manual language, and carton structural integrity. Orders are released only after the final packaging audit is signed off by authorized quality personnel.'

inspection_points:
  tagline: Inspection Coverage
  title: Key Inspection Control Points
  subtitle: Every checkpoint is executed against documented acceptance criteria agreed per order.
  features:
    - icon: A
      icon_bg: blue
      title: Clamping Force Verification
      desc: 'Completed vises are tested at rated clamping force using calibrated force gauges. Force readings are recorded per unit and compared against the minimum specification. Any vise falling below the rated capacity is rejected and routed through the non-conformance process.'
    - icon: B
      icon_bg: green
      title: Visual & Dimensional Inspection
      desc: 'Vises are inspected under suitable lighting for surface finish, casting defects, machining marks, coating uniformity, scratches, contamination, and assembly alignment. Key dimensions and jaw positions are verified against approved drawings or specifications.'
    - icon: C
      icon_bg: purple
      title: Accessory & Packaging Verification
      desc: 'The complete product configuration is verified before shipment: vise model, swivel base, mounting hardware, instruction manual, and customer-specific accessories — each matched to the approved sample, drawings, and BOM.'
    - icon: D
      icon_bg: orange
      title: Packing & Shipment Release
      desc: 'Packed units are checked for SKU configuration, accessory completeness, product labels, barcode information, instruction manual version, carton marking, packing quantity, and carton condition. Shipment release is authorized only after all inspection and packing requirements are completed.'

traceability_intro:
  tagline: Batch Traceability
  title: Project-Level & Batch Traceability System
  body: |
    Every custom bench vise order is managed under a unified project code linking technical specifications, the approved BOM, artwork revisions, material lot numbers, packing references, and inspection records. Production and inspection records are maintained by the applicable project and production batch, and each batch can be linked back to the approved product specification, BOM, artwork, and packing references.

    This supports efficient review of product configuration, inspection status, and affected scope if a quality concern is identified — from finished product back to source records using the vise or carton identification.

traceability_chain:
  tagline: Traceability Chain
  title: From Project Code to Shipment Release
  subtitle: One chain of controlled references from order confirmation to authorized dispatch.
  steps:
    - step: '01'
      title: Project Code
      desc: Unified project reference that links every controlled document to the order.
    - step: '02'
      title: Document Revisions
      desc: Current spec, BOM, artwork, and packing revision levels — only approved versions are valid for production.
    - step: '03'
      title: Batch & Materials
      desc: Material and component lots recorded against the production batch.
    - step: '04'
      title: Inspection Records
      desc: IQC, casting, machining, heat treatment, assembly, final, and packing inspection results per batch.
    - step: '05'
      title: Packing & Release
      desc: Packing batch, NCR closure status, and authorized shipment release summary.

traceability_sample:
  tagline: Anonymized Sample
  title: Traceability Control Record (Demo)
  body: |
    Demonstration values are shown for illustration only — customer names, PO numbers, custom artwork, supplier data, and commercial information are removed to protect confidentiality.

