    - **Shipment Status:** RELEASED

quarantine_intro:
  tagline: Non-Conformance Control
  title: Control of Non-Conforming Products & Quarantine
  body: |
    Products or components that do not meet defined acceptance criteria are clearly identified and placed under controlled hold or quarantine status. They cannot proceed to the next production stage, packing, or shipment until an authorized disposition is completed. Rework is performed under approved instructions and linked to the relevant non-conformance record; reworked items are re-inspected against the applicable project requirements before quality release.

quarantine_flow:
  tagline: 7-Step Control Flow
  title: What Happens When a Non-Conformance Is Found
  subtitle: Identify, control, correct, verify — then release or reject. Non-conforming product never flows back into production or packing unchecked.
  steps:
    - step: '01'
      title: Identify
      desc: The non-conformance is recorded against the affected product, SKU, batch, or process stage.
    - step: '02'
      title: Label
      desc: Affected items are clearly identified with controlled status labels — HOLD, QUARANTINE, or REJECTED.
    - step: '03'
      title: Quarantine
      desc: Items are segregated in a physically controlled quarantine area or system-controlled to prevent unintended use or shipment.
    - step: '04'
      title: Assess Scope
      desc: The affected scope is reviewed by batch, process stage, material lot, and document revision.
    - step: '05'
      title: Rework / Replace
      desc: Correction is permitted only through an approved disposition and controlled work instruction.
    - step: '06'
      title: Re-Inspect
      desc: Corrected items are re-inspected against the applicable acceptance criteria before release.
    - step: '07'
      title: Release or Reject
      desc: Only authorized conforming product proceeds to packing or shipment release.

quarantine_evidence:
  tagline: On the Factory Floor
  title: Controlled Testing & Quarantine in Practice
  subtitle: Photos from our workshop in Qingdao show how status control and inspection records are applied on site.
  features:
    - image: https://assets.Stavalk.com/site/quality/qc-hold-quarantine-station.avif
      alt: Quality control checksheets and controlled hold status labels at the factory inspection station
      title: Hold & Quarantine Station
      desc: 'Inspection station with QC checksheets and status labelling. Any item failing acceptance criteria is tagged, logged, and moved to quarantine — it cannot proceed to packing until an authorized disposition and mandatory re-inspection are completed.'
    - image: https://assets.Stavalk.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Workshop demonstration of controlled quarantine segregation in the Qingdao factory
      title: Quarantine Area Demonstration
      desc: 'Demonstration photo from the workshop showing how controlled quarantine segregation works on site: segregated units are kept under status control until an authorized disposition is completed.'

rework_intro:
  tagline: Rework Governance
  title: Controlled Non-Conformance & Rework Governance
  body: |
    At Stavalk, rework is defined strictly as restoring a non-conforming unit to full compliance with its original engineering specification — not as a quick fix. Any bench vise identified with a quality non-conformance is placed on controlled hold and linked to a Non-Conformance Report (NCR) before further processing; the defect source is located and recorded using the approved diagnostic method.

    Rework may proceed only when the defect is within the approved rework scope and an authorized method is available. The rework instruction identifies the product, batch, defect location, approved material, method, required conditions and re-inspection scope. After the required process, the vise is re-inspected against the same applicable acceptance criteria as a conforming product — rework never reduces the acceptance standard. Failure of re-inspection requires renewed engineering and quality disposition; repeated rework is not permitted without documented approval.

rework_decision:
  tagline: Interactive Flow
  title: Rework Decision Flow — Click Any Node
  subtitle: 'Follow how a non-conformance is handled from detection to release or scrap. Click a node to expand the control requirements at that step.'
  nodes:
    - id: detect
      type: start
      label: Defect Detected
      detail: 'A quality non-conformance is identified during inspection — clamping force failure, jaw hardness below spec, surface defect or a related manufacturing defect.'
    - id: hold
      type: step
      label: Stop Line · HOLD Label · NCR
      detail: 'Processing stops. Vise ID, product code, batch, workstation, date and inspector are recorded; a HOLD / QUARANTINE label is attached and an NCR is opened against the applicable specification revision.'
    - id: locate
      type: step
      label: Locate Defect Source
      detail: 'The defect is located using the approved method — visual inspection, hardness testing, dimensional measurement, or force testing with calibrated equipment.'
    - id: classify
      type: step
      label: Classify Defect (A–G)
      detail: 'The defect is classified against the approval matrix: A surface finish, B dimensional, C hardness, D clamping force, E swivel mechanism, F coating, G structural.'
    - id: authorize
      type: decision
      label: Rework Authorized?
      yes: rework
      no: escalate
      detail: 'QC confirms the defect category and Engineering reviews whether the vise can be restored to its original specification. The authorization records the method card, materials, conditions and re-inspection scope — or routes to replacement, rejection, scrap or customer concession.'
    - id: rework
      type: step
      label: Controlled Rework
      detail: 'Executed only within the approved defect boundary using the approved method card, material batch and tooling — never altering dimensions, construction, surface finish, or packing requirements.'
    - id: cure
      type: step
      label: Process & Stabilization
      detail: 'The vise remains on HOLD through the rework process defined by the approved material and process instruction, then receives a visual and dimensional pre-check.'
    - id: reinspect
      type: decision
      label: Re-Inspection Passed?
      yes: release
      no: escalate
      detail: 'The vise is tested against the project-approved re-inspection criteria and the original failure plus all potentially affected characteristics are re-verified — clamping force, jaw hardness, dimensional accuracy, coating integrity, and appearance. Rework never reduces the acceptance standard.'
    - id: release
      type: release
      label: Quality Release
      detail: 'Quality reviews the closed NCR, rework record and re-inspection result and authorizes release. No reworked vise is packed or shipped without authorized quality release.'
    - id: escalate
      type: escalate
      label: Escalate — Replace / Scrap / Concession
      detail: 'No repeat rework without documented approval. The vise routes to replacement, rejection, scrap, or a written customer concession where the original specification cannot be restored.'

defect_matrix:
  tagline: Defect Classification
  title: Defect Classification & Approval Matrix
  subtitle: 'Not every defect is reworked — each is classified and its disposition approved at the right level, from QC inspector up to plant manager.'
  headers:
    category: Defect Category
    area: Typical Area
    eligibility: Rework Eligibility
    approval: Required Approval
  rows:
    - category: 'Class A — Surface Finish'
      area: 'Casting surface, machined surface, coating finish'
      eligibility: 'Standard rework authorized'
      approval: 'QC Inspector'
    - category: 'Class B — Dimensional'
      area: 'Jaw parallelism, bore diameter, thread pitch'
      eligibility: 'Evaluated rework per the approved method card'
      approval: 'QC + Engineering'
    - category: 'Class C — Hardness'
      area: 'Jaw insert hardness below 58 HRC specification'
      eligibility: 'Authorized only when re-heat treatment is feasible'
      approval: 'QC + Engineering'
    - category: 'Class D — Clamping Force'
      area: 'Force output below rated capacity'
      eligibility: 'High risk; strict engineering disposition required'
      approval: 'Engineering + QA Head'
    - category: 'Class E — Swivel Mechanism'
      area: 'Base rotation, detent, quick-release failure'
      eligibility: 'Standard rework not authorized — replacement or root-cause review'
      approval: 'QA Head + Customer Concession'
    - category: 'Class F — Coating'
      area: 'Paint, powder coat, or Parkerized finish defects'
      eligibility: 'Re-coating within approved parameters'
      approval: 'Lead QA / Engineering'
    - category: 'Class G — Structural'
      area: 'Casting crack, forging defect, body deformation'
      eligibility: 'Rework not authorized — replacement, scrap or written customer concession'
      approval: 'Quality Manager + Customer Approval'

rework_flow:
  tagline: 7-Step Closed-Loop
  title: Controlled Rework Workflow — From Detection to Release or Scrap
  subtitle: 'Every rework follows the same controlled loop: detect, quarantine, diagnose, authorize, rework, re-inspect, release.'
  steps:
    - step: '01'
      title: Detection, Stop-Line & Quarantine
      desc: 'Processing stops immediately on the affected vise. Vise ID, product code, batch, workstation, date and inspector are recorded, a HOLD / QUARANTINE label is attached, and an NCR is opened against the applicable specification revision.'
    - step: '02'
      title: Systematic Defect Diagnosis
      desc: 'The defect is located with the approved method — visual inspection, calibrated hardness testing, dimensional measurement, or clamping force testing. The suspected location is marked without damaging the product.'
    - step: '03'
      title: Engineering Disposition & Authorization
      desc: 'QC confirms the defect category and Engineering reviews whether the vise can be restored to its original specification. A rework authorization referencing the NCR records the approved method, materials, conditions and re-inspection scope — or assigns replacement, rejection, scrap or customer concession.'
    - step: '04'
      title: Controlled Rework Execution
      desc: 'Rework is executed only within the approved defect boundary, using the approved method card, material batch and tooling. Vise dimensions, surface finish, mechanical function and packing requirements are never altered.'
    - step: '05'
      title: Process Completion & Pre-Check
      desc: 'The reworked vise remains in HOLD status through the rework process defined by the approved instructions, then receives a visual and dimensional pre-check before re-inspection.'
    - step: '06'
      title: Re-Inspection & Proof Testing
      desc: 'The vise is tested against the project-approved re-inspection criteria and the original failure plus all potentially affected characteristics are re-verified: clamping force, jaw hardness, dimensional accuracy, swivel function, coating integrity, and appearance. Rework never reduces the acceptance standard.'
    - step: '07'
      title: QA Release or Final Disposition
      desc: 'Quality reviews the completed NCR, rework record and re-inspection result, then authorizes release — or escalates to replacement, rejection, scrap or customer concession. No reworked vise is packed or shipped without authorized quality release.'

quality_safeguards:
  tagline: Quality Safeguards
  title: Anti-Error Rules That Protect Your Brand
  subtitle: Hard controls that prevent uncontrolled repair loops — one documented rework per defect, batch-level alert thresholds, calibrated instrumentation and controlled test conditions.
  features:
    - icon: 1
      icon_bg: blue
      title: One Rework Per Defect
      desc: 'A single location may be reworked once under an authorized instruction. If re-inspection still fails, the vise is escalated for replacement, rejection, scrap or customer concession — repeated rework without documented approval is not permitted.'
    - icon: 2
      icon_bg: green
      title: Batch Alert & Line-Stop
      desc: 'When non-conformance in a production batch exceeds the engineering-set threshold, the line is stopped and Engineering investigates the cause — material lot, process conditions and records — before production resumes.'
    - icon: 3
      icon_bg: purple
      title: Calibrated Instrumentation
      desc: 'Force gauges, hardness testers, calipers, and torque wrenches used for testing are controlled and calibrated by third-party laboratories within their validity period, with calibration status visible in the inspection area.'
    - icon: 4
      icon_bg: orange
      title: Controlled Test Conditions
      desc: 'Testing areas are kept in a controlled environment so results are not affected by temperature swings between day and night.'

rework_boundaries:
  tagline: Scope & Boundaries
  title: What This System Does Not Cover
  body: |
    The rework control system applies to completed or in-process bench vises identified with dimensional, hardness, force, coating or structural defects before shipment release. It does not authorize changes to approved construction, materials, surface finish, product configuration or customer requirements, and it does not cover:

    - Products already shipped or in customer channels.
    - Structural damage or body deformation not assessed by Engineering.
    - Widespread casting defects, forging flaws, or defects that may affect safety.
    - Projects where rework is not permitted: customer-approved samples, certification or test units.
    - Projects with proprietary customer processes, special materials or special repair requirements.
    - Recurring defects that cannot be located, or vises failing again after rework.

    Any deviation from customer specifications requires documented engineering review and, where applicable, written customer approval. Vises that cannot be restored to their original specification are only released under an explicit customer concession — never by production alone.

method_cards:
  tagline: Method Card System
  title: Controlled Rework Method Card Index
  subtitle: 'The general instruction controls the process; method cards control the operation. The rework instruction (WI-QC-RW-001) references method cards MC-RW-01 to MC-RW-06, plus MC-RW-00 for mandatory scrap and reject.'
  headers:
    code: Method Card
    defect: Defect Class
    scope: Application Scope
    controls: Key Engineering Controls
    approval: Sign-off Authority
  rows:
    - code: MC-RW-01
      defect: Class A (Surface Finish)
      scope: 'Surface grinding and polishing restoration'
      controls: 'Calibrated grinding wheel, controlled feed rate, surface roughness gauge'
      approval: 'QC Inspector'
    - code: MC-RW-02
      defect: Class B (Dimensional)
      scope: 'CNC re-machining of jaw seats and bore holes'
      controls: 'Coordinate measurement, controlled fixture, approved cutting parameters'
      approval: 'QC + Engineering'
    - code: MC-RW-03
      defect: Class C (Hardness)
      scope: 'Re-heat treatment of jaw inserts'
      controls: 'Controlled furnace temperature, quench medium, post-quench temper cycle'
      approval: 'QC + Engineering'
    - code: MC-RW-04
      defect: Class D (Clamping Force)
      scope: 'Thread re-cutting and jaw alignment correction'
      controls: 'Torque-controlled fastening, dial indicator alignment check'
      approval: 'Engineering + QA Head'
    - code: MC-RW-05
      defect: Class E (Swivel Mechanism)
      scope: 'Base re-machining and detent repair'
      controls: 'Precision jig, controlled torque setting, engagement force test'
      approval: 'QC + Engineering'
    - code: MC-RW-06
      defect: Class F (Coating)
      scope: 'Surface re-coating (paint, powder coat, Parkerizing)'
      controls: 'Surface preparation, controlled application thickness, cure cycle'
      approval: 'Chief Engineer'
    - code: MC-RW-00
      defect: Class G (Critical / Structural)
      scope: 'Mandatory scrap and physical destruction'
      controls: 'Physical cut-off to prevent mix-out, scrap record, cross-department root-cause review'
      approval: 'Plant Manager'

inspector_friendly:
  tagline: Third-Party Inspection
  title: Inspector-Friendly Protocol
  body: |
    We provide a dedicated inspection area with calibrated force gauges, hardness testers, precision measuring instruments, and pre-filled Inspection Briefs so third-party agencies (SGS, TÜV, BV, Intertek) can complete pre-shipment inspection efficiently — saving your inspection overhead.

    Each brief summarizes the applicable document revisions, approved sample reference, critical-to-quality checks, agreed sampling level, functional tests, and packaging and barcode requirements for the PO. Specified quantities, quality, packing, and basic safety items are verified against the approved project references — no last-minute document hunting on site.

