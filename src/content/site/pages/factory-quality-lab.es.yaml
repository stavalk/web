    - 'calidad de tornillos de banco'
hero:
  tagline: Laboratorio de control de calidad
  title: Laboratorio de ensayos y garantía de calidad
  subtitle: 'Laboratorio de calidad independiente con procesos ISO 9001:2015: cada unidad se prueba antes del envío'

intro: Stavalk opera un laboratorio de control de calidad dedicado que trabaja de forma independiente de la producción. Cada lote de materia prima y cada tornillo de banco terminado pasa por protocolos de inspección documentados antes de su liberación. Nuestro equipo de control de calidad informa directamente a la dirección, lo que garantiza decisiones de calidad imparciales.

highlights:
  - value: 100%
    label: Unidades comprobadas en dureza
    detail: Cada mordaza, cada lote
  - value: 58–62
    label: Dureza de las mordazas (HRC)
    detail: Tras el temple por inducción
  - value: 10,000+
    label: Durabilidad de apertura/cierre
    detail: Por modelo y lote
  - value: 48h+
    label: Niebla salina anticorrosión
    detail: En superficies galvanizadas

test_procedures:
  - title: Inspección de materias primas
    description: Cada lote entrante de hierro gris HT200/HT250, acero forjado 45#, acero para mordazas GCr15 / Cr12MoV y herraje se ensaya antes de su aceptación. Se verifican el análisis espectroquímico, la dureza Rockwell y las comprobaciones dimensionales. Los materiales no conformes se ponen en cuarentena y se devuelven.
    standards:
      - ISO 6508-1 (Rockwell)
      - Análisis espectroquímico
      - GB/T 9439 (hierro gris)
  - title: Puntos de control de calidad en proceso
    description: Los operadores de producción realizan autoinspecciones en cada etapa. Los auditores de control de calidad realizan muestreos aleatorios durante todo el turno. La dureza de las mordazas se comprueba por muestreo en cada lote de endurecimiento y las comprobaciones dimensionales se realizan cada 20 unidades.
    standards:
      - ISO 6508-1 (dureza)
      - Lista de control interna de 100 puntos
      - Muestreo ISO 2859
  - title: Ensayos funcionales y de durabilidad
    description: Los tornillos ensamblados se ensayan en fuerza de sujeción y par del plato, con muestras sometidas a más de 10.000 ciclos de apertura/cierre. Cualquier fallo activa una reinspección automática del lote y una acción correctiva.
    standards:
      - Especificación interna de fuerza de sujeción
      - Durabilidad de más de 10.000 ciclos
      - Muestreo ISO 2859
  - title: Verificación de corrosión y acabado
    description: Las superficies galvanizadas en zinc y recubiertas en polvo se someten a más de 48 h de ensayo de niebla salina neutra según ISO 9227, y la adherencia del recubrimiento se verifica mediante ensayo de corte transversal antes de la liberación final.
    standards:
      - ISO 9227 (niebla salina)
      - ISO 2409 (adherencia por corte transversal)

equipment:
  - name: Durómetro Rockwell
    spec: Escala HRC, verificación de lotes de mordazas
  - name: Espectrómetro de emisión óptica
    spec: 'C, Si, Mn, P, S en coladas HT200/HT250'
  - name: Banco de ensayo de fuerza de sujeción
    spec: 'kN/célula de carga, calibrado'
  - name: Calibre de grosor del recubrimiento (digital)
    spec: Resolución de 0,1 μm
  - name: Comprobador de durabilidad de apertura/cierre
    spec: 'Programable, más de 10.000 ciclos'
  - name: Comprobador de par del plato
    spec: Llave dinamométrica calibrada
  - name: Cámara de niebla salina
    spec: 'ISO 9227, exposición de más de 48 h'

lab_evidence:
  tagline: Dosieres de informes de ensayo
  title: 'Descarga los informes de ensayo de laboratorio reales'
  subtitle: 'Los mismos registros controlados bilingües contra los que cierra nuestro equipo de calidad —estructura, métodos, criterios y resultados, con los campos confidenciales eliminados. Cada dosier corresponde a una de las siete puertas de inspección.'
  items:
    - title: 'IQC — Informes de materiales entrantes'
      description: 'Certificados de lote de hierro y acero, análisis espectroquímico y verificación de dureza Rockwell contra la especificación aprobada.'
      icon: tabler:file-certificate
      link: https://assets.stavalk.com/site/downloads/STAVALK_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
    - title: 'IPQC — Informes en proceso y de primera pieza'
      description: 'Registros de primera pieza e inspección en proceso contra la revisión bloqueada.'
      icon: tabler:file-check
      link: https://assets.stavalk.com/site/downloads/STAVALK_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
    - title: 'Tratamiento térmico — Registros de dureza y durabilidad'
      description: 'Comprobaciones de dureza de mordazas al 100% a 58–62 HRC, ensayos de fuerza de sujeción y registros de durabilidad de más de 10.000 ciclos de apertura/cierre.'
      icon: tabler:waves
      link: https://assets.stavalk.com/site/downloads/STAVALK_HEAT_TREATMENT_TEST_REPORTS.pdf
      link_label: 'Descargar informes de tratamiento térmico (PDF)'
    - title: 'FQC — Informes de ensayo final del tornillo'
      description: 'Inspección final contra la muestra aprobada —dimensiones, cosmética y marcado de fundición.'
      icon: tabler:shield-check
      link: https://assets.stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
    - title: 'PSI — Informes de embalaje y pre-embarque'
      description: 'Registros de integridad del kit, grado de código de barras, marcas de caja y resistencia a caídas.'
      icon: tabler:package
      link: https://assets.stavalk.com/site/downloads/STAVALK_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
    - title: 'Liberación de envío y dosier de trazabilidad'
      description: 'Autorización de liberación y trazabilidad de lote vinculada a especificación, patrón de fundición y BOM.'
      icon: tabler:history
      link: https://assets.stavalk.com/site/downloads/STAVALK_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberación (PDF)'
    - title: 'Dosier de calidad completo'
      description: 'Un pack que cubre todo el sistema documental —QIP, registros de puertas, trazabilidad y control de NCR.'
      icon: tabler:books
      link: https://assets.stavalk.com/site/downloads/STAVALK_COMPLETE_QUALITY_DOSSIER.pdf
      link_label: 'Descargar pack de documentación (PDF)'

