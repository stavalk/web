meta:
  title: 'Laboratorio de calidad: ensayos y garantía de calidad | {SITE}'
  description: 'Laboratorio de calidad con procesos ISO 9001:2015 en Stavalk: cada unidad se prueba antes del envío para garantizar la calidad de los tornillos de banco.'
  dateModified: '2026-09-01'
  keywords:
