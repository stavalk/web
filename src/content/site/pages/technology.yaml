hero:
  tagline: Technology
  title: Built for Precision and Strength
  subtitle: Every Stavalk bench vise is engineered through green-sand and resin-sand casting, CNC machining, oil-quench heat treatment and precision coating — production methods tested for clamping force, durability and hardness.
  actions:
    - variant: primary
      text: R&D Center
      href: /randdcenter
sections:
  title: The Processes Behind a Stavalk Vise
  subtitle: Four production technologies combine to deliver consistent clamping force, jaw hardness and corrosion resistance in every series.
  items:
    - title: Sand Casting Process
      description: HT200/HT250 gray cast iron bodies are poured through green-sand and resin-sand lines, validated per spec with a spectrometer. The result is a strong, vibration-damping body that is the backbone of every vise.
      link: /technology/sand-casting-process
      link_label: Read article
    - title: CNC Machining Precision
      description: Jaw faces, spindles and bases are machined on CNC lathes and milling centers for consistent dimensional accuracy, with CMM and caliper metrology verifying every critical dimension.
      link: /technology/cnc-machining-precision
      link_label: Read article
    - title: Heat Treatment Jaw Hardness
      description: GCr15 and Cr12MoV hardened steel jaws are oil-quenched and tempered to 58–62 HRC, verified by Rockwell hardness testing for wear resistance and long service life.
      link: /technology/heat-treatment-jaw-hardness
      link_label: Read article
    - title: Surface Coating & Finishing
      description: Spray paint, powder coat and Parkerizing lines protect bodies and jaws from corrosion and wear. Finishes are salt-spray tested for 48+ hours to confirm durability.
      link: /technology/surface-coating-and-finishing
      link_label: Read article
