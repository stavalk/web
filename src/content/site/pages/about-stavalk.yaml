factory_details:
  title: Manufacturing Capability
  body: |
    The Stavalk factory operates five specialized workshops under one roof:

    - **Casting Workshop**: Green-sand and resin-sand casting lines pouring 100% HT200/HT250 gray cast iron per specification, with spectrometer verification of alloy composition.
    - **Machining Workshop**: CNC lathes and milling centers for jaw faces, spindles and bases, plus conventional machining for secondary operations.
    - **Heat Treatment Workshop**: Oil-quench and temper lines producing jaw hardness of 58–62 HRC on GCr15 and Cr12MoV hardened steel.
    - **Coating Workshop**: Spray paint, powder coat and Parkerizing lines for corrosion protection and finish quality.
    - **Assembly & Test**: Manual assembly lines with hydraulic press stations for clamping force verification, swivel torque checks and 10,000+ cycle durability testing.
factory_section:
  title: Factory at a Glance
  body: |
    The Jimo, Qingdao facility is purpose-built for bench vise production. Raw materials — HT200/HT250 cast iron, 45# forged steel, GCr15 and Cr12MoV jaw steel — are sourced from certified Chinese mills and verified by spectrometer on arrival. Every batch is traceable to its material lot and production run through a 10-year ERP traceability system.

    Third-party inspections from SGS, TÜV, Bureau Veritas and Intertek are welcome and routinely accommodated. Buyers receive a complete documentation pack with each shipment: Certificate of Conformance, material certificate, dimensional report and inspection records.
values_section:
  title: How the Factory Works With Brands
  subtitle: 'Three principles that shape every project built by Stavalk.'
  columns: 3
  items:
    - title: Engineering Before Production
      description: 'Every project starts with requirements, drawings and a physical sample — jaw width, body material, jaw hardness, finish and packaging are validated before any production run, not discovered on the line.'
      icon: 'tabler:settings'
    - title: One Team, One Facility
      description: 'Casting, machining, heat treatment, coating, assembly and testing happen in one 8,000 m² facility. No trading-company handoffs: the people who answer your questions are the people who build your vises.'
      icon: 'tabler:building-factory-2'
    - title: Small First Runs
      description: 'Standard MOQ starts at 50–200 pieces; heavy-duty and specialty vises from 20–50 pieces. Samples ship in 7–14 days, bulk production in 25–35 days, so brands validate the market before committing to full volume.'
      icon: 'tabler:layers-intersect'
