  title: "Force de Serrage d'Étau — Vis de Commande, Filets et Mécanisme | Stavalk"
  description: "Comment un étau génère une force de serrage : vis de commande à filet trapézoïdal, effet de levier de la poignée, précontrainte de coulisse et rigidité du corps — jusqu'à 8 000 lbf sur la série lourde Stavalk."
  dateModified: '2026-09-10'
