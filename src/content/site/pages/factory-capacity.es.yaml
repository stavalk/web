workshops:
  - title: Taller de fundición
    description: 'Línea automática de fundición en arena que produce cuerpos, deslizaderas y bases de hierro gris HT200/HT250. La fusión, la colada, el desmoldeo y el granallado se ejecutan en paralelo con muestreo QC por colada. Capacidad anual de fundición: más de 80.000 unidades.'
    output: 'Más de 80.000 piezas fundidas al año'
  - title: Taller de mecanizado CNC
    description: 'Centros de mecanizado y tornos CNC para cuerpos, deslizaderas, husillos y asientos de mordaza, con roscado sobre acero forjado 45#. El mecanizado corre en paralelo con el tratamiento térmico para un flujo continuo.'
    output: 'Capacidad de mecanizado ampliada'
  - title: Línea de tratamiento térmico y acabado
    description: 'Endurecimiento por inducción de mordazas GCr15 / Cr12MoV a 58–62 HRC, además de líneas de recubrimiento electrostático en polvo y galvanizado en zinc. Todas las estaciones de acabado se reconfiguran según la mezcla de pedidos. Capacidad anual: más de 80.000 unidades.'
    output: 'Más de 80.000 unidades al año'
  - title: Ensamblaje, mordazas de tubo y embalaje
    description: 'Área de ensamblaje dedicada a platos giratorios, juegos de mordazas de tubo (cadena y trípode), montaje de husillo/guía y ajuste final, además de estaciones de embalaje de exportación. Capacidad anual de ensamblaje: más de 80.000 unidades.'
    output: 'Más de 80.000 tornillos al año'

oem_capacity:
  moq: 'Modelos estándar 50–200 | pesados/especiales 20–50 uds. por modelo'
  lead_time: 'Estándar de 25–35 días. Muestras en 7–14 días. Acelerado disponible.'
  payment: 'T/T 30% de depósito + 70% de saldo. Se aceptan L/C y Western Union.'

lead_time_explainer:
  tagline: 'Planificación y programación'
  title: 'Cómo se traduce la capacidad en tu entrega'
  subtitle: 'La capacidad no es un número único: así se asignan realmente los plazos.'
  items:
    - title: 'La capacidad varía según tu especificación'
      body: 'Los huecos disponibles cambian según el modelo de tornillo, la anchura de mordaza, la complejidad del recubrimiento y el acabado, el packaging y la demanda estacional. Durante el pico de primavera/verano, las líneas están al máximo y los huecos de muestras se reservan primero.'
    - title: 'Planifica antes de tu temporada de lanzamiento'
      body: 'Fija pronto la confirmación de muestras y el cierre de recubrimiento/acabado. Los pedidos repetidos se programan en tu hueco recurrente acordado una vez archivada la muestra dorada.'
    - title: 'Tres vías de programación'
      body: 'Las muestras entran primero en la línea de prototipos, los pedidos iniciales se colocan en la ventana de ensamblaje abierta más próxima y los pedidos repetidos se ejecutan en su hueco recurrente.'
    - title: 'Plazos firmes tras la revisión'
      body: 'Confirmamos un plazo firme solo después de revisar especificación, patrón de fundición, recubrimiento, packaging y cantidad — nunca como una promesa fija a priori.'

cta:
  title: 'Comprueba la disponibilidad de producción para tu fecha de lanzamiento'
  subtitle: 'Envía tu modelo de tornillo, cantidad y fecha de lanzamiento objetivo — respondemos con la próxima ventana de producción abierta y una estimación de plazo firme.'
  actions:
