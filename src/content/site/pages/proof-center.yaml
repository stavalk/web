certifications:
  title: Certificates & Scope
  body: |
    - **CE** — EN ISO 12100 and MD 2006/42/EC for machinery safety.
    - **ISO 9001:2015** — quality management system across the factory.
    - **ISO 14001** — environmental management in manufacturing.
    - **RoHS** — restricted substances compliance.

    Scanned certificates with scope are available on request before order.
evidence_gates:
  title: Evidence Folders
  subtitle: Four categories of auditable records a buyer can request.
  items:
    - title: Equipment & Facility
      description: Factory floor photos, casting and machining equipment lists, and line documentation.
    - title: Production Gates
      description: Timestamped in-process photos at casting, machining, heat treatment and coating.
    - title: Lab Reports
      description: Spectrometer chemistry, Rockwell hardness, clamping-force and salt-spray results.
    - title: Traceability
      description: Batch records linking material lots to finished serial numbers.
traceability:
  title: Batch Traceability Chain
  body: |
    Every order carries a traceability chain from raw material to finished product:

    - **Material intake** — gray cast iron and steel grades logged with certificate of conformity.
    - **Casting lot** — spectrometer validation and heat number recorded per cast.
    - **Machining & heat treatment** — process parameters and hardness results logged per batch.
    - **Final inspection** — 7-stage checklist and test records tied to the shipping batch.

    Buyers with signed agreements can request anonymized record samples covering each gate.
faqs:
  title: FAQs
  questions:
    - q: Can I visit the factory?
      a: Yes. We welcome factory visits and factory audits to our facility in Qingdao, China.
    - q: What evidence can I request before ordering?
      a: Scanned certificates, factory and equipment photos, lab reports and anonymized traceability records.
    - q: Who performs third-party inspection?
      a: SGS, TÜV, BV or Intertek, arranged by you or us, at the factory before shipment.
    - q: Are the statistics verified?
      a: Factory floor space, headcount and capacity are documented and corroborated during on-site audits.
cta:
  title: 'Audit the evidence yourself'
  subtitle: 'Request evidence folders, book a factory visit, or start an order — our team in Qingdao is ready to open the doors.'
  actions:
    - variant: primary
      text: Request evidence
      href: /contact
    - text: Factory audit checklist
      href: /factory-audit-checklist
