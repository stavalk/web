hero:
  tagline: Tecnología
  title: Diseñado para precisión y resistencia
  subtitle: Cada tornillo de banco Stavalk se fabrica mediante fundición en arena verde y arena aglomerante, mecanizado CNC, temple en aceite y recubrimiento de precisión — métodos de producción probados para fuerza de sujeción, durabilidad y dureza.
  actions:
    - variant: primary
      text: Centro de I+D
      href: /es/randdcenter
sections:
  title: Los procesos detrás de un tornillo Stavalk
  subtitle: Cuatro tecnologías de producción se combinan para ofrecer fuerza de sujeción constante, dureza de mandíbula y resistencia a la corrosión en cada serie.
  items:
    - title: Proceso de fundición en arena
      description: Los cuerpos de hierro gris HT200/HT250 se funden en líneas de arena verde y arena aglomerante, validados según especificación con espectrómetro. El resultado es un cuerpo fuerte y absorbente de vibraciones, la columna vertebral de cada tornillo.
      link: /es/technology/sand-casting-process
      link_label: Leer artículo
    - title: Precisión de mecanizado CNC
      description: Las caras de mandíbula, los husillos y las bases se mecanizan en tornos y centros de fresado CNC para una precisión dimensional constante, con CMM y calibradores que verifican cada dimensión crítica.
      link: /es/technology/cnc-machining-precision
      link_label: Leer artículo
    - title: Tratamiento térmico de dureza de mandíbula
      description: Las mandíbulas de acero endurecido GCr15 y Cr12MoV se templan en aceite y se revienen a 58–62 HRC, verificadas por prueba de dureza Rockwell para resistencia al desgaste y larga vida útil.
      link: /es/technology/heat-treatment-jaw-hardness
      link_label: Leer artículo
    - title: Recubrimiento y acabado superficial
      description: Líneas de pintura en spray, recubrimiento en polvo y Parkerizing protegen cuerpos y mandíbulas de la corrosión y el desgaste. Los acabados se prueban en niebla salina durante más de 48 horas para confirmar su durabilidad.
      link: /es/technology/surface-coating-and-finishing
      link_label: Leer artículo
