hero:
  tagline: Desarrollo de producto
  title: 'Desarrollo de producto de tornillos de banco a medida, del concepto al envío'
  subtitle: 'Seis etapas convierten tu idea de producto en tornillos de banco listos para producir - especificación, ingeniería, prototipado, ensayos, utillaje y producción en masa, todo dentro de una sola fábrica con un único sistema de calidad responsable.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo de producto de tornillos de banco en Stavalk transcurre en seis etapas - especificación del producto, ingeniería estructural, muestreo de prototipo, ensayos y validación, utillaje a medida y producción en masa. La primera muestra física sale en 7-12 días tras la aprobación de la especificación; la producción transcurre en 25-35 días tras el PO y el depósito confirmados; el desarrollo de un patrón nuevo añade 15-20 días.'
  verified: '2026-08'

stages:
  title: 'Las seis etapas del desarrollo de producto de tornillos de banco'
  subtitle: 'Cada etapa tiene un entregable claro, para que siempre sepas dónde está tu proyecto - y qué llega después.'
  items:
    - title: '1. Idea y especificación del producto'
      description: 'Material del cuerpo, apertura de mandíbula, profundidad de garganta, alcance giratorio, acabado superficial y paquete de accesorios. Un tornillo de referencia, un boceto o la especificación de un competidor bastan para empezar.'
      icon: 'tabler:bulb'
    - title: '2. Ingeniería y diseño 3D'
      description: 'Ingeniería estructural, selección de calidades de hierro fundido, especificación de dureza de mandíbula, más una revisión de fabricabilidad y presupuesto - devueltos en un día hábil.'
      icon: 'tabler:blueprint'
    - title: '3. Muestreo de prototipo'
      description: 'Tu primera muestra física sale en 7-12 días, documentada con una ficha de aprobación que cubre construcción, dimensiones, dureza de mandíbula y acabado superficial.'
      icon: 'tabler:tools'
    - title: '4. Ensayos y validación'
      description: 'Fuerza de apriete, dureza de mandíbula, torque de giro, ensayos de durabilidad y salinidad contra la muestra aprobada, con documentación CE e ISO preparada para tus mercados objetivo.'
      icon: 'tabler:test-pipe'
    - title: '5. Utillaje y producción en masa'
      description: 'Desarrollo de patrón a medida en 15-20 días cuando se necesita; la producción transcurre en 25-35 días con puntos de control de QC en proceso, inspección de 7 etapas y trazabilidad de lote.'
      icon: 'tabler:settings'
    - title: '6. Entrega y escalado'
      description: 'Logística FOB, CIF o DDP a más de 50 países - y después pedidos repetidos de tu línea consolidada con plazos estables y arte aprobado en archivo.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Por qué el desarrollo dentro de una fábrica gana a un proyecto intermediado'
  subtitle: 'Que el trabajo de desarrollo esté dentro de la planta de producción cambia lo que obtienes en cada etapa.'
  items:
    - title: Sin brechas de traspaso de diseño
      description: 'El equipo de ingeniería y dibujo trabaja en la misma planta que la línea de mecanizado CNC - un cambio de plano llega a producción la misma semana, no después de un viaje comercial de ida y vuelta.'
      icon: 'tabler:handshake'
    - title: Muestras que coinciden con la producción
      description: 'La tirada de muestra y la tirada de producción comparten la misma fundición, mecanizado, tratamiento térmico y puestos de QC, así que la muestra aprobada es lo que realmente recibes a volumen.'
      icon: 'tabler:stack-2'
    - title: Ingeniería que no vende nada más
      description: 'Las decisiones se toman contra el coste objetivo, el peso y la durabilidad - no contra márgenes de venta adicional, porque esto es una fábrica y la producción es el único ingreso.'
      icon: 'tabler:scale'
    - title: Confidencialidad como contrato permanente
      description: 'Se firma un NDA antes de cualquier intercambio de archivos, y tus archivos de arte, utillaje y especificaciones siguen siendo de tu propiedad - nunca reutilizados, revendidos ni mostrados a otro cliente.'
      icon: 'tabler:lock'

