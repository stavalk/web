qc_section:
  tagline: Control de calidad
  title: Proceso de ensayo y garantía de calidad
  subtitle: Cada tornillo se somete a ensayos obligatorios antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción e informa directamente a la dirección.
  steps:
    - step: '1'
      title: Inspección de materias primas
      desc: El hierro gris HT200/HT250, el acero forjado 45# y los aceros para mordazas GCr15 / Cr12MoV se someten a análisis espectroquímico, verificación de dureza Rockwell e inspección visual antes de que cualquier lote entre en producción.
    - step: '2'
      title: Verificación del tratamiento térmico
      desc: Cada lote de endurecimiento de mordazas se comprueba con un durómetro Rockwell para confirmar 58–62 HRC. Los lotes fuera de rango se rechazan y la línea de endurecimiento se reprocesa antes de que cualquier unidad pase al ensamblaje.
    - step: '3'
      title: Ensayos funcionales y de durabilidad
      desc: Los tornillos terminados se comprueban en cuanto a fuerza de sujeción y par del plato, y se verifican el paralelismo de las mordazas, el recorrido del husillo, el marcado de fundición y el acabado frente a las tolerancias del plano. Muestras sometidas a más de 10.000 ciclos de apertura/cierre y más de 48 h de niebla salina antes de la liberación.

oem_section:
  tagline: Proyectos OEM
  title: Casos de éxito de marcas y asociaciones OEM
  subtitle: 'Del concepto a la producción: cómo ayudamos a marcas globales de ferretería e industria a lanzar y escalar sus líneas de tornillos de banco.'
  cases:
    - challenge: Un minorista europeo de ferretería necesitaba una línea de tornillos de banco de etiqueta privada con logotipos fundidos a medida, acabado galvanizado en zinc y embalaje listo para el comercio minorista, todo entregado en 60 días.
      solution: Desarrollamos modelos de fundición personalizados y logotipos grabados, conseguimos herrajes conformes a RoHS y redujimos las muestras de 3 rondas a 1 al ubicar al equipo de diseño en nuestra fábrica de Qingdao.
      result: Producción de 25–35 días desde la orden de compra firmada, con la primera entrega dentro de la ventana de llegada de 60 días. 2.400 unidades en 4 SKU. Pedido repetido antes de completarse la primera tirada.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Un distribuidor industrial estadounidense necesitaba una gama de uso pesado de 8″–10″ con mordazas GCr15, acabado duradero de recubrimiento en polvo y documentación completa ISO 9001 para su colocación en el comercio minorista.
      solution: Adaptamos las fundiciones existentes para el formato de uso pesado, desarrollamos el arte del embalaje co-marcado y proporcionamos documentación completa de calidad y conformidad.
      result: Colocado con éxito en los principales minoristas de ferretería de EE. UU., generando un fuerte impulso con más de 5.000 unidades vendidas en el primer año y una tasa de ventas del 98%.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Un mayorista australiano necesitaba una gama de tornillos de banco de uso medio certificada CE con colores de recubrimiento personalizados y cumplimiento de las normas australianas.
      solution: Produjimos muestras de preproducción con 4 variantes de recubrimiento y coordinamos ensayos de cumplimiento de terceros.
      result: Gama de 3 modelos lanzada en el mercado AU/NZ. Posteriormente, adjudicación de una licitación gubernamental para 12 tornillos de banco de grado taller.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'

faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tornillos de banco OEM?
      a: 'El MOQ se confirma por modelo y especificación, no con un número fijo — serie, anchura de mordaza, recubrimiento y embalaje. Los modelos estándar (uso ligero, medio y pesado) corren en lotes de 50–200 uds. por modelo, mientras que los de uso pesado y los especiales parten de 20–50 uds. Cada proyecto pasa por una etapa de muestra (7–14 días) antes de la producción en volumen. Consulta nuestra guía de MOQ para la lógica de cálculo completa.'
    - q: ¿Qué certificaciones tiene Stavalk?
      a: Fabricamos según ISO 9001:2015 para la gestión de calidad e ISO 14001:2015 para la gestión ambiental. La certificación CE para los mercados de la UE se basa en EN 12100 y la Directiva de Máquinas 2006/42/CE (alcance confirmado por proyecto). La documentación de conformidad RoHS se entrega con cada pedido OEM.
    - q: ¿Cuál es el plazo de entrega típico de un pedido OEM?
      a: El plazo estándar es de 25–35 días desde la confirmación del pedido y el depósito para la producción OEM en volumen. El desarrollo de modelos de fundición personalizados añade 15–20 días para el utillaje del patrón. Hay producción acelerada disponible para pedidos urgentes y picos de temporada. Las muestras de prototipo suelen estar listas en 7–14 días.
    - q: ¿Gestionáis la documentación de exportación?
      a: Sí. Nuestro equipo gestiona internamente la documentación de exportación y el despacho de aduanas, y suministramos a más de 50 países en los mercados de la UE, EE. UU., Australia y Asia.

production_flow:
  tagline: Flujo de producción
  title: Del material al tornillo terminado
  subtitle: Cada tornillo pasa por 6 etapas de producción con puntos de control de calidad en cada paso. Sin atajos, sin inspecciones omitidas.
  stages:
    - stage: '01'
      title: Recepción de materiales y control de calidad de entrada
      description: Todos los materiales entrantes se registran por número de lote/colada en nuestro sistema ERP. El hierro gris HT200/HT250, la barra de acero forjado 45#, los aceros para mordazas GCr15 / Cr12MoV, los fijadores y el herraje se ponen en cuarentena hasta el visto bueno del control de calidad.
      qc_check: 'Análisis espectroquímico (C, Si, Mn, P, S), dureza Rockwell (ISO 6508), comprobación dimensional, escaneo de defectos visuales'
      qc_threshold: 'Se ensaya el 100% de los lotes. Rechazo si la composición o la dureza están fuera de especificación o hay cualquier defecto visual'
      responsibility: Equipo de control de calidad de entrada (3 inspectores)
    - stage: '02'
      title: Fundición en arena y desbarbado
      description: El hierro gris HT200/HT250 se funde y se cuela en la línea automática de fundición en arena. Las piezas se desmoldean, desbarban, granallan y se comprueba su dureza antes de liberarlas al mecanizado.
      qc_check: 'Muestra de dureza y tracción por colada, inspección de densidad/porosidad de la pieza, comprobación dimensional contra el patrón'
      qc_threshold: 'Muestra por colada. Rechazo si la dureza está fuera de especificación o los defectos de fundición superan los criterios de aceptación'
      responsibility: Control de calidad de fundición (2 inspectores por turno)
    - stage: '03'
      title: Mecanizado CNC y roscado
      description: Los cuerpos, deslizaderas, husillos y asientos de mordaza se mecanizan en centros de 5 ejes y tornos CNC. Las deslizaderas y los husillos se tornean a partir de acero forjado 45# y se roscan con tolerancia.
      qc_check: 'Comprobación dimensional contra archivos CAD, verificación con calibre de rosca, medición del acabado superficial (Ra)'
      qc_threshold: 'Se mide cada 20.ª unidad. Tolerancia ±0,05 mm. Rechazo del lote si >2% fuera de tolerancia'
      responsibility: Responsable del taller de mecanizado
    - stage: '04'
      title: Tratamiento térmico y acabado de superficies
      description: Las mordazas GCr15 / Cr12MoV se endurecen por inducción y se revenan a 58–62 HRC. Los cuerpos y el herraje se recubren con pintura electrostática en polvo y galvanizado en zinc para protegerlos de la corrosión.
      qc_check: 'Dureza de mordazas en cada lote (58–62 HRC), calibre de grosor del recubrimiento, muestra de niebla salina (48h+)'
      qc_threshold: 'Dureza de mordazas 58–62 HRC en todas las muestras; grosor del recubrimiento 60–80 μm; sin óxido tras 48 h de niebla salina'
      responsibility: Control de calidad de tratamiento térmico y acabado (2 inspectores por turno)
    - stage: '05'
      title: Ensamblaje y ajuste
      description: Los platos giratorios y las mordazas de tubo (juegos de cadena y trípode) se montan en los cuerpos mecanizados; los husillos, tuercas y mangos se instalan, alinean y ajustan. Cada unidad sigue una lista de verificación de ensamblaje de 100 puntos.
      qc_check: 'Firma de la lista de verificación de 100 puntos por unidad, verificación del par del plato, comprobación del recorrido y la alineación del husillo, inspección visual'
      qc_threshold: 'Política de cero defectos en los elementos críticos de seguridad (enclavamiento del husillo, bloqueo del plato, retención de mordazas). Defectos menores estéticos: AQL 2.5 (ISO 2859)'
      responsibility: Responsable del equipo de ensamblaje + control de calidad de línea
    - stage: '06'
      title: Inspección final y embalaje
      description: 'Inspección visual y funcional final: fuerza de sujeción, paralelismo de las mordazas, verificación del marcado de fundición, integridad del embalaje y completitud de los accesorios. Las unidades se engrasan, se embalan en cajas y se paletizan para la carga de contenedores.'
      qc_check: 'Inspección funcional completa, ensayo de fuerza de sujeción, muestra de durabilidad de 10.000+ ciclos, lista de verificación de accesorios por SKU, verificación por escaneo de etiquetas/códigos de barras'
      qc_threshold: 'AQL 2.5 para defectos mayores, AQL 4.0 para menores. Tolerancia cero en defectos de seguridad. El 100% de las unidades se inspeccionan funcionalmente'
      responsibility: Equipo de control de calidad final (4 inspectores) + responsable del equipo de embalaje

