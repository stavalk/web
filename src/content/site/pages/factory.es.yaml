material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de materiales y control de lotes
  description: A cada lote de materia prima se le asigna un número de lote/colada único en nuestro sistema ERP. Desde la llegada hasta la producción y el producto terminado, la lista de materiales de cada tornillo se vincula al lote original del proveedor. Esto permite la trazabilidad ascendente completa ante cualquier consulta de calidad o cumplimiento.
  system: ERP a medida (sistema interno de Stavalk) + etiquetas físicas de lote en cada orden de trabajo
  coverage: 'El 100% de los materiales de producción: hierro gris HT200/HT250, acero forjado 45#, aceros GCr15 / Cr12MoV, fijadores, herraje, recubrimientos, embalaje'
  records_retained: 10 años (según el requisito ISO 9001:2015)
  suppliers:
    - material: Hierro gris (HT200/HT250)
      source: Proveedores de fundición chinos y coreanos
      certified: ISO 9001, certificado espectroquímico por colada
    - material: Acero forjado 45#
      source: Siderúrgicas chinas e importadas
      certified: ISO 9001, certificados de material por lote
    - material: Aceros para mordazas GCr15 / Cr12MoV
      source: Siderúrgicas certificadas
      certified: Normas GB/T, certificados de material por lote
    - material: Fijadores y herraje
      source: Proveedores OEM chinos
