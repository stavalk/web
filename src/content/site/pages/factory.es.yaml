hero:
  tagline: Fábrica
  title: Fábrica y fabricación
  subtitle: 'Fábrica de tornillos de banco de 8.000 m² en Qingdao, China: fabricación personalizada de tornillos de banco desde la fundición de hierro gris hasta el tornillo terminado y ensayado.'
intro:
  - Como fabricante dedicado de tornillos de banco, **Stavalk** controla cada etapa de la producción, desde la llegada del hierro gris y el acero aleado en bruto hasta la inspección final previa a la entrega del tornillo terminado. Nuestra planta de fabricación en la Zona de Desarrollo Económico de Qingdao ocupa 8.000 metros cuadrados y alberga talleres dedicados a la fundición en arena, el mecanizado CNC, el tratamiento térmico por inducción, el acabado de superficies, el ensamblaje y los ensayos de calidad.
  - Al integrar diseño, ingeniería, creación de prototipos, fabricación y ensayos bajo un mismo techo, eliminamos las ineficiencias de la fabricación por contrato y mantenemos el control directo de la calidad de construcción, la selección de materiales y los plazos de entrega. Cada tornillo de banco que sale de nuestro taller está construido por nuestra gente, con nuestro equipo y según nuestros estándares.

