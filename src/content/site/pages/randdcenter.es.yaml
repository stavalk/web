rd_services:
  title: Servicios de I+D
  subtitle: Soporte de desarrollo disponible para socios OEM y de marca privada.
  services:
    - title: Diseño personalizado de mandíbula y base
      desc: Adapta el ancho de mandíbula, la apertura y el montaje a tu aplicación y banco de trabajo.
    - title: Selección de material y acabado
      desc: Elige el grado del cuerpo, el acero de mandíbula y el recubrimiento para la resistencia, dureza y protección contra la corrosión adecuadas.
    - title: Del dibujo a la muestra
      desc: Nuestros ingenieros convierten tu boceto o referencia en un prototipo verificado.
    - title: Soporte de certificación
      desc: Diseña el producto para cumplir CE, ISO y RoHS desde la etapa de dibujo, no después.
  cta: Inicia un proyecto de desarrollo
  cta_link: /es/contact
vision:
  title: Visión
  body: |
    Ser el socio de I+D de tornillos de banco preferido de las marcas de sujeción en todo el mundo — combinando fabricación certificada con la profundidad de ingeniería para construir su producto exacto, cada vez.
labs_section:
  title: Laboratorios y equipos
  subtitle: Instalaciones internas que mantienen el desarrollo rápido y la calidad documentada.
  items:
    - title: Laboratorio de espectrómetro
      description: Valida la química del hierro gris y del acero según especificación antes de mecanizar una sola pieza.
    - title: Laboratorio de metrología
      description: CMM y calibres de precisión verifican cada dimensión crítica en prototipos y lotes de producción.
    - title: Laboratorio de dureza y materiales
      description: La prueba Rockwell confirma la dureza de mandíbula en el temple en aceite y el revenido.
    - title: Laboratorio de durabilidad
      description: Ensayos de fuerza de sujeción, par de giro y más de 10,000 ciclos confirman una larga vida útil.
