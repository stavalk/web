hero:
  tagline: Centro de I+D
  title: Ingeniería, materiales y diseño en un solo lugar
  subtitle: El centro de I+D de Stavalk desarrolla tornillos de banco mediante ingeniería de fundición, metalurgia de tratamiento térmico y diseño mecánico — convirtiendo el boceto de un comprador en una serie certificada y producible.
  actions:
    - variant: primary
      text: Iniciar un proyecto de desarrollo
