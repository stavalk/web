intro:
  title: Introducción
  body: |
    El centro de I+D de Stavalk está dentro de nuestra fábrica en Qingdao, China, por lo que los equipos de diseño, prototipado y producción trabajan en el mismo edificio. Los ingenieros cubren diseño de fundición, programación CNC, tratamiento térmico y acabado superficial, además del laboratorio de metrología que verifica cada prototipo contra la especificación.

    El centro respalda tanto nuestras cinco series estándar de tornillos de banco como proyectos OEM personalizados — desde un simple cambio de ancho de mandíbula hasta una gama industrial totalmente codesarrollada.
mission:
  title: Misión
  body: |
    Convertir los requisitos del cliente en tornillos de banco que sujeten el trabajo con seguridad, duren años de uso en taller y se envíen con calidad totalmente documentada. Ingenieros para rendimiento de sujeción, dureza de mandíbula y resistencia a la corrosión, manteniendo el desarrollo de marca privada rentable y rápido.
pillars:
  title: Pilares de ingeniería
  subtitle: Los cuatro principios que guían cada proyecto.
  items:
    - title: Material en primer lugar
      description: La aleación correcta de hierro gris, acero forjado y endurecimiento para cada clase de uso y aplicación.
    - title: Mecanizado de precisión
      description: Tolerancias CNC que mantienen las caras de mandíbula paralelas y el husillo firme bajo carga.
    - title: Control de dureza
      description: Temple en aceite y revenido que mantiene las mandíbulas a 58–62 HRC, verificado por prueba Rockwell.
    - title: Diseño verificado por ensayos
      description: Cada prototipo se valida para fuerza de sujeción, par de giro y vida de ciclo antes de la producción.
capabilities:
  title: Capacidades
  subtitle: Lo que nuestros ingenieros y laboratorio pueden hacer internamente.
  groups:
    - title: Fundición y mecanizado
      items:
        - Modelos de arena verde y aglomerante, bebederos y mazarotas para cuerpos de hierro gris HT200/HT250
        - Caras de mandíbula, husillos, bases y accesorios mecanizados con precisión dimensional constante
        - Geometría de mandíbula y base personalizada desarrollada a partir de tu dibujo
    - title: Metalurgia y laboratorio
      items:
        - Líneas de temple en aceite y revenido para mandíbulas GCr15/Cr12MoV de 58–62 HRC
        - Acabado en spray, en polvo y Parkerizing con validación de niebla salina
        - Espectrómetro, CMM, dureza, par y equipos de ensayo de ciclo para validar cada diseño
