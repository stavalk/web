services:
  - title: Product Design & Engineering
    description: Our in-house R&D team works with your concept or spec to develop CAD drawings, 3D models, and prototypes. We offer cast-pattern design, jaw geometry optimization, clamping mechanism engineering, and material selection guidance.
  - title: Custom Branding & Marking
    description: Cast and engraved brand logos, nameplates, laser marking, and custom coating colors. We develop brand-specific branding, jaw serration patterns, and retail-ready packaging.
  - title: Material & Specification Customization
    description: Choose from HT200/HT250 gray cast iron bodies, 45# forged carbon steel slides and screws, and GCr15 / Cr12MoV jaw steels. Custom jaw widths (4″–10″), coating options (powder coat, zinc, specialty finishes), and reinforcement choices.
  - title: Packaging & Logistics
    description: Custom retail packaging, private-label boxes, anti-rust oiling and wrapping, palletizing, and export-grade packing prepared in-house.

moq_table:
  - product: Bench Vises
    standard_moq: 'Standard 50–200 | Heavy/specialty 20–50 pcs'
    custom_moq: 'Per-model quantity confirmation'
    lead_time: '25–35 days (samples 7–14)'

why_us:
  - title: Vertical Integration
    description: We own our factory, cast patterns, and supply chain —no middlemen, no subcontractors. This gives us control over quality, cost, and delivery.
  - title: Dual Certification
    description: ISO 9001:2015 quality management and ISO 14001:2015 environmental management certification. Factory audit reports available upon request.
  - title: CE Compliance
    description: CE certification applies to models destined for EU markets based on EN 12100 and Machinery Directive 2006/42/EC (scope confirmed per project). Custom models can be CE certified through our established process.
  - title: Project-Specific MOQ
    description: 'MOQ is confirmed by your project configuration — standard models run 50–200 pcs, heavy-duty and specialty 20–50 pcs. We help emerging brands launch without overcommitting inventory.'

