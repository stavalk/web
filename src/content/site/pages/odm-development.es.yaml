hero:
  tagline: Desarrollo ODM
  title: 'Desarrollo ODM de tornillos de banco - De tu idea a un tornillo listo para el mercado'
  subtitle: '¿Aún no tienes planos? Nuestros ingenieros diseñan el cuerpo, las mandíbulas, el acabado y el embalaje alrededor de tu brief - y luego fabrican, prueban y producen en serie. Prototipos en 7-12 días, producción en 25-35 días tras confirmar el pedido.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo ODM parte de tu brief, no de tus planos: el diseño del cuerpo (material, apertura de mandíbula, profundidad de garganta, alcance giratorio), la especificación de material y dureza de mandíbula, el acabado superficial y los gráficos se ingenian en casa, se validan con muestras de prototipo en 7-12 días y se producen con un MOQ de volumen estándar de 50-200 unidades por lote para tornillos de gama media (pilotos desde 20-50 unidades). La producción corre en 25-35 días tras confirmar el pedido y el depósito; el utillaje de patrón a medida añade 15-20 días. Con cada pedido se envía documentación CE, ISO 9001:2015, ISO 14001 y RoHS.'
  verified: '2026-08'

