customization:
  tagline: Diseñado contigo
  title: Qué desarrollamos alrededor de tu brief
  subtitle: 'ODM significa que el producto se diseña para ti desde cero o desde nuestra biblioteca de plataformas - estas son las palancas que controla tu brief:'
  items:
    - 'Perfil de aplicación - taller ligero, industrial de gama media, fabricación pesada o trabajo de tubería especial'
    - 'Material del cuerpo - hierro fundido gris HT200, hierro fundido pesado HT250 o acero forjado 45#'
    - 'Especificación de mandíbula - acero endurecido GCr15 (58-62 HRC) o acero de herramienta Cr12MoV para aplicaciones pesadas'
    - 'Apertura de mandíbula y profundidad de garganta - dimensiones ajustadas a la aplicación y tamaño de pieza objetivo'
    - 'Base giratoria - rotación de 360° con mecanismo de bloqueo, o configuración de base fija'
    - 'Acabado superficial - pintura, recubrimiento en polvo o parkerizado en los colores de tu marca'
    - 'Accesorios y características - superficie de yunque, mandíbulas de tubo, mecanismo de liberación rápida, placas endurecidas'
    - 'Embalaje y presentación retail - cajas retail, displays y embalaje de exportación bajo tu marca'

faq_section:
  tagline: FAQ
  title: Preguntas sobre desarrollo ODM
  questions:
    - q: ¿En qué se diferencia ODM de OEM?
      a: 'ODM (fabricación con diseño original) parte de tu brief - nuestros ingenieros desarrollan la estructura del cuerpo, la especificación de mandíbula, el acabado y el embalaje, ya sea desde un concepto de mercado, un objetivo de rendimiento o una adaptación de una plataforma probada. Tú apruebas el diseño antes de la producción. OEM (fabricación con equipo original) construye desde tu propio diseño o planos tal cual. Tú eres dueño del diseño y la propiedad intelectual. Ambas rutas pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación; ODM es la vía más rápida hacia un tornillo con tu marca cuando todavía no tienes un diseño.'
    - q: Solo tengo una idea aproximada - ¿por dónde empezamos?
      a: 'Envía un brief corto: aplicaciones objetivo, casos de uso, rango de tamaños, mercados y volúmenes. Nuestros ingenieros vuelven con un concepto, una dirección de tornillo de referencia y un plan de desarrollo en un día hábil - se firma un NDA antes de cualquier intercambio detallado cuando lo pidas.'
    - q: ¿Cuánto tarda el desarrollo de un tornillo de banco nuevo?
      a: 'Las muestras de prototipo salen en 7-12 días. Un cuerpo nuevo con utillaje de patrón a medida añade 15-20 días de ingeniería antes de las muestras. La producción corre en 25-35 días tras el pedido y el depósito.'
    - q: ¿Cuál es el MOQ de un tornillo ODM?
      a: 'La producción de volumen estándar corre de 50-200 unidades por lote para tornillos de gama media; los pilotos parten de 20-50 unidades sobre plataformas existentes. Los tornillos pesados y especiales corren de 20-50 unidades como mínimo. Consulta nuestra Guía de MOQ y branding flexible para el cálculo completo.'
    - q: ¿Quién es el dueño del diseño y del patrón?
      a: 'Tu brief, tu diseño y el utillaje están protegidos por NDA, términos de licencia de marca y cláusulas de propiedad o compra del patrón escritas en el contrato. El utillaje se conserva para tu marca y es transferible.'
    - q: ¿Podéis desarrollar un tipo específico de tornillo (pesado, de tubo, especial)?
      a: 'Sí. Nuestra ingeniería cubre todas las categorías principales de tornillos - ligera (4"-5"), media (6"-8"), pesada (8"-10"), de tubo y configuraciones especiales - con validación de fuerza de apriete y durabilidad para cada una.'
    - q: ¿Qué certificaciones llevará el tornillo desarrollado?
      a: 'CE (EN ISO 12100, Directiva de Máquinas 2006/42/CE), ISO 9001:2015, ISO 14001 y RoHS. La documentación de certificación se prepara por pedido para tus mercados de exportación.'

process:
  title: 'El proceso ODM - Del brief a la producción escalada'
  subtitle: 'Seis fases controladas dirigidas por el mismo equipo interno que diseña, muestrea y escala tu tornillo - todo queda documentado.'
  steps:
    - phase: '01'
      title: Brief y concepto
      period: 1 día hábil
      items:
        - 'Comparte aplicaciones objetivo, casos de uso, tamaños, mercados y volúmenes - o solo una idea.'
        - 'Nuestros ingenieros devuelven una dirección de concepto, opciones de plataforma y un plan de desarrollo.'
    - phase: '02'
      title: Diseño de cuerpo y materiales
      period: Semana 1-2
      items:
        - 'Dimensiones del cuerpo, calidades de material, especificación de mandíbula y alcance giratorio diseñados en casa.'
        - 'Acabado superficial, concepto de marca y embalaje desarrollados alrededor de tu marca.'
    - phase: '03'
      title: Patrón y utillaje
      period: +15-20 días (nuevos cuerpos)
      items:
        - 'Utillaje de patrón a medida diseñado y cortado para nuevos cuerpos fundidos; las plataformas existentes omiten esta fase.'
        - 'Los términos de propiedad del utillaje se fijan en el contrato antes de empezar el corte.'
    - phase: '04'
      title: Prototipo y muestra
      period: 7-12 días
      items:
        - 'Se construye un prototipo físico, se prueba y se envía para tu revisión - comprobaciones dimensionales y de dureza incluidas.'
        - 'La muestra (1-2 unidades) valida el cuerpo, la especificación de mandíbula y la marca antes del volumen.'
    - phase: '05'
      title: Validación y aprobación
      period: En paralelo
      items:
        - 'Ensayos de fuerza de apriete, dureza de mandíbula, torque de giro, durabilidad y salinidad por línea de producción.'
        - 'Documentación CE, ISO 9001:2015, ISO 14001 y RoHS preparada para tus mercados de exportación.'
        - 'Apruebas el prototipo; el pedido y el depósito bloquean el cupo de producción.'
    - phase: '06'
      title: Producción y entrega
      period: 25-35 días
      items:
        - 'Los lotes de volumen estándar corren de 50-200+ unidades por lote; los pilotos desde 20-50 unidades.'
        - 'Embalaje de exportación, envío FOB/CIF/DDP a más de 50 países y soporte de reordenes incluidos.'

