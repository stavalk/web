design_rules:
  tagline: Règles de Conception
  title: "Pourquoi la Géométrie des Mâchoires Décide la Qualité de la Prise"
  body: |
    **Le parallélisme est la spécification invisible.** Quand une mâchoire mobile parcourt une coulisse usinée à 0,05 mm de précision de position, les deux faces restent parallèles de fermée à complètement ouverte. Le contact avec la pièce est alors uniforme sur toute la face, la force de serrage est répartie équitablement, et les pièces fines ou hautes ne s'échappent pas sous charge. Une coulisse désalignée concentre la force sur un bord — la pièce bascule, glisse, ou le corps est contraint de façon inégale.

    **La dureté protège la pièce et l'étau.** Une face plus dure que la pièce s'incruste légèrement et saisit sans labourer. Si la face est trop molle, elle se déforme et le point de prise bouge sous charge ; si elle est fragile, les bords s'écaillent sous impact. La fenêtre de 58–62 HRC est un compromis soigneux : assez dure pour tenir une pièce trempée ou avec calamine, assez tenace pour survivre au choc de serrage.

    **Les faces remplaçables changent le coût de possession.** Sur les étaux à mâchoires moulées dans le corps, le premier choc sérieux sur un bord peut dévaloriser tout le corps. Des mâchoires trempées remplaçables signifient qu'une face endommagée est une petite pièce de rechange standardisée — la raison pour laquelle les jeux de mâchoires remplaçables sont standard dans la gamme Stavalk et disponibles pour re-marquage.

    **Le motif de striures est spécifique à la charge.** La striure agressive en losange saisit les barres rondes et avec calamine ; la croix fine est préférée pour les pièces usinées et tendres où l'état de surface compte. Le motif est l'un des points de personnalisation d'un cahier des charges de conception de mâchoires OEM.

faqs:
  tagline: FAQ
  title: "Questions Fréquentes sur la Conception des Mâchoires"
  items:
    - q: "Pourquoi les mâchoires Stavalk sont-elles trempées à 58–62 HRC ?"
      a: "Cette fenêtre donne à la face la dureté pour résister à l'indentation de la pièce et à l'usure, tout en gardant assez de ténacité pour absorber le choc de serrage sans s'écailler. La dureté est vérifiée sur chaque lot avant emballage."
    - q: "Les faces de mâchoires peuvent-elles être remplacées ?"
      a: "Oui. Les jeux de mâchoires trempées remplaçables sont standard dans la gamme Stavalk, montés avec des vis mécaniques. Une face usée ou endommagée est une pièce de service, pas une raison de remplacer le corps."
    - q: "Quelles options de mâchoires existent dans un projet OEM ?"
      a: "Des motifs de striures personnalisés, des largeurs de mâchoires, des matériaux de face (y compris des inserts en bronze ou tendres pour les pièces délicates) et des plaques de mâchoires à votre marque peuvent être spécifiés dans le cahier des charges technique."
    - q: "Comment le parallélisme des mâchoires est-il vérifié ?"
      a: "Les faces sont contrôlées pour l'équerrage et le parallélisme à l'assemblage, et les mêmes gabarits sont utilisés pour l'inspection finale avant emballage. Les relevés de parallélisme et les rapports d'inspection sont disponibles sur demande."

