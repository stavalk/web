answer:
  label: 'Réponse directe'
  text: "Une bonne conception de mâchoires repose sur trois choses. D'abord, la face de prise : des surfaces en acier trempé ou en fonte trempée qui résistent à l'usure et s'incrustent au lieu d'écraser la pièce. Ensuite, le montage : des faces remplaçables boulonnées à un support de mâchoire en fonte ductile ou en acier, pour qu'une face usée ou endommagée soit changée au lieu de jeter le corps. Enfin, le parallélisme : des faces usinées par CNC et alignées par la coulisse pour rester parallèles sur toute la course d'ouverture, distribuant la force de serrage au lieu de presser davantage sur un bord. Chaque face de mâchoire Stavalk est vérifiée à 58–62 HRC et chaque lot est contrôlé avant emballage."
  verified: '2026-09'

