how_to_choose:
  title: Cómo elegir el tamaño adecuado
  body: |
    Relaciona el ancho de mandíbula con tu banco de trabajo y con la pieza de trabajo más grande que uses habitualmente:

    - **Ancho de mandíbula** determina la pieza máxima que puedes sujetar con seguridad. Un tornillo ligero de 2″–5″ sirve para hobby y trabajo pequeño; el trabajo medio de 6″–8″ cubre la mayoría de talleres; el pesado de 8″–10″ es para fabricación industrial.
    - **Rango de apertura** debe superar tu material más grande. Comprueba la apertura máxima contra tu stock más grueso habitual antes de elegir una serie.
    - **Peso y banco** — los tornillos ligeros van de 3–5 kg, los medios de 5–8 kg, los pesados de 8–14 kg. Refuerza la parte superior del banco para tornillos pesados.
    - **Montaje** — relaciona el tamaño del perno (típicamente 4–12 mm) y la separación con tu banco. Una base giratoria de 360° añade flexibilidad de sujeción; una base fija es más rígida para golpes fuertes.
    - **Mandíbulas para tubería** — si sujetas material redondo con frecuencia, elige un modelo con mandíbulas para tubería o un tornillo dedicado que acepte tubería de 1/8″–2″.

    ### Opciones comunes
    - Trabajo pequeño y de precisión → 2″–5″ trabajo ligero con mandíbulas reemplazables
    - Uso general de taller → 6″ trabajo medio
    - Trabajo pesado e industrial → 8″–10″ trabajo pesado con cara de yunque
    - Material redondo → mandíbulas para tubería o un tornillo dedicado
