quality_basis:
  title: Cinq lignes de base qualité verrouillées
  subtitle: Chaque commande est produite selon les mêmes cinq lignes de base convenues.
  items:
    - title: Grade de matériau
      description: Fonte grise HT200/HT250 et acier forgé 45# vérifiés par spectromètre avant usinage.
    - title: Dureté de mâchoire
      description: Mâchoires GCr15/Cr12MoV trempées à l''huile et revenues à 58–62 HRC, vérifiées par Rockwell.
    - title: Précision dimensionnelle
      description: Dimensions critiques vérifiées par CMM et pieds à coulisse par rapport au dessin approuvé.
    - title: Durabilité du revêtement
      description: Finitions par pulvérisation, poudre et Parkerizing testées au brouillard salin pendant plus de 48 heures.
    - title: Essais de performance
      description: Force de serrage, couple de pivotement, durée de vie et sécurité vérifiés par commande.
tests:
  title: Essais et procédures
  subtitle: Les contrôles derrière chaque serre-joint Stavalk.
  items:
    - title: Essai de force de serrage
      description: Confirme que la vis et les mâchoires maintiennent la charge de travail nominale sans glissement ni déformation.
    - title: Essai de dureté de mâchoire
      description: L''essai Rockwell vérifie 58–62 HRC sur toute la surface de mâchoire trempée.
    - title: Essai de couple de pivotement
      description: Vérifie que la base pivote et se verrouille en douceur au couple spécifié.
    - title: Essai de durée de vie en cycle
      description: Plus de 10 000 cycles d''ouverture/fermeture confirment la durée de vie de la vis et du coulisseau.
    - title: Essai au brouillard salin
      description: Une exposition de plus de 48 heures confirme la résistance du revêtement et à la corrosion.
    - title: Conformité de sécurité
      description: Conçu selon CE conformément à EN ISO 12100 et MD 2006/42/CE.
qc_flow:
  title: Parcours d''inspection en 7 étapes
  subtitle: Un parcours qualité documenté par commande avec enregistrements à chaque jalon.
  obj_label: Objet d''inspection
  method_label: Méthode d''inspection
  criteria_label: Critère d''acceptation
  record_label: Enregistrement de sortie
  stages:
    - stage: '01'
      title: Matériaux entrants
      summary: La fonte grise et l''acier bruts sont vérifiés par rapport aux certificats de matériaux.
      checks:
        - Grade et certificat de conformité vérifiés
        - Contrôle chimique par spectromètre sur les lots de fonte grise
      object: Lots de matériaux entrants
      method: Revue des certificats + spectromètre
      criteria: HT200/HT250 / 45# selon spécification
      record: Enregistrement de réception des matériaux
    - stage: '02'
      title: Inspection de coulée
      summary: Les corps coulés sont vérifiés pour les défauts, les dimensions et la solidité.
      checks:
        - Contrôle visuel et dimensionnel des corps coulés
        - Détection des défauts de porosité et de fissures
      object: Corps coulés
      method: Inspection visuelle + jauges
      criteria: Aucun défaut structurel ; dimensions selon dessin
      record: Enregistrement de lot de coulée
    - stage: '03'
      title: Inspection d''usinage
      summary: Faces de mâchoire, vis et bases vérifiées après l''usinage CNC.
      checks:
        - Dimensions critiques mesurées avec CMM/étalons
        - Finition de surface et ajustement vérifiés
      object: Pièces usinées
      method: Métrologie CMM + étalons
      criteria: Dans la tolérance du dessin
      record: Enregistrement d''inspection d''usinage
    - stage: '04'
      title: Traitement thermique
      summary: Dureté de mâchoire vérifiée après trempe à l''huile et revenu.
      checks:
        - Dureté Rockwell sur la surface de mâchoire trempée
        - Paramètres de processus du lot enregistrés
      object: Mâchoires trempées
      method: Essai de dureté Rockwell
      criteria: 58–62 HRC
      record: Enregistrement de traitement thermique
    - stage: '05'
      title: Revêtement de surface
      summary: Adhérence et durabilité du revêtement vérifiées.
      checks:
        - Épaisseur et aspect du revêtement
        - Échantillonnage au brouillard salin pour la résistance à la corrosion
      object: Corps et mâchoires revêtus
      method: Jauge d''épaisseur + brouillard salin
      criteria: 48h+ sans échec
      record: Enregistrement d''inspection du revêtement
    - stage: '06'
      title: Montage et essai fonctionnel
      summary: Les serre-joints assemblés passent des essais fonctionnels et de performance.
      checks:
        - Force de serrage et couple de pivotement
        - Essai de cycle d''ouverture/fermeture
      object: Serre-joints assemblés
      method: Essai fonctionnel sur banc
      criteria: Respecte la performance nominale
      record: Enregistrement d''essai fonctionnel
    - stage: '07'
      title: Inspection finale et emballage
      summary: Serre-joints finis inspectés, emballés et prêts pour l''expédition.
      checks:
        - Contrôle cosmétique et de complétude
        - Emballage, marquage et documentation vérifiés
      object: Serre-joints finis
      method: Liste de contrôle qualité finale
      criteria: Prêt pour FOB Qingdao
      record: Inspection finale et liste d''emballage
system_map:
  title: Carte du système qualité
  subtitle: Les quatre normes qui structurent notre système qualité d''usine.
  items:
    - title: CE — EN ISO 12100
      description: Conception de sécurité des machines et réduction des risques sur toute la gamme.
    - title: MD 2006/42/CE
      description: Conformité à la Directive Machines pour la sécurité sur le marché de l''UE.
    - title: ISO 9001:2015
      description: Système de management de la qualité régissant tout notre processus de production.
    - title: ISO 14001 et RoHS
      description: Management environnemental et conformité aux substances restreintes.
intelligence_cards:
  title: Documentation et traçabilité
  subtitle: Documents contrôlés et échantillons anonimisés d''enregistrements disponibles pour les acheteurs.
  cards:
