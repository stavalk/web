    - title: Traçabilité
      icon: trace
      desc: Les enregistrements de lot relient les lots de matières premières à travers chaque jalon qualité jusqu''à la commande finie.
      metrics:
        - label: Jalons
          value: '7'
    - title: Tiers
      icon: audit
      desc: Inspections SGS, TÜV, BV et Intertek disponibles avant expédition.
      metrics:
        - label: Options
          value: '4'
doc_register:
  title: Registre des documents contrôlés
  subtitle: Documents versionnés gérés dans tout le système qualité.
  items:
    - title: '00 – Manuel qualité'
      description: Décrit la portée et la politique du système qualité de l''usine.
    - title: '01 – Spécifications des matériaux'
      description: Grades de fonte grise et d''acier et limites d''acceptation.
    - title: '03 – Contrôle des dessins'
      description: Dessins et spécifications de produit versionnés.
    - title: '05 – Plans d''inspection'
      description: Plans d''inspection en 7 étapes et listes de contrôle par commande.
    - title: '08 – Méthodes d''essai'
      description: Procédures standard pour la dureté, le couple, le cycle et le brouillard salin.
    - title: '12 – Enregistrements de traçabilité'
      description: Traçabilité de lot reliant le matériau au produit fini.
traceability:
  title: Matrice de traçabilité
  subtitle: Comment un produit reste traçable de la matière première à l''expédition.
  items:
    - title: Lot de matériaux
      description: Certificats de matières premières et numéros de coulée enregistrés à la réception.
    - title: Lot de coulée
      description: Résultats de spectromètre et numéros de coulée enregistrés par lot.
    - title: Jalons de processus
      description: Enregistrements d''usinage, de traitement thermique et de revêtement par lot.
    - title: Série finie
      description: Des enregistrements anonimisés relient chaque jalon à la commande finie.
non_conformance:
  title: Contrôle de non-conformité
  subtitle: Comment les défauts sont détectés, contenus et corrigés.
  items:
    - title: Détection
      description: Les défauts trouvés à tout jalon qualité sont signalés et mis en quarantaine.
    - title: Contention
      description: Le lot concerné est isolé et tracé jusqu''aux matériaux et processus.
    - title: Disposition
      description: Reprise, réparation ou rejet décidés par l''inspection et l''acheteur.
    - title: Action corrective
      description: La cause racine et l''action corrective préviennent la récurrence sur les commandes futures.
third_party:
  title: Inspection tierce et par l''acheteur
  subtitle: Vérification indépendante disponible à chaque étape.
  items:
    - title: Pré-expédition
      description: Inspection SGS, TÜV, BV ou Intertek avant l''expédition FOB.
    - title: En cours de processus
      description: Acheteur ou tiers aux jalons qualité clés pendant la production.
    - title: Essai en laboratoire
      description: Vérification indépendante en laboratoire de la dureté, du couple et du revêtement.
    - title: Remise des rapports
      description: Rapports d''inspection remis avec les documents d''expédition.
content_certifications:
  title: Certifications en un coup d''œil
  body: |
    Stavalk produit des serre-joints conformes à la **CE** (EN ISO 12100 et MD 2006/42/CE), à **l''ISO 9001:2015**, à **l''ISO 14001** et au **RoHS**. Le système qualité est documenté, mesuré et auditable — de la réception des matériaux à travers un parcours d''inspection en 7 étapes jusqu''à l''inspection tierce et l''expédition FOB Qingdao.

    Les certificats scannés avec portée sont disponibles sur demande avant commande, et les acheteurs peuvent organiser une inspection SGS, TÜV, BV ou Intertek à l''usine avant l''expédition.
faqs:
  title: Questions fréquentes
  questions:
    - q: Quelles normes respectent les serre-joints Stavalk ?
      a: CE (EN ISO 12100, MD 2006/42/CE), ISO 9001:2015, ISO 14001 et RoHS.
    - q: Quelle est la dureté des mâchoires ?
      a: Les mâchoires GCr15/Cr12MoV sont trempées à l''huile et revenues à 58–62 HRC.
    - q: Puis-je organiser une inspection tierce ?
      a: Oui — SGS, TÜV, BV ou Intertek, organisée par vous ou par nous, à l''usine avant l''expédition.
    - q: Puis-je voir les enregistrements qualité ?
      a: Les acheteurs ayant signé un accord peuvent demander des enregistrements de traçabilité et de contrôle qualité anonimisés par commande.
