checklist:
  heading: 'Qué Preparar Antes de Tu Brief de Proyecto'
  body: |
    Cuanto más completo sea tu brief, más rápida y precisa será la cotización. Esto es lo que debes tener listo:

    - **Especificaciones de tornamesa** — Ancho de mordaza objetivo, profundidad de apertura, serie del cuerpo (ligera, media, pesada, tubo o especial), requisito de fuerza de sujeción y uso previsto (taller, industrial, construcción, etc.). Si tienes dimensiones de tornamesa de referencia o un modelo competidor, inclúyelas.
    - **Archivos de diseño** — Arte vectorial (AI, SVG o PDF) para marcas de marca, color de cuerpo y cualquier branding secundario. Si el arte no está listo, un moodboard o imágenes de referencia son suficientes para la factibilidad inicial.
    - **Volumen y cronograma del pedido** — Tu cantidad objetivo para el primer pedido y el calendario de temporada que necesitas cumplir. Incluso un rango aproximado ("50–100 tornamesas para marzo") es suficiente para confirmar factibilidad y disponibilidad de cupo.
    - **Requisitos de cumplimiento** — Mercados objetivo (UE, Norteamérica, Australia, etc.) y cualquier requisito específico de certificación o pruebas más allá de nuestro alcance estándar (CE, ISO 9001, ISO 14001, RoHS).
    - **Rango de presupuesto** — Un presupuesto indicativo por unidad o costo landed objetivo nos ayuda a recomendar la serie y el nivel de construcción adecuados. El precio exacto se confirma después de la revisión de ingeniería — nunca antes.

    Si aún no tienes todo esto, envía lo que tengas. Nosotros guiamos el resto.

evidence_review:
  tagline: 'Evidencia y verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricación en esta página son verificadas por nuestro equipo de ingeniería de fabricación en la planta de Jimo, Qingdao. Certificados, registros de inspección QC, informes de dureza y pruebas estructurales, y registros de trazabilidad por lote están disponibles a petición. Especificaciones verificadas por última vez 2026-09.'

faqs:
  tagline: FAQ
  title: 'Onboarding OEM — Preguntas Frecuentes'
  items:
    - q: '¿Cuánto tarda el proceso completo de onboarding?'
      a: 'La aprobación de muestras típicamente toma 2–4 semanas (incluyendo producción de muestras en 7–14 días y tu período de revisión). La primera serie de producción toma 6–8 semanas desde PO confirmado y depósito. Un cuerpo fundido a medida añade 15–20 días de desarrollo de molde. Cada puerta tiene un cronograma fijo que acuerdas por adelantado.'
    - q: '¿Necesito firmar un NDA antes de compartir mi diseño?'
      a: 'Un NDA está disponible de inmediato a petición — antes de que compartas cualquier especificación técnica o arte de propiedad. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado. La misma política se aplica a una muestra de 1 tornamesa que a un programa de volumen completo.'
    - q: '¿Cuál es el pedido mínimo para una primera serie OEM?'
      a: 'El punto de entrada es escalonado: primero 1–2 muestras (listas en 7–14 días), un pedido de prueba o piloto de 20–50 tornamesas (producción en 25–35 días), y luego series de volumen estándar de 50–200+ tornamesas por configuración aprobada. El co-branding de lotes pequeños parte desde 20 unidades cuando no se necesita etapa de desarrollo. Las tarifas de muestra se acreditan a tu pedido de producción.'
    - q: '¿Cómo se maneja la protección de IP durante el onboarding?'
      a: 'Tus diseños y especificaciones están protegidos bajo el NDA firmado antes de que se comparta cualquier información de propiedad. Todos los archivos de arte, datos de BOM y archivos técnicos se almacenan en sistemas con control de acceso y trazabilidad de auditoría. En modo OEM, tú posees todo el IP. En modo ODM, el IP de la plataforma adaptada se comparte según acuerdo. En modo Private Label, el IP permanece con Stavalk y tú licencias la aplicación de marca.'
    - q: '¿Qué garantías de calidad aplican a un primer pedido?'
      a: 'Cada tornamesa — muestra, prueba o volumen — pasa por el mismo sistema de inspección de 7 etapas: inspección de material entrante, fundición en arena, mecanizado CNC, tratamiento térmico, recubrimiento superficial, ensamblaje e inspección final con pruebas de fuerza de sujeción, dureza de mordaza (58–62 HRC), torque de giro, durabilidad de 10.000+ ciclos y resistencia a corrosión por sal de 48+ horas. La calidad nunca se reduce para pedidos más pequeños.'

