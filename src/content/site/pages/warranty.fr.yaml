seo:
  headline: 'Garantie de serre-joint Stavalk — Garantie limitée 1 et 2 ans | Stavalk'
  description: 'Stavalk offre une garantie limitée sur la structure et les composants du serre-joint. 1 an sur les défauts de matériaux ou de fabrication pour un usage commercial, 2 ans pour un usage domestique de loisir. Termes et conditions complets de la garantie de serre-joint Stavalk.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Cette Garantie Limitée s'applique aux nouveaux serre-joints Stavalk achetés directement auprès de Stavalk ou d'un revendeur ou distributeur agréé Stavalk. La date d'entrée en vigueur est la date vérifiable d'achat d'origine.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Couverture et durée de la garantie</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">2 ans</h3>
        <p class="text-sm text-gray-600 mt-1">Usage domestique de loisir — défauts structurels de matériaux ou de fabrication</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 an</h3>
        <p class="text-sm text-gray-600 mt-1">Usage commercial, industriel ou professionnel — tous les composants</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">La couverture se limite aux défauts de matériaux et de fabrication en usage normal. La mauvaise utilisation, l'abus, la modification ou l'usure normale sont exclus.</p>
  </div>

  <h2>Ce qui est couvert</h2>
  <h3>Structure du corps (2 ans domestique / 1 an commercial)</h3>
  <p>Stavalk garantit la structure du corps du serre-joint —y compris le corps en fonte grise HT200/HT250, l'arbre en acier forgé 45# et le canal de glissement— contre toute défaillance structurelle due à des défauts de matériaux ou de fabrication.</p>

  <h3>Faces de mâchoire et inserts trempés</h3>
  <p>Les faces de mâchoire trempées GCr15/Cr12MoV (58–62 HRC) sont garanties contre les défauts de fabrication provoquant une fissuration prématurée ou une usure excessive en usage normal.</p>

  <h3>Base pivotante et enclume</h3>
  <p>Le mécanisme de base pivotante 360° et la face d'enclume sont garantis contre les défauts de matériaux ou de fabrication qui altèrent leur fonctionnement normal.</p>

  <h2>Ce qui n'est pas couvert</h2>
  <ul>
    <li>Défauts esthétiques, y compris décoloration, taches, perte de brillance ou toute altération d'aspect</li>
    <li>Dommages dus à un impact, une surcharge, une chute ou un abus physique</li>
    <li>Dommages dus à l'utilisation de l'enclume pour forger ou frapper au-delà de sa capacité nominale</li>
    <li>Fissuration, écaillage, frottement ou détérioration par friction ou contact</li>
    <li>Corrosion due à une exposition prolongée à l'humidité, aux produits chimiques, aux carburants ou aux solvants</li>
    <li>Dommages dus à la négligence, à une mauvaise utilisation, à un abus, à un accident ou à l'usure normale</li>
    <li>Modification, démontage ou réparation par des parties non autorisées</li>
    <li>Équipements, composants ou systèmes tiers (couverts par la garantie de leur fabricant respectif)</li>
  </ul>

  <h2>Obligation et recours du fabricant</h2>
  <p>L'unique et exclusive obligation de Stavalk est la réparation ou, à notre option, le remplacement de pièces ou d'unités de tout composant jugé défectueux en matériaux ou en fabrication et couvert par cette garantie, après inspection du produit retourné. Les composants remplacés ou réparés ne sont garantis que pour la partie restante de la période de garantie d'origine. Toutes les garanties sont FOB à l'usine de Stavalk à Qingdao, Chine ; l'acheteur assume les frais d'expédition et de manutention pour la soumission et le retour.</p>

  <h2>Conditions de la garantie</h2>
  <ul>
    <li><strong>Enregistrement :</strong> le produit doit être correctement enregistré comme exigé par les termes de la garantie.</li>
    <li><strong>Entretien :</strong> le produit doit être entretenu conformément aux directives publiées par Stavalk, y compris la lubrification régulière de la vis mère et du canal de glissement.</li>
    <li><strong>Coopération :</strong> l'acheteur doit coopérer pleinement et rapidement avec Stavalk sur toutes les questions relatives aux réclamations de garantie.</li>
    <li><strong>Acheteur d'origine :</strong> cette garantie est étendue exclusivement à l'acheteur final d'origine et n'est pas transférable.</li>
  </ul>

  <h2>Usage commercial</h2>
  <p>Si le produit est utilisé à des fins commerciales, industrielles, professionnelles, locatives ou toute autre fin que l'usage domestique de loisir, la période de garantie pour tous les composants est d'un (1) an à compter de la date d'achat d'origine.</p>

  <h2>Comment faire une réclamation de garantie</h2>
  <p>Contactez Stavalk ou votre revendeur agréé avec une preuve d'achat et une description détaillée du problème. Stavalk examinera la réclamation et fournira des instructions pour l'inspection et le service.</p>
  <p>Pour toute demande de service de garantie, contactez-nous via notre <a href="/fr/contact" class="text-sky-600 underline">page de contact</a> avec votre numéro de commande et les détails du produit.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Appuyé par un système qualité documenté</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Chaque serre-joint est testé avant l'emballage — force de serrage, dureté de mâchoire, couple de pivotage et durabilité de 10 000+ cycles sont enregistrés par lot, et les lots conservent une traçabilité ERP sur 10 ans. Les réclamations de garantie sont traitées sur la base de ces enregistrements de lot, pas de suppositions. Voir le <a href="/fr/quality" class="text-sky-600 underline">système qualité complet</a> et télécharger les <a href="https://assets.Stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf" class="text-sky-600 underline">rapports d'inspection finale</a>.</p>
  </div>

  <h2>Articles tiers</h2>
  <p>Les équipements, composants ou systèmes fabriqués par des tiers (même s'ils sont installés par Stavalk) sont couverts exclusivement par la garantie offerte par leur fabricant respectif. Stavalk décline expressément toute responsabilité de garantie pour ces articles tiers.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Cette déclaration de garantie est un résumé de la Garantie Limitée complète du fabricant Stavalk. Le document légal complet de la garantie régit tous les termes et conditions. Les spécifications peuvent changer sans préavis. Stavalk est un fabricant de serre-joints à Jimo, Qingdao, Chine.
  </p>
