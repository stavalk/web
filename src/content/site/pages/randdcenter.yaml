vision:
  title: Vision
  body: |
    To be the bench vise R&D partner of choice for workholding brands worldwide — combining certified manufacturing with the engineering depth to build their exact product, every time.
labs_section:
  title: Labs & Equipment
  subtitle: In-house facilities that keep development fast and quality documented.
  items:
    - title: Spectrometer Lab
      description: Validates gray cast iron and steel chemistry per spec before a single piece is machined.
    - title: Metrology Lab
      description: CMM and precision gauges verify every critical dimension on prototypes and production runs.
    - title: Hardness & Materials Lab
      description: Rockwell testing confirms jaw hardness across oil-quench and tempering.
    - title: Durability Lab
      description: Clamping-force, swivel-torque and 10,000+ cycle tests confirm long service life.
