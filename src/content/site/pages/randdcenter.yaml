rd_services:
  title: R&D Services
  subtitle: Development support available to OEM and private-label partners.
  services:
    - title: Custom Jaw & Base Design
      desc: Tailor jaw width, opening and mounting to your application and workbench.
    - title: Material & Finish Selection
      desc: Choose body grade, jaw steel and coating for the right strength, hardness and corrosion resistance.
    - title: Drawing to Sample
      desc: Our engineers turn your sketch or reference into a verified prototype.
    - title: Certification Support
      desc: Design the product to meet CE, ISO and RoHS from the drawing stage, not after.
  cta: Start a development project
