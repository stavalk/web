intro:
  title: Introduction
  body: |
    The Stavalk R&D center sits inside our factory in Qingdao, China, so design, prototyping and production teams work on one floor. Engineers cover casting design, CNC programming, heat treatment and surface finishing, plus the metrology lab that verifies each prototype against specification.

    The center supports both our five standard bench vise series and custom OEM projects — from a simple jaw-width change to a fully co-developed industrial range.
mission:
  title: Mission
  body: |
    To turn customer requirements into bench vises that hold work securely, last through years of shop use, and ship with fully documented quality. We engineer for clamping performance, jaw hardness and corrosion resistance while keeping private-label development cost-effective and fast.
pillars:
  title: Engineering Pillars
  subtitle: The four principles that guide every project.
  items:
    - title: Material First
      description: Correct gray cast iron grade, forged steel and hardening alloy for each duty class and application.
    - title: Precision Machining
      description: CNC tolerances that keep jaw faces parallel and the screw running true under load.
    - title: Hardness Control
      description: Oil-quench and tempering that holds jaws at 58–62 HRC, verified by Rockwell testing.
    - title: Test-Verified Design
      description: Every prototype is validated for clamping force, swivel torque and cycle life before production.
capabilities:
  title: Capabilities
  subtitle: What our engineers and lab can do in-house.
  groups:
    - title: Casting & Machining
      items:
        - Green-sand and resin-sand patterns, gating and feeders for HT200/HT250 gray cast iron bodies
        - Jaw faces, spindles, bases and accessories machined to consistent dimensional accuracy
        - Custom jaw and base geometry developed to your drawing
    - title: Metallurgy & Lab
      items:
        - Oil-quench and tempering lines for GCr15/Cr12MoV jaws at 58–62 HRC
        - Spray, powder-coat and Parkerizing finishing with salt-spray validation
        - Spectrometer, CMM, hardness, torque and cycle-testing equipment to validate every design
