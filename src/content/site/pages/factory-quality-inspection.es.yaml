      desc: 'Control de cambios formal según ISO 9001 para parámetros de retrabajo: ECR, clasificación de riesgos, matriz de aprobación interdepartamental, bucle cerrado de 9 pasos, validación de ingeniería cuantificada y salvaguardas Poka-Yoke — con el SOP bilingüe QMS-SOP-QC-CC-001 Rev 2.0.'
      link: '/es/factory/quality-change-control'
      link_label: Ver página
    - icon: N
      icon_bg: green
      title: Control de productos no conformes (página)
      desc: 'Control de salidas no conformes según la ISO 9001:2015 Cláusula 8.7: registro NCR, cuarentena, autoridad de disposición por gravedad, retrabajo controlado bajo SRI, reinspección independiente y destrucción presenciada con bóveda de video SHA-256 — con SOP bilingüe y descargas de certificado de desguace.'
      link: '/es/factory/non-conforming-control'
      link_label: Ver página

faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre el control de calidad de los tornillos de banco
  items:
    - q: '¿Cómo controla Stavalk la calidad de los tornillos de banco?'
      a: 'La calidad se controla mediante inspección de materiales entrantes, inspección de fundición y forja, verificación de mecanizado CNC, control de tratamiento térmico, comprobaciones de calidad de montaje, ensayos finales del producto, inspección del embalaje y trazabilidad de la producción, cada uno ejecutado según muestras, especificaciones y criterios de inspección aprobados por proyecto.'
    - q: '¿Qué inspecciones de calidad se realizan durante la producción de los tornillos de banco?'
      a: 'Las inspecciones incluyen verificación de materiales, inspección de fundición, inspección de forja, controles de mecanizado, ensayo de dureza del tratamiento térmico, verificación del montaje, ensayo de fuerza de sujeción, ensayo de dureza de las mordazas, verificación del par de giro, inspección de aspecto y verificación del embalaje.'
    - q: '¿Pueden los clientes OEM solicitar los registros de inspección de los tornillos de banco?'
      a: 'Sí. Los registros de inspección y la documentación de calidad pueden facilitarse según los requisitos del proyecto y los acuerdos de calidad con el cliente, incluidos informes de muestra de inspección de pre-embarque.'
    - q: '¿Cómo garantiza la fábrica la consistencia de la producción OEM?'
      a: 'La consistencia de la producción se mantiene mediante muestras aprobadas, especificaciones técnicas, puntos de control de fabricación, procedimientos de inspección y procesos documentados de control de calidad vinculados a cada pedido.'
    - q: '¿Puedo organizar una inspección de terceros con SGS, TÜV, BV o Intertek?'
      a: 'Sí. Recibimos a los inspectores de terceros con una zona de inspección dedicada, dinamómetros calibrados, durómetros, briefs de inspección precumplimentados y registros accesibles. Comparte tu especificación, muestra aprobada, arte, requisitos de embalaje y criterios de defectos — o utiliza nuestra plantilla de brief de inspección de terceros.'
    - q: '¿Cómo se gestionan los cambios de arte, BOM o embalaje durante la producción?'
      a: 'Los cambios se registran en nuestro registro de control de cambios con la revisión del documento afectado, el resumen del cambio, el motivo, la evaluación de impacto, el estado de aprobación del cliente y el lote efectivo. Las versiones obsoletas se retiran para que producción e inspección utilicen siempre los documentos aprobados vigentes.'
    - q: '¿La fábrica admite proyectos de tornillos de banco personalizados?'
      a: 'Sí. Se admiten proyectos OEM/ODM de tornillos de banco personalizados según las especificaciones del cliente, los requisitos de arte, las configuraciones de accesorios y las necesidades de embalaje, con criterios de inspección específicos por proyecto acordados antes de la producción.'
    - q: '¿Puede retrabajarse en fábrica un tornillo de banco defectuoso?'
      a: 'Sí — bajo condiciones controladas. El tornillo de banco se coloca en HOLD y se vincula a un NCR, el defecto se localiza con un método de diagnóstico aprobado y el retrabajo solo se realiza tras la autorización de Calidad/Ingeniería y únicamente dentro de las clases de defecto aprobadas para retrabajo. El tornillo de banco se reinspecciona después contra los mismos criterios de aceptación que un producto conforme antes de su liberación.'
    - q: '¿Cuántas veces puede retrabajar la fábrica un tornillo de banco?'
      a: 'Una misma ubicación puede retrabajarse una sola vez bajo una instrucción autorizada. Si la reinspección sigue fallando, el tornillo de banco se escala a sustitución, rechazo, desecho o concesión del cliente — no se permite repetir el retrabajo sin aprobación documentada.'

