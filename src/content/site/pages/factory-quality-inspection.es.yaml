answer:
  label: 'Respuesta directa'
  text: 'Stavalk controla la calidad de los tornillos de banco mediante un sistema de inspección de 7 puertas: control de materiales entrantes (IQC), inspección de fundición y forja en proceso, verificación de mecanizado CNC, control de tratamiento térmico, control de calidad de montaje (IPQC), ensayos finales del producto (FQC) y embalaje y liberación de pre-embarque (OQC). Cada pedido se inspecciona según la muestra aprobada, la especificación técnica, la prueba de arte, la BOM y los estándares de embalaje, con pruebas de fuerza de sujeción, verificación de dureza de las mordazas, comprobación de par de giro de la base, precisión dimensional, confirmación de accesorios y trazabilidad del lote. Los artículos que no cumplen los criterios de aceptación se ponen bajo retención o cuarentena controlada, se retrabajan solo bajo instrucciones aprobadas y se reinspeccionan antes de la liberación autorizada.'
  verified: '2026-09'

intro: 'Nuestro sistema de calidad está diseñado para proyectos OEM/ODM: los criterios de inspección se definen por pedido, se documentan y son seguidos por los equipos de producción y calidad desde el material entrante hasta el embalaje. Esto mantiene alineadas las expectativas de calidad entre la fábrica y tu marca, desde la primera muestra hasta los contenedores completos.'

scope_note:
  tagline: Alcance
  title: Criterios de inspección específicos por proyecto
  body: |
    Las especificaciones de calidad pueden variar según la construcción del tornillo de banco (por ejemplo, uso ligero con mordazas de 4″–5″, uso medio de 6″–8″, uso pesado de 8″–10″, tornillos de banco para tubos, tornillos de banco especiales), el uso final previsto, las normativas del mercado de destino y los parámetros aprobados por el cliente. La autorización final de liberación se basa estrictamente en los criterios de inspección documentados y acordados para el pedido.

stages:
  tagline: Marco de calidad
  title: Nuestro sistema de verificación de calidad en 7 fases
  subtitle: Un circuito completo de control de calidad desde la llegada de la materia prima hasta la liberación del envío.
  steps:
    - title: '1. Control de materiales entrantes (IQC)'
      desc: 'Los materiales y componentes adquiridos se comprueban según las especificaciones aprobadas y las muestras de referencia antes de entrar en la línea de producción. Los cuerpos de hierro fundido gris HT200/HT250 se verifican en cuanto a composición química, resistencia a la tracción y porosidad superficial. Los componentes de acero forjado 45# se comprueban en cuanto a estructura del grano, dureza y tolerancias dimensionales. Las mordazas endurecidas de acero GCr15/Cr12MoV se verifican en cuanto a composición de la aleación, potencial de dureza y acabado superficial. Los herrajes, elementos de fijación y materiales de recubrimiento se cotejan en cantidad, color, marca, precisión del código de barras y versión de arte según la BOM aprobada.'
    - title: '2. Inspección de fundición y forja'
      desc: 'Los cuerpos de hierro fundido se inspeccionan en cuanto a integridad del molde, temperatura de colada, colocación de los bebederos y solidificación de la colada. Los machos de arena verde y arena aglomerada con resina se comprueban en cuanto a precisión dimensional y acabado superficial. Los componentes de acero forjado se verifican en cuanto a alineación de la matriz, temperatura de forja, recorte de rebaba y consistencia de peso según los planos aprobados.'
    - title: '3. Verificación de mecanizado CNC (IPQC)'
      desc: 'Los pasos críticos de mecanizado se inspeccionan para detectar no conformidades antes de que los componentes pasen a los siguientes puestos de trabajo. El fresado del asiento de las mordazas se verifica en cuanto a planitud, paralelismo y rugosidad superficial según los planos técnicos aprobados. El roscado y taladrado se comprueban en cuanto a paso, profundidad y concentricidad. El mecanizado de la base giratoria se verifica en cuanto a suavidad de rotación, posición de los topes y alineación de los orificios de montaje.'
    - title: '4. Control de tratamiento térmico'
      desc: 'Los componentes tratados térmicamente se someten a verificación obligatoria de dureza y metalúrgica antes del montaje. Las mordazas (GCr15/Cr12MoV) se templan y revenan para alcanzar una dureza de 58–62 HRC, verificada con durómetros calibrados. Los cuerpos de hierro fundido reciben un relevado de tensiones para garantizar la estabilidad dimensional. Los componentes de acero forjado reciben endurecimiento superficial cuando se especifica. Todos los registros de tratamiento térmico se registran por lote con curvas de temperatura y tiempos de mantenimiento.'
    - title: '5. Control de calidad del montaje'
      desc: 'Los tornillos de banco terminados se someten a verificación de montaje antes de los ensayos finales. La rotación de la base giratoria se comprueba en cuanto a funcionamiento suave y engrane de los topes. Los mecanismos de liberación rápida se ensayan en cuanto a fuerza de engrane y desengrane. Las superficies del yunque se verifican en cuanto a planitud y dureza. El par de apriete de los pernos, el funcionamiento de la manivela y la alineación de las mordazas se verifican según las especificaciones de montaje.'
    - title: '6. Ensayos finales del producto (FQC)'
      desc: 'Los tornillos de banco terminados se someten a ensayos funcionales y estructurales obligatorios antes de la aprobación para el embalaje. La fuerza de sujeción se mide a la capacidad nominal con dinamómetros calibrados. El paralelismo de las mordazas se verifica bajo carga con comparadores de cuadrante. El par de giro de la base se ensaya en todo el rango de rotación. El ensayo de durabilidad por ciclos simula más de 10.000 operaciones de apertura-cierre. El ensayo de niebla salina (48 h o más) verifica la integridad del recubrimiento superficial en pintura, polvo o parkerizado.'
    - title: '7. Embalaje y liberación de pre-embarque (OQC)'
      desc: 'La verificación exhaustiva de pre-embarque garantiza cero discrepancias en la configuración del SKU o las marcas de envío. La comprobación de la integridad del kit cruza el tornillo de banco, los herrajes de montaje, el manual de instrucciones y los accesorios específicos del cliente con la BOM del pedido. Los controles de embalaje y código de barras verifican las marcas del cartón, las etiquetas de SKU, la legibilidad del código de barras, el idioma del manual y la integridad estructural del cartón. Los pedidos se liberan solo tras la auditoría final de embalaje firmada por personal de calidad autorizado.'

inspection_points:
  tagline: Cobertura de inspección
  title: Puntos clave de control de inspección
  subtitle: Cada punto de control se ejecuta según criterios de aceptación documentados y acordados por pedido.
  features:
    - icon: A
      icon_bg: blue
      title: Verificación de la fuerza de sujeción
      desc: 'Los tornillos de banco terminados se ensayan a la fuerza de sujeción nominal con dinamómetros calibrados. Las lecturas de fuerza se registran por unidad y se comparan con la especificación mínima. Cualquier tornillo de banco que no alcance la capacidad nominal se rechaza y se deriva al proceso de no conformidad.'
    - icon: B
      icon_bg: green
      title: Inspección visual y dimensional
      desc: 'Los tornillos de banco se inspeccionan con iluminación adecuada en cuanto a acabado superficial, defectos de fundición, marcas de mecanizado, uniformidad del recubrimiento, rayones, contaminación y alineación del montaje. Las dimensiones clave y las posiciones de las mordazas se verifican según los planos o especificaciones aprobados.'
    - icon: C
      icon_bg: purple
      title: Verificación de accesorios y embalaje
      desc: 'La configuración completa del producto se verifica antes del envío: modelo de tornillo de banco, base giratoria, herrajes de montaje, manual de instrucciones y accesorios específicos del cliente, cada uno cotejado con la muestra, los planos y la BOM aprobados.'
    - icon: D
      icon_bg: orange
      title: Embalaje y liberación del envío
      desc: 'Las unidades embaladas se comprueban en cuanto a configuración de SKU, integridad de accesorios, etiquetas de producto, información del código de barras, versión del manual de instrucciones, marcado del cartón, cantidad de embalaje y estado del cartón. La liberación del envío se autoriza solo tras completar todos los requisitos de inspección y embalaje.'

traceability_intro:
  tagline: Trazabilidad de lotes
  title: Sistema de trazabilidad a nivel de proyecto y de lote
  body: |
    Cada pedido de tornillo de banco personalizado se gestiona bajo un código de proyecto unificado que vincula las especificaciones técnicas, la BOM aprobada, las revisiones de arte, los números de lote de material, las referencias de embalaje y los registros de inspección. Los registros de producción e inspección se mantienen por proyecto y por lote de producción aplicable, y cada lote puede vincularse de nuevo a la especificación del producto aprobada, la BOM, el arte y las referencias de embalaje.

    Esto respalda una revisión eficiente de la configuración del producto, el estado de la inspección y el alcance afectado si se identifica un problema de calidad — desde el producto terminado hasta los registros de origen, utilizando la identificación del tornillo de banco o del cartón.

traceability_chain:
  tagline: Cadena de trazabilidad
  title: Del código de proyecto a la liberación del envío
  subtitle: Una cadena de referencias controladas desde la confirmación del pedido hasta el despacho autorizado.
  steps:
    - step: '01'
      title: Código de proyecto
      desc: 'Referencia unificada del proyecto que vincula cada documento controlado con el pedido.'
    - step: '02'
      title: Revisiones de documentos
      desc: 'Niveles de revisión actuales de especificación, BOM, arte y embalaje: solo las versiones aprobadas son válidas para producción.'
    - step: '03'
      title: Lote y materiales
      desc: 'Lotes de materiales y componentes registrados contra el lote de producción.'
    - step: '04'
      title: Registros de inspección
      desc: 'Resultados de inspección IQC, fundición, mecanizado, tratamiento térmico, montaje, final y de embalaje por lote.'
    - step: '05'
      title: Embalaje y liberación
      desc: 'Lote de embalaje, estado de cierre de NCR y resumen de liberación de envío autorizada.'

traceability_sample:
  tagline: Muestra anonimizada
  title: Registro de control de trazabilidad (demo)
  body: |
    Los valores de demostración se muestran solo con fines ilustrativos: los nombres de clientes, números de PO, arte personalizado, datos de proveedores e información comercial se eliminan para proteger la confidencialidad.

    - **Fabricante:** Stavalk (Qingdao, China)
    - **Código de proyecto:** DEMO-VISE-2026-01
    - **Referencia de SKU:** DEMO-BV-600
    - **Lote de producción:** BATCH-SEP-01
    - **Revisión de especificación / BOM / arte:** Rev B / Rev C / Rev B
    - **Ensayo de fuerza de sujeción:** PASS — conservado por lote
    - **Estado de inspección:** PASS
    - **Estado de envío:** RELEASED

quarantine_intro:
  tagline: Control de no conformidades
  title: Control de productos no conformes y cuarentena
  body: |
    Los productos o componentes que no cumplen los criterios de aceptación definidos se identifican claramente y se ponen bajo estado de retención o cuarentena controlada. No pueden pasar a la siguiente etapa de producción, al embalaje ni al envío hasta completar una disposición autorizada. El retrabajo se realiza bajo instrucciones aprobadas y se vincula al registro de no conformidad correspondiente; los artículos retrabajados se reinspeccionan según los requisitos del proyecto aplicables antes de la liberación de calidad.

quarantine_flow:
  tagline: Flujo de control en 7 pasos
  title: Qué ocurre cuando se detecta una no conformidad
  subtitle: Identificar, controlar, corregir, verificar — luego liberar o rechazar. El producto no conforme nunca vuelve a producción o embalaje sin verificación.
  steps:
    - step: '01'
      title: Identificar
      desc: 'La no conformidad se registra contra el producto, SKU, lote o etapa de proceso afectados.'
    - step: '02'
      title: Etiquetar
      desc: 'Los artículos afectados se identifican claramente con etiquetas de estado controladas — HOLD, CUARENTENA o RECHAZADO.'
    - step: '03'
      title: Cuarentena
      desc: 'Los artículos se separan en una zona de cuarentena físicamente controlada o se bloquean por sistema para evitar su uso o envío no intencionado.'
    - step: '04'
      title: Evaluar el alcance
      desc: 'El alcance afectado se revisa por lote, etapa de proceso, lote de material y revisión de documento.'
    - step: '05'
      title: Retrabajo / Sustitución
      desc: 'La corrección solo se permite mediante una disposición aprobada y una instrucción de trabajo controlada.'
    - step: '06'
      title: Reinspección
      desc: 'Los artículos corregidos se reinspeccionan según los criterios de aceptación aplicables antes de la liberación.'
    - step: '07'
      title: Liberar o rechazar
      desc: 'Solo el producto conforme autorizado avanza al embalaje o a la liberación del envío.'

quarantine_evidence:
  tagline: En el taller
  title: Ensayos controlados y cuarentena en la práctica
  subtitle: Fotografías de nuestro taller en Qingdao que muestran cómo se aplican el control de estado y los registros de inspección en planta.
  features:
    - image: https://assets.Stavalk.com/site/quality/qc-clamping-force-test-area.avif
      alt: Tornillos de banco sometidos a ensayos de fuerza de sujeción en el área de calidad de la fábrica con dinamómetros calibrados
      title: Zona de ensayo de fuerza de sujeción
      desc: 'Tornillos de banco mantenidos en la zona de control de calidad bajo iluminación industrial, con dinamómetros calibrados que miden la capacidad de sujeción nominal en la cara de las mordazas. Los registros se conservan por lote y se vinculan a la inspección final.'
    - image: https://assets.Stavalk.com/site/quality/qc-hold-quarantine-station.avif
      alt: Hojas de control de calidad y etiquetas de estado de retención controlada en la estación de inspección de la fábrica
      title: Estación de retención y cuarentena
      desc: 'Estación de inspección con hojas de control de calidad y etiquetado de estado. Cualquier artículo que no cumpla los criterios de aceptación se etiqueta, se registra y se traslada a cuarentena: no puede pasar al embalaje hasta completar una disposición autorizada y una reinspección obligatoria.'
    - image: https://assets.Stavalk.com/site/quality/qc-hardness-rework.avif
      alt: Técnico de control de calidad realizando un retrabajo controlado de dureza en la mordaza de un tornillo de banco en la estación de retrabajo de la fábrica
      title: Estación de retrabajo controlado
      desc: 'El retrabajo se realiza en una estación dedicada según una tarjeta de método aprobada: el defecto se marca, el tornillo de banco permanece en HOLD y, tras el proceso requerido, vuelve a la zona de ensayos para su reinspección contra los criterios de aceptación originales.'
    - image: https://assets.Stavalk.com/site/quality/qc-workshop-quarantine-demo.avif
      alt: Demostración en el taller de la segregación controlada en cuarentena en la fábrica de Qingdao
      title: Demostración de la zona de cuarentena
      desc: 'Fotografía de demostración del taller que muestra cómo funciona la segregación controlada en cuarentena en planta: las unidades segregadas se mantienen bajo control de estado hasta que se completa una disposición autorizada.'

rework_intro:
  tagline: Gobernanza del retrabajo
  title: Gobernanza controlada de no conformidades y retrabajo
  body: |
    En Stavalk, el retrabajo se define estrictamente como la restauración de una unidad no conforme hasta el pleno cumplimiento de su especificación de ingeniería original — no como un arreglo rápido. Cualquier tornillo de banco identificado con una no conformidad de calidad se coloca bajo retención controlada y se vincula a un Informe de No Conformidad (NCR) antes de continuar cualquier proceso; la fuente del defecto se localiza y registra mediante el método de diagnóstico aprobado.

    El retrabajo solo puede realizarse cuando el defecto está dentro del alcance de retrabajo aprobado y se dispone de un método autorizado. La instrucción de retrabajo identifica el producto, el lote, la ubicación del defecto, el material aprobado, el método, las condiciones requeridas y el alcance de la reinspección. Tras el proceso requerido, el tornillo de banco se reinspecciona contra los mismos criterios de aceptación aplicables que un producto conforme — el retrabajo nunca reduce el estándar de aceptación. El fallo de la reinspección exige una nueva disposición de ingeniería y calidad; no se permite repetir el retrabajo sin una aprobación documentada.

rework_decision:
  tagline: Flujo interactivo
  title: Flujo de decisión de retrabajo — haz clic en cualquier nodo
  subtitle: Sigue cómo se gestiona una no conformidad desde la detección hasta la liberación o el desecho. Haz clic en un nodo para expandir los requisitos de control en ese paso.
  nodes:
    - id: detect
      type: start
      label: Defecto detectado
      detail: 'Se identifica una no conformidad de calidad durante la inspección — fallo de fuerza de sujeción, dureza de mordaza por debajo de la especificación, defecto superficial o defecto relacionado de fabricación.'
    - id: hold
      type: step
      label: Parada de línea — Etiqueta HOLD — NCR
      detail: 'El procesamiento se detiene. Se registran el ID del tornillo de banco, el código de producto, el lote, el puesto de trabajo, la fecha y el inspector; se coloca una etiqueta HOLD / CUARENTENA y se abre un NCR contra la revisión de especificación aplicable.'
    - id: locate
      type: step
      label: Localizar la fuente del defecto
      detail: 'El defecto se localiza con el método aprobado — inspección visual, ensayo de dureza calibrado, medición dimensional o ensayo de fuerza con equipos calibrados.'
    - id: classify
      type: step
      label: Clasificar el defecto (A–G)
      detail: 'El defecto se clasifica según la matriz de aprobación: A acabado superficial, B dimensional, C dureza, D fuerza de sujeción, E mecanismo giratorio, F recubrimiento, G estructural.'
    - id: authorize
      type: decision
      label: '¿Retrabajo autorizado?'
      yes: rework
      no: escalate
      detail: 'Calidad confirma la categoría del defecto e Ingeniería evalúa si el tornillo de banco puede restaurarse a su especificación original. La autorización registra la tarjeta de método, los materiales, las condiciones y el alcance de la reinspección — o deriva a sustitución, rechazo, desecho o concesión del cliente.'
    - id: rework
      type: step
      label: Retrabajo controlado
      detail: 'Se ejecuta solo dentro del límite del defecto aprobado, con la tarjeta de método, el lote de material y las herramientas aprobados — nunca se alteran las dimensiones, la construcción, el acabado superficial ni los requisitos de embalaje.'
    - id: cure
      type: step
      label: Proceso y estabilización
      detail: 'El tornillo de banco permanece en HOLD durante el proceso de retrabajo definido por la instrucción de material y proceso aprobada, y recibe una preinspección visual y dimensional.'
    - id: reinspect
      type: decision
      label: '¿Reinspección superada?'
      yes: release
      no: escalate
      detail: 'El tornillo de banco se ensaya contra los criterios de reinspección aprobados por el proyecto y se reverifican el fallo original y todas las características potencialmente afectadas — fuerza de sujeción, dureza de mordaza, precisión dimensional, integridad del recubrimiento y aspecto. El retrabajo nunca reduce el estándar de aceptación.'
    - id: release
      type: release
      label: Liberación de calidad
      detail: 'Calidad revisa el NCR cerrado, el registro de retrabajo y el resultado de la reinspección y autoriza la liberación. Ningún tornillo de banco retrabajado se embala ni se envía sin la liberación de calidad autorizada.'
    - id: escalate
      type: escalate
      label: Escalar — Sustituir / Desechar / Concesión
      detail: 'No se repite el retrabajo sin aprobación documentada. El tornillo de banco se deriva a sustitución, rechazo, desecho o concesión escrita del cliente cuando no puede restaurarse la especificación original.'

defect_matrix:
  tagline: Clasificación de defectos
  title: Matriz de clasificación de defectos y aprobación
  subtitle: No todo defecto se retrabaja — cada defecto se clasifica y su disposición se aprueba al nivel adecuado, desde el inspector de calidad hasta el director de planta.
  headers:
    category: Categoría de defecto
    area: Zona típica
    eligibility: Elegibilidad de retrabajo
    approval: Aprobación requerida
  rows:
    - category: 'Clase A — Acabado superficial'
      area: 'Superficie de fundición, superficie mecanizada, acabado del recubrimiento'
      eligibility: 'Retrabajo estándar autorizado'
      approval: 'Inspector de calidad'
    - category: 'Clase B — Dimensional'
      area: 'Paralelismo de las mordazas, diámetro del agujero, paso de rosca'
      eligibility: 'Retrabajo evaluado según la tarjeta de método aprobada'
      approval: 'Calidad + Ingeniería'
    - category: 'Clase C — Dureza'
      area: 'Dureza de la mordaza por debajo de la especificación de 58 HRC'
      eligibility: 'Autorizado solo si es factible un nuevo tratamiento térmico'
      approval: 'Calidad + Ingeniería'
    - category: 'Clase D — Fuerza de sujeción'
      area: 'Salida de fuerza por debajo de la capacidad nominal'
      eligibility: 'Riesgo alto; requiere disposición estricta de ingeniería'
      approval: 'Ingeniería + Jefe de calidad'
    - category: 'Clase E — Mecanismo giratorio'
      area: 'Rotación de la base, topes, fallo de liberación rápida'
      eligibility: 'Retrabajo estándar no autorizado — sustitución o revisión de causa raíz'
      approval: 'Jefe de calidad + Concesión del cliente'
    - category: 'Clase F — Recubrimiento'
      area: 'Defectos de pintura, polvo o parkerizado'
      eligibility: 'Re-recubrimiento dentro de los parámetros aprobados'
      approval: 'Jefe de calidad / Ingeniería'
    - category: 'Clase G — Estructural'
      area: 'Grieta de fundición, defecto de forja, deformación del cuerpo'
      eligibility: 'Retrabajo no autorizado — sustitución, desecho o concesión escrita del cliente'
      approval: 'Responsable de calidad + Aprobación del cliente'

rework_flow:
  tagline: Circuito cerrado en 7 pasos
  title: Flujo de retrabajo controlado — de la detección a la liberación o el desecho
  subtitle: 'Todo retrabajo sigue el mismo circuito controlado: detectar, aislar, diagnosticar, autorizar, retrabajar, reinspeccionar, liberar.'
  steps:
    - step: '01'
      title: Detección, parada de línea y cuarentena
      desc: 'El procesamiento del tornillo de banco afectado se detiene de inmediato. Se registran el ID del tornillo de banco, el código de producto, el lote, el puesto de trabajo, la fecha y el inspector; se coloca una etiqueta HOLD / CUARENTENA y se abre un NCR contra la revisión de especificación aplicable.'
    - step: '02'
      title: Diagnóstico sistemático del defecto
      desc: 'El defecto se localiza con el método aprobado — inspección visual, ensayo de dureza calibrado, medición dimensional o ensayo de fuerza. La ubicación sospechosa se marca sin dañar el producto.'
    - step: '03'
      title: Disposición y autorización de ingeniería
      desc: 'Calidad confirma la categoría del defecto e Ingeniería evalúa si el tornillo de banco puede restaurarse a su especificación original. Una autorización de retrabajo vinculada al NCR registra el método, los materiales, las condiciones y el alcance de la reinspección aprobados — o asigna sustitución, rechazo, desecho o concesión del cliente.'
    - step: '04'
      title: Ejecución controlada del retrabajo
      desc: 'El retrabajo se ejecuta solo dentro del límite del defecto aprobado, utilizando la tarjeta de método, el lote de material y las herramientas aprobados. Las dimensiones, el acabado superficial, la función mecánica y los requisitos de embalaje del tornillo de banco nunca se alteran.'
    - step: '05'
      title: Finalización del proceso y preinspección
      desc: 'El tornillo de banco retrabajado permanece en estado HOLD durante el proceso de retrabajo definido por las instrucciones aprobadas, y recibe una preinspección visual y dimensional antes de la reinspección.'
    - step: '06'
      title: Reinspección y ensayo de prueba
      desc: 'El tornillo de banco se ensaya contra los criterios de reinspección aprobados por el proyecto y se reverifican el fallo original y todas las características potencialmente afectadas: fuerza de sujeción, dureza de mordaza, precisión dimensional, función de giro, integridad del recubrimiento y aspecto. El retrabajo nunca reduce el estándar de aceptación.'
    - step: '07'
      title: Liberación de calidad o disposición final
      desc: 'Calidad revisa el NCR completado, el registro de retrabajo y el resultado de la reinspección y autoriza la liberación — o escala a sustitución, rechazo, desecho o concesión del cliente. Ningún tornillo de banco retrabajado se embala ni se envía sin la liberación de calidad autorizada.'

quality_safeguards:
  tagline: Salvaguardas de calidad
  title: Reglas a prueba de errores que protegen tu marca
  subtitle: Controles firmes que evitan bucles de reparación no controlados — un retrabajo documentado por defecto, umbrales de alerta por lote, instrumentación calibrada y condiciones de ensayo controladas.
  features:
    - icon: 1
      icon_bg: blue
      title: Un retrabajo por defecto
      desc: 'Una misma ubicación puede retrabajarse una sola vez bajo una instrucción autorizada. Si la reinspección sigue fallando, el tornillo de banco se escala a sustitución, rechazo, desecho o concesión del cliente — no se permite repetir el retrabajo sin aprobación documentada.'
    - icon: 2
      icon_bg: green
      title: Alerta por lote y parada de línea
      desc: 'Cuando la no conformidad de un lote de producción supera el umbral fijado por ingeniería, la línea se detiene e Ingeniería investiga la causa — lote de material, condiciones de proceso y registros — antes de reanudar la producción.'
    - icon: 3
      icon_bg: purple
      title: Instrumentación calibrada
      desc: 'Los dinamómetros, durómetros, calibradores y llaves dinamométricas utilizados para los ensayos se controlan y calibran por laboratorios de terceros dentro de su periodo de validez, con el estado de calibración visible en la zona de inspección.'
    - icon: 4
      icon_bg: orange
      title: Condiciones de ensayo controladas
      desc: 'Las zonas de ensayo se mantienen en un entorno controlado para que los resultados no se vean afectados por las variaciones de temperatura entre el día y la noche.'

rework_boundaries:
  tagline: Alcance y límites
  title: Qué no cubre este sistema
  body: |
    El sistema de control de retrabajo se aplica a tornillos de banco terminados o en proceso identificados con defectos dimensionales, de dureza, de fuerza, de recubrimiento o estructurales antes de la liberación del envío. No autoriza cambios en la construcción, los materiales, el acabado superficial, la configuración del producto o los requisitos del cliente aprobados, y no cubre:

    - Productos ya enviados o en canales de distribución del cliente.
    - Daños estructurales o deformaciones del cuerpo no evaluados por Ingeniería.
    - Defectos generalizados de fundición, fallos de forja o defectos que puedan afectar a la seguridad.
    - Proyectos en los que no se permite el retrabajo: muestras aprobadas por el cliente, unidades de certificación o ensayo.
    - Proyectos con procesos propietarios del cliente, materiales especiales o requisitos de reparación especiales.
    - Defectos recurrentes que no pueden localizarse, o tornillos de banco que vuelven a fallar tras el retrabajo.

    Cualquier desviación de las especificaciones del cliente requiere una revisión de ingeniería documentada y, cuando corresponda, la aprobación escrita del cliente. Los tornillos de banco que no puedan restaurarse a su especificación original solo se liberan bajo una concesión explícita del cliente — nunca por decisión únicamente de producción.

method_cards:
  tagline: Sistema de tarjetas de método
  title: Índice de tarjetas de método de retrabajo controlado
  subtitle: 'La instrucción general controla el proceso; las tarjetas de método controlan la operación. La instrucción de retrabajo (WI-QC-RW-001) referencia las tarjetas de método MC-RW-01 a MC-RW-06, además de MC-RW-00 para desecho y rechazo obligatorios.'
  headers:
    code: Tarjeta de método
    defect: Clase de defecto
    scope: Alcance de aplicación
    controls: Controles clave de ingeniería
    approval: Autoridad de aprobación
  rows:
    - code: MC-RW-01
      defect: Clase A (Acabado superficial)
      scope: 'Restauración de esmerilado y pulido de superficie'
      controls: 'Muela calibrada, velocidad de avance controlada, medidor de rugosidad superficial'
      approval: 'Inspector de calidad'
    - code: MC-RW-02
      defect: Clase B (Dimensional)
      scope: 'Re-mecanizado CNC de asientos de mordaza y agujeros'
      controls: 'Medición por coordenadas, fijación controlada, parámetros de corte aprobados'
      approval: 'Calidad + Ingeniería'
    - code: MC-RW-03
      defect: Clase C (Dureza)
      scope: 'Nuevo tratamiento térmico de las mordazas'
      controls: 'Temperatura de horno controlada, medio de temple, ciclo de revenido posterior'
      approval: 'Calidad + Ingeniería'
    - code: MC-RW-04
      defect: Clase D (Fuerza de sujeción)
      scope: 'Re-roscado y corrección de la alineación de las mordazas'
      controls: 'Apriete controlado por par, comprobación de alineación con comparador de cuadrante'
      approval: 'Ingeniería + Jefe de calidad'
    - code: MC-RW-05
      defect: Clase E (Mecanismo giratorio)
      scope: 'Re-mecanizado de la base y reparación de los topes'
      controls: 'Plantilla de precisión, ajuste de par controlado, ensayo de fuerza de engrane'
      approval: 'Calidad + Ingeniería'
    - code: MC-RW-06
      defect: Clase F (Recubrimiento)
      scope: 'Re-recubrimiento de superficie (pintura, polvo, parkerizado)'
      controls: 'Preparación de superficie, espesor de aplicación controlado, ciclo de curado'
      approval: 'Ingeniero jefe'
    - code: MC-RW-00
      defect: Clase G (Crítico / Estructural)
      scope: 'Desecho obligatorio y destrucción física'
      controls: 'Corte físico para evitar mezclas, registro de desecho, revisión de causa raíz entre departamentos'
      approval: 'Director de planta'

inspector_friendly:
  tagline: Inspección de terceros
  title: Protocolo amigable para inspectores
  body: |
    Disponemos de una zona de inspección dedicada con dinamómetros calibrados, durómetros, instrumentos de medición de precisión y Briefs de inspección precumplimentados para que las agencias de terceros (SGS, TÜV, BV, Intertek) puedan completar la inspección de pre-embarque de forma eficiente — reduciendo tus costes de inspección.

    Cada brief resume las revisiones de documentos aplicables, la referencia de la muestra aprobada, los controles críticos de calidad, el nivel de muestreo acordado, los ensayos funcionales y los requisitos de embalaje y código de barras del PO. Las cantidades, la calidad, el embalaje y los elementos básicos de seguridad especificados se verifican contra las referencias del proyecto aprobadas — sin búsquedas de última hora sobre el terreno.

