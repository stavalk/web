workshops:
  - title: Foundry & Casting Workshop
    description: 'Automatic sand casting line producing HT200/HT250 gray cast iron bodies, slides and bases. Melting, pouring, shakeout and shot blasting run in parallel with QC sampling per heat. Annual casting capacity: 80,000+ units.'
    output: '80,000+ castings/year'
  - title: CNC Machining Workshop
    description: 'CNC machining centers and lathes for bodies, slides, screws and jaw beds, with threading on 45# forged carbon steel. Machining runs in parallel with heat treatment for continuous flow.'
    output: 'Expanded machining capacity'
  - title: Heat Treatment & Finishing Line
    description: 'Induction hardening of GCr15 / Cr12MoV jaws to 58–62 HRC, plus electrostatic powder coating and zinc plating lines. All finishing stations are reconfigured based on order mix. Annual capacity: 80,000+ units.'
    output: '80,000+ units/year'
  - title: Assembly, Pipe-Jaw & Packing
    description: 'Dedicated assembly area for swivel bases, pipe-jaw (chain and tripod) sets, screw/guide fitting and final adjustment, plus export packing stations. Annual assembly capacity: 80,000+ units.'
    output: '80,000+ vises/year'

oem_capacity:
  moq: 'Standard models 50–200 | heavy/specialty 20–50 pcs per model'
  lead_time: 'Standard 25–35 days. Sample 7–14 days. Rush available.'
  payment: 'T/T 30% deposit + 70% balance. L/C, Western Union accepted.'

lead_time_explainer:
  tagline: 'Planning & Scheduling'
  title: 'How Capacity Translates Into Your Delivery'
  subtitle: 'Capacity is not a single number — here is how lead times are actually allocated.'
  items:
    - title: 'Capacity varies with your specification'
      body: 'Available slots shift with vise model, jaw width, coating and finish complexity, packaging and seasonal demand. During the spring/summer build-up, lines run near full and sample slots book out first.'
    - title: 'Plan ahead of your launch season'
      body: 'Lock your sample confirmation and coating/finish freeze early. Repeat orders are scheduled into your agreed recurring slot once the golden sample is archived.'
    - title: 'Three scheduling lanes'
      body: 'Samples enter the prototype line first, initial orders slot into the nearest open assembly window, and repeat orders run in their recurring slot.'
    - title: 'Firm lead times after review'
      body: 'We confirm a firm lead time only after specification, casting pattern, coating, packaging and quantity are reviewed — never as a fixed promise beforehand.'

