meta:
  title: 'Laboratoire qualité —Essais et assurance qualité | {SITE}'
  description: 'Laboratoire qualité indépendant avec processus ISO 9001:2015 chez Stavalk : chaque unité testée avant expédition pour garantir la qualité des étaux d''établi.'
  dateModified: '2026-09-01'
  keywords:
    - 'contrôle qualité étaux'
    - 'laboratoire d''essais d''étaux'
    - 'usine d''étaux iso 9001'
    - 'qualité étau'
hero:
  tagline: Laboratoire de contrôle qualité
  title: Laboratoire d'essais et assurance qualité
  subtitle: Laboratoire qualité indépendant avec processus ISO 9001:2015 —chaque unité testée avant expédition

intro: Stavalk exploite un laboratoire de contrôle qualité dédié qui fonctionne indépendamment de la production. Chaque lot de matière première et chaque étau d'établi fini passe par des protocoles d'inspection documentés avant libération. Notre équipe QC relève directement de la direction, garantissant des décisions qualité impartiales.

highlights:
  - value: 100%
    label: Unités contrôlées en dureté
    detail: Chaque mâchoire, chaque lot
  - value: 58–62
    label: Dureté des mâchoires (HRC)
    detail: Après trempe par induction
  - value: 10,000+
    label: Durabilité ouverture/fermeture
    detail: Par modèle et par lot
  - value: 48h+
    label: Brouillard salin anticorrosion
    detail: Sur surfaces zinguées

test_procedures:
  - title: Inspection des matières premières
    description: Chaque lot entrant de fonte grise HT200/HT250, d'acier forgé 45#, d'acier de mâchoires GCr15 / Cr12MoV et de quincaillerie est testé avant acceptation. L'analyse spectrométrique, la dureté Rockwell et les contrôles dimensionnels sont vérifiés. Les matériaux non conformes sont mis en quarantaine et retournés.
    standards:
      - ISO 6508-1 (Rockwell)
      - Analyse spectrométrique
      - GB/T 9439 (fonte grise)
  - title: Points de contrôle QC en cours de fabrication
    description: Les opérateurs de production effectuent une auto-inspection à chaque étape. Les auditeurs QC réalisent un échantillonnage aléatoire tout au long de l'équipe. La dureté des mâchoires est contrôlée par échantillonnage sur chaque lot de trempe et les contrôles dimensionnels ont lieu chaque 20e unité.
    standards:
      - ISO 6508-1 (dureté)
      - Liste de contrôle interne à 100 points
      - Échantillonnage ISO 2859
  - title: Essais fonctionnels et de durabilité
    description: Les étaux assemblés sont testés en force de serrage et en couple de pivot, avec des échantillons passant plus de 10 000 cycles d'ouverture/fermeture. Toute défaillance déclenche une ré-inspection automatique du lot et une action corrective.
    standards:
      - Spécification interne de force de serrage
      - Durabilité de plus de 10 000 cycles
      - Échantillonnage ISO 2859
  - title: Vérification de la corrosion et de la finition
    description: Les surfaces zinguées et revêtues par poudre subissent plus de 48 h d'essai de brouillard salin neutre selon ISO 9227, avec vérification de l'adhérence du revêtement par essai de quadrillage avant libération finale.
    standards:
      - ISO 9227 (brouillard salin)
      - ISO 2409 (adhérence au quadrillage)

equipment:
  - name: Duromètre Rockwell
    spec: Échelle HRC, vérification des lots de mâchoires
  - name: Spectromètre à décharge optique
    spec: 'C, Si, Mn, P, S sur les coulées HT200/HT250'
  - name: Banc de test de force de serrage
    spec: kN/capteur de charge, calibré
  - name: Jauge d'épaisseur de revêtement (numérique)
    spec: Résolution 0,1 μm
  - name: Testeur de durabilité ouverture/fermeture
    spec: 'Programmable, +10 000 cycles'
  - name: Testeur de couple de pivot
    spec: Clé dynamométrique calibrée
  - name: Chambre de brouillard salin
    spec: 'ISO 9227, exposition +48 h'

lab_evidence:
  tagline: Dossiers de rapports de test
  title: 'Télécharger les rapports de test de laboratoire réels'
  subtitle: 'Les mêmes enregistrements bilingues contrôlés contre lesquels notre équipe qualité clôture —structure, méthodes, critères et résultats, avec les champs confidentiels supprimés. Chaque dossier correspond à l''une des sept portes d''inspection.'
  items:
    - title: 'IQC —Rapports des matières entrantes'
      description: 'Certificats de lots de fonte et d''acier, analyse spectrométrique et vérification de dureté Rockwell par rapport à la spécification approuvée.'
      icon: tabler:file-certificate
      link: https://assets.stavalk.com/site/downloads/STAVALK_IQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports IQC (PDF)'
    - title: 'IPQC —Rapports en cours de fabrication et du premier article'
      description: 'Enregistrements du premier article et de l''inspection en cours de fabrication contre la révision verrouillée.'
      icon: tabler:file-check
      link: https://assets.stavalk.com/site/downloads/STAVALK_IPQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports IPQC (PDF)'
    - title: 'Traitement thermique —Enregistrements de dureté et de durabilité'
      description: 'Contrôles de dureté des mâchoires à 100 % à 58–62 HRC, tests de force de serrage et enregistrements de durabilité de plus de 10 000 cycles d''ouverture/fermeture.'
      icon: tabler:waves
      link: https://assets.stavalk.com/site/downloads/STAVALK_HEAT_TREATMENT_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports de traitement thermique (PDF)'
    - title: 'FQC —Rapports de test final des étaux'
      description: 'Inspection finale contre l''échantillon approuvé —dimensions, cosmétique et marquage de fonderie.'
      icon: tabler:shield-check
      link: https://assets.stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports FQC (PDF)'
    - title: 'PSI —Rapports de conditionnement et avant expédition'
      description: 'Complétude du kit, note de code-barres, marquages des cartons et enregistrements de sécurité à la chute.'
      icon: tabler:package
      link: https://assets.stavalk.com/site/downloads/STAVALK_PSI_TEST_REPORTS.pdf
      link_label: 'Télécharger les rapports PSI (PDF)'
    - title: 'Dossier d''autorisation d''expédition et de traçabilité'
      description: 'Autorisation de libération et traçabilité des lots mappée à la spécification, au patron de fonderie et à la BOM.'
      icon: tabler:history
      link: https://assets.stavalk.com/site/downloads/STAVALK_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Télécharger les rapports de libération (PDF)'
    - title: 'Dossier qualité complet'
      description: 'Un pack couvrant tout le système documentaire —QIP, enregistrements de portes, traçabilité et contrôle NCR.'
      icon: tabler:books
      link: https://assets.stavalk.com/site/downloads/STAVALK_COMPLETE_QUALITY_DOSSIER.pdf
      link_label: 'Télécharger le pack de documentation (PDF)'

