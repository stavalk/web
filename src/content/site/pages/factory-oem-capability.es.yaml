    custom_moq: 'Confirmación de cantidad por modelo'
    lead_time: '25–35 días (muestras 7–14)'

why_us:
  - title: Integración vertical
    description: 'Somos propietarios de nuestra fábrica, patrones de fundición y cadena de suministro: sin intermediarios ni subcontratistas. Esto nos da control sobre la calidad, el coste y la entrega.'
  - title: Doble certificación
    description: Certificación de gestión de calidad ISO 9001:2015 y de gestión ambiental ISO 14001:2015. Informes de auditoría de fábrica disponibles bajo petición.
  - title: Cumplimiento CE
    description: La certificación CE se aplica a los modelos destinados a los mercados de la UE según EN 12100 y la Directiva de Máquinas 2006/42/CE (alcance confirmado por proyecto). Los modelos personalizados pueden obtener la certificación CE mediante nuestro proceso establecido.
  - title: MOQ específico por proyecto
    description: 'El MOQ se confirma según la configuración de tu proyecto — los modelos estándar corren en 50–200 uds. y los de uso pesado y especiales en 20–50 uds. Ayudamos a las marcas emergentes a lanzarse sin comprometer inventario en exceso.'

