intro: Stavalk ofrece servicios OEM y ODM integrales para marcas, distribuidores y mayoristas de todo el mundo. Con más de 20 años de experiencia en exportación y una fábrica de 8.000 m² certificada ISO 9001:2015 e ISO 14001:2015, nos encargamos de todo, desde el diseño del producto y el desarrollo de patrones de fundición hasta la producción a gran escala, el embalaje y la gestión de exportación.

