services:
  - title: Diseño de producto e ingeniería
    description: Nuestro equipo interno de I+D trabaja con su concepto o especificación para desarrollar planos CAD, modelos 3D y prototipos. Ofrecemos diseño de patrones de fundición, optimización de la geometría de las mordazas, ingeniería del mecanismo de sujeción y asesoramiento en la selección de materiales.
  - title: Marca y marcado personalizados
    description: Logotipos de marca fundidos y grabados, placas de identificación, marcado láser y colores de recubrimiento personalizados. Desarrollamos branding específico de la marca, patrones de aserrado de mordazas y embalaje listo para el comercio minorista.
  - title: Personalización de materiales y especificaciones
    description: Elija entre cuerpos de hierro gris HT200/HT250, deslizaderas y husillos de acero forjado 45# y aceros para mordazas GCr15 / Cr12MoV. Anchos de mordaza personalizados (4″–10″), opciones de recubrimiento (polvo, zinc, acabados especiales) y refuerzos a elegir.
  - title: Embalaje y logística
    description: Embalaje minorista personalizado, cajas con marca propia, engrase y envoltura antirrápida, paletizado y embalaje listo para exportación preparado en casa.

