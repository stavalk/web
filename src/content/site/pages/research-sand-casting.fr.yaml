label: Research
headline: '<strong>Coulée en sable</strong> — La base de la fabrication du corps d''étau'
subtitle: 'Comment le moulage en sable vert et en sable liant produit des corps d''étau en fonte grise HT200/HT250 rigides et amortissants.'
seo:
  title: 'Processus de coulée en sable pour corps en fonte'
  description: 'Stavalk utilise la coulée en sable vert et liant pour couler des corps d''étau en fonte grise HT200/HT250 à 1350–1400 °C avec contrôle dimensionnel.'
body: >-
  Chaque étau de banc Stavalk commence dans l''atelier de fonderie, où la fonte grise HT200 et HT250 est fondue et versée dans des moules en sable vert ou en sable liant à des températures comprises entre 1350 et 1400 °C. Les maquettes sont conçues et entretenues dans notre atelier interne de modèles, ce qui permet une itération rapide sur la géométrie du corps et garantit la précision dimensionnelle sur les séries de production. Après la coulée, les pièces traversent le décochage, le grenaillage et le nettoyage de surface avant que l''inspection dimensionnelle confirme qu''il reste un-usinage suffisant sur toutes les faces critiques. Cette approche offre la rigidité et l''amortissement de vibrations que demandent les étaux d''atelier, tout en maintenant un coût unitaire favorable aux volumes requis par nos clients.
faqs:
  - q: 'Quel grade de fonte Stavalk utilise-t-il pour les corps d''étau ?'
    a: 'Stavalk coule les corps d''étau en fonte grise HT200 ou HT250, sélectionnée selon la série et la classification de service. L''HT200 convient aux étaux légers et moyens, tandis que le HT250 est spécifié pour les modèles lourds nécessitant une résistance à la traction et à l''usure supérieures.'
  - q: 'Pourquoi la coulée en sable est-elle préférée pour les corps d''étau ?'
    a: 'La coulée en sable produit des sections transversales épaisses et nervurées qui confèrent au corps d''étau sa rigidité et son amortissement de vibrations, des propriétés essentielles pour un serrage précis. Le processus passe également facilement du prototype à la production en volume, idéal pour la gamme de tailles fabriquées par Stavalk.'
  - q: 'Comment Stavalk gère-t-il la porosité dans les pièces coulées ?'
    a: 'La conception des garnitures et des jets est optimisée pour assurer un remplissage sans pression et une solidification directionnelle, maintenant la porosité éloignée des faces usinées critiques. Chaque pièce subit une inspection visuelle et dimensionnelle à 100 % de la glissière et des surfaces de montage des mâchoires pour confirmer l''intégrité structurelle avant l''usinage.'
