  system: 'ERP personnalisé (système interne de Stavalk) + étiquettes de lot physiques sur chaque ordre de travail'
  coverage: '100 % des matériaux de production — fonte grise HT200/HT250, acier forgé 45#, aciers GCr15 / Cr12MoV, fixations, quincaillerie, revêtements, emballage'
