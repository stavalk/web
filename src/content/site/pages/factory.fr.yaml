hero:
  tagline: Usine
  title: Usine et fabrication
  subtitle: 'Usine d''étaux de 8 000 m² à Qingdao, Chine — fabrication d''étaux d''établi personnalisée de la fonte brute à l''étau fini et testé.'
intro:
  - En tant que fabricant dédié d'étaux d'établi, **Stavalk** contrôle chaque étape de la production — de l'arrivée de la fonte et des aciers alliés bruts à l'inspection finale avant livraison de l'étau fini. Notre installation de fabrication dans la zone de développement économique de Qingdao s'étend sur 8 000 mètres carrés et abrite des ateliers dédiés à la fonderie au sable, à l'usinage CNC, au traitement thermique par induction, à la finition des surfaces, à l'assemblage et aux essais qualité.
  - En intégrant la conception, l'ingénierie, le prototypage, la fabrication et les essais sous un même toit, nous éliminons les inefficacités de la sous-traitance contractuelle et conservons un contrôle direct sur la qualité de fabrication, le choix des matériaux et les délais de livraison. Chaque étau qui quitte notre atelier est construit par nos équipes, sur nos équipements, selon nos normes.

