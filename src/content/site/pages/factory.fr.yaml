qc_section:
  tagline: Contrôle qualité
  title: Processus d'essais et d'assurance qualité
  subtitle: Chaque étau subit des essais obligatoires avant expédition. Notre laboratoire qualité fonctionne indépendamment de la production et relève directement de la direction.
  steps:
    - step: '1'
      title: Inspection des matières premières
      desc: La fonte grise HT200/HT250, l'acier forgé 45# et les aciers de mâchoires GCr15 / Cr12MoV subissent une analyse spectrométrique, une vérification de dureté Rockwell et une inspection visuelle avant que tout lot n'entre en production.
    - step: '2'
      title: Vérification du traitement thermique
      desc: Chaque lot de trempe des mâchoires est vérifié sur un duromètre Rockwell pour confirmer 58–62 HRC. Les lots hors plage sont rejetés et la ligne de trempe est retraitée avant qu'aucune unité ne passe à l'assemblage.
    - step: '3'
      title: Essais fonctionnels et de durabilité
      desc: Les étaux terminés sont contrôlés pour la force de serrage et le couple de pivot, et le parallélisme des mâchoires, la course de la vis, le marquage de fonderie et la finition sont vérifiés par rapport aux tolérances du plan. Des échantillons passent plus de 10 000 cycles d'ouverture/fermeture et plus de 48 h de brouillard salin avant libération.

oem_section:
  tagline: Projets OEM
  title: Études de cas de partenariats de marques et OEM
  subtitle: Du concept à la production — comment nous aidons les marques mondiales de quincaillerie et industrielles à lancer et développer leurs gammes d'étaux.
  cases:
    - challenge: Un détaillant européen de quincaillerie avait besoin d'une gamme d'étaux en marque privée avec des logos fondus personnalisés, une finition zinguée et un emballage prêt pour le retail — le tout livré en 60 jours.
      solution: Nous avons développé des modèles de fonderie personnalisés et des logos gravés, sourcé une quincaillerie conforme RoHS et réduit l'échantillonnage de 3 tours à 1 en installant l'équipe de conception à notre usine de Qingdao.
      result: 'Production en 25–35 jours à partir du bon de commande signé, avec première livraison dans la fenêtre de 60 jours. 2 400 unités sur 4 SKU. Une commande renouvelée a été passée avant la livraison complète du premier lot.'
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'
    - challenge: Un distributeur industriel américain avait besoin d'une gamme à usage intensif de 8″–10″ avec mâchoires GCr15, finition durable par revêtement en poudre et documentation ISO 9001 complète pour le placement en retail.
      solution: Adaptation des fontes existantes pour l'empreinte à usage intensif, développement des visuels d'emballage co-marqués et fourniture de la documentation complète de qualité et de conformité.
      result: Placement réussi dans les principaux détaillants de quincaillerie américains, générant une forte dynamique avec plus de 5 000 unités vendues en première année et un taux d'écoulement de 98 %.
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'
    - challenge: Un grossiste australien avait besoin d'une gamme d'étaux à usage moyen certifiée CE avec des couleurs de revêtement personnalisées et une conformité aux normes australiennes.
      solution: Production d'échantillons de pré-production avec 4 variantes de revêtement et coordination des essais de conformité par une tierce partie.
      result: Gamme de 3 modèles d'étaux lancée sur le marché AU/NZ. Suivie d'une victoire à un appel d'offres gouvernemental pour 12 étaux de qualité atelier.
      disclaimer: 'Résumé de projet anonymisé — le type et le périmètre du projet sont représentatifs ; les résultats spécifiques ne sont pas vérifiables de manière indépendante.'

faq_section:
  tagline: FAQ
  title: Questions fréquentes B2B et OEM
  questions:
    - q: Quelle est la quantité minimale de commande (MOQ) pour les étaux d'établi OEM ?
      a: 'Le MOQ est confirmé par modèle et spécification plutôt que par un chiffre fixe — série, largeur de mâchoire, revêtement et emballage. Les modèles standard (usage léger, moyen et intensif) s''exécutent en 50–200 pcs par modèle, tandis que les étaux à usage intensif et spéciaux partent de 20–50 pcs. Chaque projet passe par une étape d''échantillon (7–14 jours) avant la production en volume. Consultez notre guide MOQ pour la logique de calcul complète.'
    - q: Quelles certifications Stavalk détient-elle ?
      a: Nous fabriquons selon l'ISO 9001:2015 pour le management de la qualité et l'ISO 14001:2015 pour le management environnemental. La certification CE pour les marchés de l'UE est basée sur l'EN 12100 et la Directive Machines 2006/42/CE (périmètre confirmé par projet). La documentation de conformité RoHS est fournie avec chaque commande OEM.
    - q: Quel est le délai habituel pour une commande OEM ?
      a: 'Le délai standard est de 25–35 jours à partir du bon de commande confirmé et de l''acompte pour la production OEM en volume. Le développement de modèles de fonderie personnalisés ajoute 15–20 jours pour l''outillage du patron. Une production accélérée est disponible pour les commandes urgentes et les périodes de pointe saisonnières. Les échantillons de prototype sont généralement prêts en 7–14 jours.'
    - q: Gérez-vous la documentation d'export ?
      a: 'Oui. Notre équipe gère la documentation d''export et le dédouanement en interne, et nous livrons dans plus de 50 pays sur les marchés UE, US, AU et Asie.'

production_flow:
  tagline: Flux de production
  title: De la matière à l'étau fini
  subtitle: Chaque étau passe par 6 étapes de production avec des points de contrôle qualité à chaque étape. Pas de raccourcis, pas d'inspections sautées.
  stages:
    - stage: '01'
      title: Réception des matières et QC entrant
      description: 'Toutes les matières entrantes sont enregistrées par lot/numéro de coulée dans notre système ERP. La fonte grise HT200/HT250, la barre d''acier forgé 45#, les aciers de mâchoires GCr15 / Cr12MoV, les fixations et la quincaillerie sont mises en quarantaine jusqu''à l''approbation QC.'
      qc_check: 'Analyse spectrométrique (C, Si, Mn, P, S), dureté Rockwell (ISO 6508), contrôle dimensionnel, recherche de défauts visuels'
      qc_threshold: '100 % des lots testés. Rejet si la chimie ou la dureté est hors spécification, ou tout défaut visuel'
      responsibility: Équipe QC entrante (3 inspecteurs)
    - stage: '02'
      title: Fonderie au sable et ébarbage
      description: 'La fonte grise HT200/HT250 est fondue et coulée sur la ligne automatique de fonderie au sable. Les pièces sont décochées, ébarbées, grenailées et contrôlées en dureté avant libération pour l''usinage.'
      qc_check: 'Échantillon de dureté et de traction par coulée, inspection densité/porosité de la pièce, contrôle dimensionnel contre le patron'
      qc_threshold: 'Échantillon par coulée. Rejet si la dureté est hors spécification ou si les défauts de fonderie dépassent les critères d''acceptation'
      responsibility: QC fonderie (2 inspecteurs par équipe)
    - stage: '03'
      title: Usinage CNC et filetage
      description: 'Les corps, coulisseaux, vis et logements de mâchoires sont usinés sur des centres 5 axes et tours CNC. Les coulisseaux et vis sont tournés à partir d''acier forgé 45# et filetés à la tolérance.'
      qc_check: 'Contrôle dimensionnel par rapport aux fichiers CAD, vérification au calibre de filetage, mesure de l''état de surface (Ra)'
      qc_threshold: 'Chaque 20e unité mesurée. Tolérance ±0,05 mm. Rejet du lot si >2 % hors tolérance'
      responsibility: Responsable de l'atelier d'usinage
    - stage: '04'
      title: Traitement thermique et finition des surfaces
      description: 'Les mâchoires GCr15 / Cr12MoV sont trempées par induction et revenues à 58–62 HRC. Les corps et la quincaillerie reçoivent un revêtement par poudre électrostatique et un zingage pour la protection anticorrosion.'
      qc_check: 'Dureté des mâchoires sur chaque lot (58–62 HRC), jauge d''épaisseur du revêtement, échantillon de brouillard salin (48h+)'
      qc_threshold: 'Dureté des mâchoires 58–62 HRC sur tous les échantillons ; épaisseur de revêtement 60–80 μm ; aucune rouille après 48 h de brouillard salin'
      responsibility: QC traitement thermique et finition (2 inspecteurs par équipe)
    - stage: '05'
      title: Assemblage et équipement
      description: 'Les bases pivotantes et mâchoires pour tuyaux (jeux chaîne et trépied) sont montées sur les corps usinés ; les vis, écrous et poignées sont installés, alignés et ajustés. Chaque unité suit une liste de contrôle d''assemblage de 100 points.'
      qc_check: 'Signature de la liste de contrôle à 100 points par unité, vérification du couple de pivot, contrôle de la course et de l''alignement de la vis, inspection visuelle'
      qc_threshold: 'Politique zéro défaut sur les éléments critiques pour la sécurité (engagement de la vis, verrouillage du pivot, rétention des mâchoires). Cosmétique mineur : AQL 2,5 (ISO 2859)'
      responsibility: Chef d'équipe d'assemblage + QC de ligne
    - stage: '06'
      title: Inspection finale et conditionnement
      description: 'Inspection visuelle et fonctionnelle finale : force de serrage, parallélisme des mâchoires, vérification du marquage de fonderie, intégrité de l''emballage et complétude des accessoires. Les unités sont huilées, cartonnées et palettisées pour le chargement du conteneur.'
      qc_check: 'Inspection fonctionnelle complète, test de force de serrage, échantillon de durabilité 10 000+ cycles, liste de contrôle des accessoires par SKU, vérification par scan des étiquettes/codes-barres'
      qc_threshold: 'AQL 2,5 pour les défauts majeurs, AQL 4,0 pour les mineurs. Tolérance zéro sur les défauts de sécurité. 100 % des unités inspectées fonctionnellement'
      responsibility: Équipe QC finale (4 inspecteurs) + responsable du conditionnement

