hero:
  tagline: Factory
  title: Factory & Manufacturing
  subtitle: 8,000 m2 bench vise factory in Qingdao, China — custom bench vise manufacturing from raw gray cast iron to a finished, tested vise
intro:
  - As a dedicated bench vise manufacturer, **Stavalk** controls every stage of production — from the arrival of raw gray cast iron and alloy steel to the final pre-delivery inspection of the finished vise. Our manufacturing facility in the Qingdao Economic Development Zone spans 8,000 square metres and houses dedicated workshops for sand casting, CNC machining, induction heat treatment, surface finishing, assembly, and quality testing.
  - By integrating design, engineering, prototyping, manufacturing, and testing under one roof, we eliminate the inefficiencies of contract manufacturing and maintain direct control over build quality, material selection, and delivery timelines. Every vise that leaves our workshop is built by our people, on our equipment, to our standards.

