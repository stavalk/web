material_traceability:
  tagline: Traceability
  title: Material Tracking & Batch Control
  description: Every batch of raw material is assigned a unique lot/heat number in our ERP system. From arrival through production to the finished product, each vise's bill of materials links back to the original supplier batch. This enables full upstream traceability for any quality or compliance inquiry.
  system: Custom ERP (Stavalk internal system) + physical batch tags on each work order
  coverage: 100% of production materials —HT200/HT250 gray cast iron, 45# forged carbon steel, GCr15 / Cr12MoV steels, fasteners, hardware, coatings, packaging
  records_retained: 10 years (per ISO 9001:2015 requirement)
  suppliers:
    - material: Gray cast iron (HT200/HT250)
      source: Chinese and Korean foundry suppliers
      certified: ISO 9001, spectro cert per heat
    - material: 45# forged carbon steel
      source: Chinese and imported mills
      certified: ISO 9001, material certs per batch
    - material: GCr15 / Cr12MoV jaw steels
      source: Certified steel mills
      certified: GB/T standards, material certs per batch
    - material: Fasteners & Hardware
      source: Chinese OEM suppliers
      certified: ISO 9001, RoHS, material certs per batch

