workshops_section:
  tagline: Workshops
  title: Manufacturing Workshops
  workshops:
    - title: Sand Casting & Foundry
      description: Automatic sand casting lines pour HT200 and HT250 gray cast iron into bodies, slides and base castings with consistent metallurgy. Molding, pouring, shakeout, fettling and shot blasting are computer-monitored to keep every casting within its heat standard.
      image: https://assets.stavalk.com/images/stavalk/hero/production-dept.webp
      alt: CNC casting and founding department preparing gray cast iron bench vise bodies at Qingdao factory
    - title: CNC Machining
      description: Dedicated machining workshop with 5-axis CNC centers and CNC lathes. Bodies, slides, screws and jaw beds are machined to ±0.05 mm, while 45# forged carbon steel slides and screws are turned and threaded to tight tolerances.
      image: https://assets.stavalk.com/images/stavalk/factory/stavalk-production-department.webp
      alt: CNC machining center finishing a bench vise body and slide at Qingdao factory
    - title: Induction Heat Treatment
      description: GCr15 and Cr12MoV jaw steels are induction-hardened and tempered to 58–62 HRC for long service life. Each hardening batch is hardness-checked on a Rockwell tester before jaws are released to assembly.
      image: https://assets.stavalk.com/images/stavalk/factory/stavalk-sup-manufacturing.webp
      alt: Induction heat treatment line hardening GCr15 bench vise jaws at Qingdao factory
    - title: Surface Finishing
      description: Vise bodies are finished with electrostatic powder coating (60–80 μm) and hardware is zinc plated, giving a durable, corrosion-resistant surface that passes 48h+ salt-spray testing.
      image: https://assets.stavalk.com/images/stavalk/factory/stavalk-production-department-2.webp
      alt: Powder coating and zinc plating line at Qingdao bench vise factory
    - title: Assembly & Fitting
      description: Assembly line where swivel bases, pipe jaws, screws, nuts and handles are fitted to each vise. Swivel torque and screw travel are verified with calibrated tools, and each unit follows a 100-point assembly checklist signed off by the team lead.
      image: https://assets.stavalk.com/images/stavalk/factory/stavalk-production-department.webp
      alt: Assembly workstations where bench vise swivel bases and pipe jaws are fitted at Qingdao factory
    - title: Quality Testing & Inspection
      description: Every completed vise undergoes mandatory clamping-force testing, jaw hardness verification, and a full systems check before shipping. Our quality lab operates independently from production and reports directly to management.
      image: https://assets.stavalk.com/images/stavalk/factory/stavalk-pressure-testing.webp
      alt: Quality lab testing clamping force and jaw hardness on bench vises before shipping at Qingdao factory

