qc_section:
  tagline: Quality Control
  title: Testing & Quality Assurance Process
  subtitle: Every vise undergoes mandatory testing before shipping. Our quality lab operates independently from production and reports directly to management.
  steps:
    - step: '1'
      title: Raw Material Inspection
      desc: HT200/HT250 gray cast iron, 45# forged carbon steel and GCr15 / Cr12MoV jaw steels undergo spectro chemical analysis, Rockwell hardness verification, and visual inspection before any batch enters production.
    - step: '2'
      title: Heat Treatment Verification
      desc: Every jaw hardening batch is checked on a Rockwell tester to confirm 58–62 HRC. Out-of-range batches are rejected and the hardening line is reprocessed before any unit proceeds to assembly.
    - step: '3'
      title: Functional & Durability Testing
      desc: Completed vises are checked for clamping force and swivel torque, and jaw parallelism, screw travel, cast marking and coating finish are verified against drawing tolerances. Samples run through 10,000+ open/close cycles and 48h+ salt-spray testing before release.

oem_section:
  tagline: OEM Projects
  title: Brand & OEM Partnership Case Studies
  subtitle: From concept to production —how we help global hardware and industrial brands launch and scale their bench vise lines.
  cases:
    - challenge: European hardware retailer needed a private-label bench vise line with custom cast logos, zinc-plated finish, and retail-ready packaging —all delivered in 60 days.
      solution: Developed custom cast patterns and engraved logos, sourced RoHS-compliant hardware, and compressed sampling from 3 rounds to 1 by co-locating the design team at our Qingdao factory.
      result: 25–35 days production from signed PO, with first delivery within the 60-day landing window. 2,400 units across 4 SKUs. Repeat order placed before the first batch was fully delivered.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'
    - challenge: US industrial distributor needed a heavy-duty 8″–10″ range with GCr15 jaws, durable powder-coated finish, and full ISO 9001 documentation for retail placement.
      solution: Adapted existing castings for the heavy-duty footprint, developed co-branded packaging artwork, and provided complete quality and compliance documentation.
      result: Successfully placed across key US hardware retailers, driving strong momentum with over 5,000 units sold in Year 1 and a 98% sell-through rate.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'
    - challenge: Australian wholesaler required a CE-certified medium-duty bench vise range with custom coating colors and compliance with Australian standards.
      solution: Produced pre-production samples with 4 coating variants and coordinated third-party compliance testing.
      result: 3-model vise range launched in AU/NZ market. Followed by government tender win for 12 workshop-grade vises.
      disclaimer: 'Anonymized project summary — project type and scope are representative; specific results are not independently verifiable.'

faq_section:
  tagline: FAQ
  title: B2B & OEM Frequently Asked Questions
  questions:
    - q: What is the minimum order quantity (MOQ) for OEM bench vises?
      a: 'MOQ is confirmed by model and specification rather than a fixed number — series, jaw width, coating and packaging. Standard models (light, medium and heavy-duty) run 50–200 pcs per model, while heavy-duty and specialty vises start from 20–50 pcs. Every project moves through a sample stage (7–14 days) before volume production. See our MOQ guide for the full calculation logic.'
    - q: Which certifications does Stavalk hold?
      a: We manufacture to ISO 9001:2015 for quality management and ISO 14001:2015 for environmental management. CE certification for EU markets is based on EN 12100 and Machinery Directive 2006/42/EC (scope confirmed per project). RoHS compliance documentation is provided with every OEM order.
    - q: What is the typical lead time for an OEM order?
      a: Standard lead time is 25–35 days from confirmed PO and deposit for bulk OEM production. Custom cast-pattern development adds 15–20 days for pattern tooling. Expedited production is available for urgent orders and seasonal rushes. Prototype samples are typically ready within 7–14 days.
    - q: Do you handle export documentation?
      a: Yes. Our team manages export documentation and customs clearance in-house, and we supply to 50+ countries across EU, US, AU, and Asia markets.

production_flow:
  tagline: Production Flow
  title: From Material to Finished Vise
  subtitle: Every vise passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: '01'
      title: Material Receiving & Incoming QC
      description: 'All incoming materials are logged by batch/heat number in our ERP system. HT200/HT250 gray cast iron, 45# forged carbon steel bar, GCr15 / Cr12MoV jaw steels, fasteners and hardware are quarantined until QC sign-off.'
      qc_check: 'Spectro chemical analysis (C, Si, Mn, P, S), Rockwell hardness (ISO 6508), dimensional check, visual defect scan'
      qc_threshold: '100% of batches tested. Reject if chemistry or hardness out of spec, or any visual defect'
      responsibility: Incoming QC team (3 inspectors)
    - stage: '02'
      title: Sand Casting & Fettling
      description: 'HT200/HT250 gray cast iron is melted and poured on the automatic sand casting line. Castings are shaken out, fettled, shot-blasted and heat-checked before release to machining.'
      qc_check: 'Hardness and tensile sample per heat, casting density/porosity inspection, dimensional check against pattern'
      qc_threshold: 'Sample per heat. Reject if hardness out of spec or casting defects exceed acceptance criteria'
      responsibility: Foundry QC (2 inspectors per shift)
    - stage: '03'
      title: CNC Machining & Threading
      description: 'Vise bodies, slides, screws and jaw beds are machined on 5-axis machining centers and CNC lathes. Slides and screws are turned from 45# forged carbon steel and threaded to tolerance.'
      qc_check: 'Dimensional check against CAD files, thread gauge verification, surface finish (Ra) measurement'
      qc_threshold: 'Every 20th unit measured. Tolerance ±0.05 mm. Reject batch if >2% out of tolerance'
      responsibility: Machining workshop lead
    - stage: '04'
      title: Heat Treatment & Surface Finishing
      description: 'GCr15 / Cr12MoV jaws are induction-hardened and tempered to 58–62 HRC. Bodies and hardware are finished with electrostatic powder coating and zinc plating for corrosion protection.'
      qc_check: 'Jaw hardness on every batch (58–62 HRC), coating thickness gauge, salt-spray sample (48h+)'
      qc_threshold: 'Jaw hardness 58–62 HRC on all samples; coating thickness 60–80 μm; no rust after 48h salt spray'
      responsibility: Heat treatment & finishing QC (2 inspectors per shift)
    - stage: '05'
      title: Assembly & Fitting
      description: 'Swivel bases and pipe jaws (chain and tripod sets) are fitted to machined bodies; screws, nuts and handles are installed, aligned and adjusted. Each unit follows a 100-point assembly checklist.'
      qc_check: '100-point checklist sign-off per unit, swivel torque verification, screw travel and alignment check, visual inspection'
      qc_threshold: 'Zero-defect policy on safety-critical items (screw engagement, swivel lock, jaw retention). Minor cosmetic: AQL 2.5 (ISO 2859)'
      responsibility: Assembly team lead + line QC
    - stage: '06'
      title: Final Inspection & Packing
      description: 'Final visual and functional inspection: clamping force, jaw parallelism, cast marking verification, packaging integrity, and accessory completeness. Units are oiled, boxed, and palletized for container loading.'
      qc_check: 'Full functional inspection, clamping-force test, 10,000+ cycle durability sample, accessory checklist per SKU, label/barcode scan verification'
      qc_threshold: 'AQL 2.5 for major defects, AQL 4.0 for minor. Zero tolerance on safety defects. 100% of units functionally inspected'
      responsibility: Final QC team (4 inspectors) + Packing team lead

