customization:
  tagline: Construit selon votre spéc.
  title: Points de spécification OEM
  subtitle: 'Voici les points de spécification que vous contrôlez sur un projet OEM - votre document de spécification est le contrat de production :'
  items:
    - 'Matériau du corps - fonte grise HT200 ou HT250, ou acier forgé selon vos dessins'
    - 'Matériau et dureté de la mâchoire - acier trempé GCr15 ou Cr12MoV à 58-62 HRC'
    - 'Ouverture de mâchoire et profondeur de gorge - dimensions selon vos dessins ou l''application cible'
    - 'Angle de base tournante et mécanisme de blocage - rotation à 360° ou base fixe'
    - 'Sélection de série d''étau - légère (2"-5"), moyenne (6"-8"), lourde (8"-10"), à tuyaux ou spéciale'
    - 'Finition de surface - peinture, revêtement en poudre ou parkerising selon votre spécification'
    - 'Quincaillerie et accessoires - surface d''enclume, mâchoires à tuyaux, mécanismes de libération rapide'
    - 'Marque et emballage - logo sur la fonte, couleur de peinture, étiquette et emballage retail sous votre marque'
    - 'Marques de conformité - étiquettes CE, numéros de série et documentation par marché préparée pour votre région d''export'

faq_section:
  tagline: FAQ
  title: Questions sur la fabrication OEM
  questions:
    - q: Comment démarrer un projet OEM avec mon propre design ?
      a: 'Envoyez vos dessins, un étau de référence ou une spécification écrite. Notre revue d''ingénierie confirme la fabricabilité et renvoie un devis sous un jour ouvré - c''est notre engagement standard, et une NDA est signée avant tout échange de fichier si nécessaire.'
    - q: Quel est le MOQ pour des étaux OEM ?
      a: 'Le MOQ est confirmé par la configuration du projet - corps moulé, spécification de mâchoire, finition, marque et emballage. La production en volume standard s''exécute à 50-200 unités par lot pour des étaux de gamme moyenne, tandis que les étaux lourds et spéciaux s''exécutent à 20-50 unités. Les séries pilotes démarrent à 20-50 unités sur des modèles existants.'
    - q: Quel est le délai typique pour une commande OEM ?
      a: 'La production s''exécute en 25-35 jours à partir du bon de commande confirmé et de l''acompte. Le développement d''outillage personnalisé ajoute 15-20 jours. Les échantillons de prototype partent généralement sous 7-12 jours.'
    - q: Pouvez-vous fabriquer à partir de mes seuls dessins existants ?
      a: 'Oui. L''OEM construit à partir de votre spécification telle quelle - vous possédez le design. Nos ingénieurs examinent les dessins pour la faisabilité de production, signalent tout conflit de spéc. avant le début de l''outillage, et l''échantillon approuvé devient la référence de production.'
    - q: Fournissez-vous des échantillons avant la production ?
      a: 'Oui. Un échantillon physique est produit et approuvé avant toute série de production, généralement sous 7-12 jours, et il sert de référence pour tous les contrôles QC ultérieurs.'
    - q: Quelles certifications l''usine détient-elle ?
      a: 'CE (EN ISO 12100, Directive Machines 2006/42/CE), ISO 9001:2015, ISO 14001 et RoHS. Une documentation de conformité complète est fournie avec chaque expédition OEM, préparée pour vos marchés cibles.'
    - q: Comment le contrôle qualité est-il géré sur une série OEM ?
      a: 'La production s''exécute sous un QC multipoints - matière entrante, contrôle en cours de processus et inspection finale - avec essai de force de serrage, vérification de dureté de mâchoire (58-62 HRC), contrôles de couple de rotation, tests de durabilité de plus de 10 000 cycles, essai de brouillard salin de plus de 48 heures et inspection en 7 étapes avec traçabilité ERP.'
    - q: Quelles sont vos conditions d''expédition ?
      a: 'FOB Qingdao, CIF sur les principaux ports mondiaux, ou DDP pour les partenaires qualifiés. Nous expédions vers 50+ pays à travers les marchés UE, US, AU et Asie.'

process:
  title: 'Le processus OEM - de la spéc. à la commande expédiée'
  subtitle: 'Sept étapes contrôlées gérées par une seule équipe d''usine, donc chaque étape de votre première spéc. au carton emballé reste documentée et dans les délais.'
  steps:
    - phase: '01'
      title: Revue de spéc. et devis
      period: 1 jour ouvré
      items:
        - 'Partagez vos dessins, spécification ou étau de référence - nos ingénieurs vérifient la fabricabilité.'
        - 'Vous recevez un devis détaillé et un plan de projet sous un jour ouvré.'
    - phase: '02'
      title: Confirmation d''ingénierie
      period: Semaine 1
      items:
        - 'Les dimensions du corps, la spéc. de mâchoire, les qualités de matériaux et la construction tournante sont confirmées contre votre document.'
        - 'Les décisions de gabarit ou d''outillage sont verrouillées - le développement de gabarit personnalisé démarre ici si requis.'
    - phase: '03'
      title: Prototype et échantillon
      period: 7-12 jours
      items:
        - 'Un échantillon physique est produit et envoyé pour votre examen - contrôles dimensionnels et de dureté inclus.'
        - 'Un échantillon (1-2 unités) valide votre spéc. avant tout engagement de volume.'
    - phase: '04'
      title: Tests et validation
      period: En parallèle
      items:
        - 'Essais de force de serrage, dureté de mâchoire, couple de rotation, plus de 10 000 cycles de durabilité et plus de 48 heures de brouillard salin par ligne de production.'
        - 'Documentation CE, ISO 9001:2015, ISO 14001 et RoHS préparée pour vos marchés d''export.'
    - phase: '05'
      title: Approbation et confirmation
      period: Après signature de l''échantillon
      items:
        - 'Vous approuvez l''échantillon et les graphismes ; le bon de commande et l''acompte verrouillent le créneau de production.'
        - 'Un plan de pré-production confirme les dates, quantités, emballage et port de chargement.'
    - phase: '06'
      title: Production
      period: 25-35 jours
      items:
        - 'La production s''exécute sous un QC multipoints - matière entrante, contrôle en cours de processus et inspection finale.'
        - 'Des commandes pilotes (20-50 unités) sur modèles existants jusqu''aux lots complets (50-200 unités) pour la production en volume standard.'
    - phase: '07'
      title: Emballage et expédition
      period: 1 jour + transit
      items:
        - 'Conditionnement d''export avec étiquettes de série du modèle, puis FOB Qingdao, CIF ou DDP vers 50+ pays.'
        - 'Documentation douanière, suivi et support de ré-commande inclus à chaque étape.'

