headline: 'Garantía de tornillo de banco y soporte post-venta'
subtitle: 'Stavalk respalda la calidad de cada tornillo de banco que fabrica. Esta Garantía Limitada establece los términos y la cobertura de tu producto Stavalk.'
seo:
  headline: 'Garantía de tornillo de banco Stavalk — Garantía limitada de 1 y 2 años | Stavalk'
  description: 'Stavalk ofrece una garantía limitada sobre la estructura y los componentes del tornillo de banco. 1 año sobre defectos de materiales o mano de obra para uso comercial, 2 años para uso doméstico de aficionado. Términos y condiciones completos de la garantía de tornillo de banco Stavalk.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Esta Garantía Limitada se aplica a los tornillos de banco Stavalk nuevos comprados directamente a Stavalk o a un distribuidor o minorista autorizado de Stavalk. La fecha efectiva es la fecha verificable de compra original.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Cobertura y duración de la garantía</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">2 años</h3>
        <p class="text-sm text-gray-600 mt-1">Uso doméstico de aficionado — defectos estructurales de materiales o mano de obra</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 año</h3>
        <p class="text-sm text-gray-600 mt-1">Uso comercial, industrial o profesional — todos los componentes</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">La cobertura se limita a defectos de materiales y mano de obra bajo uso normal. El mal uso, abuso, alteración o desgaste normal quedan excluidos.</p>
  </div>

  <h2>Qué está cubierto</h2>
  <h3>Estructura del cuerpo (2 años doméstico / 1 año comercial)</h3>
  <p>Stavalk garantiza la estructura del cuerpo del tornillo —incluidos el cuerpo de hierro gris HT200/HT250, el husillo de acero forjado 45# y el canal de deslizamiento— contra fallos estructurales debidos a defectos de materiales o mano de obra.</p>

  <h3>Caras de mandíbula e insertos endurecidos</h3>
  <p>Las caras de mandíbula endurecidas GCr15/Cr12MoV (58–62 HRC) están garantizadas contra defectos de fabricación que provoquen agrietamiento prematuro o desgaste excesivo bajo uso normal.</p>

  <h3>Base giratoria y yunque</h3>
  <p>El mecanismo de base giratoria de 360° y la cara de yunque están garantizados contra defectos de materiales o mano de obra que perjudiquen su funcionamiento normal.</p>

  <h2>Qué no está cubierto</h2>
  <ul>
    <li>Defectos cosméticos, incluidos decoloración, manchas, pérdida de color o cualquier alteración del aspecto</li>
    <li>Daños por impacto, sobrecarga, caídas o abuso físico</li>
    <li>Daños por uso del yunque para forjar o golpear más allá de su capacidad nominal</li>
    <li>Agrietamiento, astillado, roces o deterioro por fricción o contacto</li>
    <li>Corrosión por exposición prolongada a humedad, productos químicos, combustibles o disolventes</li>
    <li>Daños por negligencia, uso indebido, abuso, accidente o desgaste normal</li>
    <li>Modificación, desmontaje o reparación por partes no autorizadas</li>
    <li>Equipo, componentes o sistemas de terceros (cubiertos por sus respectivos fabricantes)</li>
  </ul>

  <h2>Obligación y reparación del fabricante</h2>
  <p>La única y exclusiva obligación de Stavalk es la reparación o, a nuestra elección, la sustitución de piezas o de unidades, de cualquier componente que se determine defectuoso en materiales o mano de obra y esté cubierto por esta garantía, tras nuestra inspección del producto devuelto. Los componentes sustituidos o reparados están garantizados solo por la parte no transcurrida del periodo de garantía original. Todas las garantías son FOB la fábrica de Stavalk en Qingdao, China; el comprador asume los costes de envío y manipulación para la entrega y la devolución.</p>

  <h2>Condiciones de la garantía</h2>
  <ul>
    <li><strong>Registro:</strong> el producto debe registrarse correctamente según lo exigen los términos de la garantía.</li>
    <li><strong>Mantenimiento:</strong> el producto debe mantenerse de acuerdo con las directrices publicadas por Stavalk, incluida la lubricación periódica de la rosca del husillo y el canal de deslizamiento.</li>
    <li><strong>Colaboración:</strong> el comprador debe cooperar plena y puntualmente con Stavalk en todos los asuntos relativos a las reclamaciones de garantía.</li>
    <li><strong>Comprador original:</strong> esta garantía se extiende exclusivamente al comprador final original y no es transferible.</li>
  </ul>

  <h2>Uso comercial</h2>
  <p>Si el producto se utiliza con fines comerciales, industriales, profesionales, de alquiler o para cualquier propósito distinto del uso doméstico de aficionado, el periodo de garantía de todos los componentes es de un (1) año desde la fecha original de compra.</p>

  <h2>Cómo realizar una reclamación de garantía</h2>
  <p>Contacta con Stavalk o con tu distribuidor autorizado con el comprobante de compra y una descripción detallada del problema. Stavalk revisará la reclamación y te indicará los pasos para la inspección y el servicio.</p>
  <p>Para consultas sobre el servicio de garantía, contacta con nosotros a través de nuestra <a href="/es/contact" class="text-sky-600 underline">página de contacto</a> con tu número de pedido y los datos del producto.</p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 my-10">
    <h2 class="text-xl font-bold mb-3">Respaldado por un sistema de calidad documentado</h2>
    <p class="text-sm text-gray-600 dark:text-gray-400">Cada tornillo se prueba antes del embalaje — fuerza de sujeción, dureza de mandíbula, par del girador y durabilidad de 10.000+ ciclos se registran por lote, y los lotes mantienen trazabilidad ERP de 10 años. Las reclamaciones de garantía se resuelven con estos registros de lote, no con suposiciones. Consulta el <a href="/es/quality" class="text-sky-600 underline">sistema de calidad completo</a> y descarga los <a href="https://assets.Stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf" class="text-sky-600 underline">informes de inspección final</a>.</p>
  </div>

  <h2>Artículos de terceros</h2>
  <p>El equipo, los componentes o los sistemas fabricados por terceros (aunque los instale Stavalk) están cubiertos exclusivamente por la garantía que ofrezca su respectivo fabricante. Stavalk renuncia expresamente a cualquier responsabilidad de garantía sobre dichos artículos de terceros.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Esta declaración de garantía es un resumen de la Garantía Limitada completa del fabricante Stavalk. El documento legal íntegro de la garantía rige todos los términos y condiciones. Las especificaciones están sujetas a cambios sin previo aviso. Stavalk es un fabricante de tornillos de banco en Jimo, Qingdao, China.
  </p>
