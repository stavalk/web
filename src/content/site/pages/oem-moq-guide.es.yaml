moq_faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre el MOQ'
  items:
    - q: '¿El MOQ se calcula por pedido, por modelo o por variante?'
      a: 'El MOQ puede aplicarse por modelo, variante, serie del cuerpo, configuración de branding o pedido total. Dado que diferentes anchos de mordaza (4″ vs 10″) y cuerpos fundidos provienen de moldes de fundición y lotes de tratamiento térmico distintos, pedir 50 tornamesas divididas en 5 series crea 5 requisitos de producción separados. Confirmamos el cálculo exacto contra tu matriz de SKU antes de cotizar para que planifiques tu mezcla con claridad.'
    - q: '¿Puedo pedir una muestra antes de la producción en masa?'
      a: 'Sí. El desarrollo de muestras (1–2 unidades) verifica la dureza de mordaza, la fuerza de sujeción, el torque de giro, el acabado superficial y el ajuste antes del lanzamiento de producción. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - q: '¿Por qué el empaque minorista personalizado tiene un MOQ independiente?'
      a: 'Las imprentas flexográficas u offset de cajas personalizadas requieren una preparación mínima de más de 500 unidades. Ofrecemos una Solución de Almacenamiento de Empaque Híbrido: producimos las 500 cajas impresas, almacenamos el excedente en nuestro almacén limpio y las liberamos en lotes a través de tus envíos programados — así un pedido menor también puede enviarse con empaque minorista totalmente personalizado.'
    - q: '¿Por qué el MOQ estándar de volumen es de 50–200 unidades?'
      a: 'El MOQ de volumen estándar sigue el proceso de fundición: una carga completa de cajón en nuestro fundición produce de 50 a 200 cuerpos de tornamesa dependiendo del ancho de mordaza y el número de cavidades. Ejecutar cargas completas de cajón asegura una temperatura de hierro fundido consistente, llenado uniforme del molde y microestructura repetible — mientras se amortiza la energía del horno, la preparación de tratamiento térmico y la calibración de mecanizado CNC en el lote.'
    - q: '¿Una cantidad mayor reduce el costo unitario?'
      a: 'En la mayoría de los proyectos, sí. Las cantidades mayores mejoran el rendimiento de fundición, distribuyen los costos fijos de preparación de fundición y tratamiento térmico entre más unidades y reducen los costos unitarios de empaque.'
    - q: '¿Las tarifas de molde del co-branding se aplican de nuevo en los re-pedidos?'
      a: 'No. Las tarifas de utillaje de marca de fundición se cobran una vez en la configuración inicial y se eximen en re-pedidos que usen las mismas dimensiones de arte. Solo pagas la tarifa de grabado láser y manejo de $0.50 USD por tornamesa.'
    - q: '¿Solicitar orientación de MOQ me compromete con un pedido?'
      a: 'No. Solicitar orientación de MOQ simplemente permite que nuestro equipo de ingeniería en Stavalk, Qingdao revise tu brief técnico y aconseje la ruta de producción más rentable. Hay disponible un Acuerdo de No Divulgación (NDA) antes de compartir especificaciones técnicas o arte propietario.'

