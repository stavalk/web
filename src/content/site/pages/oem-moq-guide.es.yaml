moq_stages:
  tagline: Muestra · Piloto · Volumen
  title: 'Tres Etapas de Cantidad Distintas'
  subtitle: 'Las cantidades de muestra, piloto y producción de volumen son diferentes. Cada proyecto se clasifica en tres niveles distintos para que valides antes de comprometerte.'
  steps:
    - step: '01'
      title: 'Desarrollo de Muestra (1–2 unidades)'
      desc: 'Confirmación física de la dureza de mordaza (58–62 HRC), fuerza de sujeción, torque de giro, acabado superficial y ajuste de accesorios antes de cualquier compromiso financiero. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - step: '02'
      title: 'Pedido Piloto (20–50 unidades)'
      desc: 'Pruebas comerciales y validación de mercado regional usando plataformas de series existentes, materiales estándar y empaque estándar para minimizar la fricción de preparación.'
    - step: '03'
      title: 'Producción de Volumen (50–200+ unidades)'
      desc: 'Confirmada tras BOM congelada, branding finalizado, empaque personalizado y planes de entrega programados — ciclos completos de fundición, sistemas de pintura personalizados, empaque exclusivo, descuentos por volumen y trazabilidad completa de lote.'

moq_factors:
  tagline: Qué Define Tu MOQ
  title: 'Por Qué el MOQ Totalmente Personalizado Siempre Es Específico del Proyecto'
  subtitle: 'Para la fabricación 100% a medida, el MOQ se calcula a partir de la arquitectura completa del producto — estos cuatro componentes se evalúan juntos antes de cotizar.'
  headers:
    component: Componente del Proyecto
    driver: Factor de Fabricación
    impact: Impacto en la Cantidad Mínima
  rows:
    - component: 'Ancho de Mordaza y Serie del Cuerpo'
      driver: 'Moldes de fundición existentes para series estándar vs cavidades de molde diseñadas en CAD a medida'
      impact: 'Plataformas existentes: pedidos piloto desde 20 piezas. Cuerpos fundidos a medida: requiere amortización de utillaje dedicado.'
    - component: 'Acabado Superficial y Pintura'
      driver: 'Pintura estándar martillada vs acabado en polvo Pantone o Parkerizado personalizado'
      impact: 'Los sistemas de pintura personalizados requieren preparación dedicada de línea de recubrimiento con mínimos de lote independientes.'
    - component: 'Empaque con Marca'
      driver: 'Cajas genéricas con etiquetas de código de barras vs cajas minoristas a todo color con marca y hojas de instrucciones'
      impact: 'Las cajas de color personalizadas tienen un mínimo independiente de impresión offset (típicamente más de 500 cajas).'
    - component: 'Paquetes de Accesorios'
      driver: 'Jawas de acero forjado estándar vs juego de jawas endurecidas GCr15/Cr12MoV personalizadas con accesorios de marca'
      impact: 'Los juegos de accesorios totalmente personalizados siguen los lotes de producción de los proveedores de nivel inferior.'

