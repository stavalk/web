hero:
  tagline: 'Manufacturing You Can Verify'
  title: 'OEM Trust & Factory Assurance'
  subtitle: 'Every claim on this site can be verified: official company registration, a physical 8,000 m² factory you can visit or audit, real engineers under NDA, QMS documents you can download, and test data recorded per serial number. Engineered and operated by Stavalk, Qingdao, China.'

answer:
  label: 'Straight answer'
  text: 'Trust is not a promise — it is documentation. We are a registered Chinese manufacturing entity (Stavalk, Qingdao) with a physical 8,000 m² plant in Jimo, Qingdao, 200+ workers and 80,000+ vises of annual capacity. You can verify the registration, audit the factory, review QMS SOPs, download sample quality records, schedule third-party inspections (SGS, TUV, BV or Intertek) and have an NDA signed within 4 business hours. Every vise is tested for clamping force, jaw hardness (58–62 HRC), swivel torque, 10,000+ cycle durability and 48-hour salt-spray corrosion resistance, and every batch keeps full ERP traceability. If a claim cannot be documented, we do not make it.'
  verified: '2026-09'

