buyer_guides:
  tagline: Artículos
  title: Artículos de conocimiento sobre tornillos de banco
  subtitle: |-
    Fundamentos, selección, materiales, diseño, aplicaciones y abastecimiento OEM — cada artículo enlaza un producto, la ingeniería detrás, opciones OEM y lectura relacionada.
  items:
    - title: ¿Qué es un tornillo de banco?
      body: La herramienta fija que sujeta piezas para cortar, taladrar, rectificar y ensamblar.
      href: /knowledge/what-is-a-bench-vise
    - title: ¿Cómo funciona un tornillo de banco?
      body: La vis, la corredera y las mordazas — cómo la fuerza de la mano se vuelve sujeción.
      href: /knowledge/how-does-a-bench-vise-work
    - title: Piezas de la mordaza explicadas
      body: Cada pieza, qué hace, qué se desgasta y qué se reemplaza.
      href: /knowledge/bench-vise-parts-explained
    - title: ¿Para qué se usa un tornillo de banco?
      body: Ocho oficios clave y la clase de tornillo que usa cada uno.
      href: /knowledge/what-is-a-bench-vise-used-for
    - title: Tipos de tornillos de banco, explicados
      body: Ligeros, medianos, pesados, para tubería y formas especiales.
      href: /knowledge/types-of-bench-vises-explained
    - title: Guía de tamaños de tornillo de banco
      body: Cómo funcionan los tamaños — ancho, apertura, garganta y peso por clase.
      href: /knowledge/bench-vise-size-guide
    - title: Tornillo de 4 vs 6 pulgadas
      body: Afición o taller general — qué aportan las dos pulgadas extra.
      href: /knowledge/4-inch-vs-6-inch-bench-vise
    - title: Tornillo de 6 vs 8 pulgadas
      body: Cuándo el trabajo pesado justifica el salto de masa y alcance.
      href: /knowledge/6-inch-vs-8-inch-bench-vise
    - title: ¿Cuánta apertura de mordaza necesita?
      body: Mida su pieza más grande y elija el rango de apertura correcto.
      href: /knowledge/how-much-jaw-opening-do-you-need
    - title: ¿Cuánta garganta necesita?
      body: El alcance para el trabajo vertical y las profundidades por clase.
      href: /knowledge/how-much-throat-depth-do-you-need
    - title: ¿Cuánta fuerza de sujeción necesita?
      body: Rangos de fuerza, por qué más no es mejor y cómo verificar.
      href: /knowledge/how-much-clamping-force-do-you-need
    - title: ¿De qué están hechas las mordazas?
      body: Fonte gris, GCr15 y Cr12MoV — aceros de herramienta templados para mordazas que agarran años.
      href: /knowledge/bench-vise-jaw-materials
    - title: ¿Por qué se endurecen las mordazas?
      body: Qué hace la dureza bajo carga y cuándo quiere lo contrario.
      href: /knowledge/why-are-bench-vise-jaws-hardened
    - title: ¿Qué significa 60 HRC?
      body: La escala Rockwell descifrada y cómo leer la dureza en una ficha.
      href: /knowledge/what-does-60-hrc-mean
    - title: Cómo elegir un tornillo de banco
      body: Ancho, apertura, fuerza de sujeción, material y base.
      href: /knowledge/how-to-choose-a-bench-vise
    - title: Fundición vs. hierro dúctil
      body: Qué cuerpo encaja con tu carga — rigidez, impacto y coste.
      href: /knowledge/cast-iron-vs-ductile-vises
    - title: Fundición vs. acero forjado
      body: Coste, durabilidad, peso y resistencia al impacto, comparados.
      href: /knowledge/cast-iron-vs-steel-vises
    - title: Mantenimiento del tornillo de banco
      body: Lubricación, alineación y cuidado para décadas de servicio.
      href: /knowledge/bench-vise-maintenance
    - title: Fabricación OEM de tornillos de banco
      body: MOQ, personalización, plazos y estándares de calidad.
      href: /knowledge/oem-bench-vise-manufacturing
cta:
