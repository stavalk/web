clusters:
  title: Qué encontrarás aquí
  subtitle: Respuestas directas a las preguntas que más oímos de talleres, distribuidores y marcas.
  items:
    - title: Elegir un tornillo de banco
      description: Cómo escoger el tornillo adecuado para tu banco — ancho de mandíbula, serie, materiales y clase de uso.
    - title: Dimensiones y montaje
      description: Referencia de ancho de mandíbula, rangos de apertura, peso, tamaños de perno y montaje en banco.
    - title: Materiales y dureza
      description: Cuerpos de hierro gris, acero forjado y mandíbulas de GCr15/Cr12MoV endurecidas a 58–62 HRC.
    - title: Mantenimiento y cuidado
      description: Lubricación, protección contra la corrosión y mantenimiento del husillo y las mandíbulas.
    - title: OEM y marca privada
      description: MOQ, plazos, muestras, certificaciones y cómo construir tu propia marca de tornillos de banco.
