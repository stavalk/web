faq_section:
  tagline: FAQ
  title: 'Questions fréquentes sur le développement d''étau à main'
  questions:
    - q: Pouvez-vous développer un produit d''étau à main à partir d''une idée ?
      a: 'Oui. Nous soutenons le parcours complet de la spécification produit et de l''ingénierie au développement de prototype, à la personnalisation et à la production de masse en fonction de vos exigences. Un croquis, un étau de référence ou même une spécification concurrente suffit pour démarrer la revue d''ingénierie.'
    - q: Combien coûte le développement de produit d''étau à main ?
      a: 'La revue de spécification et l''évaluation d''ingénierie sont gratuites et renvoyées sous un jour ouvré. L''échantillonnage de prototype est devisé par projet après fixation de la spéc. ; la tarification de production dépend des matériaux, du volume et de la nécessité ou non d''un outillage personnalisé.'
    - q: Combien de temps prend le développement de produit d''étau à main ?
      a: 'Le premier échantillon part 7-12 jours après l''approbation de la spécification, avec 3-7 jours par cycle de révision. La production s''exécute en 25-35 jours après le bon de commande et l''acompte. Le développement de gabarit personnalisé ajoute 15-20 jours en amont, et le fret maritime ajoute 4-6 semaines vers la plupart des destinations.'
    - q: Qu''est-ce qui vient en premier - l''échantillon ou la production ?
      a: 'Toujours l''échantillon. Un prototype physique est produit, mesuré et approuvé contre la spécification avant le début de toute série de production. Nous ne faisons pas de production en gros sur des designs non approuvés.'
    - q: Signez-vous une NDA pour le développement de produit ?
      a: 'Oui. Une NDA est signée avant tout échange de fichiers, et vos designs, graphismes et votre outillage restent votre propriété tout au long du développement et de la fabrication.'
    - q: Pouvez-vous protéger mon design et mes spécifications d''étau ?
      a: 'Les designs, spécifications et concepts de produit des clients sont traités de manière confidentielle pendant le développement et la fabrication. Vos fichiers d''outillage ne sont jamais réutilisés, revendus ou montrés à un autre client.'

