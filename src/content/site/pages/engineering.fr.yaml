faqs:
  tagline: FAQ
  title: "Questions Fréquentes sur l'Ingénierie des Étaux"
  items:
    - q: "Pourquoi l'ingénierie compte-t-elle plus que la liste des pièces ?"
      a: "Deux étaux de même largeur de mâchoire peuvent se comporter complètement différemment. La force de serrage, le parallélisme des mâchoires, la douceur de la vis et la durée de vie dépendent de la nuance du matériau, des tolérances usinées, du traitement thermique et de la conception de la coulisse. Un acheteur qui compare des étaux sur le papier doit peser ces choix d'ingénierie, pas seulement les dimensions."
    - q: "La fonte grise est-elle meilleure que la fonte ductile ou l'acier forgé ?"
      a: "Chacune sert une classe de service. La fonte grise (HT200/HT250) offre une excellente rigidité et amortissement pour les étaux standard à un coût compétitif. La fonte ductile ajoute de la résistance aux chocs pour un usage plus dur. L'acier forgé 45# offre la plus haute résistance à la traction et est réservé aux séries industrielles lourdes où la charge et le frappage dominent."
    - q: "Comment la dureté des mâchoires est-elle vérifiée ?"
      a: "Chaque face de mâchoire est testée à 58–62 HRC avant emballage et les relevés sont enregistrés par lot. Les relevés de dureté, les copies de certificats et la traçabilité des lots sont disponibles sous NDA."
    - q: "Où les étaux Stavalk sont-ils conçus et fabriqués ?"
      a: "Conception, fonderie, usinage, traitement thermique et tests sont réalisés en interne à l'usine Stavalk de Jimo, Qingdao, Chine. Il n'y a aucune séparation conception-production entre le sol de R&D et la fonderie."
    - q: "Stavalk peut-elle concevoir un étau personnalisé pour ma marque ?"
      a: "Oui. Largeurs de mâchoires personnalisées, corps moulés, types de coulisse, pas de vis, matériaux de mâchoires et inserts trempés sont développés sous NDA à partir d'un cahier des charges technique. Voir les pages OEM et ODM pour le processus de coopération."

