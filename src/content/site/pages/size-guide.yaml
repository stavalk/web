how_to_choose:
  title: How to Choose the Right Size
  body: |
    Match the jaw width to both your workbench and your largest regular workpiece:

    - **Jaw width** determines the maximum workpiece you can grip securely. A 2″–5″ light-duty vise suits hobby and small work; 6″–8″ medium-duty covers most workshops; 8″–10″ heavy-duty is for industrial fabrication.
    - **Opening range** must clear your biggest material. Check the maximum opening against your thickest regular stock before choosing a series.
    - **Weight and bench** — light vises run 3–5 kg, medium 5–8 kg, heavy 8–14 kg. Reinforce the workbench top for heavy-duty vises.
    - **Mounting** — match bolt size (typically 4–12 mm) and spacing to your bench. A 360° swivel base adds clamping flexibility; a fixed base is more rigid for heavy hammering.
    - **Pipe jaws** — if you regularly hold round stock, choose a model with pipe jaws or a dedicated pipe vise accepting 1/8″–2″ pipe.

    ### Common choices
    - Small and precision work → 2″–5″ light-duty with replaceable jaws
    - General workshop use → 6″ medium-duty
    - Heavy and industrial work → 8″–10″ heavy-duty with anvil back
    - Round stock → pipe jaws or a dedicated pipe vise
