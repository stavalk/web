label: Research
headline: '<strong>Sand Casting</strong> — The Foundation of Vise Body Manufacturing'
subtitle: 'How green-sand and resin-sand moulding produce rigid, vibration-dampening HT200/HT250 gray cast iron vise bodies at volume.'
seo:
  title: 'Sand Casting Process for Cast Iron Vise Bodies'
  description: 'Stavalk uses green-sand and resin-sand casting to pour HT200/HT250 gray cast iron vise bodies at 1350–1400 °C with full dimensional control.'
body: >-
  Every Stavalk bench vise begins in the casting workshop, where HT200 and HT250 gray cast iron is melted and poured into green-sand or resin-sand moulds at temperatures between 1350 and 1400 °C. Patterns are designed and maintained in our in-house pattern shop, which allows rapid iteration on body geometry and ensures dimensional accuracy across production runs. After pouring, the castings pass through shakeout, shot-blasting and surface cleaning before dimensional inspection confirms adequate machining stock remains on all critical faces. This approach delivers the rigidity and vibration damping that workshop vises demand, while keeping per-unit casting cost favourable at the volumes our clients require.
faqs:
  - q: 'What iron grade does Stavalk use for vise bodies?'
    a: 'Stavalk casts vise bodies from HT200 or HT250 gray cast iron, selected based on the vise series and duty rating. HT200 suits light-to-medium vises, while HT250 is specified for heavy-duty models requiring higher tensile strength and wear resistance.'
  - q: 'Why is sand casting preferred for vise bodies?'
    a: 'Sand casting produces the thick-walled, ribbed cross-sections that give vise bodies their rigidity and vibration damping — properties essential for accurate clamping. The process also scales cost-effectively from prototype to high-volume production, making it ideal for the range of vise sizes Stavalk manufactures.'
  - q: 'How does Stavalk handle porosity in castings?'
    a: 'Gating and riser design are optimised to ensure pressure-free filling and directional solidification, keeping porosity away from critical machined faces. Every casting undergoes 100% visual and dimensional inspection of the slideway and jaw-mounting surfaces to confirm structural integrity before machining begins.'
