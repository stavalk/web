hero:
  tagline: Product Development
  title: 'Custom Bench Vise Product Development, From Concept to Shipment'
  subtitle: 'Six stages turn your product idea into production-ready bench vises - specification, engineering, prototyping, testing, tooling and mass production, all inside one factory with one accountable quality system.'

answer:
  label: 'Straight answer'
  text: 'Bench vise product development at Stavalk runs six stages - product specification, structural engineering, prototype sampling, testing and validation, custom tooling, and mass production. The first physical sample ships 7-12 days after specification approval; production runs 25-35 days after confirmed PO and deposit; new pattern development adds 15-20 days.'
  verified: '2026-08'

stages:
  title: 'The Six Stages of Bench Vise Product Development'
  subtitle: 'Each stage has a clear deliverable, so you always know where your project stands - and what arrives next.'
  items:
    - title: '1. Idea & Product Specification'
      description: 'Body material, jaw opening, throat depth, swivel range, surface finish and accessory package. A reference vise, sketch or competitor spec is enough to start.'
      icon: 'tabler:bulb'
    - title: '2. Engineering & 3D Design'
      description: 'Structural engineering, cast iron grade selection, jaw hardness specification, plus a manufacturability review and quotation - returned within one business day.'
      icon: 'tabler:blueprint'
    - title: '3. Prototype Sampling'
      description: 'Your first physical sample ships in 7-12 days, documented with an approval sheet covering construction, dimensions, jaw hardness and surface finish.'
      icon: 'tabler:tools'
    - title: '4. Testing & Validation'
      description: 'Clamping force, jaw hardness, swivel torque, durability cycle and salt spray tests against the approved sample, with CE and ISO documentation prepared for your target markets.'
      icon: 'tabler:test-pipe'
    - title: '5. Tooling & Mass Production'
      description: 'Custom pattern development in 15-20 days when needed; production runs 25-35 days with in-process QC checkpoints, 7-stage inspection and batch traceability.'
      icon: 'tabler:settings'
    - title: '6. Delivery & Scale'
      description: 'FOB, CIF or DDP logistics to 50+ countries - then repeat orders on your established line with stable lead times and approved artwork on file.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Why Development Inside a Factory Beats a Brokered Project'
  subtitle: 'Development work sitting inside the production plant changes what you get at every stage.'
  items:
    - title: No Design Handoff Gaps
      description: 'The engineering and drafting team works on the same floor as the CNC machining line - a drawing change goes to production the same week, not after a commercial round trip.'
      icon: 'tabler:handshake'
    - title: Samples That Match Production
      description: 'The sample run and the production run share the same casting, machining, heat treatment and QC stations, so the approved sample is what you actually receive at volume.'
      icon: 'tabler:stack-2'
    - title: Engineering That Sells Nothing
      description: 'Decisions are made against target cost, weight and durability - not against upsell margins, because this is a factory and production is the only revenue.'
      icon: 'tabler:scale'
    - title: Confidentiality as a Standing Contract
      description: 'An NDA is signed before any file exchange, and your artwork, tooling and specification files remain your property - never reused, resold or shown to another client.'
      icon: 'tabler:lock'

