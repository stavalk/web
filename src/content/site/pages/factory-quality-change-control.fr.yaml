cc_intro:
  tagline: Portée et Politique
  title: Principes Fondamentaux de Gouvernance
  body: |
    **Document :** QMS-SOP-QC-CC-001 — *Norme de Maîtrise des Changements de Paramètres de Retouche* (Rev 2.0, Publication Officielle). **Fabricant :** Stavalk, fabricant d’étaux d’établi à Qingdao, Chine (district de Jimo). **Référence norme :** ISO 9001:2015 Systèmes de Management de la Qualité.

    - **Aucun changement non maîtrisé.** Les changements de paramètres de retouche doivent passer une maîtrise des changements formelle. Les opérateurs de l’atelier, les chefs d’équipe ou un seul service ne sont jamais autorisés à modifier des paramètres de retouche approuvés par accord verbal ou par annotation manuscrite sur un enregistrement de retouche.
    - **Couverture complète des éléments.** La portée maîtrisée couvre la fonderie, le forgeage, l’usinage CNC, le traitement thermique, le revêtement de surface et l’assemblage — tout paramètre pouvant influencer la précision dimensionnelle, la dureté, la force de serrage, l’état de surface, l’acceptation du client ou la traçabilité.
    - **Ligne rouge de l’approbation client.** Tout changement qui éloigne le produit de l’échantillon approuvé par le client, de la spécification technique, de la nomenclature, de l’œuvre, de l’exigence d’emballage ou du critère d’acceptation n’est mis en œuvre qu’avec l’approbation écrite du client. Sans elle, l’étau est retouché selon l’exigence d’origine, remplacé ou rejeté — jamais « assoupli » par la seule usine.

cc_scope:
  tagline: Classification des Risques
  title: Portée du Changement et Classification des Risques
  subtitle: 'L’un des éléments suivants déclenche une maîtrise des changements formelle — il n’est jamais géré en écrivant une note dans l’enregistrement de retouche. Le niveau de risque détermine qui approuve et à quel point la validation est exigée.'
  headers:
    category: Catégorie de Changement
    examples: Exemples Types
    risk: Risque
    requirements: Exigences de Maîtrise et d’Approbation
  rows:
    - category: 'Matériaux de Retouche'
      examples: 'Matériau de revêtement, abrasif, nuance d’acier de trempe, milieu de traitement thermique ou changement de fournisseur'
      risk: 'Élevé'
      requirements: 'Revue inter-services + validation de compatibilité du matériau et de dureté + accord client le cas échéant'
    - category: 'Conditions de Procédé'
      examples: 'Température/temps de maintien du traitement thermique, épaisseur de revêtement, pression de serrage, température de cuisson'
      risk: 'Élevé'
      requirements: 'Approbation Ingénierie + Qualité avec validation de la fenêtre de température et de temps définie'
    - category: 'Outillage et Instruments'
      examples: 'Dynamomètres, duromètres, fours de traitement thermique, outillage CNC, clés dynamométriques'
      risk: 'Moyen/Élevé'
      requirements: 'Vérification de validité d’étalonnage + évaluation de l’aptitude de l’équipement'
    - category: 'Étendue du Défaut'
      examples: 'Extension de la zone de retouche ; défaut de surface progressant vers les zones critiques structurelles du corps ou des mâchoires'
      risk: 'Élevé'
      requirements: 'Surfaces portantes structurelles : arrêt obligatoire et réévaluation'
    - category: 'Méthodes d’Inspection'
      examples: 'Méthode d’essai de dureté, essai de force de serrage sous charge nominale, essai de couple de rotation'
      risk: 'Élevé'
      requirements: 'Approbation Qualité + confirmation de l’accord technique client'
    - category: 'Documentation et Autorisation'
      examples: 'Instruction de retouche, feuilles d’inspection, logique de disposition du NCR, qualification de l’opérateur'
      risk: 'Moyen'
      requirements: 'Révision de document contrôlée (Rev A — Rev B) + enregistrements de formation'

cc_containment:
  tagline: Règle de Stop Net
  title: Contention Immédiate Quand les Conditions s’Aggravent
  body: |
    > « La méthode de retouche existante doit être placée sous revue et ne doit pas être appliquée à des produits affectés supplémentaires tant que le changement n’est pas évalué et autorisé, sauf si une déviation temporaire documentée est approuvée par la Qualité et l’Ingénierie. »

    La méthode de retouche actuelle doit être suspendue immédiatement lorsque la contre-inspection de la retouche échoue à répétition, lorsque le défaut touche des zones portantes structurelles (corps, mâchoires, filetages, faces de serrage), lorsqu’un matériau de substitution n’est pas encore validé, ou lorsque les paramètres actuels entrent en conflit avec la spécification approuvée par le client.

    Les déviations temporaires ne deviennent jamais une pratique permanente : chacune porte une fenêtre de validité définie, une portée de lot applicable, un plafond de quantité, des exigences de validation et un mécanisme d’expiration automatique. Une exception verbale n’est pas une exception — si elle n’est pas documentée avec sa date d’expiration, elle n’existe pas.

cc_flow:
  tagline: Boucle Fermée Standard en 9 Étapes
  title: De la Demande de Changement à la Clôture et la Conservation
  subtitle: 'Une boucle documentée pour chaque changement de paramètre : proposer, examiner, évaluer, approuver, valider, piloter, vérifier, réviser, clôturer.'
  steps:
    - step: '01'
      title: Demande de Changement (ECR)
      desc: 'Tout service peut déposer une demande, mais c’est l’Ingénierie, la Qualité ou la Direction de Production qui la parraine. L’ECR répond pourquoi le changement est proposé, ce qui change, ce qui est affecté et comment il sera vérifié — avec numéro de maîtrise des changements, NCR/CAPA associé, paramètre actuel vs proposé, lots affectés et classification temporaire/permanente.'
    - step: '02'
      title: Examen Initial et Contention
      desc: 'La demande est d’abord examinée pour la contention immédiate : la méthode actuelle doit-elle s’arrêter maintenant ? Si une déviation temporaire est autorisée, elle est bornée par la fenêtre de validité, la portée de lot, le plafond de quantité et l’expiration automatique.'
    - step: '03'
      title: Évaluation d’Impact et de Risque
      desc: 'L’Ingénierie, la Qualité, la Production, les Achats/Supply Chain et les Projets évaluent la performance du produit, les critères d’acceptation, la compatibilité des matériaux, l’état de surface, la capabilité du procédé, l’équipement et les instruments, la qualification du personnel, les exigences client, la conformité et la portée de traçabilité.'
    - step: '04'
      title: Revue Conjointe et Approbation
      desc: 'L’approbation suit la matrice d’autorisation fixe — pas « celui qui parle le plus fort ». Les changements à haut risque exigent une approbation inter-services et, le cas échéant, l’approbation écrite du client avant tout essai.'
    - step: '05'
      title: Plan de Validation
      desc: 'Pour les changements à haut risque, un plan de validation approuvé est exigé avant l’application de routine : étaux d’échantillon représentatifs, méthode actuelle vs proposée, méthodes d’essai, critères d’acceptation, étapes d’inspection, responsables et calendrier.'
    - step: '06'
      title: Pilote Contrôlé et Mise en Œuvre
      desc: 'Les nouveaux documents sont publiés et les documents obsolètes retirés et marqués OBSOLÈTE ; les nouveaux matériaux et instruments sont vérifiés et étalonnés ; les opérateurs sont formés et qualifiés ; le premier lot est exécuté sous inspection renforcée avec identification claire de l’état.'
    - step: '07'
      title: Contre-Inspection et Revue d’Efficacité
      desc: 'Le taux de retouche à la première passe, le taux de réussite de la contre-inspection, le taux de récurrence et l’acceptation de surface sont mesurés et revus avant de considérer le changement efficace — un étau réparé n’est jamais traité comme une validation de procédé.'
    - step: '08'
      title: Révision du Document et Formation
      desc: 'Les instructions de travail, feuilles d’inspection, options de disposition du NCR, cartes de paramètres et supports de formation sont mis à jour à la nouvelle révision avec formation pratique enregistrée et qualification de l’opérateur.'
    - step: '09'
      title: Clôture et Conservation des Enregistrements
      desc: 'Le changement n’est clôturé qu’après revue et approbation des preuves de validation, des mises à jour de documents, des enregistrements de formation et de l’efficacité de la mise en œuvre. Si le résultat visé n’est pas atteint, le changement est révisé, prolongé, suspendu ou retiré.'

