cc_validation:
  tagline: Validation d’Ingénierie
  title: Protocole de Validation et d’Acceptation — Preuves Plutôt que Déclarations
  body: |
    Les formulations d’acceptation vagues telles que *« l’étau réparé doit être bon »* ne sont pas acceptées. La formulation maîtrisée est :

    > « L’échantillon retouché doit satisfaire aux mêmes critères applicables de dimension, de dureté, de force de serrage, de finition visuelle et d’acceptation spécifique au projet qu’un étau d’établi conforme, sauf si une déviation approuvée par le client définit spécifiquement un critère alternatif. »

    Les preuves de validation sont quantitatives, et la base d’ingénierie pour la retouche d’étaux d’établi comprend :

    - **Force de serrage et maintien sous pression.** La force de serrage des mâchoires satisfait la spécification de capacité nominale sans glissement soutenu sous charge ; le mécanisme de filetage et de rotation maintient la charge nominale sans jeu mesurable.
    - **Dureté.** Les inserts de mâchoire (GCr15/Cr12MoV) atteignent 58–62 HRC, vérifiés avec des duromètres étalonnés après re-traitement thermique.
    - **Précision dimensionnelle.** Le parallélisme des mâchoires, les diamètres d’alésage et le pas de filetage restent dans les tolérances approuvées après la retouche, vérifiés avec des instruments de mesure étalonnés.
    - **Aspect et finition.** Aucun défaut de revêtement, aucune marque d’usinage hors tolérance, aucune distorsion du corps, et aucun désalignement des mâchoires ou de la base pivotante.

cc_engineering:
  tagline: Matrice d’Exécution d’Ingénierie
  title: Paramètres Quantifiés des Quatre Procédés de Retouche de Base
  subtitle: 'Chaque procédé de retouche maîtrisé porte des paramètres, une méthodologie et des critères d’acceptation définis — les mêmes chiffres que suivent nos opérateurs et que nos clients peuvent vérifier lors des audits.'
  headers:
    process: Procédé de Retouche
    parameters: Paramètres Maîtrisés
    methodology: Méthodologie d’Essai
    acceptance: Critères d’Acceptation
  rows:
    - process: 'Réparation de Finition / Revêtement de Surface'
      parameters: 'Préparation de surface à Sa2,5 ; épaisseur de revêtement 60–80 µm ; cuisson à 180°C ± 10°C'
      methodology: 'Inspection visuelle sous lumière du jour ; mesure avec appareil d’épaisseur de film en 3 points'
      acceptance: 'Zéro zone découverte, zéro coulure ; épaisseur dans 55–85 µm ; aucune cloque ni perte d’adhérence'
    - process: 'Re-Traitement de Dureté des Mâchoires'
      parameters: 'Austénitisation 820–860°C ; trempe à l’huile ; revenu 150–200°C pour inserts de mâchoire GCr15/Cr12MoV'
      methodology: 'Essai de dureté Rockwell en 3 positions par insert ; contrôle métallographique de l’austénite résiduelle'
      acceptance: '58–62 HRC à toutes les positions d’essai ; aucune fissure ni point mou ; structure de grain selon référence ASTM'
    - process: 'Re-Filetage et Réalignement des Mâchoires'
      parameters: 'Pas de filetage selon spécification ; fixation à couple contrôlé ; parallélisme des mâchoires ≤ 0,05 mm'
      methodology: 'Inspection au calibre de filetage ; mesure au comparateur à cadran sur les faces des mâchoires sous charge nominale'
      acceptance: 'Le calibre de filetage s’engage proprement ; parallélisme dans 0,05 mm ; aucun grippage de rotation ou de poignée'
    - process: 'Vérification Finale de Force de Serrage et de Rotation'
      parameters: 'Force de serrage nominale par modèle ; couple de rotation dans 8–15 N·m pour la gamme moyenne'
      methodology: 'Dynamomètre étalonné en face de mâchoire ; clé dynamométrique sur la base pivotante sur toute la rotation'
      acceptance: 'Force de serrage ≥ spécification nominale ; couple de rotation dans la fenêtre ; aucun jeu latéral sous charge'

cc_pokayoke:
  tagline: Garde-Fous Anti-Erreur
  title: 'Poka-Yoke : des Blocs Durs qui Arrêtent le Changement Non Maîtrisé'
  subtitle: La norme est appliquée non seulement par des procédures, mais par des blocs physiques et système qui rendent impossible d’exécuter des changements non maîtrisés.
  features:
    - icon: 1
      icon_bg: blue
      title: Passage ECR pour le Déverrouillage de l’Outillage
      desc: 'Les postes de retouche lisent un code-barres ECR signé par l’AQ avant que les fours de traitement thermique et les lignes de revêtement se déverrouillent. Pas d’enregistrement de maîtrise des changements approuvé, pas d’approvisionnement — la signature rétroactive (« changer d’abord, signer ensuite ») est physiquement bloquée.'
    - icon: 2
      icon_bg: green
      title: Expiration Automatique de la Déviation Temporaire
      desc: 'Les déviations temporaires sont plafonnées dans le système (par exemple un maximum de 50 étaux ou 7 jours calendaires). Atteindre le plafond verrouille le lot et bloque l’impression de l’étiquette de passe d’expédition jusqu’à ce que le changement soit évalué formellement.'
    - icon: 3
      icon_bg: purple
      title: Preuve Minimale de Validation
      desc: 'Les changements à haut risque exigent au moins 5 étaux d’échantillon représentatifs couvrant les limites de tolérance supérieure et inférieure, entièrement inspectés par 2 contrôleurs QC indépendants, avant qu’un rapport de validation puisse être émis — un étau réparé n’est jamais traité comme une validation de procédé.'
    - icon: 4
      icon_bg: orange
      title: Maîtrise Documentaire 1-Sorti-1-Entré
      desc: 'Les cartes de poste obsolètes sont physiquement récupérées et annulées (perforées) avant que la nouvelle carte timbrée du sceau rouge maîtrisé soit délivrée — les versions ancienne et nouvelle ne partagent jamais un même poste.'

