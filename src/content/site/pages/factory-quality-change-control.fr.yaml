hero:
  tagline: Maîtrise des Changements de Paramètres de Retouche
  title: Norme de Maîtrise des Changements de Paramètres de Retouche et de Validation
  subtitle: 'Chez Stavalk, aucun opérateur, chef d’équipe ou service individuel ne peut modifier un paramètre de retouche approuvé sur-le-champ. Tout changement proposé aux matériaux de retouche approuvés, conditions de procédé, outillage, méthodes d’essai, critères d’inspection ou personnel autorisé est géré par une maîtrise des changements documentée — Demande de Changement d’Ingénierie, évaluation d’impact et de risque, approbation plurifonctionnelle, plan de validation, mise en œuvre contrôlée, contre-inspection et revue d’efficacité, puis clôture et conservation des enregistrements. Cette page présente notre norme contrôlée QMS-SOP-QC-CC-001 (Rev 2.0, basée sur ISO 9001:2015) et les preuves d’ingénierie qui la soutiennent.'
  actions:
    - text: Télécharger le SOP de Maîtrise des Changements (PDF)
      variant: primary
      href: 'https://assets.Stavalk.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf?dl=1'
    - text: Télécharger l’Annexe d’Exécution A (PDF)
