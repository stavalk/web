    - text: Demander une Revue Qualité
      href: /fr/contact

answer:
  label: 'Réponse directe'
  text: 'Les changements de paramètres de retouche ne sont jamais décidés verbalement ni rétroactivement chez Stavalk. Chaque changement proposé aux matériaux de retouche approuvés, conditions de procédé, équipements, méthodes d’essai, critères d’inspection ou personnel autorisé doit passer une maîtrise des changements formelle avant mise en œuvre : une Demande de Changement d’Ingénierie (ECR) documentée, une évaluation d’impact et de risque, une revue plurifonctionnelle par Ingénierie, Qualité, Production, Achats et Projets, une approbation au niveau fixé par notre matrice d’autorisation, un plan de validation approuvé pour les changements à haut risque, une mise en œuvre pilote contrôlée, une contre-inspection et une revue d’efficacité, puis une clôture après révision des documents et formation. Tout changement affectant des spécifications, échantillons, nomenclatures, œuvres ou critères d’acceptation approuvés par le client exige en outre son approbation écrite.'
  verified: '2026-09'

