faqs:
  tagline: FAQ
  title: Questions Fréquentes sur la Maîtrise des Changements de Retouche
  items:
    - q: 'L’usine peut-elle modifier les paramètres de retouche sans nous prévenir ?'
      a: 'Non. Tout changement proposé aux matériaux de retouche approuvés, conditions de procédé, outillage, méthodes d’essai, critères d’inspection ou personnel autorisé doit d’abord passer la maîtrise des changements documentée. Les changements affectant des spécifications, échantillons, nomenclatures, œuvres ou critères d’acceptation approuvés par le client exigent son approbation écrite.'
    - q: 'Qu’est-ce qui compte comme changement à haut risque ?'
      a: 'Les changements de matériaux de retouche ou de fournisseurs, de conditions de traitement thermique ou de revêtement, de méthodes de retouche mâchoire/filetage/corps, de critères d’inspection ou d’acceptation, et l’extension de l’étendue du défaut vers des zones structurelles sont classés à haut risque. Ils exigent une revue inter-services, un plan de validation approuvé et une mise en œuvre pilote maîtrisée avant l’usage de routine.'
    - q: 'Peut-on utiliser une déviation temporaire indéfiniment ?'
      a: 'Non. Chaque déviation temporaire porte une fenêtre de validité définie, une portée de lot, un plafond de quantité et des exigences de validation, avec expiration automatique. Atteindre le plafond verrouille le lot et bloque l’impression de l’étiquette de passe jusqu’à ce que le changement soit évalué formellement.'
    - q: 'Comment prouve-t-on qu’une méthode changée fonctionne avant l’usage complet ?'
      a: 'Les changements à haut risque exigent un plan de validation : au moins 5 étaux d’échantillon représentatifs couvrant les limites de tolérance, testés par 2 contrôleurs QC indépendants contre des critères d’acceptation quantifiés (force de serrage, dureté, précision dimensionnelle, état de surface). Approuver la validation n’est pas approuver l’application.'
    - q: 'Devons-nous approuver chaque changement ?'
      a: 'Pas chaque changement, mais tout changement qui éloigne le produit de l’échantillon approuvé par le client, de la spécification technique, de la nomenclature, de l’œuvre, de l’emballage ou du critère d’acceptation n’est mis en œuvre qu’avec l’approbation écrite du client. Sans elle, les étaux sont retouchés selon l’exigence d’origine, remplacés ou rejetés.'
    - q: 'Que deviennent les documents anciens quand un changement est approuvé ?'
      a: 'Les instructions de travail, cartes de paramètres et feuilles d’inspection anciennes sont physiquement récupérées et annulées (1-sorti-1-entré), marquées OBSOLÈTE, et remplacées par la nouvelle révision maîtrisée après formation. Les versions ancienne et nouvelle ne partagent jamais un même poste.'
    - q: 'Combien de temps les enregistrements de maîtrise des changements sont-ils conservés ?'
      a: 'Les enregistrements de clôture — preuves de validation, révisions de documents, enregistrements de formation et revues d’efficacité — sont conservés selon notre politique de rétention des enregistrements (minimum 3 ans pour les enregistrements de clôture) afin que chaque changement reste traçable pour les audits et les revues de traçabilité.'

