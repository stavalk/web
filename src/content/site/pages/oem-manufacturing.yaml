hero:
  tagline: OEM Manufacturing
  title: 'Custom Bench Vise OEM Manufacturing - Your Spec, Our Factory'
  subtitle: 'You bring the design, drawing or proven platform - we manufacture it at scale. Engineering review within one business day, samples in 7-12 days, production runs 25-35 days after confirmed PO and deposit, shipped under your brand.'

answer:
  label: 'Straight answer'
  text: 'OEM production runs from your specification. MOQ is confirmed by project configuration rather than a fixed number: standard volume production runs 50-200 units per batch for medium-duty vises, pilot runs start at 20-50 units on existing models, and every project moves through sample (1-2 units) before volume. Samples ship in 7-12 days; production runs 25-35 days after confirmed PO and deposit, plus 15-20 days when new tooling is required.'
  verified: '2026-08'

