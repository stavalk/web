customization:
  tagline: Built to Your Spec
  title: OEM Specification Points
  subtitle: 'These are the specification points you control on an OEM project - your specification document is the production contract:'
  items:
    - 'Vise body material - HT200 or HT250 gray cast iron, or forged steel per your drawing'
    - 'Jaw material and hardness - GCr15 or Cr12MoV hardened steel at 58-62 HRC'
    - 'Jaw opening and throat depth - dimensions per your drawings or target application'
    - 'Swivel base angle and lock mechanism - 360-degree rotation or fixed base'
    - 'Vise series selection - light-duty (4"-5"), medium-duty (6"-8"), heavy-duty (8"-10"), pipe or specialty'
    - 'Surface finish - paint, powder coating or Parkerizing per your specification'
    - 'Hardware and accessories - anvil surface, pipe jaws, quick-release mechanisms'
    - 'Branding and packaging - logo on casting, paint color, label and retail packaging under your brand'
    - 'Compliance marks - CE labels, serial numbers and per-market documentation prepared for your export region'

faq_section:
  tagline: FAQ
  title: OEM Manufacturing Questions
  questions:
    - q: How do I start an OEM project with my own design?
      a: 'Send your drawings, a reference vise or a written specification. Our engineering review confirms manufacturability and returns a quotation within one business day - it is our standard commitment, and an NDA is signed before any file exchange when needed.'
    - q: What is the MOQ for OEM bench vises?
      a: 'MOQ is confirmed by project configuration - body casting, jaw specification, surface finish, branding and packaging. Standard volume production runs 50-200 units per batch for medium-duty vises, while heavy-duty and specialty vises run 20-50 units. Pilot runs start at 20-50 units on existing models.'
    - q: What is the typical lead time for an OEM order?
      a: 'Production runs 25-35 days from confirmed PO and deposit. Custom tooling development adds 15-20 days. Prototype samples usually ship within 7-12 days.'
    - q: Can you manufacture from my existing drawings only?
      a: 'Yes. OEM builds from your specification as-is - you own the design. Our engineers review the drawings for production feasibility, flag any spec conflicts before tooling starts, and the approved sample becomes the production reference.'
    - q: Do you provide samples before production?
      a: 'Yes. A physical sample is produced and approved before any production run, typically within 7-12 days, and it is the reference for all subsequent QC checks.'
    - q: Which certifications does the factory hold?
      a: 'CE (EN ISO 12100, Machinery Directive 2006/42/EC), ISO 9001:2015, ISO 14001 and RoHS. Full compliance documentation is provided with every OEM shipment, prepared for your target markets.'
    - q: How is quality controlled on an OEM run?
      a: 'Production runs under multi-point QC - incoming material, in-process and final inspection - with clamping force testing, jaw hardness verification (58-62 HRC), swivel torque checks, 10,000+ cycle durability tests, 48-hour salt spray testing and 7-stage inspection with ERP batch traceability.'
    - q: What are your shipping terms?
      a: 'FOB Qingdao, CIF major global ports, or DDP for qualified partners. We ship to 50+ countries across EU, US, AU and Asia markets.'

process:
  title: 'The OEM Process - From Spec to Shipped Order'
  subtitle: 'Seven controlled stages run by one factory team, so every step from your first spec to the packed carton stays documented and on schedule.'
  steps:
    - phase: '01'
      title: Spec Review & Quotation
      period: 1 business day
      items:
        - 'Share your drawings, specification or reference vise - our engineers check manufacturability.'
        - 'You receive a detailed quotation and project plan within one business day.'
    - phase: '02'
      title: Engineering Confirmation
      period: Week 1
      items:
        - 'Body dimensions, jaw spec, material grades and swivel construction are confirmed against your document.'
        - 'Pattern or tooling decisions are locked - custom pattern development starts here when required.'
    - phase: '03'
      title: Prototype & Sample
      period: 7-12 days
      items:
        - 'A physical sample is produced and sent for your review - dimensional and hardness checks included.'
        - 'Sample (1-2 units) validates your spec before any volume commitment.'
    - phase: '04'
      title: Testing & Validation
      period: In parallel
      items:
        - 'Clamping force, jaw hardness, swivel torque, 10,000+ cycle durability and 48-hour salt spray tests per production line.'
        - 'CE, ISO 9001:2015, ISO 14001 and RoHS documentation prepared for your export markets.'
    - phase: '05'
      title: Approval & Confirmation
      period: After sample sign-off
      items:
        - 'You approve the sample and artwork; the PO and deposit lock the production slot.'
        - 'A pre-production plan confirms dates, quantities, packaging and port of loading.'
    - phase: '06'
      title: Production
      period: 25-35 days
      items:
        - 'Production runs under multi-point QC - incoming material, in-process and final inspection.'
        - 'From pilot orders (20-50 units) on existing models up to full batches (50-200 units) for standard volume production.'
    - phase: '07'
      title: Packing & Shipment
      period: 1 day + transit
      items:
        - 'Export packing with model serial labels, then FOB Qingdao, CIF or DDP to 50+ countries.'
        - 'Customs documentation, tracking and reorder support included at every stage.'

