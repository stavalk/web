derisk:
  tagline: Lancement sans le risque
  title: 'Quatre façons dont une commande d''essai réduit le risque de votre lancement'
  subtitle: 'La plupart des échecs de lancement de marques nouvelles se produisent sur le stock, pas sur la qualité du produit. Une commande d''essai est conçue pour rendre les erreurs évitables impossibles.'
  features:
    - icon: I
      icon_bg: blue
      title: 'Pas d''engagement de stock lourd'
      desc: 'Votre exposition de première saison reste sous 50 unités. Si le format a besoin d''ajustement, vous ajustez avant la grosse dépense, pas après.'
    - icon: C
      icon_bg: green
      title: 'Une trésorerie qui reste gérable'
      desc: 'Des commandes plus petites signifient des acomptes plus petits, des paiements échelonnés et aucun capital oisif dans un entrepôt. La tarification de volume attend d''être réellement méritée.'
    - icon: Q
      icon_bg: purple
      title: 'La qualité n''est jamais réduite'
      desc: 'Une commande d''essai de 20 unités passe par le même système d''inspection à 7 étapes et les mêmes tests de durabilité qu''un programme de volume complet — aucun compromis « essayer avant la qualité ».'
    - icon: G
      icon_bg: orange
      title: 'Chemin garanti vers l''échelle'
      desc: 'Chaque commande d''essai porte une voie confirmée vers le volume : crédits d''échantillon conservés, BOM et marque figés, et créneaux de production réservés pour votre série de suivi.'

scale_path:
  tagline: Après l'essai
  title: 'Ce qui vient après une commande d''essai réussie'
  subtitle: 'La commande d''essai est délibérément conçue pour être la première étape d''une relation plus longue. Voici le chemin que nous convenons avant que la première unité ne parte.'
  steps:
    - step: 'Phase 1'
      title: 'Essai livré et examiné'
      desc: '20 à 50 unités arrivent selon le calendrier, les données d''écoulement reviennent de votre canal — distributeur, retail ou direct.'
    - step: 'Phase 2'
      title: 'Retour et affinement'
      desc: 'Couleur du corps, placement de la marque, emballage et mix d''accessoires sont ajustés contre la réponse réelle du marché. La BOM et la marque sont figées pour le suivi.'
    - step: 'Phase 3'
      title: 'Série de volume (50 à 200+ unités)'
      desc: 'Lots standard de coulée avec efficacité de production complète, systèmes de peinture personnalisés et tarification de volume — les crédits d''échantillon déjà appliqués.'
    - step: 'Phase 4'
      title: 'Programmes à pleine échelle'
      desc: 'Programmes de 500+ unités avec expéditions échelonnées, finitions Pantone personnalisées et le pipeline de développement complet — la même usine, désormais à pleine échelle.'

trial_faqs:
  tagline: FAQ
  title: 'Questions fréquentes sur le lancement avec une commande d''essai'
  items:
    - q: 'Puis-je vraiment lancer une marque d''étaux sans commande complète ?'
      a: 'Oui. Le point d''entrée est étagé : 1 à 2 échantillons valident l''étau (prêts en 7 à 14 jours), une commande d''essai de 20 à 50 unités valide le marché (production en 25 à 35 jours), et les séries de volume de 50 à 200+ unités suivent uniquement quand l''écoulement prouve le format. Le co-marquage en petits lots commence dès 20 unités quand vous voulez des étaux marqués sans aucune étape de développement.'
    - q: 'Combien de temps prend un lancement complet, de bout en bout ?'
      a: 'En utilisant les plateformes de séries existantes, un premier lancement typique s''exécute en 6 à 10 semaines du brief produit à la commande d''essai livrée : échantillons en 7 à 14 jours, production d''essai en 25 à 35 jours après bon de commande confirmé et acompte. Un corps coulé sur mesure ajoute 15 à 20 jours de développement de moule.'
    - q: 'Que comprend le prix — et que ne comprend-il pas ?'
      a: 'Les fourchettes de référence sont FOB Qingdao pour les étaux eux-mêmes, y compris l''application de la marque et le QC standard. Elles sont indicatives : le devis final est confirmé contre votre configuration — série, matériau de mâchoire, finition de surface, marque, emballage et accessoires — avant tout engagement. Le fret, les droits et le dédouanement à destination sont devisés séparément.'
    - q: 'Dois-je acheter 100 ou 500 étaux pour avoir mon logo dessus ?'
      a: 'Non. Le co-marquage en petits lots met votre logo sur l''arbre ou la face de mâchoire dès 20 unités, et les commandes d''essai de 20 à 50 unités soutiennent l''application complète de la marque à la même qualité que la production en volume. Ce qui change avec la quantité, c''est le prix unitaire, pas la disponibilité.'
    - q: 'Que se passe-t-il si je veux modifier le design après l''essai ?'
      a: 'Les modifications entre l''essai et le volume sont normales et bienvenues — c''est tout l''intérêt de l''essai. Couleur du corps, placement de la marque, emballage et accessoires sont re-devisés contre la nouvelle configuration, puis figés avec la signature BOM et marque avant la série de volume. Les frais de moule de coulée pour les marques sont levés sur les ré-commandes utilisant les mêmes dimensions de graphisme.'
    - q: 'Signez-vous une NDA avant que je partage mes designs ?'
      a: 'Oui. Un accord de non-divulgation est disponible avant que vous partagiez des spécifications techniques ou des graphismes propriétaires. Nous fabriquons exclusivement sous les marques de nos clients et ne concurrençons jamais sur aucun marché — la même politique s''applique à un échantillon d''1 unité qu''à un programme de volume complet.'

