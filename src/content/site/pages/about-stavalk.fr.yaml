intro: |
  <p><strong>Stavalk</strong> est un fabricant de serre-joints basé à Jimo, Qingdao, Shandong, Chine. Depuis une installation de production de 8 000 m², l''entreprise fabrique des serre-joints allant des modèles légers de 4″ aux serre-joints industriels de 10″, ainsi que des serre-joints à tuberie et des outils de maintien spécialisés.</p>
  <p>Chaque projet Stavalk —d''un premier échantillon à la production OEM en volume— est fabriqué dans la même installation, par les mêmes équipes et sous le même système qualité décrit ici. Nous fabriquons exclusivement pour nos clients et ne les concurrençons jamais sous notre propre marque.</p>
  <p>L''usine couvre 8 000 m² avec des ateliers dédiés à la coulée en sable vert et sable aggloméré, l''usinage CNC et conventionnel, le traitement thermique, le revêtement de surface et l''assemblage. La capacité annuelle dépasse 80 000 serre-joints, et l''installation fonctionne sous un système de management de la qualité ISO 9001:2015 avec conformité CE (EN ISO 12100, Directive Machines 2006/42/CE) et RoHS.</p>
  <p>Plus de 200 ouvriers qualifiés et une équipe R&D dédiée soutiennent toute la chaîne de production : coulée de corps en fonte grise HT200/HT250, usinage d''arbres en acier forgé 45#, trempe des mâchoires en acier GCr15/Cr12MoV à 58–62 HRC, application de revêtements de surface et inspection en 7 étapes avant expédition.</p>
