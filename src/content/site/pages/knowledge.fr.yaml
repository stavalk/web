clusters:
  title: Ce que vous trouverez ici
  subtitle: Des réponses directes aux questions que nous entendons le plus des ateliers, distributeurs et marques.
  items:
    - title: Choisir un serre-joint
      description: Comment choisir le bon serre-joint pour votre établi — largeur de mâchoire, série, matériaux et classe d''usage.
    - title: Tailles et montage
      description: Référence de largeur de mâchoire, gammes d''ouverture, poids, tailles de boulons et montage sur établi.
    - title: Matériaux et dureté
      description: Corps en fonte grise, acier forgé et mâchoires GCr15/Cr12MoV trempées à 58–62 HRC.
    - title: Entretien et maintenance
      description: Lubrification, protection contre la corrosion et maintien de la vis et des mâchoires en bon état.
    - title: OEM et marque privée
      description: MOQ, délais, échantillons, certifications et comment créer votre propre marque de serre-joints.
