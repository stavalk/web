  tagline: 'Fabricación que puedes verificar'
  title: 'Confianza y Garantía de Fábrica OEM'
  subtitle: 'Cada afirmación de este sitio se puede verificar: registro oficial de la empresa, una fábrica física de 8.000 m² que puedes visitar o auditar, ingenieros reales bajo NDA, documentos QMS descargables y datos de ensayo registrados por lote. Diseñado y operado por Stavalk, Qingdao, China.'

answer:
  label: 'Respuesta directa'
  text: 'La confianza no es una promesa — es documentación. Somos una entidad manufacturera china registrada (Stavalk, Qingdao) con una planta física de 8.000 m² en Jimo, Qingdao, más de 200 trabajadores y más de 80.000 tornamesas de capacidad anual. Puedes verificar el registro, auditar la fábrica, revisar los SOP de QMS, descargar registros de calidad de muestra, programar inspecciones de terceros (SGS, TÜV, BV o Intertek) y firmar un NDA en un plazo de 4 horas laborables. Cada tornamesa se prueba para fuerza de sujeción, dureza de mordaza (58–62 HRC), torque de giro, durabilidad de 10.000+ ciclos y resistencia a corrosión por sal de 48+ horas, y cada lote conserva trazabilidad ERP completa. Si una afirmación no se puede documentar, no la hacemos.'
  verified: '2026-09'

