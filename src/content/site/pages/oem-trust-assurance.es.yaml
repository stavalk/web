role_boundary:
  tagline: 'Qué somos — y qué no somos'
  title: 'Una fábrica verificable, nunca una afirmación que debas tomar al pie de la letra'
  subtitle: 'La diferencia entre una fábrica y una mesa comercial es simple: detrás de cada afirmación hay un documento, una persona o una máquina.'
  features:
    - icon: A
      icon_bg: blue
      title: 'Qué somos — un fabricante verificable'
      desc: '· Una entidad legal registrada: Stavalk, Qingdao, China — datos del registro compartidos bajo NDA o durante la auditoría · Una fábrica física: 8.000 m² en Jimo, Qingdao, con 4 talleres especializados, más de 200 trabajadores y múltiples líneas de producción · Un equipo de fabricación: las personas que responden tus preguntas son las que construyen tus tornamesas · Documentos reales: SOP de QMS, estándares de inspección y registros de calidad anonimizados descargables · Verificación independiente bienvenida: inspecciones SGS, TÜV, BV o Intertek a tu elección, según ISO 2859-1 Nivel II'
