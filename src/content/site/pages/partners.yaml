content_programs:
  title: Partnership Programs
  subtitle: Work with us at the level that fits your business — each program scales commitment, pricing and development support.
  body: |
    ### OEM Manufacturing
    Produce your bench vise under your own brand. We handle casting, machining, heat treatment, coating, testing and quality inspection to your spec in Qingdao, China. MOQ from 50 units (20 for heavy and specialty models).

    ### Private Label
    Standard Stavalk series labelled with your brand and packaging. Fastest route to market with full certification support and warranty backing.

    ### Co-Development
    Co-develop a new series — custom jaw width, materials, finish, branding and accessory sets — with our engineering team from drawing to production.

    ### Distribution & Resale
    Reliable supply in volume for importers and distributors across Europe, the Americas, Asia-Pacific and the Middle East, with consistent lead times.
content_benefits:
  title: Why Partners Choose Stavalk
  subtitle: Four reasons teams keep reordering.
  body: |
    - **Certified manufacturing** — CE (EN ISO 12100, MD 2006/42/EC), ISO 9001:2015, ISO 14001 and RoHS across the factory.
    - **Design freedom** — OEM and custom series with our engineering support from drawing to production.
    - **Fast sampling** — samples in 7–14 days, bulk orders in 25–35 days, FOB Qingdao.
    - **Quality you can audit** — 7-stage inspection, lab tests, batch traceability and SGS/TÜV/BV/Intertek third-party reports.
content_process:
  title: How It Works
  subtitle: A clear, gated path from first contact to repeat orders.
  body: |
    1. **Share your spec** — send your blueprint, sample reference or target price and quantity.
    2. **Receive a proposal** — engineering review, costing and a sample plan within a few working days.
    3. **Approve a sample** — physical or photo sample verified against your drawing and requirements.
    4. **Place a bulk order** — production with 7-stage in-process inspection and batch traceability.
    5. **Ship and support** — FOB Qingdao shipment, doc register, warranty and reorder service.
