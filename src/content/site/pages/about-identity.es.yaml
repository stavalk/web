answer:
  label: En resumen
  text: Stavalk es un fabricante profesional de tornillos de banco en Qingdao, China, que opera una fábrica de 8.000 m² con más de 200 trabajadores y una capacidad de más de 80.000 tornillos al año en series ligera, media, pesada, tubería y precisión — certificado CE, ISO 9001:2015, ISO 14001 y RoHS.
  verified: '2026-09-01'
identity_detail:
  title: Quiénes somos
  subtitle: Una identidad de fabricación centrada en sujetar el trabajo de forma segura y fiable.
  items:
    - title: Producción de fábrica propia
      description: Fundición, mecanizado, tratamiento térmico, recubrimiento y montaje se realizan en nuestro propio centro de 8.000 m² en Qingdao, China.
    - title: Profundidad de ingeniería
      description: Un centro de I+D interno cubre diseño de fundición, programación CNC, metalurgia y ensayos.
    - title: Calidad certificada
      description: CE (EN ISO 12100, MD 2006/42/CE), ISO 9001:2015, ISO 14001 y RoHS en toda la línea de producción.
    - title: Listo para marca privada
      description: Series estándar y modelos OEM/codesarrollados personalizados para distribuidores y marcas en todo el mundo.
manufacturing_scope:
  title: Alcance de fabricación
  body: |
    La fábrica de Stavalk cubre toda la cadena de producción de tornillos de banco:

    - **Fundición** — cuerpos de hierro gris HT200/HT250 mediante líneas de arena verde y aglomerante, validados con espectrómetro.
    - **Mecanizado** — caras de mandíbula, husillos y bases en tornos y centros de fresado CNC con dimensiones verificadas por CMM.
    - **Tratamiento térmico** — mandíbulas de acero GCr15/Cr12MoV templadas en aceite y revenidas a 58–62 HRC.
    - **Recubrimiento** — pintura en spray, recubrimiento en polvo y Parkerizing con ensayos de niebla salina de más de 48 horas.
    - **Inspección** — un flujo de calidad de 7 etapas con trazabilidad de lote y opciones de terceros.

    Esta cadena interna nos permite controlar la calidad, los plazos y el costo desde la materia prima hasta el producto terminado.
brand_positioning:
  title: Posicionamiento de marca
  body: |
    Stavalk se posiciona como una fuente OEM fiable y certificada para marcas y distribuidores de sujeción — no un revendedor, sino la fábrica que diseña, funde, mecaniza y ensaya el producto. Competimos con profundidad de ingeniería, calidad documentada y desarrollo de marca privada ágil, incluyendo muestras en 7–14 días y pedidos en volumen en 25–35 días, FOB Qingdao.
evidence_review:
  title: Evidencia y verificación
  body: |
    Las afirmaciones anteriores están respaldadas por evidencia de fábrica verificable: JSON de datos de fabricación, JSON de datos de certificación, fotos de producción con marca de tiempo y informes de inspección de terceros. Los compradores pueden auditar estos registros directamente o a través de nuestro centro de pruebas:

    - [Centro de pruebas](/es/proof-center)
    - [Certificaciones](/es/quality)
    - [Fábrica y calidad](/es/quality)
faqs:
  title: Preguntas frecuentes
  questions:
    - q: ¿Dónde está Stavalk?
      a: Stavalk opera una fábrica de 8.000 m² en Qingdao, China, que cubre fundición, mecanizado, tratamiento térmico, recubrimiento y montaje.
    - q: ¿Qué fabrica Stavalk?
      a: Tornillos de banco en series ligera, media, pesada, tubería y precisión, además de desarrollo OEM y de marca privada personalizado.
    - q: ¿Cuál es su capacidad de producción?
      a: Más de 80.000 tornillos al año, con más de 200 trabajadores en producción.
    - q: ¿Soportan OEM y marca privada?
      a: Sí — series estándar bajo tu marca o modelos codesarrollados personalizados, con muestras en 7–14 días y pedidos en volumen en 25–35 días.
