      title: Material First
      desc: 'The correct gray cast iron grade, ductile iron or forged steel for each duty class, selected before any machining begins. HT200/HT250 gray cast iron for standard cast bodies, ductile iron where impact risk is higher, 45# forged steel for the heaviest series.'
    - icon: P
      icon_bg: green
      title: Precision Machining
