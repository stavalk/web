faqs:
  tagline: FAQ
  title: Frequently Asked Questions About Vise Engineering
  items:
    - q: 'Why does vise engineering matter more than the raw parts list?'
      a: 'Two vises with the same jaw width can behave completely differently. Clamping force, jaw parallelism, thread smoothness and wear life are decided by material grade, machined tolerances, heat treatment and slide design. A buyer comparing vises on paper should weigh these engineering choices, not just dimensions.'
    - q: 'Is gray cast iron better than ductile iron or forged steel?'
      a: 'Each serves a duty class. Gray cast iron (HT200/HT250) gives excellent rigidity and dampening for standard bench vises at a competitive cost. Ductile iron adds impact resilience for harder shop use. 45# forged steel delivers the highest tensile strength and is used on heavy-duty industrial series where load and striking dominate.'
    - q: 'How is jaw hardness verified?'
      a: 'Every jaw face is hardness-tested to 58–62 HRC before packing, and the readings are recorded per batch. Hardness records, certificate copies and batch traceability are available on request under NDA.'
    - q: 'Where are Stavalk vises engineered and manufactured?'
      a: 'Engineering, casting, machining, heat treatment and testing are all performed in house at the Stavalk plant in Jimo, Qingdao, China. There is no design-to-production separation between the R&D floor and the foundry.'
    - q: 'Can Stavalk engineer a custom vise for my brand?'
      a: 'Yes. Custom jaw widths, body castings, slide types, thread pitch, jaw materials and hardened inserts are developed under NDA from a technical brief. See the OEM and ODM pages for the cooperation process.'

