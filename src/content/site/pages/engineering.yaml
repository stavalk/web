answer:
  label: 'Straight answer'
  text: 'Vise engineering is the difference between a vise that clamps hard for years and one that binds, wears or distorts within months. Four decisions dominate performance: the body material (gray cast iron, ductile iron or forged steel), the jaw face material and geometry, the screw-thread mechanism that generates clamping force, and the heat treatment that sets jaw hardness. Stavalk engineers, casts, machines, heat-treats and tests every element on site in Qingdao — every batch is hardness-tested and clamping-force-cycled before packing.'
  verified: '2026-09'

pillars:
  tagline: Engineering Pillars
  title: The Four Principles Behind Every Vise
  subtitle: 'The same rules apply to a 2″ hobby vise and a 10″ industrial model — only the scale and grade change.'
