answer:
  label: 'Straight answer'
  text: 'A bench vise converts handle torque into clamping force through a single mechanism: a spindle with a trapezoidal (Acme-style) thread, turned by a handle, pushing the movable jaw down the slide. Force depends on thread pitch and diameter, handle length, slide friction and body rigidity — a coarse pitch multiplies force per turn and resists backing off, a longer handle gives more leverage, and a rigid cast-iron or forged-steel body converts that force into the jaws instead of flexing. On the Stavalk heavy-duty forged-steel series, this system develops clamping force in the 2,000–8,000 lbf range, and the spindle assembly is a replaceable, serviceable unit.'
  verified: '2026-09'

