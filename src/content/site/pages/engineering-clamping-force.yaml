      desc: 'A stiff gray-iron, ductile-iron or forged-steel body transmits force into the jaws. A flexing body absorbs force and lets the workpiece shift under load.'

clamp_notes:
  tagline: Clamping Notes
  title: Why the Mechanism Matters More Than the Handle
  body: |
    **Thread design sets the character of a vise.** A trapezoidal thread does two jobs at once: it converts torque into powerful linear force, and its thread flank angle resists the spindle backing out under load. A coarse pitch makes each handle turn travel further and clamp harder — which is why heavy-duty vises feel "positive" and stay clamped, while cheap fine threads slip back. Slide screws are also induction-hardened and cycled to verify smooth, accurate clamping with no binding across the full range.

    **Force is the product, not the promise.** Clamping capacity is a designed number: thread geometry, handle length, cross-section and material grade are chosen together to hit a target force. The heavy-duty forged-steel series is engineered for 2,000–8,000 lbf of clamping force with the body and slide sized so the mechanism does not yield at the top of the range — and the replaceable screw assembly keeps the vise serviceable when a spindle finally wears out.

    **Slides are measured in thousandths.** The moving jaw travels on slide channels and guides machined to 0.05 mm positional accuracy. If the slide binds, part of every handle turn is wasted overcoming friction instead of adding force; if it is loose, the jaw tilts under load and grip collapses at one corner. The combination of accurate machining and a stiff body is what lets a modest handle effort produce a genuinely industrial grip.

    **Swivel and anvil are part of the load path.** On swivel-base models the entire clamp reaction passes through the swivel locking mechanism, which must hold the body square while force is applied — the reason swivel bases use front and back locks. On anvil models, the same rigidity that holds clamping force also supports impact work.

faqs:
  tagline: FAQ
  title: Frequently Asked Questions About Clamping Force
  items:
    - q: 'How much clamping force does a Stavalk vise develop?'
      a: 'Clamping capacity scales with series and jaw width. The heavy-duty 45# forged-steel series is engineered for 2,000–8,000 lbf of clamping force depending on model; standard cast-iron series are sized for their duty class.'
    - q: 'Why are the spindle threads trapezoidal?'
      a: 'A trapezoidal (Acme-style) thread combines high load capacity with low backlash and resists backing off under load — the right geometry for a spindle that must hold clamping force all day.'
    - q: 'Is the spindle replaceable?'
      a: 'Yes. The screw assembly is a replaceable unit on Stavalk vises, which keeps the body in service for heavy industrial use if a spindle wears out.'
    - q: 'How is smooth clamping verified?'
      a: 'Every sliding screw is cycled to verify smooth, accurate clamping with no binding across the full opening range before packing. Cycle and force records are available on request.'

