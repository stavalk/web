      href: 'https://assets.Stavalk.com/site/downloads/rework-execution-annex-a-qms-sop-qc-cc-001.pdf?dl=1'
    - text: Request Quality Review
      href: /contact

answer:
  label: 'Straight answer'
  text: 'Rework parameter changes are never decided verbally or retroactively at Stavalk. Every proposed change to approved rework materials, process conditions, equipment, test methods, inspection criteria or authorized personnel must pass formal change control before implementation: a documented Engineering Change Request (ECR), impact and risk assessment, cross-functional review by Engineering, Quality, Production, Procurement and Project, approval at the level fixed by our authorization matrix, an approved validation plan for high-risk changes, controlled pilot implementation, re-inspection and effectiveness review, and closure only after document revision and training. Any change affecting customer-approved specifications, samples, BOMs, artwork or acceptance criteria additionally requires written customer approval.'
  verified: '2026-09'

