cc_validation:
  tagline: Engineering Validation
  title: Validation & Acceptance Protocol — Evidence Over Statements
  body: |
    Vague acceptance wording such as *"the repaired vise must be good"* is not accepted. The controlled wording is:

    > "The reworked sample shall meet the same applicable dimensional, hardness, clamping-force, visual workmanship and project-specific acceptance criteria as a conforming bench vise, unless a customer-approved deviation specifically defines an alternative criterion."

    Validation evidence is quantitative, and the engineering baseline for bench vise rework includes:

    - **Clamping force & pressure hold.** The jaw clamping force meets the rated-capacity specification with no sustained slip under load; the thread and swivel mechanism hold the rated load with no measurable play.
    - **Hardness.** Jaw inserts (GCr15/Cr12MoV) achieve 58–62 HRC, verified with calibrated hardness testers after re-heat treatment.
    - **Dimensional accuracy.** Jaw parallelism, bore diameters and thread pitch stay within the approved tolerances after rework, verified with calibrated measuring instruments.
    - **Appearance & workmanship.** No coating defects, no machining marks beyond tolerance, no body distortion, and no misalignment of jaws or swivel base.

cc_engineering:
  tagline: Engineering Execution Matrix
  title: Quantified Parameters for the Four Core Rework Processes
  subtitle: 'Each controlled rework process carries defined parameters, methodology and acceptance criteria — the same numbers our operators follow and our customers can verify during audits.'
  headers:
    process: Rework Process
    parameters: Controlled Parameters
    methodology: Test Methodology
    acceptance: Acceptance Criteria
  rows:
    - process: 'Surface Finish / Coating Repair'
      parameters: 'Surface prep to Sa2.5; coating thickness 60–80 µm; cure at 180°C ± 10°C'
      methodology: 'Visual inspection under daylight; film thickness gauge measurement at 3 points'
      acceptance: 'Zero bare patches, zero runs; thickness within 55–85 µm; no blisters or adhesion loss'
    - process: 'Jaw Hardness Re-Treatment'
      parameters: 'Austenitize 820–860°C; oil quench; temper 150–200°C for jaw inserts GCr15/Cr12MoV'
      methodology: 'Rockwell hardness test at 3 positions per insert; metallographic check for retained austenite'
      acceptance: '58–62 HRC at all test positions; no cracks or soft spots; grain structure per ASTM reference'
    - process: 'Thread Re-Cutting & Jaw Realignment'
      parameters: 'Thread pitch per spec; torque-controlled fastening; jaw parallelism ≤ 0.05 mm'
      methodology: 'Thread gauge inspection; dial indicator measurement across jaw faces under rated load'
      acceptance: 'Thread gauge fits cleanly; parallelism within 0.05 mm; no binding in swivel or handle'
    - process: 'Final Clamping Force & Swivel Verification'
      parameters: 'Rated clamping force per model; swivel torque within 8–15 N·m for medium-duty range'
      methodology: 'Calibrated force gauge at jaw face; torque wrench on swivel base across full rotation'
      acceptance: 'Clamping force ≥ rated spec; swivel torque within window; no lateral play under load'

