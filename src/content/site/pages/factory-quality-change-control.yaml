hero:
  tagline: Rework Parameter Change Control
  title: Rework Process Parameter Change Control & Validation Standard
  subtitle: 'At Stavalk, no operator, shift leader or single department may change an approved rework parameter on the spot. Any proposed change to approved rework materials, process conditions, tooling, test methods, inspection criteria or authorized personnel is managed through documented change control — Engineering Change Request, impact & risk assessment, cross-functional approval, validation plan, controlled implementation, re-inspection and effectiveness review, then closure and record retention. This page presents our controlled standard QMS-SOP-QC-CC-001 (Rev 2.0, ISO 9001:2015-based) and the engineering evidence behind it.'
  actions:
    - text: Download Change Control SOP (PDF)
      variant: primary
      href: 'https://assets.Stavalk.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf?dl=1'
