faqs:
  tagline: FAQ
  title: Frequently Asked Questions About Rework Change Control
  items:
    - q: 'Can the factory change rework parameters without telling us?'
      a: 'No. Any proposed change to approved rework materials, process conditions, tooling, test methods, inspection criteria or authorized personnel must pass documented change control first. Changes affecting customer-approved specifications, samples, BOMs, artwork or acceptance criteria require written customer approval.'
    - q: 'What counts as a high-risk change?'
      a: 'Changes to rework materials or suppliers, heat-treatment or coating conditions, jaw/thread/body rework methods, inspection or acceptance criteria, and defect scope expansion into structural zones are classified high-risk. They require a cross-department review, an approved validation plan and controlled pilot implementation before routine use.'
    - q: 'Can a temporary deviation be used indefinitely?'
      a: 'No. Every temporary deviation carries a defined validity window, batch scope, quantity cap and validation requirements, with automatic expiry. Reaching the cap locks the batch and blocks pass-tag printing until the change is formally assessed.'
    - q: 'How is a changed method proven to work before full use?'
      a: 'High-risk changes require a validation plan: at least 5 representative sample vises covering tolerance limits, tested by 2 independent QC inspectors against quantified acceptance criteria (clamping force, hardness, dimensional accuracy, surface finish). Approval to validate is not approval to apply.'
    - q: 'Do we need to approve every change?'
      a: 'Not every change, but any change that moves the product away from the customer-approved sample, technical specification, BOM, artwork, packaging or acceptance criteria is implemented only with written customer approval. Without it, vises are reworked per the original requirement, replaced or rejected.'
    - q: 'What happens to old documents when a change is approved?'
      a: 'Old work instructions, parameter cards and inspection sheets are physically collected and cancelled (1-in-1-out), marked OBSOLETE, and replaced by the new controlled revision after training. Old and new versions never share a workstation.'
    - q: 'How long are change control records kept?'
      a: 'Closure records — validation evidence, document revisions, training records and effectiveness reviews — are retained according to our record retention policy (minimum 3 years for closure records) so every change remains traceable for audits and traceability reviews.'

