hero:
  tagline: 'Transparent et spécifique au projet'
  title: 'Guide du MOQ de fabrication et de marque flexible'
  subtitle: 'Comprenez l''économie de lots de fonderie qui régit les séries de production d''étaux — et comment notre programme de co-marquage à faible barrière fonctionne pour les distributeurs, fournisseurs industriels et marques d''outillage en croissance. Conçu et opéré par Stavalk, Qingdao, Chine.'

answer:
  label: 'Réponse directe'
  text: 'Le MOQ n''est pas un chiffre unique. Chaque MOQ est confirmé par la configuration du projet : largeur et ouverture des mâchoires, série du corps (légère, moyenne, lourde, à tuyau ou spéciale), type de base rotative, finition de surface, exigences de marque et d''emballage. La production en volume standard s''exécute en lots de 50 à 200 unités par cycle de coulée ; les séries lourdes et spéciales tournent en 20 à 50 unités ; et chaque projet est divisé en trois étapes distinctes — développement d''échantillon (1 à 2 unités), commande pilote (20 à 50 unités) et production en volume (50 à 200+ unités). Nous confirmons le calcul exact pour votre mix de SKU avant devis — pas de promesses vagues de « MOQ bas », pas de compromis cachés.'
  verified: '2026-09'

moq_principle:
  tagline: La logique d'ingénierie
  title: 'Pourquoi le MOQ de volume standard est de 50 à 200 unités : économie de lots de fonderie'
  subtitle: 'Les tailles des séries de production ne sont pas des chiffres arbitraires fixés par une équipe commerciale — elles sont déterminées par les cavités de moules de fonderie, les tailles de lots de traitement thermique et la physique des changements de ligne.'
  body: |
    **La ligne de base des cavités de coulée.** Les corps d''étaux sont coulés en sable en fonte grise HT200 ou HT250. Un bacs de fonderie standard accueille un cycle de coulée qui produit de 4 à 8 corps d''étaux selon la largeur de mâchoire. Le lot minimum efficace de coulée est une charge complète de bacs.

    **Le calcul de rendement (50 à 200 unités).** Pour un étau moyen standard (largeur de mâchoire de 6″ à 8″), un cycle de coulée avec outillage à cavités multiples produit environ 50 à 200 étaux finis lorsque plusieurs cavités sont utilisées dans un seul versement. Les unités plus lourdes de 8″ à 10″ produisent moins par bac ; les plus légères de 2″ à 5″ produisent plus.

    **Optimisation des lots de traitement thermique.** Tous les corps d''étaux subissent un traitement thermique pour atteindre la dureté requise. Le chargement du four est le plus efficace dans des tailles de lot qui remplissent la chambre — les fours sous-chargés gaspillent de l''énergie, les charges surchargées risquent un traitement inégal.

    **Politique de coulée sans déchet.** Les charges complètes de bacs garantissent une température de fonte liquide constante, un remplissage uniforme du moule et une microstructure répétable dans chaque corps du lot — sans versements partiels qui créent des zones de dureté incohérentes.

