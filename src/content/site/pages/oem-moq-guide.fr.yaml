moq_faqs:
  tagline: FAQ
  title: 'Questions fréquentes sur le MOQ'
  items:
    - q: 'Le MOQ est-il calculé par commande, par modèle ou par variante ?'
      a: 'Le MOQ peut s''appliquer par modèle, variante, série du corps, configuration de marque ou commande totale. Parce que différentes largeurs de mâchoire (4″ vs 10″) et corps coulés proviennent de moules de coulée et de lots de traitement thermique distincts, commander 50 étaux répartis sur 5 séries crée 5 exigences de production séparées. Nous confirmons le calcul exact contre votre matrice de SKU avant devis pour que vous puissiez planifier clairement votre mix.'
    - q: 'Puis-je commander un échantillon avant la production en masse ?'
      a: 'Oui. Le développement d''échantillon (1 à 2 unités) vérifie la dureté de mâchoire, la force de serrage, le couple de rotation, la finition de surface et le montage avant la sortie de production de masse. Des frais d''échantillon s''appliquent et sont crédités sur votre commande de production à la signature du contrat.'
    - q: 'Pourquoi l''emballage retail personnalisé a-t-il un MOQ indépendant ?'
      a: 'Les presses d''impression de cartons flexographiques ou offset personnalisées exigent une configuration de production minimale de 500+ unités. Nous proposons une Solution de Stockage d''Emballage Hybride : nous produisons les 500 cartons imprimés personnalisés, stockons le surplus dans notre entrepôt propre, et les libérons sur vos expéditions programmées — pour qu''une commande d''étaux plus petite puisse encore partir en emballage retail entièrement marqué.'
    - q: 'Pourquoi le MOQ de volume standard est-il de 50 à 200 unités ?'
      a: 'Le MOQ de volume standard suit le processus de coulée : une charge complète de bacs dans notre fonderie produit de 50 à 200 corps d''étaux selon la largeur de mâchoire et le nombre de cavités. L''exécution de charges complètes de bacs garantit une température de fonte liquide constante, un remplissage uniforme du moule et une microstructure répétable — tout en amortissant l''énergie du four, la configuration de traitement thermique et l''étalonnage d''usinage CNC sur le lot.'
    - q: 'Une quantité plus élevée réduit-elle le coût unitaire ?'
      a: 'Dans la plupart des projets, oui. Des quantités plus élevées améliorent le rendement de coulée, répartissent les frais généraux fixes de configuration de fonderie et de traitement thermique sur plus d''unités et réduisent les coûts d''emballage par unité.'
    - q: 'Les frais de moule de co-marquage s''appliquent-ils à nouveau sur les ré-commandes ?'
      a: 'Non. Les frais d''outillage de marque de coulée sont facturés une fois à la configuration initiale et sont levés pour les ré-commandes utilisant les mêmes dimensions de graphisme. Vous ne payez que les 0,50 $ USD par étau de frais de gravure laser et de traitement.'
    - q: 'Demander des conseils sur le MOQ m''engage-t-il dans une commande ?'
      a: 'Non. Demander des conseils sur le MOQ de projet permet simplement à notre équipe d''ingénierie de Stavalk, Qingdao d''examiner votre brief technique et de conseiller la voie de production la plus rentable. Un accord de non-divulgation (NDA) est disponible avant que vous partagiez des spécifications techniques ou des graphismes propriétaires.'

