moq_stages:
  tagline: Échantillon · Pilote · Volume
  title: 'Trois étapes de quantité distinctes'
  subtitle: 'Les quantités de production d''échantillon, de pilote et de volume sont différentes. Chaque projet est catégorisé en trois niveaux distincts pour que vous validiez avant de vous engager.'
  steps:
    - step: '01'
      title: 'Développement d''échantillon (1 à 2 unités)'
      desc: 'Confirmation physique de la dureté de mâchoire (58 à 62 HRC), de la force de serrage, du couple de rotation, de la finition de surface et du montage des accessoires avant tout engagement financier. Des frais d''échantillon s''appliquent et sont crédités sur votre commande de production à la signature du contrat.'
    - step: '02'
      title: 'Commande pilote (20 à 50 unités)'
      desc: 'Tests commerciaux et validation des marchés régionaux en utilisant les plateformes de séries existantes, les matériaux standards et un emballage standard pour minimiser les frictions de configuration.'
    - step: '03'
      title: 'Production en volume (50 à 200+ unités)'
      desc: 'Confirmée après BOM figé, marque finalisée, emballage personnalisé et plans de livraison programmés — cycles complets de coulée, systèmes de peinture personnalisés, emballage sur mesure, remises de volume et traçabilité complète de lot.'

moq_factors:
  tagline: Ce qui détermine votre MOQ
  title: 'Pourquoi le MOQ entièrement personnalisé est toujours spécifique au projet'
  subtitle: 'Pour une fabrication 100 % sur mesure, le MOQ est calculé à partir de l''architecture produit complète — ces quatre composants sont évalués ensemble avant le devis.'
  headers:
    component: Composant du projet
    driver: Facteur de fabrication
    impact: Impact sur la quantité minimale
  rows:
    - component: 'Largeur de mâchoire et série du corps'
      driver: 'Moules de coulée existants pour séries standard vs cavités de moule conçues en CAO sur mesure'
      impact: 'Plateformes existantes : commandes pilotes dès 20 pièces. Corps coulés sur mesure : amortissement d''outillage dédié requis.'
    - component: 'Finition de surface et peinture'
      driver: 'Peinture standard martelée vs finition en poudre Pantone ou parkérisation personnalisée'
      impact: 'Les systèmes de peinture personnalisés exigent une configuration dédiée de ligne de revêtement avec des minimums de lot indépendants.'
    - component: 'Emballage de marque'
      driver: 'Cartons génériques avec étiquettes de code-barres vs boîtes retail pleine couleur de marque et fiches d''instructions'
      impact: 'Les boîtes couleur personnalisées portent un minimum de presse d''impression offset indépendant (généralement 500+ boîtes).'
    - component: 'Packs d''accessoires'
      driver: 'Mâchoires en acier forgé standard vs jeu de mâchoires durcies GCr15/Cr12MoV personnalisées avec accessoires de marque'
      impact: 'Les jeux d''accessoires entièrement marqués suivent les lots de production des fournisseurs de sous-niveau.'

