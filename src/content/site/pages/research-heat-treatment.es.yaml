label: Research
headline: '<strong>Tratamiento térmico</strong> — Mandíbulas endurecidas para un rendimiento de sujeción duradero'
subtitle: 'El temple en aceite y revenido llevan los insertos de mandíbula GCr15 a 58–62 HRC, resistiendo la indentación de la pieza bajo sujeción de alta fuerza repetida.'
seo:
  title: 'Tratamiento térmico de dureza de mandíbula — 58–62 HRC'
  description: 'Stavalk temple y revenido de insertos de mandíbula GCr15 a 58–62 HRC, verificado por prueba Rockwell, para agarre duradero de piezas.'
body: >-
  Los insertos de mandíbula son los únicos componentes del tornillo que reciben tratamiento térmico completo en Stavalk, porque solo las caras de sujeción deben resistir la indentación de piezas endurecidas. Los insertos de acero al carbono GCr15 o acero de herramienta Cr12MoV se calientan, templan en aceite y revenen para alcanzar una dureza Rockwell C de 58–62 HRC. La profundidad de la capa se controla para asegurar resistencia al desgaste sin fragilidad en el borde de la mandíbula. Cada lote se verifica con prueba de lima y durómetro Rockwell, con resultados registrados por lote de producción para trazabilidad. El cuerpo del tornillo, fundido en hierro gris HT200/HT250, no recibe tratamiento térmico; su función es rigidez y amortiguación de vibraciones, no dureza superficial.
faqs:
  - q: '¿Qué dureza objetivo alcanza Stavalk en los insertos de mandíbula?'
    a: 'Los insertos de mandíbula GCr15 y Cr12MoV se endurecen a 58–62 HRC, evaluados por la escala Rockwell C. Este rango proporciona la dureza necesaria para resistir la indentación de la pieza sin sacrificar la tenacidad para evitar astillas bajo impacto.'
  - q: '¿Por qué solo se endurecen los insertos de mandíbula y no todo el tornillo?'
    a: 'El cuerpo del tornillo está hecho de hierro gris HT200/HT250, elegido por su rigidez y amortiguación de vibraciones, propiedades que se verían comprometidas por el endurecimiento. Solo las caras de sujeción de los insertos necesitan dureza superficial para sujetar piezas endurecidas, por lo que el tratamiento térmico se concentra donde importa.'
  - q: '¿Existe trazabilidad por lote para los componentes tratados térmicamente?'
    a: 'Sí. Cada lote de producción lleva un número de lote de tratamiento térmico que vincula el registro del horno, el medio de temple, el ciclo de revenido y los resultados de dureza. Esta trazabilidad forma parte del sistema de calidad ISO 9001 de Stavalk y está disponible para los compradores bajo solicitud.'
