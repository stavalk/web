      description: 'Essais par unité de force de serrage, dureté de mâchoire, couple de rotation, plus de 10 000 cycles de durabilité et plus de 48 heures de brouillard salin, avec documentation CE, ISO 9001:2015, ISO 14001 et RoHS pour l''export.'
