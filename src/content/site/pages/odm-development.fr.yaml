      icon: 'tabler:settings'
    - title: Graphismes et marque
      description: 'Finition de surface, couleur de peinture, placement du logo et emballage retail développés par notre équipe de design interne autour de votre marque.'
      icon: 'tabler:palette'
    - title: Développement de gabarit et d''outillage
      description: 'Nouveaux corps moulés commencent par un outillage de gabarit conçu et découpé en interne - l''outillage ajoute 15-20 jours au calendrier du projet.'
      icon: 'tabler:shapes'
    - title: Validation du prototype
      description: 'Un prototype physique est construit, testé et envoyé pour votre examen - généralement sous 7-12 jours, avec vérification dimensionnelle et de dureté.'
      icon: 'tabler:tools'
