hero:
  tagline: Développement ODM
  title: 'Développement ODM d''étau à main - de votre idée à un étau prêt pour le marché'
  subtitle: 'Pas encore de dessins ? Nos ingénieurs internes conçoivent le corps, les mâchoires, la finition et l''emballage autour de votre brief - puis le construisent, le testent et le produisent en masse. Prototypes en 7-12 jours, production en 25-35 jours après bon de commande confirmé.'

answer:
  label: 'Réponse directe'
  text: 'Le développement ODM part de votre brief, pas de vos dessins : la conception du corps (matériau, ouverture de mâchoire, profondeur de gorge, plage de rotation), la spécification de matériau et de dureté des mâchoires, la finition de surface et les graphismes sont conçus en interne, validés par des prototypes en 7-12 jours, et produits au MOQ de volume standard de 50-200 unités par lot pour des étaux de gamme moyenne (pilote dès 20-50 unités). La production s''exécute en 25-35 jours après bon de commande confirmé et acompte ; l''outillage de gabarit personnalisé ajoute 15-20 jours. La documentation CE, ISO 9001:2015, ISO 14001 et RoHS part avec chaque commande.'
  verified: '2026-08'

