    - title: Du prototype à la commande expédiée
      description: 'Un design ODM validé passe directement en production de volume standard : 50-200+ unités par lot, 25-35 jours après bon de commande confirmé.'
      icon: 'tabler:package'

customization:
  tagline: Conçu avec vous
  title: Ce que nous développons autour de votre brief
  subtitle: 'ODM signifie que le produit est conçu pour vous à partir de zéro ou de notre bibliothèque de plateformes - voici les leviers que votre brief contrôle :'
  items:
    - 'Profil d''application - atelier léger, industriel de gamme moyenne, fabrication lourde ou travail de tuyauterie spécialisé'
    - 'Matériau du corps - fonte grise HT200, fonte lourde HT250 ou acier forgé 45#'
    - 'Spécification de mâchoire - acier trempé GCr15 (58-62 HRC) ou acier à outils Cr12MoV pour les applications lourdes'
    - 'Ouverture de mâchoire et profondeur de gorge - dimensions adaptées à l''application et à la taille de la pièce cible'
    - 'Base tournante - rotation à 360° avec mécanisme de blocage, ou configuration de base fixe'
    - 'Finition de surface - peinture, revêtement en poudre ou parkerising aux couleurs de votre marque'
    - 'Accessoires et fonctionnalités - surface d''enclume, mâchoires à tuyaux, mécanisme de libération rapide, plaques trempées'
    - 'Emballage et présentation retail - boîtes retail, présentoirs et conditionnement d''export sous votre marque'

faq_section:
  tagline: FAQ
  title: Questions sur le développement ODM
  questions:
    - q: En quoi l''ODM diffère-t-il de l''OEM ?
      a: 'ODM (Fabrication de design original) part de votre brief - nos ingénieurs développent la structure du corps, la spécification de mâchoire, la finition et l''emballage, que ce soit à partir d''un concept de marché, d''un objectif de performance ou d''une adaptation d''une plateforme éprouvée. Vous approuvez le design avant la production. OEM (Fabrication d''équipement d''origine) fabrique selon votre spécification approuvée - vos dessins, dimensions, matériaux et emballage. Vous possédez le design et la propriété intellectuelle. Les deux passent par la même usine, le même système de QC et la même équipe d''export ; ODM est la voie la plus rapide vers un étau marqué quand vous n''avez pas encore de design.'
    - q: Je n''ai qu''une idée grossière - par où commençons-nous ?
      a: 'Envoyez un court brief : applications cibles, cas d''usage, gamme de tailles, marchés et volumes. Nos ingénieurs reviennent avec un concept, une direction d''étau de référence et un plan de développement sous un jour ouvré - une NDA est signée avant tout échange détaillé sur demande.'
    - q: Combien de temps faut-il pour développer un nouvel étau à main ?
      a: 'Les échantillons de prototype partent en 7-12 jours. Un nouveau corps avec outillage de gabarit personnalisé ajoute 15-20 jours d''ingénierie avant les échantillons. La production s''exécute en 25-35 jours après le bon de commande et l''acompte.'
    - q: Quel est le MOQ pour un étau ODM ?
      a: 'La production en volume standard s''exécute à 50-200 unités par lot pour des étaux de gamme moyenne ; les séries pilotes démarrent à 20-50 unités sur les plateformes existantes. Les étaux lourds et spéciaux s''exécutent à 20-50 unités minimum. Voir notre Guide MOQ & Marque Flexible pour le calcul complet.'
    - q: Qui possède le design et le gabarit ?
      a: 'Votre brief, votre design et votre outillage sont protégés par NDA, conditions de licence de marque et clauses de propriété ou de rachat du gabarit écrites dans le contrat. L''outillage est conservé pour votre marque et transférable.'
    - q: Pouvez-vous développer un type d''étau spécifique (lourd, à tuyaux, spécialisé) ?
      a: 'Oui. Notre ingénierie couvre toutes les catégories principales d''étaux - légère (4"-5"), moyenne (6"-8"), lourde (8"-10"), à tuyaux et configurations spéciales - avec validation de la force de serrage et de la durabilité pour chacune.'
    - q: Quelles certifications l''étau développé portera-t-il ?
      a: 'CE (EN ISO 12100, Directive Machines 2006/42/CE), ISO 9001:2015, ISO 14001 et RoHS. Les documents de certification sont préparés par commande pour vos marchés d''export.'

process:
  title: 'Le processus ODM - du brief à la production à l''échelle'
  subtitle: 'Six étapes contrôlées gérées par la même équipe interne qui conçoit, échantillonne et met à l''échelle votre étau - tout reste documenté.'
  steps:
    - phase: '01'
      title: Brief et concept
      period: 1 jour ouvré
      items:
        - 'Partagez les applications cibles, cas d''usage, tailles, marchés et volumes - ou juste une idée.'
        - 'Nos ingénieurs reviennent avec une direction de concept, des options de plateforme et un plan de développement.'
    - phase: '02'
      title: Conception de corps et de matériaux
      period: Semaine 1-2
      items:
        - 'Dimensions du corps, qualités de matériaux, spécification de mâchoire et plage de rotation conçus en interne.'
        - 'Finition de surface, concept de marque et emballage développés autour de votre marque.'
    - phase: '03'
      title: Gabarit et outillage
      period: +15-20 jours (nouveaux corps)
      items:
        - 'Un outillage de gabarit personnalisé conçu et découpé pour les nouveaux corps moulés ; les plateformes existantes sautent cette étape.'
        - 'Les conditions de propriété de l''outillage sont fixées dans le contrat avant le début de la découpe.'
    - phase: '04'
      title: Prototype et échantillon
      period: 7-12 jours
      items:
        - 'Un prototype physique est construit, testé et envoyé pour votre examen - contrôles dimensionnels et de dureté inclus.'
        - 'Un échantillon (1-2 unités) valide le corps, la spécification de mâchoire et la marque avant le volume.'
    - phase: '05'
      title: Validation et approbation
      period: En parallèle
      items:
        - 'Essais de force de serrage, dureté de mâchoire, couple de rotation, durabilité et brouillard salin par ligne de production.'
        - 'Documentation CE, ISO 9001:2015, ISO 14001 et RoHS préparée pour vos marchés d''export.'
        - 'Vous approuvez le prototype ; le bon de commande et l''acompte verrouillent le créneau de production.'
    - phase: '06'
      title: Production et livraison
      period: 25-35 jours
      items:
        - 'Les lots en volume standard s''exécutent à 50-200+ unités par lot ; les séries pilotes en 20-50 unités.'
        - 'Conditionnement d''export, expédition FOB/CIF/DDP vers 50+ pays et support de ré-commande inclus.'

