material_notes:
  tagline: Notes sur les Matériaux
  title: "Comment Chaque Nuance Est Choisie"
  body: |
    **La fonte grise — le standard.** Les corps HT200 et HT250 sont moulés au sable dans notre propre fonderie, puis normalisés et détensionnés. Ils donnent à l'étau un corps rigide et amortissant qui tient la pièce sans « sonner », à un prix qui garde les séries standard abordables. C'est le matériau de corps le plus courant pour les étaux légers et moyens.

    **La fonte ductile — pour l'exposition aux chocs.** La fonte ductile a des nodules de graphite au lieu de lamelles, qui arrêtent la propagation des fissures. Quand un étau est utilisé dans des ateliers actifs, tombe ou subit des charges hors axe, la fonte ductile résiste mieux à l'écaillage des bords et des concentrateurs de contraintes que la fonte grise. Nous la spécifions pour les séries de commerce et d'industrie légère soumises à un usage quotidien plus dur.

    **L'acier forgé 45# — pour le service lourd.** Forger l'acier 45# produit une structure plus dense et alignée sur le grain que le moulage. Combiné au traitement thermique, il donne la résistance à la traction pour soutenir des forces de serrage de plusieurs milliers de livres sans que le corps ne fléchisse — la raison pour laquelle notre série lourde à enclumes fixes est construite en acier forgé, avec des mâchoires trempées jusqu'à 62 HRC et un ensemble vis remplaçable.

why_materials:
  tagline: Pourquoi C'est Important
  title: "Pourquoi le Matériau du Corps Détermine la Sensation d'un Étau"
  body: |
    La largeur de mâchoire est le chiffre imprimé sur l'étau ; le matériau du corps est ce que l'utilisateur ressent réellement. Un corps en fonte résiste à la flexion quand vous serrez une grande pièce à pleine course de poignée ; un corps en acier forgé permet à une série lourde de développer une force qui tordrait une fonte plus légère. Le matériau détermine aussi le mode de défaillance : la fonte grise cassante cède par fissuration sous les chocs vifs, la fonte ductile et l'acier forgé se déforment avant de rompre — l'acheteur voit un problème avant une défaillance catastrophique.

    Le choix du matériau interagit aussi avec l'usinage. La fonte grise s'usine proprement à des tolérances serrées avec des surfaces autolubrifiantes, c'est pourquoi les rainures et glissières de coulisse sont usinées à 0,05 mm de précision de position. L'acier forgé exige des machines plus lourdes mais récompense avec une coulisse qui s'use plus lentement.

    Si vous comparez des étaux de même taille nominale de différentes usines, demandez quelle nuance de matériau est réellement le corps — des largeurs de mâchoires identiques ne sont pas des produits identiques.

faqs:
  tagline: FAQ
  title: "Questions Fréquentes sur les Matériaux d'Étau"
  items:
    - q: "La fonte ou la fonte ductile est-elle meilleure pour un étau ?"
      a: "Pour un usage standard, la fonte grise est le choix éprouvé et le plus économique — rigide, amortissant et stable. Si l'étau affrontera des conditions d'atelier dures, des chutes ou des forces hors axe, la fonte ductile résiste mieux aux dommages par impact. Les deux sont utilisées dans la gamme Stavalk selon la classe de service."
    - q: "Quels étaux Stavalk utilisent de l'acier forgé ?"
      a: "La série lourde à enclumes fixes est forgée en acier 45# pour une résistance à la traction, une résistance aux chocs et une capacité de serrage maximales (jusqu'à 8 000 lbf sur les plus grandes unités), avec des mâchoires trempées jusqu'à 62 HRC."
    - q: "Comment la nuance du matériau est-elle vérifiée ?"
      a: "Les certificats de matériaux accompagnent chaque lot de fonderie, couvrant la composition chimique et les propriétés mécaniques. Copies de certificats, relevés de dureté et traçabilité des lots disponibles sous NDA."
    - q: "Un étau personnalisé peut-il utiliser un autre matériau ?"
      a: "Oui. Des corps moulés personnalisés, des mises à niveau en fonte ductile et des corps en acier forgé sont développés via le processus OEM/ODM. Le choix du matériau est figé à la revue d'ingénierie avant le début de l'outillage."

