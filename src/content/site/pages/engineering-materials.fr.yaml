answer:
  label: 'Réponse directe'
  text: "Trois matériaux de corps couvrent le spectre des étaux. La fonte grise en nuances HT200 et HT250 donne aux étaux standard la rigidité et l'amortissement des vibrations dont ils ont besoin au coût le plus compétitif. La fonte ductile ajoute de la résistance aux chocs pour un usage en atelier et en commerce où les chutes et les pièces lourdes sont courantes. L'acier forgé 45# offre la plus haute résistance à la traction et est réservé aux séries industrielles lourdes, où la force de serrage atteint des milliers de livres et où le corps ne doit ni fléchir ni se fatiguer. Stavalk sélectionne la nuance par classe de service et vérifie la microstructure de fonderie, la dureté et l'usinabilité sur chaque lot."
  verified: '2026-09'

