hero:
  tagline: Quality Control Laboratory
  title: Testing Laboratory & Quality Assurance
  subtitle: Independent quality lab with ISO 9001:2015 processes —every unit tested before shipment

intro: Stavalk operates a dedicated quality control laboratory that operates independently from production. Every batch of raw material and every finished bench vise passes through documented inspection protocols before release. Our QC team reports directly to management, ensuring impartial quality decisions.

highlights:
  - value: 100%
    label: Units hardness-tested
    detail: Every jaw, every batch
  - value: 58–62
    label: Jaw hardness (HRC)
    detail: After induction hardening
  - value: 10,000+
    label: Open/close cycle durability
    detail: Per model per batch
  - value: 48h+
    label: Salt-spray corrosion
    detail: On plated surfaces

test_procedures:
  - title: Raw Material Inspection
    description: Every incoming batch of HT200/HT250 gray cast iron, 45# forged carbon steel, GCr15 / Cr12MoV jaw steel, and hardware is tested before acceptance. Spectro chemical analysis, Rockwell hardness, and dimensional checks are verified. Non-conforming materials are quarantined and returned.
    standards:
      - ISO 6508-1 (Rockwell)
      - Spectro chemical analysis
      - GB/T 9439 (gray cast iron)
  - title: In-Process QC Checkpoints
    description: Production operators perform self-inspection at each stage. QC auditors conduct random sampling throughout the shift. Jaw hardness is spot-checked on every hardening batch and dimensional checks happen every 20th unit.
    standards:
      - ISO 6508-1 (hardness)
      - Internal 100-point checklist
      - ISO 2859 sampling
  - title: Functional & Durability Testing
    description: Assembled vises are tested for clamping force and swivel torque, with samples run through 10,000+ open/close cycles. Any failure triggers automatic batch re-inspection and corrective action.
    standards:
      - Internal clamping-force spec
      - 10,000+ cycle durability
      - ISO 2859 sampling
  - title: Corrosion & Finish Verification
    description: Zinc-plated and powder-coated surfaces undergo 48h+ neutral salt-spray testing per ISO 9227, with coating adhesion verified by cross-cut testing before final release.
    standards:
      - ISO 9227 (salt spray)
      - ISO 2409 (cross-cut adhesion)

equipment:
  - name: Rockwell Hardness Tester
    spec: HRC scale, jaw batch verification
  - name: Optical Emission Spectrometer
    spec: C, Si, Mn, P, S on HT200/HT250 heats
  - name: Clamping Force Test Rig
    spec: kN/load cell, calibrated
  - name: Coating Thickness Gauge (digital)
    spec: 0.1 μm resolution
  - name: Open/Close Cycle Durability Tester
    spec: Programmable, 10,000+ cycles
  - name: Swivel Torque Tester
    spec: Calibrated torque wrench
  - name: Salt-Spray Chamber
    spec: ISO 9227, 48h+ exposure

