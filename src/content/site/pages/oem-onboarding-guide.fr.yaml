checklist:
  heading: 'Que préparer avant votre brief de projet'
  body: |
    Plus votre brief est complet, plus le devis est rapide et précis. Voici ce qu''il faut avoir prêt :

    - **Spécifications de l''étau** — Largeur de mâchoire cible, profondeur d''ouverture, série du corps (légère, moyenne, lourde, à tuyau ou spéciale), exigence de force de serrage et usage prévu (atelier, industriel, chantier, etc.). Si vous avez des dimensions d''étau de référence ou un modèle concurrent, incluez-les.
    - **Fichiers de design** — Graphismes vectoriels (AI, SVG ou PDF) pour les marques de marque, la couleur de corps et tout marquage secondaire. Si les graphismes ne sont pas prêts, un moodboard ou des images de référence suffisent pour la faisabilité initiale.
    - **Volume et calendrier de commande** — Votre quantité cible pour la première commande et le calendrier de saison à respecter. Même une fourchette approximative (« 50 à 100 étaux d''ici mars ») suffit pour confirmer la faisabilité et la disponibilité des créneaux.
    - **Exigences de conformité** — Marchés cibles (UE, Amérique du Nord, Australie, etc.) et toute exigence de certification ou de test spécifique au-delà de notre périmètre standard (CE, ISO 9001, ISO 14001, RoHS).
    - **Fourchette budgétaire** — Un budget indicatif par unité ou un coût débarqué cible aide à recommander la bonne série et le bon niveau de construction. Le prix exact est confirmé après la revue d''ingénierie — jamais avant.

    Si vous n''avez pas encore tout cela, soumettez ce que vous avez. Nous vous guiderons pour le reste.

evidence_review:
  tagline: 'Preuves et vérification'
  title: 'SPÉCIFICATIONS VÉRIFIÉES'
  body: 'Toutes les allégations de fabrication de cette page sont vérifiées par notre équipe d''ingénierie de fabrication à l''usine de Jimo, Qingdao. Les certificats, enregistrements d''inspection QC, rapports de dureté et de tests structuraux, et journaux de traçabilité des lots sont disponibles sur demande. Spécifications dernièrement vérifiées 2026-09.'

faqs:
  tagline: FAQ
  title: 'Intégration OEM — questions fréquentes'
  items:
    - q: 'Combien de temps prend le processus d''intégration complet ?'
      a: 'L''approbation de l''échantillon prend généralement 2 à 4 semaines (y compris la production d''échantillon en 7 à 14 jours et votre période d''examen). La première série de production prend 6 à 8 semaines à partir du bon de commande confirmé et de l''acompte. Un corps coulé sur mesure ajoute 15 à 20 jours de développement de moule. Chaque porte a un calendrier fixe convenu à l''avance.'
    - q: 'Dois-je signer une NDA avant de partager mon design ?'
      a: 'Une NDA est disponible immédiatement sur demande — avant que vous partagiez toute spécification technique ou graphisme propriétaire. Nous fabriquons exclusivement sous les marques de nos clients et ne concurrençons jamais sur aucun marché. La même politique s''applique à un échantillon d''1 étau qu''à un programme de volume complet.'
    - q: 'Quelle est la commande minimale pour une première série OEM ?'
      a: 'Le point d''entrée est étagé : 1 à 2 échantillons d''abord (prêts en 7 à 14 jours), une commande d''essai ou pilote de 20 à 50 étaux (production en 25 à 35 jours), puis des séries de volume standard de 50 à 200+ étaux par configuration approuvée. Le co-marquage en petits lots commence dès 20 unités quand aucune étape de développement n''est nécessaire. Les frais d''échantillon sont crédités sur votre commande de production.'
    - q: 'Comment la protection de la PI est-elle gérée pendant l''intégration ?'
      a: 'Vos designs et spécifications sont protégés sous la NDA signée avant que toute information propriétaire soit partagée. Tous les graphismes, données BOM et fichiers techniques sont stockés dans des systèmes à accès contrôlé avec pistes d''audit. En mode OEM, vous possédez toute la PI. En mode ODM, la PI de la série adaptée est partagée selon l''accord. En mode Marque privée, la PI reste avec Stavalk et vous licencez l''application de la marque.'
    - q: 'Quelles garanties de qualité s''appliquent à une première commande ?'
      a: 'Chaque étau — échantillon, essai ou volume — passe par le même système d''inspection à 7 étapes : inspection des matériaux entrant, coulée en sable, usinage CNC, traitement thermique, revêtement de surface, assemblage et inspection finale avec tests de force de serrage, dureté de mâchoire (58 à 62 HRC), couple de rotation, durabilité de 10 000+ cycles et résistance à la corrosion par sel de 48+ heures. La qualité n''est jamais réduite pour les commandes plus petites.'

