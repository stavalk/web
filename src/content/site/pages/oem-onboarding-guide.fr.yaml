answer:
  label: 'Réponse directe'
  text: 'Une intégration OEM typique prend 2 à 4 semaines pour l''approbation de l''échantillon et 6 à 8 semaines pour la première série de production à partir du bon de commande confirmé. Vous commencez par soumettre un brief de projet (spéc. d''étau, volume, besoins de conformité). Nous répondons sous un jour ouvré, proposons une NDA avant que vous partagiez des détails propriétaires, et produisons 1 à 2 échantillons physiques en 7 à 14 jours pour votre examen et votre approbation. Une fois l''échantillon figé, la planification de production et la fabrication suivent avec des portes de QC fixes à chaque étape. Chaque étape est documentée et traçable.'
  verified: '2026-09'

process_steps:
  tagline: Les sept portes
  title: 'Déroulement de l''intégration — sept portes du brief à la livraison'
  subtitle: 'Chaque porte a une entrée définie, une sortie définie et un calendrier que vous convenez à l''avance. Vous ne dépassez jamais une porte sans approbation explicite.'
  steps:
    - step: 'Porte 1'
      title: 'Demande initiale et NDA (Jour 0)'
      desc: 'Soumettez un brief de projet via /contact avec vos spéc. d''étau cibles, le volume de commande, les exigences de conformité et le calendrier. Une NDA est disponible immédiatement — avant que vous partagiez toute spécification technique ou graphisme propriétaire. Réponse sous un jour ouvré.'
    - step: 'Porte 2'
      title: 'Revue de faisabilité et devis (Jours 1 à 5)'
      desc: 'L''ingénierie examine votre brief contre la capacité de fabrication, la disponibilité des matériaux et le périmètre de conformité. Vous recevez un devis détaillé avec le calcul du MOQ, les frais d''échantillon (crédités sur la production) et les segments de délai — pas une fourchette approximative, mais un calendrier porte par porte.'
    - step: 'Porte 3'
      title: 'Production d''échantillon (Jours 6 à 17)'
      desc: '1 à 2 étaux physiques produits selon votre spécification : dureté de mâchoire, force de serrage, couple de rotation, finition de surface, marque. Vous testez l''étau avant de vous engager dans autre chose. Les frais d''échantillon sont crédités sur votre commande de production à la signature du contrat.'
    - step: 'Porte 4'
      title: 'Examen et approbation de l''échantillon (Jours 18 à 21)'
      desc: 'Vous évaluez l''échantillon contre vos spécifications — prise de mâchoire, force de serrage, action de rotation, qualité de finition, précision de la marque. Les ajustements sont capturés dans une BOM révisée et une signature de la marque. La spécification figée devient la référence de production pour toutes les séries ultérieures.'
    - step: 'Porte 5'
      title: 'Planification de pré-production (Jours 22 à 28)'
      desc: 'Approvisionnement des matériaux, configuration du moule de coulée, confirmation de l''emballage et réservation du créneau de production. Tous les matériaux sont contrôlés à l''arrivée contre la BOM figée. Un planning de production avec les dates de portes QC est émis avant le début de la fabrication.'
    - step: 'Porte 6'
      title: 'Production et portes QC (Jours 29 à 55)'
      desc: 'La fabrication passe par le système d''inspection à 7 étapes : inspection des matériaux entrant, coulée en sable, usinage CNC, traitement thermique, revêtement de surface (peinture/poudre/parkérisation), assemblage et inspection finale. Chaque porte a des critères de réussite/échec et des enregistrements de traçabilité.'
    - step: 'Porte 7'
      title: 'Expédition et examen post-livraison (Jours 56 à 63)'
      desc: 'Conditionnement adapté à l''export, documentation de conformité (CE, ISO 9001, ISO 14001, RoHS) et coordination du fret vers 50+ pays. Un examen post-livraison capture les enseignements et les améliorations pour le prochain cycle de commande.'

