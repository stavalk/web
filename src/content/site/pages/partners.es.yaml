content_programs:
  title: Programas de asociación
  subtitle: Trabaja con nosotros al nivel que se adapte a tu negocio — cada programa escala compromiso, precios y soporte de desarrollo.
  body: |
    ### Fabricación OEM
    Produce tu tornillo de banco bajo tu propia marca. Gestionamos fundición, mecanizado, tratamiento térmico, recubrimiento, ensayos e inspección de calidad según tu especificación en Qingdao, China. MOQ desde 50 unidades (20 para modelos pesados y especiales).

    ### Marca privada
    Series estándar Stavalk con tu marca y empaque. La vía más rápida al mercado con soporte completo de certificación y respaldo de garantía.

    ### Codesarrollo
    Codesarrolla una nueva serie — ancho de mandíbula personalizado, materiales, acabado, marca y conjuntos de accesorios — con nuestro equipo de ingeniería desde el dibujo hasta la producción.

    ### Distribución y reventa
    Suministro fiable en volumen para importadores y distribuidores en Europa, América, Asia-Pacífico y Oriente Medio, con plazos consistentes.
content_benefits:
  title: Por qué los socios eligen Stavalk
  subtitle: Cuatro razones por las que los equipos siguen reordenando.
  body: |
    - **Fabricación certificada** — CE (EN ISO 12100, MD 2006/42/CE), ISO 9001:2015, ISO 14001 y RoHS en toda la fábrica.
    - **Libertad de diseño** — OEM y series personalizadas con nuestro soporte de ingeniería desde el dibujo hasta la producción.
    - **Muestreo rápido** — muestras en 7–14 días, pedidos en volumen en 25–35 días, FOB Qingdao.
    - **Calidad auditable** — inspección de 7 etapas, ensayos de laboratorio, trazabilidad de lote e informes de terceros SGS/TÜV/BV/Intertek.
content_process:
  title: Cómo funciona
  subtitle: Un camino claro con etapas desde el primer contacto hasta los pedidos repetidos.
  body: |
    1. **Comparte tu especificación** — envía tu plano, referencia de muestra o precio y cantidad objetivo.
    2. **Recibe una propuesta** — revisión de ingeniería, costos y plan de muestras en pocos días laborables.
    3. **Aprueba una muestra** — muestra física o con foto verificada contra tu dibujo y requisitos.
    4. **Haz un pedido en volumen** — producción con inspección de 7 etapas durante el proceso y trazabilidad de lote.
    5. **Envía y recibe soporte** — envío FOB Qingdao, registro de documentos, garantía y servicio de reorden.
