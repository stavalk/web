workshops:
  - title: Atelier de fonderie
    description: 'Ligne automatique de fonderie au sable produisant des corps, coulisseaux et bases en fonte grise HT200/HT250. La fusion, la coulée, le décochage et le grenaillage fonctionnent en parallèle avec un échantillonnage QC par coulée. Capacité annuelle de fonderie : plus de 80 000 unités.'
    output: '80 000+ pièces coulées/an'
  - title: Atelier d'usinage CNC
    description: 'Centres d''usinage et tours CNC pour les corps, coulisseaux, vis et logements de mâchoires, avec filetage de l''acier forgé 45#. L''usinage fonctionne en parallèle avec le traitement thermique pour un flux continu.'
    output: 'Capacité d''usinage élargie'
  - title: Ligne de traitement thermique et finition
    description: 'Trempe par induction des mâchoires GCr15 / Cr12MoV à 58–62 HRC, plus lignes de revêtement par poudre électrostatique et de zingage. Tous les postes de finition sont reconfigurés selon le mix de commandes. Capacité annuelle : plus de 80 000 unités.'
    output: '80 000+ unités/an'
  - title: Assemblage, mâchoires pour tuyaux et conditionnement
    description: 'Zone d''assemblage dédiée aux bases pivotantes, jeux de mâchoires pour tuyaux (chaîne et trépied), montage vis/guide et réglage final, plus des postes de conditionnement export. Capacité annuelle d''assemblage : plus de 80 000 unités.'
    output: '80 000+ étaux/an'

oem_capacity:
  moq: 'Modèles standard 50–200 | intensifs/spéciaux 20–50 pcs par modèle'
  lead_time: 'Standard 25–35 jours. Échantillon 7–14 jours. Urgence disponible.'
  payment: 'T/T 30 % d''acompte + 70 % de solde. L/C, Western Union acceptés.'

lead_time_explainer:
  tagline: 'Planification et programmation'
  title: 'Comment la capacité se traduit dans votre livraison'
  subtitle: 'La capacité n''est pas un chiffre unique — voici comment les délais sont réellement alloués.'
  items:
    - title: 'La capacité varie avec votre spécification'
      body: 'Les créneaux disponibles changent avec le modèle d''étau, la largeur de mâchoire, la complexité du revêtement et de la finition, l''emballage et la demande saisonnière. Pendant la montée en charge printemps/été, les lignes tournent à plein et les créneaux d''échantillons se réservent en premier.'
    - title: 'Planifiez avant votre saison de lancement'
      body: 'Verrouillez tôt votre confirmation d''échantillon et votre gel du revêtement/finition. Les commandes renouvelées sont programmées dans votre créneau récurrent convenu une fois l''échantillon doré archivé.'
    - title: 'Trois voies de programmation'
      body: 'Les échantillons entrent d''abord dans la ligne prototype, les commandes initiales s''insèrent dans la fenêtre d''assemblage ouverte la plus proche, et les commandes renouvelées tournent dans leur créneau récurrent.'
    - title: 'Délais fermes après revue'
      body: 'Nous confirmons un délai ferme uniquement après revue de la spécification, du patron de fonderie, du revêtement, de l''emballage et de la quantité — jamais comme une promesse fixe à l''avance.'

cta:
  title: 'Vérifiez la disponibilité de production pour votre date de lancement'
  subtitle: 'Envoyez votre modèle d''étau, votre quantité et votre date d''expédition cible — nous répondons avec la prochaine fenêtre de production ouverte et une estimation de délai ferme.'
  actions:
    - variant: primary
      text: Vérifier la disponibilité
      href: /fr/contact#production-availability
    - text: Voir la vue d'ensemble complète de l'usine
      href: /fr/factory
    - text: Comment les étaux sont construits
      href: /fr/factory/process
