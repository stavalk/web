meta:
  title: 'Capacité de production — usine de 8 000 m² | {SITE}'
  description: 'Capacité de l''usine Stavalk : installation de 8 000 m² produisant plus de 80 000 étaux d''établi par an avec de la marge pour évoluer. Fabrication OEM/ODM d''étaux d''établi à grande échelle.'
  dateModified: '2026-09-01'
  keywords:
    - 'capacité de production étaux'
    - 'usine d''étaux'
    - 'fabrication d''étaux'
    - 'usine d''étaux chine'
hero:
  tagline: Capacité de production
  title: Capacité de fabrication et production annuelle
  subtitle: 'Installation de 8 000 m² produisant plus de 80 000 étaux d''établi par an avec de la marge pour évoluer'

intro: Stavalk exploite une usine autonome de 8 000 m² à Qingdao, en Chine. Fonderie au sable, usinage CNC, trempe par induction, finition de surface, assemblage des bases pivotantes et emballage d'export sont gérés en interne, avec une capacité de plus de 80 000 étaux d'établi par an.

highlights:
  - value: 8 000 m²
    label: Surface totale de fabrication
    detail: Sur 4 ateliers spécialisés
  - value: 80 000+
    label: Étaux produits chaque année
    detail: Séries légère, moyenne, intensive, tuyaux et spéciale
  - value: 200+
