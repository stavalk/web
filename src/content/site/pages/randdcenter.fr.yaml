meta:
  title: 'Centre de R&D — Ingénierie et laboratoire de matériaux des serre-joints | {SITE}'
  description: 'R&D Stavalk : science des matériaux, ingénierie de coulée et traitement thermique, et développement de serre-joints personnalisés. Les ressources d''ingénierie derrière chaque série de serre-joints.'
  dateModified: '2026-09-01'
  keywords:
    - 'R&D serre-joints'
    - 'ingénierie serre-joints'
    - 'développement serre-joints'
    - 'centre de R&D Stavalk'
hero:
  tagline: Centre de R&D
  title: Ingénierie, matériaux et conception au même endroit
  subtitle: Le centre de R&D de Stavalk développe des serre-joints grâce à l''ingénierie de coulée, la métallurgie du traitement thermique et la conception mécanique — transformant l''esquisse d''un acheteur en une série certifiée et productive.
  actions:
    - variant: primary
      text: Démarrer un projet de développement
      href: /fr/contact
intro:
  title: Introduction
  body: |
    Le centre de R&D de Stavalk se trouve dans notre usine à Qingdao, en Chine, de sorte que les équipes de conception, de prototypage et de production travaillent sur le même étage. Les ingénieurs couvrent la conception de coulée, la programmation CNC, le traitement thermique et la finition de surface, ainsi que le laboratoire de métrologie qui vérifie chaque prototype par rapport à la spécification.

    Le centre soutient à la fois nos cinq séries standard de serre-joints et les projets OEM personnalisés — d''un simple changement de largeur de mâchoire à une gamme industrielle entièrement co-développée.
mission:
  title: Mission
  body: |
    Transformer les exigences des clients en serre-joints qui maintiennent le travail en toute sécurité, durent des années d''usage en atelier et expédient avec une qualité entièrement documentée. Nous concevons pour la performance de serrage, la dureté de mâchoire et la résistance à la corrosion tout en gardant le développement en marque privée rentable et rapide.
pillars:
  title: Piliers d''ingénierie
  subtitle: Les quatre principes qui guident chaque projet.
  items:
    - title: Le matériau d''abord
      description: Le bon alliage de fonte grise, d''acier forgé et de durcissement pour chaque classe d''usage et application.
    - title: Usinage de précision
      description: Tolérances CNC qui maintiennent les faces de mâchoire parallèles et la vis stable sous charge.
    - title: Contrôle de dureté
      description: Trempe à l''huile et revenu qui maintiennent les mâchoires à 58–62 HRC, vérifiées par essai Rockwell.
    - title: Conception validée par essais
      description: Chaque prototype est validé pour la force de serrage, le couple de pivotement et la durée de vie avant production.
capabilities:
  title: Capacités
  subtitle: Ce que nos ingénieurs et notre laboratoire peuvent faire en interne.
  groups:
    - title: Coulée et usinage
      items:
        - Modèles en sable vert et aggloméré, canaux d''alimentation et masselottes pour corps en fonte grise HT200/HT250
        - Faces de mâchoire, vis, bases et accessoires usinés avec une précision dimensionnelle constante
        - Géométrie de mâchoire et de base personnalisée développée à partir de votre dessin
    - title: Métallurgie et laboratoire
      items:
        - Lignes de trempe à l''huile et de revenu pour mâchoires GCr15/Cr12MoV à 58–62 HRC
        - Finition par pulvérisation, poudre et Parkerizing validée au brouillard salin
        - Spectromètre, CMM, dureté, couple et équipements d''essais de cycle pour valider chaque conception
rd_numbers:
  title: R&D en chiffres
  items:
    - value: 5
      label: Séries standard
      detail: Léger, moyen, lourd, tuberie et précision
    - value: 80,000+
      label: Serre-joints par an
      detail: Capacité de l''usine
    - value: 200+
      label: Ouvriers
      detail: Coulée, usinage et montage
    - value: 58–62
      label: Dureté de mâchoire HRC
      detail: Mâchoires trempées GCr15 / Cr12MoV
rd_services:
  title: Services de R&D
  subtitle: Support de développement disponible pour les partenaires OEM et de marque privée.
  services:
    - title: Conception de mâchoire et de base personnalisée
      desc: Adaptez la largeur de mâchoire, l''ouverture et le montage à votre application et à votre établi.
    - title: Sélection de matériaux et de finition
      desc: Choisissez le grade du corps, l''acier de mâchoire et le revêtement pour la résistance, la dureté et la protection contre la corrosion appropriées.
    - title: Du dessin à l''échantillon
      desc: Nos ingénieurs transforment votre esquisse ou référence en prototype vérifié.
    - title: Support de certification
      desc: Concevez le produit pour respecter CE, ISO et RoHS dès la phase de dessin, pas après.
  cta: Démarrer un projet de développement
  cta_link: /fr/contact
vision:
  title: Vision
  body: |
    Être le partenaire de R&D de serre-joints privilégié des marques de maintien du travail dans le monde entier — combinant fabrication certifiée avec la profondeur d''ingénierie pour construire leur produit exact, à chaque fois.
labs_section:
  title: Laboratoires et équipements
  subtitle: Installations internes qui maintiennent un développement rapide et une qualité documentée.
  items:
    - title: Laboratoire spectromètre
      description: Valide la chimie de la fonte grise et de l''acier selon spécification avant d''usiner une seule pièce.
    - title: Laboratoire de métrologie
      description: La CMM et les étalons de précision vérifient chaque dimension critique sur les prototypes et les lots de production.
    - title: Laboratoire de dureté et matériaux
      description: L''essai Rockwell confirme la dureté de mâchoire dans la trempe à l''huile et le revenu.
    - title: Laboratoire de durabilité
      description: Les essais de force de serrage, de couple de pivotement et de cycle de 10 000+ confirment une longue durée de vie.
