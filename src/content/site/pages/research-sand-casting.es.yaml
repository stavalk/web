label: Research
headline: '<strong>Fundición en arena</strong> — La base de la fabricación del cuerpo del tornillo'
subtitle: 'Cómo la moldeo en arena verde y arena aglomerante produce cuerpos de tornillo de hierro gris HT200/HT250 rígidos y con amortiguación de vibraciones.'
seo:
  title: 'Proceso de fundición en arena para cuerpos de hierro'
  description: 'Stavalk utiliza fundición en verde y arena aglomerante para verter cuerpos de hierro gris HT200/HT250 a 1350–1400 °C con control dimensional total.'
body: >-
  Cada tornillo de banco Stavalk comienza en el taller de fundición, donde se funde hierro gris HT200 y HT250 y se vierte en moldes de arena verde o arena aglomerante a temperaturas entre 1350 y 1400 °C. Los patrones se diseñan y mantienen en nuestro taller interno de patrones, lo que permite una iteración rápida en la geometría del cuerpo y garantiza la precisión dimensional en las series de producción. Tras el vertido, las piezas pasan por sacudido, granallado y limpieza superficial antes de que la inspección dimensional confirme que queda stock de mecanizado suficiente en todas las caras críticas. Este enfoque ofrece la rigidez y la amortiguación de vibraciones que exigen los tornillos de banco de taller, manteniendo un costo unitario favorable en los volúmenes que requieren nuestros clientes.
faqs:
  - q: '¿Qué grado de hierro utiliza Stavalk para los cuerpos de los tornillos?'
    a: 'Stavalk funde los cuerpos de los tornillos en hierro gris HT200 o HT250, seleccionado según la serie y la clasificación de trabajo. HT200 se adapta a tornillos ligeros y medianos, mientras que HT250 se especifica para modelos de trabajo pesado que requieren mayor resistencia a la tracción y resistencia al desgaste.'
  - q: '¿Por qué se prefiere la fundición en arena para los cuerpos de los tornillos?'
    a: 'La fundición en arena produce secciones transversales gruesas y nervadas que brindan rigidez y amortiguación de vibraciones al cuerpo del tornillo, propiedades esenciales para un apretado preciso. El proceso también se adapta de manera rentable desde prototipos hasta producción de alto volumen, ideal para la gama de tamaños que fabrica Stavalk.'
  - q: '¿Cómo maneja Stavalk la porosidad en las piezas fundidas?'
    a: 'El diseño de alimentación y coladas se optimiza para asegurar llenado sin presión y solidificación direccional, manteniendo la porosidad alejada de las caras críticas mecanizadas. Cada pieza fundida pasa una inspección visual y dimensional del 100% de la corredera y las superficies de montaje de mandíbulas para confirmar la integridad estructural antes del mecanizado.'
