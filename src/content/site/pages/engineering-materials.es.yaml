answer:
  label: 'Respuesta directa'
  text: 'Tres materiales de cuerpo cubren el espectro de las tornamesas. El hierro gris en grados HT200 y HT250 da a las tornamesas estándar la rigidez y amortiguación de vibraciones que necesitan al costo más competitivo. El hierro dúctil añade resistencia al impacto para uso en taller y comercio donde son comunes las caídas y piezas pesadas. El acero forjado 45# entrega la mayor resistencia a la tracción y se reserva para series industriales pesadas, donde la fuerza de sujeción alcanza miles de libras y el cuerpo no debe flexionarse ni fatigarse. Stavalk selecciona el grado por clase de servicio y verifica la microestructura de fundición, la dureza y la maquinabilidad en cada lote.'
  verified: '2026-09'

