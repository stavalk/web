material_notes:
  tagline: Notas de Material
  title: 'Cómo Se Selecciona Cada Grado'
  body: |
    **Hierro gris — el estándar.** Los cuerpos HT200 y HT250 se funden en arena en nuestra propia fundición y luego se normalizan y relevan de tensiones. Dan a la tornamesa el cuerpo rígido y amortiguador que sujeta el trabajo sin "zumbar", a un precio que mantiene asequibles las series estándar. Es el material de cuerpo más común en tornamesas ligeras y medianas.

    **Hierro dúctil — para exposición al impacto.** El hierro dúctil tiene nódulos de grafito en lugar de escamas, que detienen la propagación de grietas. Cuando la tornamesa se usa en talleres ocupados, se cae o recibe cargas fuera de eje, el hierro dúctil resiste el astillado en bordes y concentradores de tensión mejor que el hierro gris. Lo especificamos para series de comercio e industrial ligero con uso diario más duro.

    **Acero forjado 45# — para servicio pesado.** Forjar acero 45# produce una estructura más densa y alineada con el grano que la fundición. Combinado con tratamiento térmico, da la resistencia a la tracción para sostener fuerzas de sujeción del rango de miles de libras sin que el cuerpo flexione — la razón por la que nuestra serie pesada con yunques fijos se construye en acero forjado, con mordazas endurecidas hasta 62 HRC y conjunto de tornillo reemplazable.

why_materials:
  tagline: Por Qué Importa
  title: 'Por Qué el Material del Cuerpo Determina Cómo Se Siente la Tornamesa'
  body: |
    El ancho de mordaza es el número impreso en la tornamesa; el material del cuerpo es lo que el usuario realmente siente. Un cuerpo de hierro gris resiste la flexión cuando sujetas una pieza grande con el mango a tope; un cuerpo de acero forjado permite que una serie pesada desarrolle una fuerza que torcería una fundición más ligera. El material también decide el modo de fallo: el hierro gris frágil falla por agrietamiento ante impactos agudos; el hierro dúctil y el acero forjado se deforman antes de romperse — el comprador ve un problema antes de una falla catastrófica.

    La elección de material también interactúa con el mecanizado. El hierro gris se mecaniza limpiamente con tolerancias ajustadas y superficies autolubricantes, razón por la que los canales y guías de corredera se mecanizan con precisión posicional de 0,05 mm. El acero forjado exige maquinaria más pesada pero la recompensa con una corredera de mayor duración.

    Si comparas tornamesas del mismo tamaño nominal de distintas fábricas, pregunta qué grado de material es realmente el cuerpo — anchos de mordaza idénticos no son productos idénticos.

faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre Materiales de Tornamesa'
  items:
    - q: '¿Es mejor el hierro fundido o el hierro dúctil para una tornamesa?'
      a: 'Para uso estándar de banco, el hierro gris es la elección probada y más económica — rígido, amortiguador y estable. Si la tornamesa enfrentará condiciones duras de taller, caídas o fuerza fuera de eje, el hierro dúctil resiste mejor el daño por impacto. Ambos se usan en la gama Stavalk según clase de servicio.'
    - q: '¿Qué tornamesas de Stavalk usan acero forjado?'
      a: 'La serie pesada con yunques fijos se forja en acero 45# para máxima resistencia a la tracción, resistencia al impacto y capacidad de sujeción (hasta 8.000 lbf en las unidades más grandes), con mordazas endurecidas hasta 62 HRC.'
    - q: '¿Cómo se verifica el grado del material?'
      a: 'Los certificados de material acompañan a cada lote de fundición, cubriendo composición química y propiedades mecánicas. Copias de certificados, registros de dureza y trazabilidad de lotes disponibles bajo NDA.'
    - q: '¿Una tornamesa personalizada puede usar otro material?'
      a: 'Sí. Cuerpos fundidos personalizados, mejoras a hierro dúctil y cuerpos de acero forjado se desarrollan mediante el proceso OEM/ODM. La selección de material se fija en la revisión de ingeniería antes de comenzar el utillaje.'

