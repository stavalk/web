intro: Every Stavalk bench vise moves through a vertical production line in 8 stages, from sand casting to finished, tested product. Each stage has a dedicated team, documented checkpoints, and records traced back to the unit production QR code.

steps:
  - step: '01'
    title: Material Receipt & Inspection
    description: Every incoming batch of HT200/HT250 gray cast iron, 45# forged carbon steel bar, GCr15 / Cr12MoV jaw steel, fasteners and hardware is inspected against specification. Metal samples are tested by spectro analysis and Rockwell hardness before release to production. Non-conforming materials are quarantined and returned.
    duration: 1–2 days
  - step: '02'
    title: Automatic Sand Casting
    description: <p>Approved metal is melted and poured on the automatic sand casting line into HT200/HT250 gray iron bodies, slides and bases. Computer-monitored pouring keeps each heat within its chemistry standard. Castings are shaken out, fettled and shot-blasted, then heat-checked before release to the machining workshop.</p>
    duration: 1–2 days per batch
  - step: '03'
    title: CNC Machining & Threading
    description: Cast bodies, slides and screws are machined on 5-axis machining centers and CNC lathes with ±0.05 mm tolerance. Slides and screws are turned from 45# forged carbon steel and threaded to specification for smooth, precise travel.
    duration: 1–2 days per batch
  - step: '04'
    title: Heat Treatment & Surface Finishing
    description: GCr15 / Cr12MoV jaws are induction-hardened and tempered to 58–62 HRC. Bodies and hardware are finished with electrostatic powder coating (60–80 μm) and zinc plating, giving a durable, corrosion-resistant surface that passes 48h+ salt-spray testing.
    duration: 1–2 days per batch
  - step: '05'
    title: Swivel Base & Pipe Jaw Fitting
    description: Swivel bases and pipe jaws (chain and tripod sets) are fitted to machined bodies. Screw, nut and handle assemblies are installed, aligned and adjusted for smooth, repeatable opening and closing.
    duration: 1–2 days
  - step: '06'
    title: Final Assembly & Adjustment
    description: 'All components come together on the assembly line: body, slide, jaws, screw, handle and swivel base. Each unit follows a 100-point assembly checklist with mandatory sign-off and torque verification at each stage.'
    duration: 1–2 days
  - step: '07'
    title: Quality Testing & Inspection
    description: 'Every completed vise undergoes the mandatory quality gate: jaw hardness check at 58–62 HRC, clamping-force test, swivel-torque verification, and cosmetic inspection. Custom and prototype builds also receive open/close cycle durability samples (10,000+ cycles) and 48h+ salt-spray checks.'
    duration: 1–2 days
  - step: '08'
    title: Packing & Shipping
    description: Vises are oiled, packed in heavy-duty boxes or retail cartons, and loaded for shipment. Each package is labelled with model, serial number, and destination. We coordinate with freight forwarders for FCL and LCL container shipments worldwide.
    duration: 1 day

evidence_gates:
  tagline: Inspection Evidence
  title: 'Every Stage Leaves a Record —Photos & Reports'
  subtitle: 'Below are the actual inspection photos and test-report dossiers from our seven controlled quality gates. Each PDF is a real bilingual record you can download and audit —the same records that back every batch in the 10-year ERP traceability archive. See the full 7-stage flow on /factory/quality-lab.'
  items:
    - title: 'PPM —Project Quality Planning'
      description: 'The pre-production meeting locks scope, the golden sample and the Quality Inspection Plan before the line starts. Unresolved items block production release.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_BENCH_VISE_QIP.pdf
      link_label: 'Download QIP (PDF)'
      image: https://assets.stavalk.com/site/quality/node01-ppm.avif
      alt: Pre-production meeting reviewing the golden sample and quality inspection plan for an OEM bench vise order
    - title: 'IQC —Incoming Material Inspection'
      description: 'Every incoming batch of gray cast iron, steel bar and hardware is checked by spectro analysis and hardness against the approved spec. Non-conforming lots are quarantined and rejected before release to the line.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_IQC_TEST_REPORTS.pdf
      link_label: 'Download IQC reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node02-iqc.avif
      alt: Incoming material inspection of gray cast iron and bench vise components at the factory
    - title: 'IPQC / FAI —In-Process Control'
      description: 'The first article is verified against the locked baselines and every shift keeps patrol checks on the line. FAI approval version-locks the cast pattern, dimensions and BOM.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_IPQC_TEST_REPORTS.pdf
      link_label: 'Download IPQC reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node03-ipqc-fai.avif
      alt: In-process inspection and first article check during bench vise production
    - title: 'Heat Treatment & Hardness Verification'
      description: '100% of jaw hardening batches —not a sample —are hardness-checked at 58–62 HRC with automatic reject outside the range. One record per batch.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_HEAT_TREATMENT_TEST_REPORTS.pdf
      link_label: 'Download heat treatment reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node04-airtightness.avif
      alt: Hardness verification of induction-hardened bench vise jaws
    - title: 'FQC —Final Product Inspection'
      description: 'Finished vises are measured against drawing tolerances, tested for clamping force and swivel torque, and cosmetically graded under D65 daylight lamps against the approved golden sample.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf
      link_label: 'Download FQC reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node05-fqc.avif
      alt: Final product inspection of finished bench vises before packing
    - title: 'PSI —Packing & Pre-Shipment Inspection'
      description: 'The packed unit is checked 100% against the customer-approved BOM —barcode scan, carton markings and ISTA-1A drop test before loading.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_PSI_TEST_REPORTS.pdf
      link_label: 'Download PSI reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node06-psi.avif
      alt: Pre-shipment inspection checking the packed bench vise against the BOM
    - title: 'Shipment Release & Traceability'
      description: 'Quality signs off the batch only when all six previous gates are closed. Serial numbers are mapped to the batch and the dossier is handed over with the shipment.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Download release reports (PDF)'
      image: https://assets.stavalk.com/site/quality/node07-shipment-release.avif
      alt: Shipment release sign-off and batch traceability record handover
