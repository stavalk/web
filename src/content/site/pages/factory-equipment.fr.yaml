  title: 'Équipement d''usine — Fonderie, usinage et finition'
  description: 'Équipements de fabrication industriels Stavalk : fonderie au sable, usinage CNC, traitement thermique, revêtement par poudre, assemblage et essais pour étaux d''établi.'
  dateModified: '2026-09-01'
  keywords:
    - 'équipement de fabrication d''étaux'
