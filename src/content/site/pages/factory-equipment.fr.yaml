    - 'fabrication d''étaux'
hero:
  tagline: Équipement
  title: Équipements et machines de fabrication
  subtitle: 'Équipements de qualité industrielle pour la fonderie, l''usinage, la finition et l''assemblage'
  back_label: Retour à l'usine
  back_link: /fr/factory
categories:
  - title: Fonderie au sable
    items:
      - name: Ligne automatique de fonderie au sable
        spec: Fonte grise HT200/HT250, coulée surveillée
        desc: Ligne de moulage et de coulée entièrement automatisée pour les corps, coulisseaux et bases d'étaux. La chimie du métal est vérifiée par coulée par analyse spectrométrique avant la coulée.
      - name: Machine de grenaillage
        spec: Multi-turbines, alimentation par lots
        desc: Nettoie le sable, la calamine et les bavures des pièces après décochage, préparant les surfaces pour l'usinage et la finition.

  - title: Usinage et CNC
    items:
      - name: Centre d'usinage CNC 5 axes
        spec: '±0,01 mm, broche refroidie par eau, enveloppe 3 m × 2 m × 1 m'
        desc: Usinage de précision des corps, logements de mâchoires et glissières en une seule configuration. Changement de modèle rapide piloté par programme.
      - name: Tour CNC
        spec: Tournage jusqu'à 500 mm de longueur, outillage motorisé
        desc: Tournage et filetage des coulisseaux, vis et axes en acier forgé 45# avec des tolérances de filetage serrées.
      - name: Centre de perçage et de filetage CNC
        spec: Taraudage rigide, indexation de la poupée
        desc: Perçage et taraudage des trous de boulons de mâchoires, des points de montage des poignées et des filetages de mâchoires pour tuyaux pour les jeux chaîne et trépied.

  - title: Traitement thermique et trempe
    items:
      - name: Machine de trempe par induction
        spec: Alimentation automatisée, puissance programmable
        desc: Trempe et revenu par induction des mâchoires GCr15 / Cr12MoV à une valeur constante de 58–62 HRC avec une distorsion minimale et une dureté homogène en profondeur.
      - name: Four de revenu
        spec: Température contrôlée, charge par lots
        desc: Revenu après trempe pour soulager les contraintes et stabiliser la dureté des mâchoires dans tout le lot.

  - title: Finition des surfaces
    items:
      - name: Ligne de revêtement par poudre
        spec: Électrostatique, épaisseur de film 60–80 μm
        desc: Revêtement par poudre électrostatique multicolore pour les corps et bases, avec cuisson au four et vérification de l'épaisseur du revêtement.
      - name: Ligne de zingage
        spec: Tambour et cuve, passivation
        desc: Zingage des vis, mâchoires, poignées et quincaillerie avec finition brillante et protection anticorrosion +48 h de brouillard salin.

  - title: Assemblage et équipement
    items:
      - name: Poste d'assemblage de base pivotante et mâchoires pour tuyaux
        spec: Modulaire réglable, à couple contrôlé
        desc: Assemblage et alignement des bases pivotantes et mâchoires pour tuyaux (jeux chaîne et trépied) sur les corps usinés avec fixations retenues.
      - name: Clé dynamométrique pneumatique
        spec: Calibrée, plage de couple réglable
        desc: Serrage à couple contrôlé des vis, verrous de pivot et boulons de retenue des mâchoires selon la spécification.
      - name: Poste d'ajustage et de meulage des étaux
        spec: Sur établi, outils à main
        desc: Ébavurage final, ajustage et réglage d'ouverture/fermeture pour garantir une course fluide et des faces de mâchoires affleurantes.

  - title: Essais et contrôle qualité
    items:
      - name: Duromètre Rockwell
        spec: Échelle 58–62 HRC, mâchoires GCr15 / Cr12MoV
        desc: Vérification de la dureté de chaque lot de trempe des mâchoires après traitement thermique par induction.
      - name: Banc de test de force de serrage
        spec: kN/capteur de charge, calibré
        desc: Mesure de la force de serrage des étaux assemblés par rapport à la spécification du plan.
      - name: Testeur de durabilité ouverture/fermeture
        spec: Programmable, +10 000 cycles
        desc: Test automatisé des cycles d'ouverture/fermeture de la vis et du coulisseau pour vérifier la durabilité à long terme.
      - name: Chambre de brouillard salin
        spec: ISO 9227, exposition +48 h
        desc: Essais de corrosion des pièces zinguées et revêtues par poudre pour la qualification de la finition.

