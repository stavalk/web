label: Research
headline: '<strong>Heat Treatment</strong> — Hardened Jaws for Lasting Clamping Performance'
subtitle: 'Oil-quench and tempering bring GCr15 jaw inserts to 58–62 HRC, resisting workpiece indentation under repeated high-force clamping.'
seo:
  title: 'Jaw Hardness Heat Treatment — 58–62 HRC'
  description: 'Stavalk oil-quenches and tempers GCr15 jaw inserts to 58–62 HRC, verified by Rockwell testing, for long-lasting workpiece grip.'
body: >-
  Jaw inserts are the only vise components that receive full heat treatment at Stavalk, because only the clamping faces must resist indentation from hardened workpieces. GCr15 bearing-steel or Cr12MoV tool-steel inserts are heated, oil-quenched and tempered to achieve a Rockwell C hardness of 58–62 HRC. Case depth is controlled to ensure wear resistance without brittleness at the jaw edge. Every batch is verified by file test and Rockwell hardness tester, with results recorded per production lot for traceability. The vise body itself, cast in HT200/HT250 gray iron, is not heat-treated — its role is rigidity and vibration damping, not surface hardness.
faqs:
  - q: 'What target hardness does Stavalk achieve on jaw inserts?'
    a: 'GCr15 and Cr12MoV jaw inserts are hardened to 58–62 HRC, evaluated per Rockwell C scale. This range provides the hardness needed to resist workpiece indentation while maintaining enough toughness to avoid chipping under impact.'
  - q: 'Why are only the jaw inserts hardened and not the entire vise?'
    a: 'The vise body is made of HT200/HT250 gray cast iron, chosen for its rigidity and vibration damping — properties that would be compromised by hardening. Only the clamping faces of the jaw inserts need surface hardness to grip hardened workpieces, so heat treatment is concentrated where it matters.'
  - q: 'Is there batch traceability for heat-treated components?'
    a: 'Yes. Each production lot carries a heat-treatment batch number that links to the furnace log, quench medium, tempering cycle and hardness-test results. This traceability is part of Stavalk''s ISO 9001 quality system and is available to buyers upon request.'
