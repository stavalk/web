quality_basis:
  title: Cinco líneas base de calidad fijas
  subtitle: Cada pedido se produce según las mismas cinco líneas base acordadas.
  items:
    - title: Grado de material
      description: Hierro gris HT200/HT250 y acero forjado 45# verificados por espectrómetro antes del mecanizado.
    - title: Dureza de mandíbula
      description: Mandíbulas GCr15/Cr12MoV templadas en aceite y revenidas a 58–62 HRC, verificadas por Rockwell.
    - title: Precisión dimensional
      description: Dimensiones críticas verificadas por CMM y calibradores contra el dibujo aprobado.
    - title: Durabilidad del recubrimiento
      description: Acabados en spray, polvo y Parkerizing probados en niebla salina durante más de 48 horas.
    - title: Ensayos de rendimiento
      description: Fuerza de sujeción, par de giro, vida de ciclo y seguridad verificados por pedido.
tests:
  title: Ensayos y procedimientos
  subtitle: Los controles detrás de cada tornillo de banco Stavalk.
  items:
    - title: Ensayo de fuerza de sujeción
      description: Confirma que el husillo y las mandíbulas sostienen la carga de trabajo nominal sin deslizamiento ni deflexión.
    - title: Ensayo de dureza de mandíbula
      description: La prueba Rockwell verifica 58–62 HRC en toda la superficie de mandíbula endurecida.
    - title: Ensayo de par de giro
      description: Verifica que la base gire y se bloquee suavemente al par especificado.
    - title: Ensayo de vida de ciclo
      description: Más de 10.000 ciclos de apertura/cierre confirman la vida del husillo y la corredera.
    - title: Ensayo de niebla salina
      description: Exposición de más de 48 horas confirma la resistencia del recubrimiento y la corrosión.
    - title: Cumplimiento de seguridad
      description: Diseñado según CE conforme a EN ISO 12100 y MD 2006/42/CE.
qc_flow:
  title: Flujo de inspección de 7 etapas
  subtitle: Un flujo de calidad documentado por pedido con registros en cada puerta.
  obj_label: Objeto de inspección
  method_label: Método de inspección
  criteria_label: Criterio de aceptación
  record_label: Registro de salida
  stages:
    - stage: '01'
      title: Material entrante
      summary: El hierro gris y el acero crudos se verifican contra los certificados de material.
      checks:
        - Grado y certificado de conformidad verificados
        - Verificación de química por espectrómetro en lotes de hierro gris
      object: Lotes de material entrante
      method: Revisión de certificados + espectrómetro
      criteria: HT200/HT250 / 45# según especificación
      record: Registro de recepción de material
    - stage: '02'
      title: Inspección de fundición
      summary: Los cuerpos fundidos se verifican por defectos, dimensiones y solidez.
      checks:
        - Control visual y dimensional de cuerpos fundidos
        - Detección de defectos por porosidad y grietas
      object: Cuerpos fundidos
      method: Inspección visual + calibres
      criteria: Sin defectos estructurales; dims según dibujo
      record: Registro de lote de fundición
    - stage: '03'
      title: Inspección de mecanizado
      summary: Caras de mandíbula, husillos y bases verificados tras el mecanizado CNC.
      checks:
        - Dimensiones críticas medidas con CMM/calibradores
        - Acabado superficial y ajuste verificados
      object: Piezas mecanizadas
      method: Metrología CMM + calibradores
      criteria: Dentro de la tolerancia del dibujo
      record: Registro de inspección de mecanizado
    - stage: '04'
      title: Tratamiento térmico
      summary: Dureza de mandíbula verificada tras el temple en aceite y el revenido.
      checks:
        - Dureza Rockwell en superficie de mandíbula endurecida
        - Parámetros de proceso del lote registrados
      object: Mandíbulas endurecidas
      method: Ensayo de dureza Rockwell
      criteria: 58–62 HRC
      record: Registro de tratamiento térmico
    - stage: '05'
      title: Recubrimiento superficial
      summary: Adherencia y durabilidad del recubrimiento verificadas.
      checks:
        - Espesor y aspecto del recubrimiento
        - Muestreo en niebla salina para resistencia a la corrosión
      object: Cuerpos y mandíbulas recubiertos
      method: Calibre de espesor + niebla salina
      criteria: 48h+ sin fallo
      record: Registro de inspección de recubrimiento
    - stage: '06'
      title: Montaje y ensayo funcional
      summary: Los tornillos montados pasan por ensayos funcionales y de rendimiento.
      checks:
        - Fuerza de sujeción y par de giro
        - Ensayo de ciclo de apertura/cierre
      object: Tornillos montados
      method: Ensayo funcional en banco
      criteria: Cumple el rendimiento nominal
      record: Registro de ensayo funcional
    - stage: '07'
      title: Inspección final y embalaje
      summary: Tornillos terminados inspeccionados, embalados y listos para el envío.
      checks:
        - Control cosmético y de integridad
        - Embalaje, marcado y documentación verificados
      object: Tornillos terminados
      method: Lista de verificación final de control de calidad
      criteria: Listo para FOB Qingdao
      record: Inspección final y lista de embalaje
system_map:
  title: Mapa del sistema de calidad
  subtitle: Los cuatro estándares que estructuran nuestro sistema de calidad de fábrica.
  items:
    - title: CE — EN ISO 12100
      description: Diseño de seguridad de maquinaria y reducción de riesgos en toda la gama de productos.
    - title: MD 2006/42/CE
      description: Cumplimiento de la Directiva de Máquinas para seguridad en el mercado de la UE.
    - title: ISO 9001:2015
      description: Sistema de gestión de calidad que rige todo nuestro proceso de producción.
    - title: ISO 14001 y RoHS
      description: Gestión ambiental y cumplimiento de sustancias restringidas.
intelligence_cards:
  title: Documentación y trazabilidad
  subtitle: Documentos controlados y muestras de registros anonimizadas disponibles para los compradores.
  cards:
    - title: Documentos controlados
      icon: doc
      desc: Todos los dibujos, especificaciones y registros de inspección están versionados y son trazables.
      metrics:
        - label: Registros
          value: '00–15'
    - title: Trazabilidad
      icon: trace
      desc: Los registros de lote vinculan los lotes de materia prima a través de cada puerta de control de calidad hasta el pedido terminado.
      metrics:
        - label: Puertas
          value: '7'
    - title: Terceros
      icon: audit
      desc: Inspecciones de SGS, TÜV, BV e Intertek disponibles antes del envío.
      metrics:
        - label: Opciones
          value: '4'
doc_register:
  title: Registro de documentos controlados
  subtitle: Documentos versionados gestionados en todo el sistema de calidad.
  items:
    - title: '00 – Manual de calidad'
      description: Describe el alcance y la política del sistema de calidad de la fábrica.
    - title: '01 – Especificaciones de material'
      description: Grados de hierro gris y acero y límites de aceptación.
    - title: '03 – Control de dibujos'
      description: Dibujos y especificaciones de producto versionados.
    - title: '05 – Planes de inspección'
      description: Planes y listas de verificación de inspección de 7 etapas por pedido.
    - title: '08 – Métodos de ensayo'
      description: Procedimientos estándar para dureza, par, ciclo y niebla salina.
    - title: '12 – Registros de trazabilidad'
      description: Trazabilidad de lote que vincula el material con el producto terminado.
traceability:
  title: Matriz de trazabilidad
  subtitle: Cómo un producto permanece trazable desde la materia prima hasta el envío.
  items:
    - title: Lote de material
      description: Certificados de material crudo y números de calor registrados en la recepción.
    - title: Lote de fundición
      description: Resultados de espectrómetro y números de fundición registrados por lote.
    - title: Puertas de proceso
      description: Registros de mecanizado, tratamiento térmico y recubrimiento por lote.
    - title: Serie terminada
      description: Registros anonimizados vinculan cada puerta con el pedido terminado.
non_conformance:
  title: Control de no conformidades
  subtitle: Cómo se detectan, contienen y corrigen los defectos.
  items:
    - title: Detección
      description: Los defectos encontrados en cualquier puerta de control de calidad se señalan y se ponen en cuarentena.
    - title: Contención
      description: El lote afectado se aísla y se rastrea hasta materiales y procesos.
    - title: Disposición
      description: Rework, reparación o rechazo decididos por la inspección y el comprador.
    - title: Acción correctiva
      description: La causa raíz y la acción correctiva evitan la recurrencia en pedidos futuros.
third_party:
  title: Inspección de terceros y del comprador
  subtitle: Verificación independiente disponible en cada etapa.
  items:
    - title: Pre-envío
      description: Inspección de SGS, TÜV, BV o Intertek antes del envío FOB.
    - title: Durante el proceso
      description: Comprador o terceros en puertas clave de control de calidad durante la producción.
    - title: Ensayo de laboratorio
      description: Verificación de laboratorio independiente de dureza, par y recubrimiento.
    - title: Entrega de informes
      description: Informes de inspección entregados junto con la documentación del envío.
content_certifications:
  title: Certificaciones de un vistazo
  body: |
    Stavalk produce tornillos de banco en cumplimiento de **CE** (EN ISO 12100 y MD 2006/42/CE), **ISO 9001:2015**, **ISO 14001** y **RoHS**. El sistema de calidad está documentado, medido y es auditable — desde la recepción de material a través de un flujo de inspección de 7 etapas hasta la inspección de terceros y el envío FOB Qingdao.

    Los certificados escaneados con alcance están disponibles a petición antes de realizar el pedido, y los compradores pueden organizar inspección de SGS, TÜV, BV o Intertek en la fábrica antes del envío.
faqs:
  title: Preguntas frecuentes
  questions:
    - q: ¿Qué estándares cumplen los tornillos de banco Stavalk?
      a: CE (EN ISO 12100, MD 2006/42/CE), ISO 9001:2015, ISO 14001 y RoHS.
    - q: ¿Qué dureza tienen las mandíbulas?
      a: Las mandíbulas GCr15/Cr12MoV se templan en aceite y se revienen a 58–62 HRC.
    - q: ¿Puedo organizar una inspección de terceros?
      a: Sí — SGS, TÜV, BV o Intertek, organizada por ti o por nosotros, en la fábrica antes del envío.
    - q: ¿Puedo ver los registros de calidad?
      a: Los compradores con acuerdos firmados pueden solicitar registros de trazabilidad y control de calidad anonimizados por pedido.
evidence_review:
  title: Evidencia y verificación
  body: |
    Nuestras afirmaciones de calidad y certificación están respaldadas por evidencia de fábrica verificable:

    - [Centro de pruebas](/es/proof-center)
    - [Fábrica y calidad](/es/quality)
    - [Tecnología](/es/technology)
cta:
  title: 'Pide certificados o una auditoría de fábrica'
  subtitle: 'Solicita certificados escaneados, organiza una inspección o planifica una visita a la fábrica Stavalk en Qingdao, China.'
  actions:
    - variant: primary
      text: Contactar al equipo
      href: /es/contact
    - text: Centro de pruebas
      href: /es/proof-center
