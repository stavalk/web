categories:
  - title: Sand Casting & Foundry
    items:
      - name: Automatic Sand Casting Line
        spec: HT200/HT250 gray cast iron, monitored pouring
        desc: Fully automated molding and pouring line for bench vise bodies, slides and bases. Melt chemistry is verified per heat by spectro analysis before casting.
      - name: Shot Blasting Machine
        spec: Multi-wheel, batch feed
        desc: Cleans sand, scale and flash from castings after shakeout, preparing surfaces for machining and finishing.

  - title: Machining & CNC
    items:
      - name: 5-Axis CNC Machining Center
        spec: ±0.01 mm, water-cooled spindle, 3 m × 2 m × 1 m envelope
        desc: Precision machining of vise bodies, jaw beds and slide ways in a single setup. Program-driven changeover for fast model switching.
      - name: CNC Lathe
        spec: Turning up to 500 mm length, live tooling
        desc: Turning and threading of 45# forged carbon steel slides, screws and spindles with tight thread tolerances.
      - name: CNC Drill & Threading Center
        spec: Rigid tapping, headstock indexing
        desc: Drilling and tapping of jaw bolt holes, handle mounting points and pipe-jaw threads for chain and tripod sets.

  - title: Heat Treatment & Hardening
    items:
      - name: Induction Hardening Machine
        spec: Automated feed, programmable power
        desc: Induction hardening and tempering of GCr15 / Cr12MoV jaws to a consistent 58–62 HRC with minimal distortion and full-depth hardness.
      - name: Tempering Furnace
        spec: Temperature-controlled, batch load
        desc: Post-hardening tempering to relieve stress and stabilize jaw hardness across the batch.

  - title: Surface Finishing
    items:
      - name: Powder Coating Line
        spec: Electrostatic, 60–80 μm film thickness
        desc: Multi-color electrostatic powder coating for vise bodies and bases, with oven curing and coating thickness verification.
      - name: Zinc Plating Line
        spec: Barrel and vat plating, passivation
        desc: Zinc plating for screws, jaws, handles and hardware with bright finishing and 48h+ salt-spray corrosion protection.

  - title: Assembly & Fitting
    items:
      - name: Swivel Base & Pipe Jaw Assembly Station
        spec: Modular adjustable, torque-controlled
        desc: Assembly and alignment of swivel bases and pipe jaws (chain and tripod sets) onto machined bodies with retained fasteners.
      - name: Pneumatic Torque Wrench
        spec: Calibrated, adjustable torque range
        desc: Torque-controlled tightening of screws, swivel locks and jaw retaining bolts to specification.
      - name: Vise Adjustment & Grinding Station
        spec: Bench-mounted, hand tools
        desc: Final deburring, fit-up and opening/closing adjustment to guarantee smooth travel and flush jaw faces.

  - title: Testing & Quality Control
    items:
      - name: Rockwell Hardness Tester
        spec: 58–62 HRC scale, GCr15 / Cr12MoV jaws
        desc: Hardness verification of every jaw hardening batch after induction heat treatment.
      - name: Clamping Force Test Rig
        spec: kN/load cell, calibrated
        desc: Clamping force measurement of assembled vises against drawing specification.
      - name: Open/Close Cycle Durability Tester
        spec: Programmable, 10,000+ cycles
        desc: Automated open/close cycle testing of the screw and slide assembly to verify long-term durability.
      - name: Salt-Spray Chamber
        spec: ISO 9227, 48h+ exposure
        desc: Corrosion testing of zinc-plated and powder-coated parts for finish qualification.

