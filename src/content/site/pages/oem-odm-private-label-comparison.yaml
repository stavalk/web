ip_rules:
  tagline: 'Intellectual Property Protection'
  title: 'How We Protect Your Designs and Brand'
  subtitle: 'Regardless of collaboration model, your artwork, tooling and specification files remain your property.'
  body: |
    **NDA before file exchange.** We sign a non-disclosure agreement before any technical file exchange — standard response time is within 4 business hours.

    **No design reuse.** Your artwork, tooling and specification files are never shared with or sold to other clients. OEM casting moulds are exclusively yours. ODM designs are approved by you before production. Private Label platforms are shared structures, but your graphics and branding are exclusive.

    **B2B only.** We manufacture exclusively under our clients' brands. We do not sell to end consumers and do not compete with our clients in any market.

    **Tooling ownership.** Custom casting moulds paid for by the buyer belong to the buyer. We store and maintain them, but cannot use them for other clients without written authorization.

faqs:
  tagline: 'FAQ'
  title: 'Common Questions About OEM, ODM and Private Label'
  items:
    - q: 'Can I switch from private label to OEM later?'
      a: 'Yes. Many clients start with a private-label or pilot batch to validate the market, then invest in custom tooling for a full OEM program once demand is proven. The same plant and QC system supports both paths.'
    - q: 'Does ODM mean the factory owns my brand?'
      a: 'No. Under ODM, you own your brand, graphics and packaging. The factory develops the vise structure from your brief and you approve the design before production. The factory retains development process IP, but the approved product specification is yours.'
    - q: 'Is private label lower quality than OEM?'
      a: 'No. All three paths run through the same plant, same QC system and same export team. Private-label vises are built on proven, validated platforms with full clamping force testing, jaw hardness verification and the same 7-stage inspection system.'
    - q: 'What if I am not sure which model to choose?'
      a: 'Contact us with your situation — our engineering team will recommend the most practical path based on your product requirements, timeline and volume targets. No commitment required before specification review.'
    - q: 'Can I get samples before committing to any model?'
      a: 'Yes. 1–2 prototype samples ship in 7–14 days. Sample cost is credited against your bulk order. This lets you evaluate construction and quality before any volume commitment.'

