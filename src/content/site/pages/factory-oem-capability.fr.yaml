services:
  - title: Conception produit et ingénierie
    description: Notre équipe R&D interne travaille avec votre concept ou votre spécification pour développer des dessins CAD, des modèles 3D et des prototypes. Nous proposons la conception de patrons de fonderie, l'optimisation de la géométrie des mâchoires, l'ingénierie du mécanisme de serrage et des conseils de choix de matériaux.
  - title: Marque et marquage personnalisés
    description: Logos de marque fondus et gravés, plaques signalétiques, marquage laser et couleurs de revêtement personnalisées. Nous développons un marquage spécifique à la marque, les motifs de stries des mâchoires et un emballage prêt pour le retail.
  - title: Personnalisation des matériaux et spécifications
    description: Choisissez parmi les corps en fonte grise HT200/HT250, les coulisseaux et vis en acier forgé 45# et les aciers de mâchoires GCr15 / Cr12MoV. Largeurs de mâchoires personnalisées (4″–10″), options de revêtement (poudre, zinc, finitions spéciales) et choix de renforts.
  - title: Emballage et logistique
    description: Emballage retail personnalisé, boîtes en marque privée, huilage et enveloppement antirouille, palettisation et conditionnement prêt à l'export préparés en interne.

moq_table:
  - product: Étaux d'établi
    standard_moq: 'Standard 50–200 | intensifs/spéciaux 20–50 pcs'
    custom_moq: 'Confirmation de quantité par modèle'
    lead_time: '25–35 jours (échantillons 7–14)'

why_us:
  - title: Intégration verticale
    description: Nous possédons notre usine, nos patrons de fonderie et notre chaîne d'approvisionnement — pas d'intermédiaires, pas de sous-traitants. Cela nous donne le contrôle sur la qualité, le coût et la livraison.
  - title: Double certification
    description: Certification de management de la qualité ISO 9001:2015 et de management environnemental ISO 14001:2015. Rapports d'audit d'usine disponibles sur demande.
  - title: Conformité CE
    description: La certification CE s'applique aux modèles destinés aux marchés de l'UE selon l'EN 12100 et la Directive Machines 2006/42/CE (périmètre confirmé par projet). Les modèles personnalisés peuvent être certifiés CE par notre processus établi.
  - title: MOQ spécifique au projet
    description: 'Le MOQ est confirmé par la configuration de votre projet — les modèles standard s''exécutent en 50–200 pcs et les étaux à usage intensif et spéciaux en 20–50 pcs. Nous aidons les marques émergentes à se lancer sans sur-engager de stock.'

