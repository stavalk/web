meta:
  title: 'Centro de pruebas — Evidencia de fábrica verificable | {SITE}'
  description: 'Centro de pruebas de Stavalk: cadena de entidades, estadísticas de fábrica verificables, certificados y alcance, carpetas de evidencia, trazabilidad de lotes y preguntas frecuentes de compradores — todo auditable en Qingdao, China.'
  dateModified: '2026-09-01'
  keywords:
    - 'evidencia fábrica tornillos de banco'
    - 'estadísticas fábrica verificables'
    - 'certificación Stavalk'
    - 'auditoría tornillos de banco'
hero:
  tagline: Centro de pruebas
  title: Evidencia que puedes verificar
  subtitle: Cada afirmación que Stavalk hace sobre su fábrica, capacidad, certificaciones y calidad está respaldada por documentación, fotos y registros de ensayos que puedes auditar — sin cajas negras.
  actions:
    - variant: primary
      text: Iniciar una auditoría de fábrica
      href: /es/factory-audit-checklist
answer:
  label: Respuesta directa
  text: Stavalk es un fabricante de tornillos de banco con fábrica propia en Qingdao, China, con 8.000 m² de instalaciones, más de 200 trabajadores y más de 80.000 tornillos al año. Todas las afirmaciones de certificación, capacidad y calidad están respaldadas por registros de producción con marca de tiempo, informes de laboratorio y opciones de inspección de terceros accesibles para los compradores.
  verified: '2026-09-01'
entities:
  title: Una cadena legal, una fábrica
  subtitle: Tres nombres comerciales, una entidad propietaria — para que mercancías, documentos y responsabilidades coincidan.
  items:
    - title: Entidad de fabricación
      description: La fábrica en Qingdao es dueña de la fundición, el mecanizado, el tratamiento térmico, el recubrimiento y el montaje.
    - title: Entidad comercial
      description: Gestiona documentación de exportación, facturas y comunicación con compradores de la misma fábrica.
    - title: Marca registrada
      description: La marca bajo la que se envían las series estándar y los pedidos de marca privada.
    - title: Una sola cadena
      description: Los tres nombres están bajo una única propiedad legal, manteniendo responsabilidad, calidad y trazabilidad alineadas.
proof_stats:
  title: Estadísticas de fábrica verificables
  items:
    - value: 8.000 m²
      label: Espacio de fábrica
      detail: Fundición, mecanizado, recubrimiento y montaje bajo un mismo techo
    - value: 200+
      label: Trabajadores
      detail: En producción y calidad
    - value: 80,000+
      label: Tornillos al año
      detail: Capacidad de fábrica
    - value: 7
      label: Etapas de control de calidad
      detail: Inspección durante el proceso por pedido
certifications:
  title: Certificados y alcance
  body: |
    - **CE** — EN ISO 12100 y MD 2006/42/CE para seguridad de maquinaria.
    - **ISO 9001:2015** — sistema de gestión de calidad en toda la fábrica.
    - **ISO 14001** — gestión ambiental en la fabricación.
    - **RoHS** — cumplimiento de sustancias restringidas.

    Los certificados escaneados con alcance están disponibles a petición antes de realizar el pedido.
evidence_gates:
  title: Carpetas de evidencia
  subtitle: Cuatro categorías de registros auditables que un comprador puede solicitar.
  items:
    - title: Equipos e instalaciones
      description: Fotos del área de fábrica, listas de equipos de fundición y mecanizado, y documentación de línea.
    - title: Puertas de producción
      description: Fotos durante el proceso con marca de tiempo en fundición, mecanizado, tratamiento térmico y recubrimiento.
    - title: Informes de laboratorio
      description: Química por espectrómetro, dureza Rockwell, fuerza de sujeción y resultados de niebla salina.
    - title: Trazabilidad
      description: Registros de lote que vinculan los lotes de material con los números de serie terminados.
traceability:
  title: Cadena de trazabilidad de lotes
  body: |
    Cada pedido lleva una cadena de trazabilidad desde la materia prima hasta el producto terminado:

    - **Recepción de material** — los grados de hierro gris y acero se registran con certificado de conformidad.
    - **Lote de fundición** — se registra la validación por espectrómetro y el número de calor por fundición.
    - **Mecanizado y tratamiento térmico** — se registran los parámetros de proceso y los resultados de dureza por lote.
    - **Inspección final** — lista de verificación de 7 etapas y registros de ensayos vinculados al lote de envío.

    Los compradores con acuerdos firmados pueden solicitar muestras de registros anonimizados que cubren cada puerta.
faqs:
  title: Preguntas frecuentes
  questions:
    - q: ¿Puedo visitar la fábrica?
      a: Sí. Damos la bienvenida a visitas y auditorías de fábrica en nuestras instalaciones en Qingdao, China.
    - q: ¿Qué evidencia puedo solicitar antes de pedir?
      a: Certificados escaneados, fotos de fábrica y equipos, informes de laboratorio y registros de trazabilidad anonimizados.
    - q: ¿Quién realiza la inspección de terceros?
      a: SGS, TÜV, BV o Intertek, organizada por ti o por nosotros, en la fábrica antes del envío.
    - q: ¿Están verificadas las estadísticas?
      a: El espacio de fábrica, la plantilla y la capacidad están documentados y se corroboran durante las auditorías en el lugar.
cta:
  title: 'Audita la evidencia tú mismo'
  subtitle: 'Solicita carpetas de evidencia, reserva una visita a la fábrica o inicia un pedido — nuestro equipo en Qingdao está listo para abrir las puertas.'
  actions:
    - variant: primary
      text: Solicitar evidencia
      href: /es/contact
    - text: Lista de verificación de auditoría de fábrica
      href: /es/factory-audit-checklist
