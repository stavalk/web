role_boundary:
  tagline: 'Ce que nous sommes — et ce que nous ne sommes pas'
  title: 'Une usine que vous pouvez vérifier, jamais une allégation à prendre sur la foi'
  subtitle: 'La différence de vérification entre une usine et un bureau de trading est simple : chaque allégation a un document, une personne ou une machine derrière elle.'
  features:
    - icon: A
      icon_bg: blue
      title: 'Ce que nous sommes — un fabricant vérifiable'
      desc: '· Une entité légale enregistrée : Stavalk, Qingdao, Chine — détails d''enregistrement partagés sous NDA ou pendant l''audit · Une usine physique : 8 000 m² à Jimo, Qingdao, avec 4 ateliers spécialisés, 200+ ouvriers et plusieurs lignes de production · Une équipe de fabrication : les personnes qui répondent à vos questions sont celles qui construisent vos étaux · De vrais documents : SOP QMS, normes d''inspection et enregistrements qualité anonymisés disponibles au téléchargement · Vérification indépendante bienvenue : inspections SGS, TÜV, BV ou Intertek à votre choix, selon ISO 2859-1 Niveau II'
