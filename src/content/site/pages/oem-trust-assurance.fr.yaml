hero:
  tagline: 'Fabrication que vous pouvez vérifier'
  title: 'Confiance OEM et assurance d''usine'
  subtitle: 'Chaque allégation de ce site peut être vérifiée : enregistrement officiel de l''entreprise, une usine physique de 8 000 m² que vous pouvez visiter ou auditer, de vrais ingénieurs sous NDA, des documents QMS que vous pouvez télécharger et des données de test enregistrées par lot. Conçu et opéré par Stavalk, Qingdao, Chine.'

answer:
  label: 'Réponse directe'
  text: 'La confiance n''est pas une promesse — c''est de la documentation. Nous sommes une entité manufacturière chinoise enregistrée (Stavalk, Qingdao) avec une usine physique de 8 000 m² à Jimo, Qingdao, 200+ ouvriers et 80 000+ étaux de capacité annuelle. Vous pouvez vérifier l''enregistrement, auditer l''usine, examiner les SOP QMS, télécharger des enregistrements qualité d''exemple, planifier des inspections tierces parties (SGS, TÜV, BV ou Intertek) et faire signer une NDA sous 4 heures ouvrées. Chaque étau est testé pour la force de serrage, la dureté de mâchoire (58 à 62 HRC), le couple de rotation, la durabilité de 10 000+ cycles et la résistance à la corrosion par sel de 48+ heures, et chaque lot conserve une traçabilité ERP complète. Si une allégation ne peut pas être documentée, nous ne la formulons pas.'
  verified: '2026-09'

