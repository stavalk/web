      link: '/fr/oem-moq-guide'
      link_label: 'Voir le guide MOQ transparent'

trust_steps:
  tagline: 'Une vraie étude de cas'
  title: 'Comment un distributeur industriel européen nous a vérifiés avant de commander'
  subtitle: 'Sept étapes de vérification qu''un distributeur commercial a complétées avant de passer une commande de plus de 200 unités — la même liste de contrôle vous est ouverte.'
  steps:
    - step: '01'
      title: 'Vérification officielle de l''entité'
      desc: 'L''acheteur a demandé l''enregistrement d''entreprise chinois et la licence de commerce d''export. L''entité légale derrière Stavalk est un fabricant enregistré à Qingdao, Shandong — vérifié via le registre national sous NDA.'
    - step: '02'
      title: 'Usine physique et audit de site'
      desc: 'Un audit d''usine (en personne et via une visite vidéo) a confirmé l''usine de 8 000 m² : quatre ateliers spécialisés, 200+ ouvriers, plusieurs lignes de production et une production mensuelle de plus de 6 500 étaux. Le rapport d''audit est classé avec les enregistrements du contrat.'
    - step: '03'
      title: 'Personnes : de vrais ingénieurs, pas des scripts commerciaux'
      desc: 'L''acheteur a parlé directement avec l''équipe d''ingénierie — conception d''étaux, laboratoire de matériaux et QC. La spécification du projet et la NDA ont été échangées sous 4 heures ouvrées, et une revue d''ingénierie est revenue sous un jour ouvré.'
    - step: '04'
      title: 'Papier : QMS, certificats et inspection tierce partie'
      desc: 'La documentation de conformité ISO 9001:2015, ISO 14001, CE (EN ISO 12100, Directive Machines 2006/42/CE) et RoHS, et les SOP QMS ont été examinés. L''acheteur a planifié une inspection SGS avant expédition selon ISO 2859-1 Niveau II sur la première commande de volume — et a reçu un Certificat de Conformité par lot.'
    - step: '05'
      title: 'Données : enregistrements de test par lot'
      desc: 'L''acheteur a audité les enregistrements de test réels : force de serrage, dureté de mâchoire (58 à 62 HRC), couple de rotation, tests de durabilité de 10 000+ cycles et résultats de corrosion par sel de 48 heures. Des enregistrements QC d''échantillon ont été fournis avant la commande.'
    - step: '06'
      title: 'Protection contractuelle'
      desc: 'Le contrat de commande couvrait la licence de marque, une période d''exclusivité territoriale convenue, la propriété de l''outillage et les conditions de rachat, et définissait les données et enregistrements qui transfèrent avec l''outillage. L''acheteur a approuvé les pièces coulées à l''usine avant la production.'
    - step: '07'
      title: 'Gouvernance continue'
      desc: 'Des revues commerciales trimestrielles avec le VP des ventes et l''ingénieur en chef, un droit réservé d''audit pendant la production et une voie d''escalade vers le directeur QA pour tout différend qualité. L''accord a été conjointement signé par le VP des ventes, l''ingénieur en chef et le directeur QA.'

trust_faqs:
  tagline: 'FAQ'
  title: 'Les 12 préoccupations que les acheteurs expriment avant de commander'
  items:
    - q: 'Stavalk est-il vraiment une usine, ou une société de trading ?'
      a: 'Stavalk est un fabricant d''étaux basé à Jimo, Qingdao. Nous exploitons l''usine de 8 000 m² nous-mêmes — fonderie en sable, usinage CNC, traitement thermique, revêtement de surface, assemblage et test se déroulent dans une seule installation. Aucun transfert de société de trading : les personnes qui répondent à vos questions sont celles qui construisent vos étaux.'
    - q: 'Avec qui exactement traiterai-je pendant mon projet ?'
      a: 'Un ingénieur de projet nommé et un contact QC nommé, plus les chefs de département qui signent vos documents. Vous pouvez demander à parler directement à l''ingénieur en chef, au directeur QA ou au directeur d''usine — avant et après la commande. Aucune couche de chef de compte ne s''interpose entre vous et les personnes qui font le travail.'
    - q: 'Puis-je visiter ou auditer l''usine ?'
      a: 'Oui. Nous accueillons les visites d''usine à Jimo, Qingdao, et soutenons les audits à distance avec des visites vidéo en direct. Les audits peuvent être organisés indépendamment (votre inspecteur ou une tierce partie comme SGS, TÜV, BV ou Intertek) et le calendrier d''audit peut être écrit dans le contrat.'
    - q: 'Signerez-vous une NDA avant que je partage mon design ?'
      a: 'Oui. Notre NDA standard est signée sous 4 heures ouvrées après votre demande, avant que toute spécification propriétaire, graphisme ou fichier technique soit partagé. Des versions bilingues (anglais/chinois) sont disponibles, et le document est contresigné par le directeur d''usine.'
    - q: 'Comment savoir que vos allégations qualité sont réelles ?'
      a: 'Chaque allégation de ce site a un document derrière elle : les SOP QMS et les normes d''inspection sont téléchargeables, des échantillons d''enregistrements qualité anonymisés sont publiés, et les données de test sont journalisées par lot avec traçabilité ERP complète. Vous pouvez aussi planifier une inspection tierce partie avant expédition à votre choix.'
    - q: 'Que se passe-t-il si mes étaux arrivent avec des défauts ?'
      a: 'Chaque étau est testé avant l''emballage, et les enregistrements au niveau du lot permettent une recherche de cause racine par numéro de lot. Le contrat définit les obligations d''inspection, de remplacement et de reprise, et le directeur QA signe la libération du lot. Les étaux repris sont re-testés en totalité — jamais contrôlés partiellement.'
    - q: 'Pouvez-vous vraiment tester 100 % des étaux avant l''expédition ?'
      a: 'Oui — et les enregistrements le prouvent. Chaque étau passe par un test de force de serrage, une vérification de dureté de mâchoire (58 à 62 HRC), une vérification de couple de rotation, des tests de durabilité de 10 000+ cycles et une résistance à la corrosion par sel de 48+ heures. Les journaux de test sont liés à chaque lot et font partie de la documentation du lot.'
    - q: 'Quelles certifications détenez-vous réellement ?'
      a: 'Management de la qualité ISO 9001:2015, management environnemental ISO 14001, conformité CE (EN ISO 12100, Directive Machines 2006/42/CE) pour les produits d''étaux, plus la conformité RoHS pour l''installation et les matériaux. Les numéros de certificat et les enregistrements d''audit sont fournis sur demande ou pendant un audit — la liste est publiée, pas « disponible sur demande uniquement ».'
    - q: 'Ma marque sera-t-elle en sécurité — design, outillage et marché ?'
      a: 'Oui. Votre marque, vos designs et votre outillage sont protégés par NDA, conditions de licence de marque et clauses de propriété ou de rachat de l''outillage écrites dans le contrat. L''outillage est conservé pour la marque et transférable. Les conditions de territoire et d''exclusivité sont convenues par écrit avant le début de la production.'
    - q: 'Quel est votre vrai MOQ ?'
      a: 'Le MOQ est spécifique au projet et expliqué sur notre guide MOQ : échantillons 1 à 2 unités, co-marquage petit volume dès 20 unités, lots pilotes 20 à 50 unités et volume standard 50 à 200+ unités par lot de coulée. Les corps coulés sur mesure s''exécutent au niveau de volume. Le calcul est confirmé avant devis — pas de chiffres vagues de « MOQ bas ».'
    - q: 'Que se passe-t-il si la production est en retard ?'
      a: 'Le délai est confirmé après l''examen de la spécification, de la marque et de l''emballage — jamais promis à l''avance. Le contrat couvre la planification, la notification de retard et la voie de résolution, et la revue commerciale trimestrielle suit la performance de livraison contre le calendrier convenu.'
    - q: 'Qui signe les documents contractuels de votre côté ?'
      a: 'Les commandes et accords sont conjointement signés par le VP des ventes, l''ingénieur en chef et le directeur QA — les trois personnes responsables respectivement des conditions commerciales, de l''exécution d''ingénierie et de la libération qualité. Vous recevez les documents signés avec les enregistrements du contrat.'

governance:
  tagline: 'Structure de responsabilité'
  title: 'Signataires nommés et droits réservés'
  subtitle: 'Chaque engagement est lié à un rôle nommé — pas à un département commercial.'
  body: |
    **Signature conjointe.** Les commandes, plans qualité et résolutions de différends sont signés par trois rôles : le VP des ventes (conditions commerciales), l''ingénieur en chef (exécution d''ingénierie) et le directeur QA (libération qualité). Les SOP bilingues sont versionnés et portent la même structure de signature.

    **Droits réservés.** L''acheteur conserve le droit d''auditer la production, d''examiner les enregistrements de test et de retenir la libération du lot jusqu''à la signature de l''inspection. La reprise n''a lieu que sous un enregistrement de changement approuvé, et la libération est validée par un QC indépendant — jamais par les opérateurs de reprise.

    **Enregistrements qui transfèrent.** Les journaux de test de lot, les certificats de conformité et les rapports d''inspection sont livrés avec chaque expédition, et la traçabilité de lot ERP est conservée pendant 10 ans. Les enregistrements d''outillage et les dessins de moule transfèrent avec l''outillage quand le contrat le prévoit.

