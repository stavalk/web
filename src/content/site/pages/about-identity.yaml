identity_detail:
  title: Who We Are
  subtitle: A manufacturing identity focused on holding work securely and reliably.
  items:
    - title: Factory-Owned Production
      description: Casting, machining, heat treatment, coating and assembly run in our own 8,000 m² facility in Qingdao, China.
    - title: Engineering Depth
      description: An in-house R&D center covers casting design, CNC programming, metallurgy and testing.
    - title: Certified Quality
      description: CE (EN ISO 12100, MD 2006/42/EC), ISO 9001:2015, ISO 14001 and RoHS across the production line.
    - title: Private-Label Ready
      description: Standard series and custom OEM/co-developed models for distributors and brands worldwide.
manufacturing_scope:
  title: Manufacturing Scope
  body: |
    Stavalk's factory covers the complete bench vise production chain:

    - **Casting** — HT200/HT250 gray cast iron bodies via green-sand and resin-sand lines, validated with a spectrometer.
    - **Machining** — jaw faces, spindles and bases on CNC lathes and milling centers with CMM-verified dimensions.
    - **Heat treatment** — GCr15/Cr12MoV steel jaws oil-quenched and tempered to 58–62 HRC.
    - **Coating** — spray paint, powder coat and Parkerizing with 48+ hour salt-spray testing.
    - **Inspection** — a 7-stage quality flow with batch traceability and third-party options.

    This in-house chain lets us control quality, lead times and cost from raw material to finished product.
brand_positioning:
  title: Brand Positioning
  body: |
    Stavalk positions itself as a reliable, certified OEM source for workholding brands and distributors — not a reseller, but the factory that designs, casts, machines and tests the product. We compete on engineering depth, documented quality and responsive private-label development, including samples in 7–14 days and bulk orders in 25–35 days, FOB Qingdao.
