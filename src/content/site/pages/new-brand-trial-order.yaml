  tagline: Indicative Budget Ranges
  title: 'What a Launch Costs — Reference Price Ranges'
  subtitle: 'Indicative reference ranges, FOB Qingdao (China), for a standard medium-duty vise (6″–8″ jaw width). Final quotation depends on series, jaw material, surface finish, branding, packaging and quantity — confirmed against your configuration before any commitment.'
  headers:
    stage: Order Stage
    price: Reference Price Per Unit
    notes: Notes
  rows:
    - stage: 'Samples (1–2 units)'
      price: 'USD 35–80'
      notes: 'Physical sample with your branding applied. Sample fees are credited toward the production order upon contract sign-off.'
    - stage: 'Trial / pilot order (20–50 units)'
      price: 'USD 25–55'
      notes: 'Existing series platforms, stock materials and standard packaging. The standard low-MOQ launch route.'
    - stage: 'Standard volume (50–200+ units per casting batch)'
      price: 'USD 18–42'
      notes: 'Full casting cycles, custom paint systems, branded packaging and volume pricing.'
    - stage: 'Bespoke body casting & tooling (add-on)'
      price: 'Quoted per project'
      notes: 'A bespoke body casting adds 15–20 days of mould development within the overall schedule; tooling is itemized and quoted once.'

derisk:
  tagline: Launch Without the Risk
  title: 'Four Ways a Trial Order De-Risks Your Launch'
  subtitle: 'Most new brand launches fail on inventory, not on product quality. A trial order is designed to make the avoidable mistakes impossible.'
  features:
    - icon: I
      icon_bg: blue
      title: 'No Heavy Inventory Commitment'
      desc: 'Your first-season exposure stays under 50 units. If the format needs adjustment, you adjust before the big spend, not after.'
    - icon: C
      icon_bg: green
      title: 'Cash Flow Stays Manageable'
      desc: 'Smaller orders mean smaller deposits, staged payments and no idle capital in a warehouse. Volume pricing waits until it is actually earned.'
    - icon: Q
      icon_bg: purple
      title: 'Quality Is Never Downscaled'
      desc: 'A 20-unit trial order runs through the same 7-stage inspection system and durability testing as a full-volume program — no "try-before-quality" compromises.'
    - icon: G
      icon_bg: orange
      title: 'Guaranteed Path to Scale'
      desc: 'Every trial order carries a confirmed route to volume: retained sample credits, frozen BOM and branding, and production slots reserved for your follow-up run.'

scale_path:
  tagline: After the Trial
  title: 'What Comes After a Successful Trial Order'
  subtitle: 'The trial order is deliberately designed to be the first step of a longer relationship. This is the path we agree before the first unit ships.'
  steps:
    - step: 'Phase 1'
      title: 'Trial Delivered & Reviewed'
      desc: '20–50 units arrive on schedule, sell-through data comes back from your channel — distributor, retail or direct.'
    - step: 'Phase 2'
      title: 'Feedback & Refinement'
      desc: 'Body color, branding placement, packaging and accessory mix are adjusted against real market response. BOM and branding are frozen for the follow-up.'
    - step: 'Phase 3'
      title: 'Volume Run (50–200+ Units)'
      desc: 'Standard casting-batch runs with full production efficiency, custom paint systems and volume pricing — sample credits already applied.'
    - step: 'Phase 4'
      title: 'Full-Scale Programs'
      desc: '500+ unit programs with staggered shipments, custom Pantone finishes and the full development pipeline — the same factory, now at full scale.'

trial_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About Launching with a Trial Order'
  items:
    - q: 'Can I really launch a vise brand without a full container order?'
      a: 'Yes. The entry point is tiered: 1–2 samples validate the vise (ready in 7–14 days), a trial order of 20–50 units validates the market (production in 25–35 days), and volume runs of 50–200+ units follow only when sell-through proves the format. Small-batch co-branding starts from as few as 20 units when you want branded vises without any development stage.'
    - q: 'How long does a full launch take, end to end?'
      a: 'Using existing series platforms, a typical first launch runs 6–10 weeks from product brief to delivered trial order: samples in 7–14 days, trial production in 25–35 days after confirmed PO and deposit. A bespoke body casting adds 15–20 days of mould development.'
    - q: 'What does the price include — and what does it not?'
      a: 'The reference ranges are FOB Qingdao for the vises themselves, including branding application and standard QC. They are indicative: the final quotation is confirmed against your configuration — series, jaw material, surface finish, branding, packaging and accessories — before any commitment. Freight, duties and customs clearance at destination are quoted separately.'
    - q: 'Do I have to buy 100 or 500 vises to get my logo on them?'
      a: 'No. Small-batch co-branding puts your logo on the spindle or jaw face from as few as 20 units, and trial orders of 20–50 units support full branding application at the same quality as volume production. What changes with quantity is unit price, not availability.'
    - q: 'What happens if I want to change the design after the trial?'
      a: 'Changes between trial and volume are normal and welcomed — that is the point of the trial. Body color, branding placement, packaging and accessories are re-priced against the new configuration, then frozen with BOM and branding sign-off before the volume run. Casting tooling fees for brand marks are waived on re-orders using the same artwork dimension.'
    - q: 'Do you sign an NDA before I share my designs?'
      a: 'Yes. A Non-Disclosure Agreement is available before you share proprietary technical specifications or artwork. We manufacture exclusively under the brands of our clients and never compete with them in any market — the same policy applies to a 1-unit sample as to a full-volume program.'

