moq_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About MOQ'
  items:
    - q: 'Is MOQ calculated per order, per model, or per variant?'
      a: 'MOQ may apply per model, variant, body series, branding configuration or total order. Because different jaw widths (4″ vs 10″) and body castings come from distinct casting moulds and heat-treatment batches, ordering 50 vises split across 5 series creates 5 separate production requirements. We confirm the exact calculation against your SKU matrix before quotation so you can plan your mix clearly.'
    - q: 'Can I order a sample before bulk production?'
      a: 'Yes. Sample development (1–2 units) verifies jaw hardness, clamping force, swivel torque, surface finish and fitment before mass production release. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - q: 'Why does custom retail packaging have an independent MOQ?'
      a: 'Custom flexographic or offset carton printing presses require a minimum production setup of 500+ units. We offer a Hybrid Packaging Storage Solution: we produce the 500 custom-printed cartons, store the surplus in our clean warehouse, and release them across your scheduled shipments — so a smaller vise order can still ship in fully branded retail packaging.'
    - q: 'Why is the standard volume MOQ 50–200 units?'
      a: 'Standard volume MOQ follows the casting process: a single flask load in our foundry yields 50–200 vise bodies depending on jaw width and cavity count. Running full flask loads ensures consistent molten iron temperature, uniform mold filling and repeatable microstructure — while amortizing the furnace energy, heat-treatment setup and CNC machining calibration across the batch.'
    - q: 'Does a higher quantity reduce unit cost?'
      a: 'In most projects, yes. Higher quantities improve casting yield, distribute fixed foundry and heat-treatment setup overhead across more units, and reduce per-unit packaging costs.'
    - q: 'Do co-branding mould fees apply again on re-orders?'
      a: 'No. Casting brand-mark tooling fees are charged once on initial setup and are waived for re-orders using the same artwork dimension. You only pay the $0.50 USD per vise laser engraving and handling fee.'
    - q: 'Does requesting MOQ guidance commit me to an order?'
      a: 'No. Requesting project MOQ guidance simply allows our engineering team at Stavalk, Qingdao to review your technical brief and advise the most cost-effective production path. A Non-Disclosure Agreement (NDA) is available before you share proprietary technical specifications or artwork.'

