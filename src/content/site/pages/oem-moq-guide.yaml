hero:
  tagline: 'Transparent & Project-Specific'
  title: 'Flexible Branding & Manufacturing MOQ Guide'
  subtitle: 'Understand the casting-batch economics that govern vise production runs — and how our low-barrier co-branding program works for distributors, industrial suppliers and growing tool brands. Engineered and operated by Stavalk, Qingdao, China.'

answer:
  label: 'Straight answer'
  text: 'MOQ is not a one-size-fits-all number. Every MOQ is confirmed by project configuration: jaw width and opening, body series (light, medium, heavy, pipe or specialty), swivel base type, surface finish, branding and packaging requirements. Standard volume production runs 50–200 units per batch from a single casting cycle; heavy-duty and specialty series run 20–50 units; and every project is split into three distinct stages — sample development (1–2 units), pilot order (20–50 units) and volume production (50–200+ units). We confirm the exact calculation for your SKU mix before quotation — no vague "low MOQ" promises, no hidden compromises.'
  verified: '2026-09'

moq_principle:
  tagline: The Engineering Logic
  title: 'Why Standard Volume MOQ Is 50–200 Units: Casting-Batch Economics'
  subtitle: 'Production run sizes are not arbitrary numbers set by a sales team — they are determined by sand-casting mould cavities, heat-treatment batch sizes and line changeover physics.'
  body: |
    **The casting-cavity baseline.** Bench vise bodies are sand-cast from HT200 or HT250 gray cast iron. A standard foundry flask accommodates a single casting cycle that yields 4 to 8 vise bodies depending on jaw width. The minimum efficient casting batch is one complete flask load.

    **The yield calculation (50 to 200 units).** For a standard medium-duty vise (6″–8″ jaw width), one casting cycle with multi-cavity tooling yields approximately 50 to 200 finished vises when multiple cavities are used across a single pour. Heavier 8″–10″ units yield fewer per flask; lighter 2″–5″ units yield more.

    **Heat-treatment batch optimization.** All vise bodies undergo heat treatment to achieve the required hardness. Furnace loading is most efficient at batch sizes that fill the hearth — under-filled furnaces waste energy, over-filled loads risk uneven treatment. Standard batch sizes are tuned to the furnace capacity.

    **Zero-waste casting policy.** Full flask loads ensure consistent molten iron temperature, uniform mold filling and repeatable microstructure across every body in the batch — no partial pours that create inconsistent hardness zones.

