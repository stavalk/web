moq_stages:
  tagline: Sample · Pilot · Volume
  title: 'Three Distinct Quantity Stages'
  subtitle: 'Sample, pilot and volume production quantities are different. Every project is categorized into three distinct tiers so you validate before you commit.'
  steps:
    - step: '01'
      title: 'Sample Development (1–2 units)'
      desc: 'Physical confirmation of jaw hardness (58–62 HRC), clamping force, swivel torque, surface finish and accessory fitment before any financial commitment. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - step: '02'
      title: 'Pilot Order (20–50 units)'
      desc: 'Commercial testing and regional market validation using existing series platforms, stock materials and standard packaging to minimize setup friction.'
    - step: '03'
      title: 'Volume Production (50–200+ units)'
      desc: 'Confirmed after frozen BOM, finalized branding, custom packaging and scheduled delivery plans — full casting cycles, custom paint systems, bespoke packaging, volume discounts and full-chain batch traceability.'

moq_factors:
  tagline: What Drives Your MOQ
  title: 'Why Full-Custom MOQ Is Always Project-Specific'
  subtitle: 'For 100% bespoke manufacturing, MOQ is calculated from the complete product architecture — these four components are evaluated together before quotation.'
  headers:
    component: Project Component
    driver: Manufacturing Driver
    impact: Impact on Minimum Quantity
  rows:
    - component: 'Jaw Width & Body Series'
      driver: 'Existing casting moulds for standard series vs bespoke CAD-designed mould cavities'
      impact: 'Existing platforms: pilot orders from 20 pcs. Bespoke body castings: dedicated tooling amortization required.'
    - component: 'Surface Finish & Paint'
      driver: 'Standard hammer-tone paint vs custom Pantone powder-coat or Parkerizing finish'
      impact: 'Custom paint systems require dedicated coating-line setup with independent batch minimums.'
    - component: 'Branded Packaging'
      driver: 'Generic cartons with barcode labels vs full-color branded retail boxes and instruction sheets'
      impact: 'Custom color boxes carry an independent offset printing press minimum (typically 500+ boxes).'
    - component: 'Accessory Packages'
      driver: 'Standard forged steel jaws vs custom hardened GCr15/Cr12MoV jaw sets with branded accessories'
      impact: 'Fully branded accessory sets follow sub-tier supplier production batches.'

