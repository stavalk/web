hero:
  tagline: 'Debida Diligencia'
  title: 'Lista de Verificación de Auditoría de Fábrica'
  subtitle: 'Antes de comprometerse con un fabricante de tornillos de banco, verifique los fundamentos. Esta lista cubre las ocho áreas que un comprador profesional debe auditar — desde gestión de calidad y capacidad de producción hasta trazabilidad de materiales y cumplimiento social. Cada elemento de esta lista es algo que podemos demostrar con registros, no solo con afirmaciones.'

answer:
  label: 'Respuesta rápida'
  text: 'Las ocho áreas de auditoría más importantes: (1) Sistema de gestión de calidad — certificación ISO 9001 y registros reales de inspección puerta por puerta, no solo un certificado en la pared. (2) Capacidad de producción — números reales de producción, no nominales. (3) Trazabilidad de materiales — inspección de entrada por lote e informes de prueba. (4) Pruebas de dureza y fuerza de sujeción — protocolos de prueba documentados. (5) Controles de fundición, mecanizado y ensamblaje — parámetros de tratamiento térmico e inspección dimensional. (6) Cumplimiento social — auditoría BSCI o equivalente. (7) Documentación y trazabilidad — registros por lote, registros de inspección, certificados de conformidad. (8) Soporte post-entrega — proceso de garantía, repuestos, capacidad de respuesta en comunicación.'
  verified: '2026-09'

audit_areas:
  tagline: Ocho Áreas de Auditoría
  title: 'Qué Verificar — Las Ocho Áreas de Auditoría'
  subtitle: 'Cada área incluye las preguntas a hacer, los registros a solicitar y las señales de alerta a observar.'
  grid: 'sm:grid-cols-2 lg:grid-cols-4'
  features:
    - icon: Q
      icon_bg: blue
      title: '1. Sistema de Gestión de Calidad'
      desc: 'Solicite: Certificado ISO 9001 (organismo acreditado, vigente), programa de auditorías internas, registro CAPA (acción correctiva y preventiva), procedimientos de puertas de inspección. Señal de alerta: Solo certificado, sin registros de inspección a nivel de puerta ni proceso CAPA.'
    - icon: C
      icon_bg: green
      title: '2. Capacidad de Producción'
      desc: 'Solicite: Cifras de producción mensual por tipo de producto, programa de producción mostrando utilización actual, capacidad de herramental (número de líneas de fundición, máquinas CNC, hornos de tratamiento térmico). Señal de alerta: Solo capacidad nominal, sin datos de utilización ni programa de producción.'
    - icon: M
      icon_bg: purple
      title: '3. Trazabilidad de Materiales'
      desc: 'Solicite: Registros de inspección de material entrante, certificados de proveedores de hierro fundido HT200/HT250 y acero forjado 45#, trazabilidad por lote desde materia prima hasta tornillo de banco terminado, declaraciones de sustancias REACH/RoHS. Señal de alerta: Sin trazabilidad a nivel de lote, certificados de material no disponibles.'
    - icon: P
      icon_bg: orange
      title: '4. Pruebas de Dureza y Fuerza de Sujeción'
      desc: 'Solicite: Protocolo de prueba de dureza (58–62 HRC para mordazas, posiciones de prueba), protocolo de prueba de fuerza de sujeción (capacidad nominal, criterios de aprobación/rechazo), registros de prueba de lotes recientes. Señal de alerta: "Solo inspección visual" o sin protocolo de prueba documentado con criterios cuantitativos.'
    - icon: W
      icon_bg: blue
      title: '5. Controles de Fundición, Mecanizado y Ensamblaje'
      desc: 'Solicite: Registros de parámetros de tratamiento térmico (temperatura, tiempo de retención), registros de mecanizado CNC e inspección dimensional, criterios de alineación de mordazas e inspección de rosca con tasas de rechazo. Señal de alerta: Sin registros de parámetros, alta tasa de rechazo sin CAPA.'
    - icon: S
      icon_bg: green
      title: '6. Cumplimiento Social'
      desc: 'Solicite: Informe de auditoría BSCI o SMETA (vigente, alcance completo), registros de horarios y salarios, informes de inspección de salud y seguridad, documentación de cumplimiento ambiental. Señal de alerta: Sin auditoría social de terceros, o auditoría con no conformidades mayores sin resolver.'
    - icon: D
      icon_bg: purple
      title: '7. Documentación y Trazabilidad'
      desc: 'Solicite: Registros de producción por lote, registros de inspección por puerta, certificados de conformidad, listas de empaque con referencias de lote, sistema de seguimiento de reclamaciones de garantía. Señal de alerta: Sin documentación a nivel de lote, reclamaciones de garantía no rastreadas ni analizadas.'
    - icon: A
      icon_bg: orange
      title: '8. Soporte Post-Entrega'
      desc: 'Solicite: Términos de garantía y proceso de reclamación, tiempo promedio de resolución de reclamaciones, disponibilidad de repuestos, compromiso de tiempo de respuesta en comunicación, proceso de revisión post-entrega. Señal de alerta: Sin proceso de garantía documentado, comunicación lenta o inconsistente después de la entrega.'

our_position:
  heading: 'Nuestra Posición en Cada Área de Auditoría'
  body: |
    No solo afirmamos cumplimiento — proporcionamos los registros. Aquí está nuestra posición en cada una de las ocho áreas de auditoría:

    - **Gestión de calidad**: Certificados ISO 9001:2015, auditados anualmente por un tercero acreditado. Sistema de inspección de 7 puertas con criterios documentados de aprobación/rechazo en cada puerta. Registro CAPA mantenido y revisado trimestralmente.
    - **Capacidad de producción**: Más de 80,000 tornillos de banco de capacidad anual, programa de producción disponible para revisión durante la visita de fábrica. Líneas de fundición, mecanizado CNC y tratamiento térmico con controles de proceso equivalentes a IATF.
    - **Trazabilidad de materiales**: Trazabilidad a nivel de lote desde material entrante hasta tornillo de banco terminado. Certificados de proveedores de hierro fundido HT200/HT250 y acero forjado 45# en archivo. Certificados de material de mordaza GCr15/Cr12MoV y declaraciones de sustancias REACH/RoHS disponibles por lote.
    - **Pruebas de dureza y fuerza de sujeción**: Dureza de mordaza verificada a 58–62 HRC con durómetros calibrados. Prueba de fuerza de sujeción a la capacidad nominal con aprobación/rechazo documentado. Registros de prueba disponibles para cada lote de producción.
    - **Controles de fundición, mecanizado y ensamblaje**: Parámetros de tratamiento térmico registrados por cada tirada de producción. Inspección de alineación de mordazas y rosca en puertas definidas con tasas de rechazo documentadas. CAPA iniciada para tasas de rechazo por encima del umbral.
    - **Cumplimiento social**: Auditado por BSCI. Registros de horarios, salarios y seguridad disponibles para inspección durante la visita de fábrica.
    - **Documentación**: Registros de producción por lote, registros de inspección por puerta, certificados de conformidad y listas de empaque con referencias de lote enviados con cada pedido. Sistema de seguimiento de reclamaciones de garantía mantenido.
    - **Soporte post-entrega**: Términos de garantía documentados por contrato. Resolución promedio de reclamaciones en menos de 14 días hábiles. Repuestos disponibles desde stock. Revisión post-entrega ofrecida para cada primer pedido.

evidence_review:
  tagline: 'Evidencia y Verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones de fabricación y calidad en esta página son verificadas por nuestro equipo de ingeniería de fabricación en la fábrica de Qingdao (Jimo). Certificados, registros de inspección de CC, informes de pruebas de dureza y fuerza de sujeción, y registros de trazabilidad por lote están disponibles bajo solicitud. Especificaciones verificadas por última vez 2026-09.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'Auditoría de Fábrica — Preguntas Frecuentes'
  items:
    - q: '¿Puedo visitar la fábrica para una auditoría en sitio?'
      a: 'Sí. Recibimos visitas de fábrica y podemos organizar una auditoría estructurada que cubra las ocho áreas. Una visita típica incluye recorrido por la planta de producción, observación de puertas de CC, inspección de almacén de materiales, revisión documental y preguntas y respuestas con el gerente de calidad. Reserve un día completo. Contáctenos para programar.'
    - q: '¿Proporcionan documentación de auditoría antes de una visita?'
      a: 'Sí. Podemos compartir el certificado ISO 9001, informe BSCI, resumen de capacidad de producción, protocolo de prueba de dureza y fuerza de sujeción y registros de inspección de muestra antes de su visita — para que pueda preparar preguntas específicas. Los registros completos de lotes están disponibles en sitio durante la visita.'
    - q: '¿Qué inspecciones de terceros utilizan?'
      a: 'Trabajamos con SGS, Intertek y TUV para inspecciones y certificaciones de terceros. La inspección de pre-embarque por terceros está disponible bajo solicitud para cualquier pedido. El alcance y costos de inspección se confirman durante la fase de cotización.'
    - q: '¿Cómo sé que su sistema de calidad realmente se aplica, no solo está documentado?'
      a: 'Cada tornillo de banco pasa 7 puertas de inspección con criterios cuantitativos de aprobación/rechazo — no listas de verificación visuales. Datos de dureza, datos de prueba de fuerza de sujeción y tasas de rechazo se registran por lote y están disponibles para su revisión. CAPA se activa automáticamente para resultados fuera de especificación. Le recomendamos auditar el proceso en vivo durante una visita de fábrica.'

