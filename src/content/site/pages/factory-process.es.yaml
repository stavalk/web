intro: Cada tornillo de banco Stavalk recorre una línea de producción vertical en 8 etapas, desde la fundición en arena hasta el producto terminado y comprobado. Cada etapa cuenta con un equipo dedicado, puntos de control documentados y registros trazables hasta el código QR de producción de la unidad.

steps:
  - step: '01'
    title: Recepción e inspección de materiales
    description: Cada lote entrante de hierro gris HT200/HT250, barra de acero forjado 45#, acero para mordazas GCr15 / Cr12MoV, fijadores y herraje se inspecciona según especificación. Las muestras de metal se ensayan con análisis espectroquímico y dureza Rockwell antes de liberarlos a producción. Los materiales no conformes se ponen en cuarentena y se devuelven.
    duration: 1–2 días
  - step: '02'
    title: Fundición automática en arena
    description: <p>El metal aprobado se funde y se cuela en la línea automática de fundición en arena para producir cuerpos, deslizaderas y bases de hierro gris HT200/HT250. La colada supervisada por ordenador mantiene cada colada dentro de su estándar químico. Las piezas se desmoldean, desbarban y granallan, y se comprueba su dureza antes de liberarlas al taller de mecanizado.</p>
    duration: 1–2 días por lote
  - step: '03'
    title: Mecanizado CNC y roscado
    description: Los cuerpos, deslizaderas y husillos fundidos se mecanizan en centros de 5 ejes y tornos CNC con tolerancia de ±0,05 mm. Las deslizaderas y los husillos se tornean a partir de acero forjado 45# y se roscan según especificación para un desplazamiento suave y preciso.
    duration: 1–2 días por lote
  - step: '04'
    title: Tratamiento térmico y acabado de superficies
    description: Las mordazas GCr15 / Cr12MoV se endurecen por inducción y se revenan a 58–62 HRC. Los cuerpos y el herraje se recubren con pintura electrostática en polvo (60–80 μm) y galvanizado en zinc, logrando un acabado duradero y resistente a la corrosión que supera las 48 h de niebla salina.
    duration: 1–2 días por lote
  - step: '05'
    title: Montaje de platos giratorios y mordazas de tubo
    description: Los platos giratorios y las mordazas de tubo (juegos de cadena y trípode) se montan sobre los cuerpos mecanizados. Los conjuntos de husillo, tuerca y mango se instalan, alinean y ajustan para una apertura y cierre suaves y repetibles.
    duration: 1–2 días
  - step: '06'
    title: Ensamblaje final y ajuste
    description: 'Todos los componentes se ensamblan en la línea: cuerpo, deslizadera, mordazas, husillo, mango y plato giratorio. Cada unidad sigue una lista de control de ensamblaje de 100 puntos con firma obligatoria y verificación de par en cada etapa.'
    duration: 1–2 días
  - step: '07'
    title: Pruebas de calidad e inspección
    description: 'Cada tornillo terminado supera el control de calidad obligatorio: comprobación de dureza de mordazas a 58–62 HRC, ensayo de fuerza de sujeción, verificación del par del plato e inspección cosmética. Los modelos personalizados y de prototipo también reciben muestras de durabilidad de ciclos de apertura/cierre (más de 10.000 ciclos) y comprobaciones de niebla salina de más de 48 h.'
    duration: 1–2 días
  - step: '08'
    title: Embalaje y envío
    description: Los tornillos se engrasan, se embalan en cajas resistentes o de retail y se cargan para su envío. Cada paquete se etiqueta con el modelo, el número de serie y el destino. Coordinamos con transitarios los envíos en contenedor FCL y LCL a todo el mundo.
    duration: 1 día

evidence_gates:
  tagline: Evidencias de inspección
  title: 'Cada etapa deja un registro: fotos e informes'
  subtitle: 'A continuación tienes las fotos de inspección reales y los dosieres de informes de ensayo de nuestras siete puertas de control de calidad. Cada PDF es un registro bilingüe real que puedes descargar y auditar — los mismos registros que respaldan cada lote en el archivo de trazabilidad ERP de 10 años. Consulta el flujo completo de 7 etapas en /factory/quality-lab.'
  items:
    - title: 'PPM — Planificación de calidad del proyecto'
      description: 'La reunión previa a la producción fija el alcance, la muestra patrón y el Plan de Inspección de Calidad antes de arrancar la línea. Los puntos sin resolver bloquean la liberación a producción.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_BENCH_VISE_QIP.pdf
      link_label: 'Descargar QIP (PDF)'
      image: https://assets.stavalk.com/site/quality/node01-ppm.avif
      alt: Reunión previa a la producción revisando la muestra patrón y el plan de inspección de calidad de un pedido OEM de tornillos de banco
    - title: 'IQC — Inspección de materiales entrantes'
      description: 'Cada lote entrante de hierro gris, barra de acero y herraje se comprueba con análisis espectroquímico y dureza contra la especificación aprobada. Los lotes no conformes se ponen en cuarentena y se rechazan antes de liberarlos a la línea.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
      image: https://assets.stavalk.com/site/quality/node02-iqc.avif
      alt: Inspección de materiales entrantes de hierro gris y componentes de tornillos de banco en la fábrica
    - title: 'IPQC / FAI — Control en proceso'
      description: 'La primera pieza se verifica contra las líneas base bloqueadas y cada turno mantiene controles de patrulla en la línea. La aprobación FAI bloquea la versión del patrón de fundición, dimensiones y BOM.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
      image: https://assets.stavalk.com/site/quality/node03-ipqc-fai.avif
      alt: Inspección en proceso y control de la primera pieza durante la producción de tornillos de banco
    - title: 'Verificación del tratamiento térmico y la dureza'
      description: 'El 100% de los lotes de temple de mordazas se comprueban en dureza a 58–62 HRC, no solo una muestra, con rechazo automático fuera del rango. Un registro por lote.'
      image: https://assets.stavalk.com/site/quality/node04-airtightness.avif
      alt: Verificación de dureza de mordazas de tornillos de banco endurecidas por inducción
    - title: 'FQC — Inspección final del producto'
      description: 'Los tornillos terminados se miden contra las tolerancias del plano, se ensayan en fuerza de sujeción y par del plato, y se clasifican cosméticamente bajo lámparas de luz diurna D65 contra la muestra patrón aprobada.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
      image: https://assets.stavalk.com/site/quality/node05-fqc.avif
      alt: Inspección final del producto de tornillos de banco terminados antes del embalaje
    - title: 'PSI — Inspección de embalaje y previa al envío'
      description: 'La unidad embalada se comprueba al 100% contra el BOM aprobado por el cliente — escaneo de código de barras, marcado de cajas y prueba de caída ISTA-1A antes de la carga.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
      image: https://assets.stavalk.com/site/quality/node06-psi.avif
      alt: Inspección previa al envío comprobando el tornillo de banco embalado contra el BOM
    - title: 'Liberación de envío y trazabilidad'
      description: 'Calidad firma la liberación del lote solo cuando las seis puertas anteriores están cerradas. Los números de serie se asignan al lote y el dosier se entrega con el envío.'
      link: https://assets.stavalk.com/site/downloads/STAVALK_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberación (PDF)'
      image: https://assets.stavalk.com/site/quality/node07-shipment-release.avif
      alt: Firma de liberación de envío y entrega del registro de trazabilidad del lote
