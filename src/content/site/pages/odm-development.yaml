    - 'Accessories and features - anvil surface, pipe jaws, quick-release mechanism, hardened face plates'
    - 'Packaging and retail presentation - retail boxes, displays and export packing under your brand'

faq_section:
  tagline: FAQ
  title: ODM Development Questions
  questions:
    - q: How does ODM differ from OEM?
      a: 'ODM (Original Design Manufacturing) starts from your brief - our engineers develop the body structure, jaw specification, finish and packaging, whether from a market concept, performance target or adaptation of a proven platform. You approve the design before production. OEM (Original Equipment Manufacturing) manufactures to your approved specification - your drawings, dimensions, materials and packaging. You own the design and IP. Both run through the same plant, QC system and export team; ODM is the fastest path to a branded vise when you do not have a design yet.'
    - q: I only have a rough idea - where do we start?
      a: 'Send a short brief: target applications, use cases, size range, markets and volumes. Our engineers come back with a concept, a reference vise direction and a development plan within one business day - an NDA is signed before any detailed exchange when requested.'
    - q: How long does it take to develop a new bench vise?
      a: 'Prototype samples ship in 7-12 days. A new body with custom pattern tooling adds 15-20 days of engineering before samples. Production runs 25-35 days after PO and deposit.'
    - q: What is the MOQ for an ODM vise?
      a: 'Standard volume production runs 50-200 units per batch for medium-duty vises; pilot runs start at 20-50 units on existing platforms. Heavy-duty and specialty vises run 20-50 units minimum. See our MOQ & Flexible Branding Guide for the full calculation.'
    - q: Who owns the design and pattern?
      a: 'Your brief, design and tooling are protected by NDA, brand licensing terms and pattern ownership or buyout clauses written into the contract. Tooling is kept for your brand and transferable.'
    - q: Can you develop a specific vise type (heavy-duty, pipe, specialty)?
      a: 'Yes. Our engineering covers all main vise categories - light-duty (2"-5"), medium-duty (6"-8"), heavy-duty (8"-10"), pipe vises and specialty configurations - with clamping force and durability validation for each.'
    - q: Which certifications will the developed vise carry?
      a: 'CE (EN ISO 12100, Machinery Directive 2006/42/EC), ISO 9001:2015, ISO 14001 and RoHS. Certification documents are prepared per order for your export markets.'

process:
  title: 'The ODM Process - From Brief to Scaled Production'
  subtitle: 'Six controlled stages run by the same in-house team that designs, samples and scales your vise - everything stays documented.'
  steps:
    - phase: '01'
      title: Brief & Concept
      period: 1 business day
      items:
        - 'Share target applications, use cases, sizes, markets and volumes - or just an idea.'
        - 'Our engineers return a concept direction, platform options and a development plan.'
    - phase: '02'
      title: Body & Material Design
      period: Week 1-2
      items:
        - 'Body dimensions, material grade, jaw specification and swivel range engineered in-house.'
        - 'Surface finish, branding concept and packaging developed around your brand.'
    - phase: '03'
      title: Pattern & Tooling
      period: +15-20 days (new castings)
      items:
        - 'Custom pattern tooling designed and cut for new body castings; existing platforms skip this stage.'
        - 'Tooling ownership terms are fixed in the contract before cutting starts.'
    - phase: '04'
      title: Prototype & Sample
      period: 7-12 days
      items:
        - 'A physical prototype is built, tested and sent for your review - dimensional and hardness checks included.'
        - 'Sample (1-2 units) validates body, jaw spec and branding before volume.'
    - phase: '05'
      title: Validation & Approval
      period: In parallel
      items:
        - 'Clamping force, jaw hardness, swivel torque, durability and salt spray tests per production line.'
        - 'CE, ISO 9001:2015, ISO 14001 and RoHS documentation prepared for your export markets.'
        - 'You approve the prototype; PO and deposit lock the production slot.'
    - phase: '06'
      title: Production & Delivery
      period: 25-35 days
      items:
        - 'Standard-volume batches run 50-200+ units per batch; pilot runs from 20-50 units.'
        - 'Export packing, FOB/CIF/DDP shipping to 50+ countries and reorder support included.'

