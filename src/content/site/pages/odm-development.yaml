customization:
  tagline: Designed with You
  title: What We Develop Around Your Brief
  subtitle: 'ODM means the product is designed for you from scratch or from our platform library - these are the levers your brief controls:'
  items:
    - 'Application profile - light-duty workshop, medium-duty industrial, heavy-duty fabrication or specialty pipe work'
    - 'Body material - HT200 gray cast iron, HT250 heavy-duty cast iron or 45# forged steel'
    - 'Jaw specification - GCr15 hardened steel (58-62 HRC) or Cr12MoV tool steel for heavy applications'
    - 'Jaw opening and throat depth - dimensions matched to the target application and workpiece size'
    - 'Swivel base - 360-degree rotation with lock mechanism, or fixed base configuration'
