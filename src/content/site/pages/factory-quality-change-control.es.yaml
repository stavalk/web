faqs:
  tagline: FAQ
  title: Preguntas Frecuentes Sobre el Control de Cambios de Retrabajo
  items:
    - q: '¿Puede la fábrica cambiar los parámetros de retrabajo sin avisarnos?'
      a: 'No. Cualquier cambio propuesto a materiales de retrabajo aprobados, condiciones de proceso, utillaje, métodos de prueba, criterios de inspección o personal autorizado debe pasar el control de cambios documentado primero. Los cambios que afectan especificaciones, muestras, BOM, arte o criterios de aceptación aprobados por el cliente requieren su aprobación escrita.'
    - q: '¿Qué cuenta como cambio de alto riesgo?'
      a: 'Los cambios a materiales o proveedores de retrabajo, condiciones de tratamiento térmico o recubrimiento, métodos de retrabajo de mordaza/rosca/cuerpo, criterios de inspección o aceptación, y la expansión del alcance del defecto hacia zonas estructurales se clasifican como de alto riesgo. Requieren revisión interdepartamental, plan de validación aprobado e implementación piloto controlada antes del uso rutinario.'
    - q: '¿Se puede usar una desviación temporal indefinidamente?'
      a: 'No. Cada desviación temporal lleva una ventana de validez definida, alcance de lote, límite de cantidad y requisitos de validación, con expiración automática. Alcanzar el límite bloquea el lote e impide imprimir la etiqueta de pase hasta que el cambio se evalúe formalmente.'
    - q: '¿Cómo se demuestra que un método cambiado funciona antes del uso completo?'
      a: 'Los cambios de alto riesgo requieren un plan de validación: al menos 5 tornillos de banco de muestra representativos que cubran los límites de tolerancia, probados por 2 inspectores de QC independientes contra criterios de aceptación cuantificados (fuerza de sujeción, dureza, precisión dimensional, acabado superficial). Aprobar la validación no es aprobar la aplicación.'
    - q: '¿Necesitamos aprobar cada cambio?'
      a: 'No cada cambio, pero cualquier cambio que aleje el producto de la muestra aprobada por el cliente, especificación técnica, BOM, arte, embalaje o criterio de aceptación se implementa solo con aprobación escrita del cliente. Sin ella, los tornillos de banco se retrabajan según el requisito original, se sustituyen o se rechazan.'
    - q: '¿Qué ocurre con los documentos antiguos cuando se aprueba un cambio?'
      a: 'Las instrucciones de trabajo antiguas, tarjetas de parámetros y hojas de inspección se recogen y cancelan físicamente (1-a-fuera-1-adentro), se marcan como OBSOLETO, y se sustituyen por la nueva revisión controlada tras la formación. Las versiones antigua y nueva nunca comparten una estación de trabajo.'
    - q: '¿Cuánto tiempo se conservan los registros de control de cambios?'
      a: 'Los registros de cierre — evidencia de validación, revisiones de documentos, registros de formación y revisiones de eficacia — se conservan según nuestra política de retención de registros (mínimo 3 años para registros de cierre) para que cada cambio siga siendo trazable para auditorías y revisiones de trazabilidad.'

