hero:
  tagline: Control de Cambios de Parámetros de Retrabajo
  title: Estándar de Control de Cambios de Parámetros de Retrabajo y Validación
  subtitle: 'En Stavalk, ningún operario, jefe de turno ni departamento individual puede modificar un parámetro de retrabajo aprobado en el momento. Cualquier cambio propuesto a materiales de retrabajo aprobados, condiciones de proceso, utillaje, métodos de prueba, criterios de inspección o personal autorizado se gestiona mediante control de cambios documentado — Solicitud de Cambio de Ingeniería, evaluación de impacto y riesgo, aprobación multifuncional, plan de validación, implementación controlada, reinspección y revisión de eficacia, y cierre con conservación de registros. Esta página presenta nuestro estándar controlado QMS-SOP-QC-CC-001 (Rev 2.0, basado en ISO 9001:2015) y la evidencia de ingeniería que lo respalda.'
  actions:
    - text: Descargar SOP de Control de Cambios (PDF)
      variant: primary
      href: 'https://assets.Stavalk.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf?dl=1'
    - text: Descargar Anexo de Ejecución A (PDF)
