      href: /es/contact

answer:
  label: 'Respuesta directa'
  text: 'Los cambios de parámetros de retrabajo nunca se deciden verbalmente ni de forma retroactiva en Stavalk. Cada cambio propuesto a materiales de retrabajo aprobados, condiciones de proceso, equipos, métodos de prueba, criterios de inspección o personal autorizado debe pasar un control de cambios formal antes de su implementación: una Solicitud de Cambio de Ingeniería (ECR) documentada, evaluación de impacto y riesgo, revisión multifuncional por Ingeniería, Calidad, Producción, Compras y Proyectos, aprobación al nivel fijado por nuestra matriz de autorización, un plan de validación aprobado para cambios de alto riesgo, implementación piloto controlada, reinspección y revisión de eficacia, y cierre solo tras la revisión de documentos y la formación. Cualquier cambio que afecte a especificaciones, muestras, BOM, arte u criterios de aceptación aprobados por el cliente requiere además su aprobación escrita.'
  verified: '2026-09'

