cc_validation:
  tagline: Validación de Ingeniería
  title: Protocolo de Validación y Aceptación — Evidencia Sobre Afirmaciones
  body: |
    La redacción de aceptación vaga como *"el tornillo de banco reparado debe estar bien"* no se acepta. La redacción controlada es:

    > "La muestra retrabajada deberá cumplir los mismos criterios aplicables de dimensión, dureza, fuerza de sujeción, mano de obra visual y aceptación específica del proyecto que un tornillo de banco conforme, salvo que una desviación aprobada por el cliente defina específicamente un criterio alternativo."

    La evidencia de validación es cuantitativa, y la base de ingeniería para el retrabajo de tornillos de banco incluye:

    - **Fuerza de sujeción y retención de presión.** La fuerza de sujeción de las mordazas cumple la especificación de capacidad nominal sin deslizamiento sostenido bajo carga; el mecanismo de rosca y giro mantiene la carga nominal sin juego medible.
    - **Dureza.** Los insertos de mordaza (GCr15/Cr12MoV) alcanzan 58–62 HRC, verificados con durómetros calibrados tras el re-tratamiento térmico.
    - **Precisión dimensional.** El paralelismo de las mordazas, los diámetros de los orificios y el paso de rosca permanecen dentro de las tolerancias aprobadas tras el retrabajo, verificados con instrumentos de medición calibrados.
    - **Apariencia y mano de obra.** Sin defectos de recubrimiento, sin marcas de mecanizado fuera de tolerancia, sin distorsión del cuerpo, y sin desalineación de mordazas o base giratoria.

cc_engineering:
  tagline: Matriz de Ejecución de Ingeniería
  title: Parámetros Cuantificados de los Cuatro Procesos Básicos de Retrabajo
  subtitle: 'Cada proceso de retrabajo controlado lleva parámetros, metodología y criterios de aceptación definidos — los mismos números que siguen nuestros operarios y que nuestros clientes pueden verificar durante las auditorías.'
  headers:
    process: Proceso de Retrabajo
    parameters: Parámetros Controlados
    methodology: Metodología de Prueba
    acceptance: Criterios de Aceptación
  rows:
    - process: 'Reparación de Acabado / Recubrimiento Superficial'
      parameters: 'Preparación superficial a Sa2.5; espesor de recubrimiento 60–80 µm; curado a 180°C ± 10°C'
      methodology: 'Inspección visual bajo luz diurna; medición con medidor de espesor de película en 3 puntos'
      acceptance: 'Cero zonas descubiertas, cero chorreados; espesor dentro de 55–85 µm; sin ampollas ni pérdida de adherencia'
    - process: 'Re-Tratamiento de Dureza de Mordazas'
      parameters: 'Austenización 820–860°C; temple en aceite; revenido 150–200°C para insertos de mordaza GCr15/Cr12MoV'
      methodology: 'Prueba de dureza Rockwell en 3 posiciones por inserto; comprobación metalográfica de austenita retenida'
      acceptance: '58–62 HRC en todas las posiciones de prueba; sin grietas ni puntos blandos; estructura de grano según referencia ASTM'
    - process: 'Re-Roscado y Realineación de Mordazas'
      parameters: 'Paso de rosca según especificación; fijación con control de par; paralelismo de mordazas ≤ 0.05 mm'
      methodology: 'Inspección con calibre de rosca; medición con comparador de dial a través de las caras de las mordazas bajo carga nominal'
      acceptance: 'El calibre de rosca encaja limpiamente; paralelismo dentro de 0.05 mm; sin agarrotamiento en el giro o el mango'
    - process: 'Verificación Final de Fuerza de Sujeción y Giro'
      parameters: 'Fuerza de sujeción nominal por modelo; par del giro dentro de 8–15 N·m para gama media'
      methodology: 'Galga de fuerza calibrada en la cara de la mordaza; llave dinamométrica en la base giratoria en todo el giro'
      acceptance: 'Fuerza de sujeción ≥ especificación nominal; par del giro dentro de la ventana; sin juego lateral bajo carga'

cc_pokayoke:
  tagline: Salvaguardas Antierror
  title: 'Poka-Yoke: Bloques Duros que Detienen el Cambio No Controlado'
  subtitle: La norma se aplica no solo mediante procedimientos, sino mediante bloqueos físicos y a nivel de sistema que hacen imposible ejecutar cambios no controlados.
  features:
    - icon: 1
      icon_bg: blue
      title: Puerta ECR para el Desbloqueo de Utillaje
      desc: 'Las estaciones de retrabajo leen un código de barras ECR firmado por QA antes de que se desbloqueen los hornos de tratamiento térmico y las líneas de recubrimiento. Sin registro de control de cambios aprobado, sin suministro — la firma retroactiva ("cambiar primero, firmar después") se bloquea físicamente.'
    - icon: 2
      icon_bg: green
      title: Expiración Automática de la Desviación Temporal
      desc: 'Las desviaciones temporales están limitadas a tope en el sistema (por ejemplo un máximo de 50 tornillos de banco o 7 días naturales). Alcanzar el límite bloquea el lote e impide imprimir la etiqueta de pase de envío hasta que el cambio se evalúe formalmente.'
    - icon: 3
      icon_bg: purple
      title: Evidencia Mínima de Validación
      desc: 'Los cambios de alto riesgo requieren al menos 5 tornillos de banco de muestra representativos que cubran los límites de tolerancia superior e inferior, inspeccionados completamente por 2 inspectores de QC independientes, antes de poder emitir un informe de validación — un tornillo de banco reparado nunca se trata como validación de proceso.'
    - icon: 4
      icon_bg: orange
      title: Control de Documentos 1-A-Fuera-1-Adentro
      desc: 'Las tarjetas obsoletas de la estación de trabajo se recogen y cancelan físicamente (perforadas) antes de emitirse la nueva tarjeta sellada con el sello rojo controlado — las versiones antigua y nueva nunca comparten una estación de trabajo.'

