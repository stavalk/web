cc_intro:
  tagline: Alcance y Política
  title: Principios Básicos de Gobernanza
  body: |
    **Documento:** QMS-SOP-QC-CC-001 — *Estándar de Control de Cambios de Parámetros de Retrabajo* (Rev 2.0, Publicación Oficial). **Fabricante:** Stavalk, fabricante de tornillos de banco en Qingdao, China (distrito de Jimo). **Referencia de norma:** ISO 9001:2015 Sistemas de Gestión de la Calidad.

    - **Sin cambios no controlados.** Los cambios de parámetros de retrabajo deben pasar por control de cambios formal. A los operarios del taller, jefes de turno o un solo departamento nunca se les permite modificar parámetros de retrabajo aprobados por acuerdo verbal o anotación manuscrita en un registro de retrabajo.
    - **Cobertura completa de elementos.** El alcance controlado cubre fundición, forja, mecanizado CNC, tratamiento térmico, recubrimiento de superficie y ensamblaje — todo parámetro que pueda influir en la precisión dimensional, la dureza, la fuerza de sujeción, el acabado superficial, la aceptación del cliente o la trazabilidad.
    - **Límite de la aprobación del cliente.** Cualquier cambio que aleje el producto de la muestra aprobada por el cliente, especificación técnica, BOM, arte, requisito de embalaje o criterio de aceptación se implementa solo con aprobación escrita del cliente. Sin ella, el tornillo de banco se retrabaja según el requisito original, se sustituye o se rechaza — nunca se "relaja" por la fábrica sola.

cc_scope:
  tagline: Clasificación de Riesgo
  title: Alcance del Cambio y Clasificación de Riesgo
  subtitle: 'Cualquiera de los siguientes activa control de cambios formal — nunca se gestiona anotando una nota en el registro de retrabajo. El nivel de riesgo determina quién aprueba y cuánta validación se requiere.'
  headers:
    category: Categoría de Cambio
    examples: Ejemplos Típicos
    risk: Riesgo
    requirements: Requisitos de Control y Aprobación
  rows:
    - category: 'Materiales de Retrabajo'
      examples: 'Material de recubrimiento, abrasivo, grado de acero de templado, medio de tratamiento térmico o cambio de proveedor'
      risk: 'Alto'
      requirements: 'Revisión interdepartamental + validación de compatibilidad de material y dureza + visto bueno del cliente cuando corresponda'
    - category: 'Condiciones de Proceso'
      examples: 'Temperatura/tiempo de retención del tratamiento térmico, espesor de recubrimiento, presión de sujeción, temperatura de curado'
      risk: 'Alto'
      requirements: 'Aprobación de Ingeniería + Calidad con validación de la ventana definida de temperatura y tiempo'
    - category: 'Utillaje y Calibres'
      examples: 'Galgas de fuerza, durómetros, hornos de tratamiento térmico, utillaje CNC, llaves dinamométricas'
      risk: 'Medio/Alto'
      requirements: 'Comprobación de validez de calibración + evaluación de idoneidad del equipo'
    - category: 'Alcance del Defecto'
      examples: 'Ampliación del área de retrabajo; defecto superficial que crece hacia zonas críticas estructurales del cuerpo o de las mordazas'
      risk: 'Alto'
      requirements: 'Superficies estructurales portantes: detención obligatoria y reevaluación'
    - category: 'Métodos de Inspección'
      examples: 'Método de prueba de dureza, prueba de fuerza de sujeción con carga nominal, prueba de par del giro'
      risk: 'Alto'
      requirements: 'Aprobación de Calidad + confirmación del acuerdo técnico con el cliente'
    - category: 'Documentación y Autorización'
      examples: 'Instrucción de retrabajo, hojas de inspección, lógica de disposición del NCR, cualificación del operario'
      risk: 'Medio'
      requirements: 'Revisión controlada del documento (Rev A — Rev B) + registros de formación'

cc_containment:
  tagline: Regla de Detención Total
  title: Contención Inmediata Cuando las Condiciones se Agravan
  body: |
    > "El método de retrabajo existente se someterá a revisión y no se aplicará a producto afectado adicional hasta que el cambio sea evaluado y autorizado, salvo que una desviación temporal documentada sea aprobada por Calidad e Ingeniería."

    El método de retrabajo actual debe suspenderse inmediatamente cuando la reinspección del retrabajo sigue fallando, cuando el defecto afecta zonas estructurales portantes (cuerpo, mordazas, roscas, caras de sujeción), cuando un material sustitutivo aún no está validado, o cuando los parámetros actuales entran en conflicto con la especificación aprobada por el cliente.

    Las desviaciones temporales nunca se convierten en práctica permanente: cada una lleva una ventana de validez definida, alcance de lote aplicable, límite de cantidad, requisitos de validación y un mecanismo de expiración automática. Una excepción verbal no es una excepción — si no está documentada con su vencimiento, no existe.

cc_flow:
  tagline: Bucle Cerrado Estándar de 9 Pasos
  title: De la Solicitud de Cambio al Cierre y Conservación
  subtitle: 'Un bucle documentado para cada cambio de parámetro: proponer, cribar, evaluar, aprobar, validar, pilotar, verificar, revisar, cerrar.'
  steps:
    - step: '01'
      title: Solicitud de Cambio (ECR)
      desc: 'Cualquier departamento puede presentar una solicitud, pero Ingeniería, Calidad o Dirección de Producción la patrocinan. La ECR responde por qué se propone el cambio, qué cambia, qué se ve afectado y cómo se verificará — con número de control de cambios, NCR/CAPA relacionado, parámetro actual frente a propuesto, lotes afectados y clasificación temporal/permanente.'
    - step: '02'
      title: Cribado Inicial y Contención
      desc: 'La solicitud se criba primero para la contención inmediata: ¿debe detenerse el método actual ahora? Si se permite una desviación temporal, se limita por ventana de validez, alcance de lote, límite de cantidad y expiración automática.'
    - step: '03'
      title: Evaluación de Impacto y Riesgo
      desc: 'Ingeniería, Calidad, Producción, Compras/Cadena de Suministro y Proyectos evalúan el rendimiento del producto, los criterios de aceptación, la compatibilidad de materiales, el acabado superficial, la capacidad del proceso, el equipo y los calibres, la cualificación del personal, los requisitos del cliente, el cumplimiento y el alcance de trazabilidad.'
    - step: '04'
      title: Revisión Conjunta y Aprobación
      desc: 'La aprobación sigue la matriz de autorización fija — no "el que más grite". Los cambios de alto riesgo requieren aprobación interdepartamental y, cuando se requiere, aprobación escrita del cliente antes de cualquier prueba.'
    - step: '05'
      title: Plan de Validación
      desc: 'Para cambios de alto riesgo, se requiere un plan de validación aprobado antes de la aplicación rutinaria: tornillos de banco de muestra representativos, método actual frente a propuesto, métodos de prueba, criterios de aceptación, etapas de inspección, responsables y cronograma.'
    - step: '06'
      title: Piloto Controlado e Implementación
      desc: 'Se publican los nuevos documentos y se retiran los obsoletos marcados como OBSOLETO; los nuevos materiales y calibres se verifican y calibran; los operarios se forman y cualifican; el primer lote se ejecuta bajo inspección reforzada con identificación de estado clara.'
    - step: '07'
      title: Reinspección y Revisión de Eficacia
      desc: 'La tasa de retrabajo a la primera, la tasa de aprobación de reinspección, la tasa de recurrencia y la aceptación superficial se miden y revisan antes de considerar eficaz el cambio — un tornillo de banco reparado nunca se trata como validación de proceso.'
    - step: '08'
      title: Revisión de Documento y Formación
      desc: 'Las instrucciones de trabajo, hojas de inspección, opciones de disposición del NCR, tarjetas de parámetros y materiales de formación se actualizan a la nueva revisión con formación práctica registrada y cualificación del operario.'
    - step: '09'
      title: Cierre y Conservación de Registros
      desc: 'El cambio se cierra solo tras revisar y aprobar la evidencia de validación, las actualizaciones de documentos, los registros de formación y la eficacia de la implementación. Si no se logra el resultado previsto, el cambio se revisa, se amplía, se suspende o se retira.'

