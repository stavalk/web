factory_details:
  title: Capacidad de fabricación
  body: |
    La fábrica Stavalk opera cinco talleres especializados bajo un mismo techo:

    - **Taller de fundición**: Líneas de fundición en arena verde y arena aglomerante que vierten 100% HT200/HT250 según especificación, con verificación espectrométrica de la composición de la aleación.
    - **Taller de mecanizado**: Tornos y centros de fresado CNC para caras de mandíbula, husillos y bases, más mecanizado convencional para operaciones secundarias.
    - **Taller de tratamiento térmico**: Líneas de temple en aceite y revenido que producen dureza de mandíbula de 58–62 HRC en acero endurecido GCr15 y Cr12MoV.
    - **Taller de recubrimiento**: Líneas de pintura en spray, recubrimiento en polvo y Parkerizing para protección contra la corrosión y calidad de acabado.
    - **Ensamblaje y pruebas**: Líneas de ensamblaje manual con estaciones de prensa hidráulica para verificación de fuerza de sujeción, comprobación de par del girador y pruebas de durabilidad de 10.000+ ciclos.
factory_section:
  title: La fábrica de un vistazo
  body: |
    La instalación de Jimo, Qingdao está diseñada específicamente para la producción de tornillos de banco. Las materias primas —hierro gris HT200/HT250, acero forjado 45#, acero de mandíbula GCr15 y Cr12MoV— provienen de acerías chinas certificadas y se verifican con espectrómetro a su llegada.

    Las inspecciones de terceros de SGS, TÜV, Bureau Veritas e Intertek son bienvenidas y se facilitan rutinariamente. Los compradores reciben un paquete documental completo con cada envío: Certificado de Conformidad, certificado de material, informe dimensional y registros de inspección.
values_section:
  title: Cómo trabaja la fábrica con las marcas
  subtitle: 'Tres principios que configuran cada proyecto construido por Stavalk.'
  columns: 3
  items:
    - title: Ingeniería antes que producción
      description: 'Cada proyecto comienza con requisitos, planos y una muestra física — ancho de mandíbula, material del cuerpo, dureza de mandíbula, acabado y embalaje se validan antes de cualquier tirada de producción, no se descubren en la línea.'
      icon: 'tabler:settings'
    - title: Un solo equipo, una sola fábrica
      description: 'Fundición, mecanizado, tratamiento térmico, recubrimiento, ensamblaje y pruebas ocurren en una instalación de 8.000 m². Sin reenvíos de casas comerciales: las personas que responden a tus preguntas son las que construyen tus tornillos.'
      icon: 'tabler:building-factory-2'
    - title: Primeras tiradas pequeñas
      description: 'El MOQ estándar parte de 50–200 piezas; tornillos pesados y especiales desde 20–50 piezas. Las muestras se envían en 7–14 días, la producción a granel en 25–35 días, para que las marcas validen el mercado antes de comprometerse con el volumen completo.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Lo que entrega la fábrica
  subtitle: 'Servicios de fabricación disponibles para los clientes de Stavalk.'
  columns: 2
  items:
    - title: Desarrollo de tornillo de banco personalizado
      description: 'Evaluación de requisitos, especificaciones, selección de materiales, prototipado, aprobación de muestras y producción para tornillos de banco personalizados con tu marca y embalaje.'
      icon: 'tabler:bulb'
    - title: Producción de marca privada
      description: 'Tu logotipo, tus colores y tu embalaje sobre plataformas de tornillo de banco probadas — cuerpo, mandíbulas, husillo, base giratoria y cartones llevan tu identidad, sin marca de fábrica.'
      icon: 'tabler:tag'
    - title: Fabricación OEM / ODM
      description: 'Fabricación completa OEM y ODM de tornillos de banco a partir de planos del cliente o diseños co-desarrollados, incluyendo perfiles de mandíbula personalizados, geometrías de husillo y configuraciones de base giratoria.'
      icon: 'tabler:package'
    - title: Suministro de volumen y flotas
      description: 'Suministro de tornillos de banco a gran escala para cadenas de herramientas, distribuidores industriales y compradores institucionales, con calidad constante en reiteraciones de múltiples lotes.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certificación y cumplimiento
  subtitle: 'La fábrica envía a la UE, Estados Unidos y Asia-Pacífico con un sistema de cumplimiento documentado.'
  columns: 2
  items:
    - title: Marcado CE
      description: 'Los tornillos de banco cumplen EN ISO 12100 y la Directiva de Maquinaria 2006/42/EC para el mercado europeo. Documentación proporcionada para cada pedido.'
      icon: 'tabler:certificate'
    - title: ISO 9001:2015
      description: 'Sistema de gestión de calidad certificado según ISO 9001:2015, cubriendo material entrante, control en proceso e inspección final en las cinco series de productos.'
      icon: 'tabler:badge-check'
    - title: ISO 14001
      description: 'Certificación de sistema de gestión ambiental, cubriendo manejo de residuos, emisiones y eficiencia de recursos en todo el proceso de producción.'
      icon: 'tabler:leaf'
    - title: Cumplimiento RoHS
      description: 'Cumplimiento de sustancias peligrosas restringidas documentado según RoHS para componentes y recubrimientos superficiales aplicables.'
      icon: 'tabler:flask'
    - title: Inspección de terceros
      description: 'Inspección pre-embarque de SGS, TÜV, Bureau Veritas e Intertek disponible según ISO 2859-1 Nivel II, programada a elección del comprador.'
      icon: 'tabler:shield-check'
    - title: Pruebas de producto
      description: 'Fuerza de sujeción, dureza de mandíbula, par del girador, durabilidad de 10.000+ ciclos y niebla salina de 48+ horas en cada lote de producción.'
      icon: 'tabler:test-pipe'
values:
  tagline: Valores fundamentales
  title: Lo que impulsa a Stavalk
  items:
    - title: Ingeniería de precisión
      description: 'Mecanizado CNC, pruebas de dureza Rockwell y verificación dimensional por CMM aseguran que cada tornillo cumpla las tolerancias publicadas.'
      icon: 'tabler:ruler'
    - title: Integridad material
      description: 'Hierro gris HT200/HT250, acero forjado 45#, mandíbulas endurecidas GCr15/Cr12MoV — sin atajos de material, nunca.'
      icon: 'tabler:metal'
    - title: Confidencialidad del comprador
      description: 'Nunca vendemos bajo nuestra propia marca. Cada tornillo lleva tu identidad. Tus diseños y especificaciones están protegidos bajo NDA.'
      icon: 'tabler:lock'
    - title: Mejora continua
      description: 'La inversión en I+D en materiales de mandíbula, geometría de husillo, tecnología de recubrimiento y optimización de fuerza de sujeción impulsa cada generación de producto.'
      icon: 'tabler:trending-up'
