content_programs:
  title: Programmes de partenariat
  subtitle: Travaillez avec nous au niveau qui convient à votre activité — chaque programme ajuste l''engagement, les prix et le support de développement.
  body: |
    ### Fabrication OEM
    Produisez votre serre-joint sous votre propre marque. Nous gérons la coulée, l''usinage, le traitement thermique, le revêtement, les essais et l''inspection qualité selon votre spécification à Qingdao, Chine. MOQ dès 50 unités (20 pour les modèles lourds et spéciaux).

    ### Marque privée
    Séries standard Stavalk marquées à votre marque et votre emballage. La voie la plus rapide vers le marché avec un support de certification complet et une garantie de fond.

    ### Co-développement
    Co-développez une nouvelle série — largeur de mâchoire personnalisée, matériaux, finition, marque et ensembles d''accessoires — avec notre équipe d''ingénierie du dessin à la production.

    ### Distribution et revente
    Approvisionnement fiable en volume pour importateurs et distributeurs en Europe, Amériques, Asie-Pacifique et Moyen-Orient, avec des délais constants.
content_benefits:
  title: Pourquoi les partenaires choisissent Stavalk
  subtitle: Quatre raisons pour lesquelles les équipes recommandent.
  body: |
    - **Fabrication certifiée** — CE (EN ISO 12100, MD 2006/42/CE), ISO 9001:2015, ISO 14001 et RoHS dans toute l''usine.
    - **Liberté de conception** — OEM et séries personnalisées avec notre support d''ingénierie du dessin à la production.
    - **Échantillonnage rapide** — échantillons en 7–14 jours, commandes en volume en 25–35 jours, FOB Qingdao.
    - **Qualité auditable** — inspection en 7 étapes, essais en laboratoire, traçabilité de lot et rapports tiers SGS/TÜV/BV/Intertek.
content_process:
  title: Comment ça fonctionne
  subtitle: Un parcours clair et jalonné du premier contact aux commandes récurrentes.
  body: |
    1. **Partagez votre spécification** — envoyez votre plan, votre référence d''échantillon ou votre prix et quantité cibles.
    2. **Recevez une proposition** — revue d''ingénierie, chiffrage et plan d''échantillon en quelques jours ouvrés.
    3. **Approuvez un échantillon** — échantillon physique ou photo vérifié par rapport à votre dessin et à vos exigences.
    4. **Passez une commande en volume** — production avec inspection en 7 étapes pendant le processus et traçabilité de lot.
    5. **Expédition et support** — expédition FOB Qingdao, registre de documents, garantie et service de réapprovisionnement.
