hero:
  tagline: 'Choisissez votre voie de collaboration'
  title: 'OEM vs ODM vs Marque privée — quel modèle convient à votre projet ?'
  subtitle: 'Trois façons de travailler avec une usine d''étaux, chacune avec des compromis différents de propriété, d''investissement et de rapidité. Ce guide explique les différences pour que vous choisissiez la bonne voie avant votre première demande.'

answer:
  label: 'Comparaison rapide'
  text: 'OEM : vous possédez le design et la spécification — nous fabriquons selon vos dessins. ODM : notre équipe d''ingénierie développe l''étau à partir de votre brief — vous approuvez avant la production. Marque privée : votre marque sur une série existante éprouvée sans modification structurelle — voie la plus rapide vers le marché. Les trois voies passent par la même usine, le même système de QC et la même équipe d''export à Qingdao, en Chine.'
  verified: '2026-09'

comparison_table:
  tagline: 'Côte à côte'
  title: 'Comparaison OEM / ODM / Marque privée'
  subtitle: 'Principales différences en matière de propriété du design, MOQ, outillage, délai et propriété intellectuelle.'
  headers:
    dimension: Dimension
    oem: Fabrication OEM
    odm: Développement ODM
    pl: Marque privée
  rows:
    - dimension: 'Qui conçoit l''étau ?'
      oem: 'Vous fournissez la spécification, les dessins ou l''étau de référence'
      odm: 'L''équipe d''ingénierie de l''usine développe à partir de votre brief'
      pl: 'Série d''usine existante — aucun travail de design nécessaire'
    - dimension: 'Propriété du design et PI'
      oem: 'Vous possédez tous les designs, l''outillage et la propriété intellectuelle'
      odm: 'Vous possédez le design final approuvé ; l''usine détient la PI du processus de développement'
      pl: 'L''usine détient le design de la série ; vous possédez votre marque et vos graphismes'
    - dimension: 'Moule / outillage'
      oem: 'Moule de coulée personnalisé requis pour les nouveaux corps — frais d''outillage uniques, 15 à 20 jours supplémentaires'
      odm: 'Peut exiger un moule de coulée personnalisé selon la spéc. — même calendrier d''outillage'
      pl: 'Pas de nouveau moule — l''outillage de série existant est utilisé'
    - dimension: 'Quantité minimale de commande'
      oem: '50 à 200+ unités par configuration approuvée'
      odm: '50 à 200+ unités par configuration approuvée ; lots pilotes dès 20 à 50'
      pl: '20+ unités (co-marquage) ou 20 à 50 (lot pilote sur série existante)'
    - dimension: 'Délai typique'
      oem: '25 à 35 jours + 15 à 20 jours d''outillage si nouveau moule'
      odm: '25 à 35 jours + temps d''itération du développement (varie selon la complexité)'
      pl: '25 à 35 jours (aucun délai d''outillage)'
    - dimension: 'Niveau de personnalisation'
      oem: 'Complet — largeur de mâchoire, ouverture, série du corps, matériaux, marque, emballage'
      odm: 'Complet — l''usine propose, vous approuvez chaque élément'
      pl: 'Marque et emballage uniquement — aucune modification structurelle'
    - dimension: 'Processus d''échantillon'
      oem: '1 à 2 échantillons de prototype en 7 à 14 jours après approbation de la spéc.'
      odm: '1 à 2 échantillons de prototype en 7 à 14 jours après approbation du design'
      pl: '1 à 2 échantillons en 7 à 14 jours — série déjà validée'
    - dimension: 'Idéal pour'
      oem: 'Les acheteurs avec des designs existants, des étaux de référence ou des spéc. détaillées'
      odm: 'Les acheteurs avec des idées de produit ou des exigences de marché mais sans spéc. détaillée'
      pl: 'Les acheteurs qui ont besoin d''étaux marqués rapidement sans développement de produit'

