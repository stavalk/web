ip_rules:
  tagline: 'Protection de la propriété intellectuelle'
  title: 'Comment nous protégeons vos designs et votre marque'
  subtitle: 'Quel que soit le modèle de collaboration, vos graphismes, votre outillage et vos fichiers de spécification restent votre propriété.'
  body: |
    **NDA avant l''échange de fichiers.** Nous signons un accord de non-divulgation avant tout échange technique de fichiers — le délai de réponse standard est de 4 heures ouvrées.

    **Pas de réutilisation du design.** Vos graphismes, votre outillage et vos fichiers de spécification ne sont jamais partagés avec ou vendus à d''autres clients. Les moules de coulée OEM vous appartiennent exclusivement. Les designs ODM sont approuvés par vous avant la production. Les plateformes Marque privée sont des structures partagées, mais vos graphismes et votre marque sont exclusifs.

    **B2B uniquement.** Nous fabriquons exclusivement sous les marques de nos clients. Nous ne vendons pas aux consommateurs finaux et ne concurrençons pas nos clients sur aucun marché.

    **Propriété de l''outillage.** Les moules de coulée personnalisés payés par l''acheteur appartiennent à l''acheteur. Nous les stockons et les entretenons, mais ne pouvons pas les utiliser pour d''autres clients sans autorisation écrite.

faqs:
  tagline: 'FAQ'
  title: 'Questions courantes sur OEM, ODM et Marque privée'
  items:
    - q: 'Puis-je passer de la marque privée à l''OEM plus tard ?'
      a: 'Oui. De nombreux clients commencent par un lot de marque privée ou pilote pour valider le marché, puis investissent dans un outillage personnalisé pour un programme OEM complet une fois la demande prouvée. La même usine et le même système de QC soutiennent les deux voies.'
    - q: 'ODM signifie-t-il que l''usine possède ma marque ?'
      a: 'Non. En ODM, vous possédez votre marque, vos graphismes et votre emballage. L''usine développe la structure de l''étau à partir de votre brief et vous approuvez le design avant la production. L''usine conserve la PI du processus de développement, mais la spécification de produit approuvée est la vôtre.'
    - q: 'La marque privée est-elle de qualité inférieure à l''OEM ?'
      a: 'Non. Les trois voies passent par la même usine, le même système de QC et la même équipe d''export. Les étaux de marque privée sont construits sur des séries éprouvées et validées avec des tests complets de force de serrage, de dureté de mâchoire et le même système d''inspection à 7 étapes.'
    - q: 'Que faire si je ne suis pas sûr du modèle à choisir ?'
      a: 'Contactez-nous avec votre situation — notre équipe d''ingénierie recommandera la voie la plus pratique en fonction de vos exigences produit, de votre calendrier et de vos objectifs de volume. Aucun engagement exigé avant l''examen de la spécification.'
    - q: 'Puis-je obtenir des échantillons avant de m''engager dans un modèle ?'
      a: 'Oui. 1 à 2 échantillons de prototype partent en 7 à 14 jours. Le coût de l''échantillon est crédité sur votre commande en gros. Cela vous permet d''évaluer la construction et la qualité avant tout engagement de volume.'

