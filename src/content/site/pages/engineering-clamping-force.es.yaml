answer:
  label: 'Respuesta directa'
  text: 'Una tornamesa convierte el torque del mango en fuerza de sujeción mediante un solo mecanismo: un husillo de rosca trapezoidal (estilo ACME), girado por un mango, que empuja la mordaza móvil por la corredera. La fuerza depende del paso y diámetro de la rosca, la longitud del mango, la fricción de la corredera y la rigidez del cuerpo — un paso grueso multiplica la fuerza por vuelta y resiste el aflojamiento, un mango más largo da más palanca, y un cuerpo rígido de hierro fundido o acero forjado convierte esa fuerza en las mordazas en lugar de flexionarse. En la serie pesada de acero forjado Stavalk, este sistema desarrolla fuerza de sujeción en el rango de 2.000–8.000 lbf, y el conjunto de husillo es una unidad reemplazable y serviable.'
  verified: '2026-09'

