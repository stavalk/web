clamp_notes:
  tagline: Notas de Sujeción
  title: 'Por Qué el Mecanismo Importa Más Que el Mango'
  body: |
    **El diseño de la rosca define el carácter de la tornamesa.** Una rosca trapezoidal hace dos trabajos a la vez: convierte el torque en fuerza lineal potente, y su ángulo de flanco resiste que el husillo retroceda bajo carga. Un paso grueso hace que cada vuelta viaje más y sujete más fuerte — por eso las tornamesas pesadas se sienten "positivas" y se mantienen sujetas, mientras que roscas finas baratas retroceden. Los tornillos de corredera también se endurecen por inducción y se someten a ciclos para verificar una sujeción suave y precisa, sin agarrotamiento en todo el rango.

    **La fuerza es el producto, no la promesa.** La capacidad de sujeción es un número diseñado: la geometría de la rosca, la longitud del mango, la sección y el grado del material se eligen juntos para alcanzar una fuerza objetivo. La serie pesada de acero forjado está diseñada para 2.000–8.000 lbf de fuerza de sujeción con el cuerpo y la corredera dimensionados para que el mecanismo no fluya al tope del rango — y el conjunto de tornillo reemplazable mantiene la tornamesa serviable cuando un husillo finalmente se desgasta.

    **Las correderas se miden en milésimas.** La mordaza móvil viaja sobre canales y guías mecanizados con precisión posicional de 0,05 mm. Si la corredera se agarrota, parte de cada vuelta se pierde venciendo fricción en vez de sumar fuerza; si queda floja, la mordaza se inclina bajo carga y el agarre colapsa en una esquina. La combinación de mecanizado preciso y cuerpo rígido es lo que permite que un esfuerzo modesto de mango produzca un agarre genuinamente industrial.

    **La base giratoria y el yunque son parte del camino de carga.** En modelos con base giratoria toda la reacción de sujeción pasa por el mecanismo de bloqueo de la base, que debe mantener el cuerpo escuadrado mientras se aplica fuerza — la razón por la que las bases giratorias usan bloqueos delantero y trasero. En modelos con yunque, la misma rigidez que sostiene la fuerza de sujeción también soporta el trabajo a golpe.

faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre Fuerza de Sujeción'
  items:
    - q: '¿Cuánta fuerza de sujeción desarrolla una tornamesa Stavalk?'
      a: 'La capacidad de sujeción escala con la serie y el ancho de mordaza. La serie pesada de acero forjado 45# está diseñada para 2.000–8.000 lbf de fuerza según el modelo; las series estándar de hierro fundido se dimensionan para su clase de servicio.'
    - q: '¿Por qué las roscas del husillo son trapezoidales?'
      a: 'Una rosca trapezoidal (estilo ACME) combina alta capacidad de carga con poco juego y resiste el aflojamiento bajo carga — la geometría correcta para un husillo que debe sostener fuerza de sujeción todo el día.'
    - q: '¿Es reemplazable el husillo?'
      a: 'Sí. El conjunto de tornillo es una unidad reemplazable en las tornamesas Stavalk, lo que mantiene el cuerpo en servicio en uso industrial pesado si un husillo se desgasta.'
    - q: '¿Cómo se verifica la sujeción suave?'
      a: 'Cada tornillo de corredera se somete a ciclos para verificar una sujeción suave y precisa sin agarrotamiento en todo el rango de apertura antes del empaque. Los registros de ciclos y fuerza están disponibles bajo petición.'

