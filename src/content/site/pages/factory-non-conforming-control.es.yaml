nc_intro:
  tagline: Control de Productos No Conformes
  title: Qué Ocurre Cuando un Producto No Cumple los Criterios
  body: |
    Los productos o componentes que no cumplen los criterios de aceptación definidos se identifican y controlan para evitar su uso no intencionado, procesamiento adicional o envío. Los criterios de aceptación aplicables se basan en la muestra aprobada, la especificación técnica, el arte, la lista de materiales, los requisitos de embalaje y el plan de inspección del proyecto.

    Los artículos no conformes se evalúan para determinar el alcance afectado y la disposición apropiada. Según el problema, el artículo puede mantenerse en espera, retrabajarse bajo instrucciones controladas, sustituirse, rechazarse o gestionarse mediante un proceso aprobado. Los artículos retrabajados o corregidos se reinspeccionan antes de la liberación. La liberación del envío solo se permite tras completar los registros de calidad pertinentes y que el producto cumpla los criterios de aceptación aplicables.

nc_flow:
  tagline: Bucle Cerrado Estándar de 7 Pasos
  title: De la Identificación a la Acción Correctiva
  subtitle: 'Un bucle controlado para cada no conformidad: identificar, poner en cuarentena, revisar, retrabajar o sustituir, reinspeccionar, liberar o rechazar, mejorar.'
  steps:
    - step: '01'
      title: Identificar
      desc: 'Cada no conformidad identificada se registra contra el producto, lote o componente afectado y se evalúa contra los requisitos del proyecto aplicables. La detección puede ocurrir en el material entrante, control en proceso, prueba final, embalaje o inspección del cliente/terceros.'
    - step: '02'
      title: Poner en Cuarentena
      desc: 'Los artículos se identifican claramente y se colocan bajo estado de espera controlado o cuarentena para evitar uso no intencionado, procesamiento adicional o envío. Las etiquetas HOLD / QUARANTINE / REJECTED llevan el número de NCR, SKU, lote, cantidad, descripción del defecto y fecha.'
    - step: '03'
      title: Revisar
      desc: 'Se evalúan el alcance afectado y la disposición apropiada: unidad individual, lote de turno, lote completo o múltiples lotes — a través de lotes de material compartidos, revisiones de arte, etapas de proceso y revisiones de documento. Se aplica contención adicional o inspección reforzada cuando se requiere.'
    - step: '04'
      title: Retrabajo o Sustitución
      desc: 'El retrabajo permitido sigue instrucciones aprobadas que identifican el artículo afectado, método, materiales, puntos de inspección y requisitos de reinspección. Nunca se permiten cambios no aprobados a la especificación del producto, el arte, la configuración de accesorios o el embalaje. Los artículos de sustitución reingresan a las puertas de inspección aplicables.'
    - step: '05'
      title: Reinspección
      desc: 'Los artículos retrabajados o corregidos se reinspeccionan contra los criterios de aceptación aplicables. La característica fallida original y cualquier característica relacionada potencialmente afectada por el retrabajo se verifican antes de la liberación — por QC independiente, y con un ciclo de prueba completo nuevo de dureza y fuerza de sujeción cuando el retrabajo tocó el tratamiento térmico o las superficies de sujeción.'
    - step: '06'
      title: Liberar o Rechazar
      desc: 'El producto solo se libera tras completar la reinspección requerida y que el personal de calidad autorizado confirme la conformidad con los requisitos aplicables del proyecto. Los artículos que no se pueden llevar a la conformidad se rechazan, sustituyen, devuelven o gestionan bajo procedimientos controlados — incluida la destrucción física presenciada.'
    - step: '07'
      title: Acción Correctiva
      desc: 'Las no conformidades repetidas, significativas o sistémicas se revisan para la causa raíz y la acción correctiva (CAPA). Las mejoras pueden incluir actualizaciones de instrucciones de trabajo, controles de material, puntos de inspección, formación, gestión de proveedores o control de documentos.'

nc_pillars:
  tagline: Pilares de Confianza del Comprador
  title: Tres Controles que Protegen Tu Marca
  subtitle: 'El proceso está diseñado en torno a las preguntas que realmente hacen los compradores extranjeros: ¿se ocultarán los problemas?, ¿se descontrolará el retrabajo?, y ¿se re-verificarán los tornillos de banco reparados?'
  features:
    - icon: 1
      icon_bg: blue
      title: Solo Instrucciones Controladas
      desc: 'El retrabajo se rige estrictamente por Instrucciones de Retrabajo Estándar (SRI) autorizadas. Se prohíben estrictamente las alteraciones de campo no aprobadas, el cambio de especificaciones o la modificación del arte sin autorización escrita.'
    - icon: 2
      icon_bg: green
      title: Reinspección Independiente
      desc: 'Los tornillos de banco retrabajados se someten a reinspección al 100% por inspectores de QA contra los criterios de aceptación originales. El retrabajo de tratamiento térmico o superficies de sujeción requiere un ciclo de prueba completo nuevo de dureza y fuerza de sujeción — nunca una re-comprobación parcial.'
    - icon: 3
      icon_bg: purple
      title: Firma Autorizada y Trazabilidad
      desc: 'La liberación del envío solo se permite tras la documentación completa del NCR y la firma autorizada de QC, con el estado del lote pasando de HOLD a RELEASED. Las desviaciones sistémicas o repetidas activan automáticamente los flujos de trabajo CAPA de causa raíz.'

