faqs:
  tagline: FAQ
  title: FAQ de Calidad y Control de Defectos para Compradores Globales
  items:
    - q: '¿Cómo garantizan que los tornillos de banco retrabajados cumplen todos los estándares de seguridad?'
      a: 'Cualquier tornillo de banco retrabajado se trata como una unidad nueva y debe completar exactamente el mismo ciclo de prueba completo desde cero — para el retrabajo de tratamiento térmico o superficies de sujeción, un ciclo completo nuevo de dureza y fuerza de sujeción. Los inspectores de QC independientes, no los operarios de retrabajo, realizan la validación de liberación.'
    - q: '¿Enviará la fábrica tornillos de banco con desviaciones cosméticas menores sin avisarnos?'
      a: 'Nunca. Cualquier desviación que afecte a las muestras doradas aprobadas por el cliente, el arte del logotipo, los colores o el embalaje requiere un Acuerdo de Concesión escrito formal firmado por el cliente antes de la liberación del envío.'
    - q: '¿Qué ocurre si un tornillo de banco retrabajado falla la reinspección?'
      a: 'El tornillo de banco no se libera. Vuelve a una nueva revisión de disposición, y si no se puede llevar a la conformidad se sustituye, rechaza o destruye bajo el protocolo de chatarra presenciada. El fallo repetido de la misma clase de defecto activa el CAPA de causa raíz.'
    - q: '¿Pueden venderse los tornillos de banco rechazados como segundas calidades o por otros canales?'
      a: 'No. Los tornillos de banco fuera de especificación no retrabajables se destruyen físicamente bajo el protocolo de chatarra presenciada — herrajes cortados, cuerpo seccionado, video registrado con hash SHA-256 y archivado durante al menos 5 años. El Certificado de Chatarra y Destrucción lo firman el Director de QA y el Gerente de Planta.'
    - q: '¿Cómo se evalúa el alcance afectado cuando se encuentra un defecto?'
      a: 'El alcance se revisa por identificación del producto, lote de producción, lote de material o componente, etapa de proceso y revisión de documento aplicable. Si está involucrado el mismo lote de material, revisión de arte o estación de trabajo, los productos afectados se contienen y se comprueban en consecuencia.'
    - q: '¿Necesitan nuestra aprobación antes de hacer una concesión?'
      a: 'Sí. Cualquier aceptación bajo una concesión documentada que afecte a los requisitos del cliente — muestras aprobadas, especificación, arte, embalaje o criterios de aceptación — requiere la aprobación escrita del cliente antes de la liberación. Sin ella, el producto se retrabaja según el requisito original, se sustituye o se rechaza.'
    - q: '¿Qué documentación recibimos por una no conformidad?'
      a: 'El registro NCR cubre el número de NCR, la etapa de detección, producto/SKU, lote, revisiones de documento aplicables, descripción del defecto, contención, disposición, referencia de la instrucción de retrabajo, resultado de la reinspección y aprobación de liberación o cierre — disponible según su acuerdo de calidad del proyecto.'

