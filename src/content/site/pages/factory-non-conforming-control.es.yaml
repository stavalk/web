nc_severity:
  tagline: Severidad del Defecto y Autoridad
  title: Clasificación de Severidad y Autoridad de Disposición
  subtitle: No toda no conformidad se maneja al mismo nivel — la autoridad de disposición escala con la severidad del defecto, desde la firma a nivel de línea hasta el Comité de Revisión de Material y la concesión del cliente.
  headers:
    severity: Severidad
    examples: Ejemplos Típicos
    authority: Autoridad de Disposición y Control
    control: Condición de Liberación
  rows:
    - severity: 'Menor'
      examples: 'Arruga de esquina de caja, ligera imperfección decorativa no crítica, pequeña mancha de óxido en una superficie no crítica'
      authority: 'Responsable de QC de sección + supervisor de línea, firma en sitio, sustituir o liberar'
      control: 'Registrado en el NCR; sin impacto en la función del producto ni en los requisitos del cliente'
    - severity: 'Mayor'
      examples: 'Dureza de mordaza por debajo de la especificación en una zona de prueba, desalineación de mordazas fuera de tolerancia (>0.05 mm), accesorio faltante'
      authority: 'El Gerente de QC + el Ingeniero Técnico emiten una instrucción de retrabajo controlada (SRI)'
      control: 'Re-test independiente al 100% de la característica fallida original y las afectadas antes de la liberación'
    - severity: 'Crítico'
      examples: 'Grieta del cuerpo de fundición en una zona portante, daño en tornillo/rosca, fuerza de sujeción por debajo de la capacidad nominal, impresión incorrecta del logotipo del cliente o desviación de color'
      authority: 'Decisión del Comité de Revisión de Material (MRB); concesión escrita del cliente cuando se requiere'
      control: 'Sin liberación sin concesión autorizada; de lo contrario, destrucción física presenciada obligatoria'

nc_matrix:
  tagline: Matriz de Protocolo de Ingeniería
  title: Matriz de Disposición y Reinspección de Defectos del Tornillo de Banco
  subtitle: Protocolos de ingeniería estándar aplicados a las desviaciones de fabricación más comunes — los mismos parámetros cuantificados que los clientes pueden verificar durante las auditorías.
  headers:
    defect: Categoría de Defecto
    protocol: Protocolo de Disposición Controlada
    validation: Reinspección Independiente y Validación
  rows:
    - defect: 'Defecto de Recubrimiento Superficial'
      protocol: 'Aislar el tornillo de banco. Decapar y re-preparar la superficie a Sa2.5 con un abrasivo aprobado, re-aplicar el recubrimiento en polvo y curar a 180°C ± 10°C.'
      validation: 'Inspección visual bajo luz diurna; medición con medidor de espesor de película en 3 puntos; prueba de adherencia — espesor dentro de 55–85 µm, cero zonas descubiertas.'
    - defect: 'Dureza de Mordaza Por Debajo de la Especificación'
      protocol: 'Poner el lote de turno en cuarentena. Re-tratar los insertos de mordaza por tratamiento térmico controlado: austenización 820–860°C, temple en aceite, revenido 150–200°C para GCr15/Cr12MoV.'
      validation: 'Re-test de dureza Rockwell al 100% en 3 posiciones por inserto — 58–62 HRC en todas las posiciones; comprobación metalográfica de austenita retenida.'
    - defect: 'Desalineación de Mordazas'
      protocol: 'Re-alinear las mordazas con una plantilla de posicionamiento de precisión; re-fijar con fijación de par controlado; verificar el paso de rosca.'
      validation: 'Verificación de tolerancia de holgura (paralelismo ≤ 0.05 mm), medición con comparador de dial a través de las caras de las mordazas, comprobación de rosca al 100%.'
    - defect: 'Impresión Incorrecta de Marca / Logotipo'
      protocol: 'Parada inmediata de la línea de marcado. Mantener en espera todas las piezas marcadas. Revisar la revisión vectorial con el cliente; cero alteraciones no aprobadas.'
      validation: 'Comprobación de color con espectrofotómetro (ΔE ≤ 1.5); verificación visual de la alineación del texto al 100% contra el PDF vectorial maestro firmado por el cliente.'
    - defect: 'Discrepancia de Embalaje / SKU Faltante'
      protocol: 'Poner la paleta de exportación en cuarentena. Desembalar y realizar una comprobación de BOM detallada al 100% (tornillo de banco, mango, base, herrajes de montaje, manual).'
      validation: 'Validación con pesadora dinámica electrónica en línea (±30 g de variación); verificación con escáner óptico de código de barras 2D.'

nc_scrap:
  tagline: Cero Fugas al Mercado
  title: Chatarra y Destrucción Presenciada — Protocolo Antidesvío de Cero Defectos
  body: |
    Los socios de marca extranjeros necesitan certeza de que los tornillos de banco rechazados nunca llegarán al comercio minorista secundario, mercados grises o canales de comercio electrónico. Los tornillos de banco que no se pueden llevar a la conformidad se destruyen bajo un protocolo presenciado y registrado:

    **1. Corte de herrajes y estructura.** Bajo supervisión del Director de QA, una cizalla hidráulica elimina el mango, la base giratoria, los pernos de montaje y todo el herraje de sujeción. El tornillo y el husillo roscado se cortan en la raíz del cuerpo, eliminando cualquier componente recuperable.

    **2. Seccionado del cuerpo y destrucción de la rosca.** El cuerpo de hierro fundido se corta transversalmente con cortes cruzados profundos y las superficies de trabajo reforzadas se seccionan en al menos 4 segmentos — destruyendo permanentemente la capacidad de sujeción y cualquier posibilidad de reensamblaje o reutilización.

    **3. Bóveda de video y fotos.** La destrucción se registra como un video 1080p sin cortes con primeros planos del código de barras serial, el proceso de cizallado, el seccionado del cuerpo y la pila de chatarra pesada final. El video se somete a hash (SHA-256) y se archiva en un servidor controlado durante al menos 5 años.

    **4. Eliminación de chatarra certificada.** Todos los fragmentos de hierro fundido y acero se pesan, se registran en el libro de salidas y se transportan solo a socios de reciclaje de metales cualificados — ningún residuo sale de las instalaciones por ningún otro canal.

    > **Garantía de protección de marca:** Stavalk garantiza la destrucción al 100% de los tornillos de banco fuera de especificación no retrabajables. Cero segundas calidades o unidades comprometidas entrarán jamás en el comercio minorista secundario, mercados grises o canales de comercio electrónico. El Certificado de Chatarra y Destrucción (VAT-QA-SCRAP-CERT-2026) registra el producto, lote, conclusión del MRB, fotos de testigos y la doble firma del Director de QA y el Gerente de Planta.

