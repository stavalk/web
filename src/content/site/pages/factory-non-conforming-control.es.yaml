answer:
  label: 'Respuesta directa'
  text: 'Los productos no conformes nunca se ocultan, se retrabajan informalmente ni se liberan sin verificación en Stavalk. Cada no conformidad identificada se registra contra el producto, lote o componente afectado y se vincula a un NCR. El artículo se etiqueta (HOLD / QUARANTINE / REJECTED), se segrega físicamente, y el alcance afectado se evalúa por lote, lote de material, etapa de proceso y revisión de documento. La disposición se decide en el nivel de autoridad acorde con la severidad del defecto: los problemas menores se firman a nivel de línea, los mayores requieren una disposición de Gerente de QC + Ingeniero Técnico con instrucción de retrabajo controlada y reinspección independiente al 100%, y los críticos requieren una decisión del Comité de Revisión de Material con concesión escrita del cliente cuando se requiere — de lo contrario, destrucción presenciada obligatoria. Los artículos retrabajados se reinspeccionan contra los criterios de aceptación originales, las reparaciones de dureza y fuerza de sujeción reciben un ciclo de prueba completo nuevo, y la liberación del envío ocurre solo tras la firma de calidad autorizada. Los problemas repetidos o sistémicos activan la acción correctiva de causa raíz (CAPA).'
  verified: '2026-09'

