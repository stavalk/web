hero:
  tagline: Technologie
  title: Conçu pour la précision et la résistance
  subtitle: Chaque serre-joint Stavalk est conçu par coulée en sable vert et aggloméré, usinage CNC, trempe à l''huile et revêtement de précision — des méthodes de production testées pour la force de serrage, la durabilité et la dureté.
  actions:
    - variant: primary
      text: Centre de R&D
      href: /fr/randdcenter
sections:
  title: Les processus derrière un serre-joint Stavalk
  subtitle: Quatre technologies de production se combinent pour offrir une force de serrage constante, une dureté de mâchoire et une résistance à la corrosion dans chaque série.
  items:
    - title: Procédé de coulée en sable
      description: Les corps en fonte grise HT200/HT250 sont coulés sur des lignes de sable vert et aggloméré, validés selon spécification par spectromètre. Le résultat est un corps solide et amortissant les vibrations, la colonne vertébrale de chaque serre-joint.
      link: /fr/technology/sand-casting-process
      link_label: Lire l''article
    - title: Précision d'usinage CNC
      description: Les faces de mâchoire, les arbres et les bases sont usinés sur des tours et centres de fraisage CNC pour une précision dimensionnelle constante, avec CMM et pieds à coulisse qui vérifient chaque dimension critique.
      link: /fr/technology/cnc-machining-precision
      link_label: Lire l''article
    - title: Dureté de mâchoire par traitement thermique
      description: Les mâchoires en acier trempé GCr15 et Cr12MoV sont trempées à l''huile et revenues à 58–62 HRC, vérifiées par essai de dureté Rockwell pour la résistance à l''usure et une longue durée de vie.
      link: /fr/technology/heat-treatment-jaw-hardness
      link_label: Lire l''article
    - title: Revêtement et finition de surface
      description: Les lignes de peinture par pulvérisation, de revêtement en poudre et de Parkerizing protègent les corps et les mâchoires de la corrosion et de l''usure. Les finitions sont testées au brouillard salin pendant plus de 48 heures pour confirmer leur durabilité.
      link: /fr/technology/surface-coating-and-finishing
      link_label: Lire l''article
