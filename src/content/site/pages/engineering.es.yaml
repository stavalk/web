faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre Ingeniería de Tornamesas'
  items:
    - q: '¿Por qué la ingeniería de la tornamesa importa más que la lista de piezas?'
      a: 'Dos tornamesas con el mismo ancho de mordaza pueden comportarse de forma completamente distinta. La fuerza de sujeción, el paralelismo de mordazas, la suavidad del tornillo y la vida útil dependen del grado del material, las tolerancias mecanizadas, el tratamiento térmico y el diseño de la corredera. Un comprador que compara tornamesas sobre papel debe pesar estas decisiones de ingeniería, no solo las dimensiones.'
    - q: '¿Es el hierro gris mejor que el hierro dúctil o el acero forjado?'
      a: 'Cada uno sirve a una clase de servicio. El hierro gris (HT200/HT250) ofrece excelente rigidez y amortiguación para tornamesas estándar a un costo competitivo. El hierro dúctil añade resiliencia al impacto para uso más duro en taller. El acero forjado 45# entrega la mayor resistencia a la tracción y se usa en series industriales pesadas donde dominan la carga y los golpes.'
    - q: '¿Cómo se verifica la dureza de las mordazas?'
      a: 'Cada cara de mordaza se prueba a 58–62 HRC antes del empaque y las lecturas se registran por lote. Los registros de dureza, copias de certificados y la trazabilidad de lotes están disponibles bajo NDA.'
    - q: '¿Dónde se diseñan y fabrican las tornamesas Stavalk?'
      a: 'Diseño, fundición, mecanizado, tratamiento térmico y pruebas se realizan en la planta de Stavalk en Jimo, Qingdao, China. No hay separación diseño-producción entre el piso de I+D y la fundición.'
    - q: '¿Puede Stavalk diseñar una tornamesa personalizada para mi marca?'
      a: 'Sí. Anchos de mordaza personalizados, cuerpos fundidos, tipos de corredera, paso de rosca, materiales de mordaza e insertos endurecidos se desarrollan bajo NDA a partir de un brief técnico. Consulta las páginas de OEM y ODM para el proceso de cooperación.'

