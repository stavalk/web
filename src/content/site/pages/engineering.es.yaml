      title: Material Primero
      desc: 'El grado correcto de hierro gris, hierro dúctil o acero forjado para cada clase de servicio, seleccionado antes de comenzar el mecanizado. Hierro gris HT200/HT250 para cuerpos fundidos estándar, hierro dúctil donde el riesgo de impacto es mayor, acero forjado 45# para las series más pesadas.'
    - icon: P
      icon_bg: green
      title: Mecanizado de Precisión
      desc: 'Caras de mordaza, guías y canales de corredera mecanizados por CNC con precisión posicional de 0,05 mm, manteniendo las caras de mordaza paralelas y el tornillo recto bajo carga.'
    - icon: T
      icon_bg: blue
      title: Control de Dureza
      desc: 'Caras de mordaza y tornillos de corredera endurecidos por inducción a 58–62 HRC, con dureza controlada verificada en cada lote antes del empaque.'
    - icon: C
      icon_bg: green
      title: Diseño Primero la Sujeción
      desc: 'Geometría del husillo de rosca trapezoidal, holgura de rodamientos y pre-carga de la corredera diseñados en torno a una pregunta: cuántos ciclos de sujeción puede soportar esta tornamesa antes de que el desgaste cambie el agarre.'

