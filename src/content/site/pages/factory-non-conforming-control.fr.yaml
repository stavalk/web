faqs:
  tagline: FAQ
  title: FAQ Qualité et Maîtrise des Défauts pour les Acheteurs Mondiaux
  items:
    - q: 'Comment garantissez-vous que les étaux retouchés respectent toutes les normes de sécurité ?'
      a: 'Tout étau retouché est traité comme une unité neuve et doit refaire exactement le même cycle d’essai complet depuis zéro — pour la retouche de traitement thermique ou de surfaces de serrage, un cycle complet neuf de dureté et de force de serrage. Les contrôleurs QC indépendants, et non les opérateurs de retouche, effectuent la validation de libération.'
    - q: 'L’usine expédiera-t-elle des étaux avec des déviations cosmétiques mineures sans nous prévenir ?'
      a: 'Jamais. Toute déviation affectant les échantillons dorés approuvés par le client, l’œuvre du logo, les coloris ou l’emballage exige un Accord de Concession écrit formel signé par le client avant la libération d’expédition.'
    - q: 'Que se passe-t-il si un étau retouché échoue à la contre-inspection ?'
      a: 'L’étau n’est pas libéré. Il retourne à un nouvel examen de disposition, et s’il ne peut pas être rendu conforme, il est remplacé, rejeté ou détruit sous le protocole de ferraille témoignée. L’échec répété de la même classe de défaut déclenche une CAPA de cause racine.'
    - q: 'Les étaux rejetés peuvent-ils être vendus comme secondes qualités ou par d’autres canaux ?'
      a: 'Non. Les étaux hors spécification non retouchables sont physiquement détruits sous le protocole de ferraille témoignée — accessoires cisaillés, corps sectionné, vidéo enregistrée avec hachage SHA-256 et archivée pendant au moins 5 ans. Le Certificat de Mise à la Ferraille et de Destruction est signé par le Directeur AQ et le Responsable d’Usine.'
    - q: 'Comment la portée affectée est-elle évaluée quand un défaut est trouvé ?'
      a: 'La portée est examinée par identification du produit, lot de production, lot de matière ou de composant, étape de procédé et révision de document applicable. Si le même lot de matière, la même révision d’œuvre ou le même poste est impliqué, les produits affectés sont contenus et vérifiés en conséquence.'
    - q: 'Avez-vous besoin de notre approbation avant d’accorder une concession ?'
      a: 'Oui. Toute acceptation sous une concession documentée qui affecte les exigences client — échantillons approuvés, spécification, œuvre, emballage ou critères d’acceptation — exige l’approbation écrite du client avant la libération. Sans elle, le produit est retouché selon l’exigence d’origine, remplacé ou rejeté.'
    - q: 'Quelle documentation recevons-nous pour une non-conformité ?'
      a: 'L’enregistrement NCR couvre le numéro NCR, l’étape de détection, le produit/SKU, le lot, les révisions de document applicables, la description du défaut, la contention, la disposition, la référence de l’instruction de retouche, le résultat de la contre-inspection et l’approbation de libération ou de clôture — disponible selon votre accord qualité projet.'

