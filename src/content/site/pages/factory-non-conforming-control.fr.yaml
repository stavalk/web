hero:
  tagline: Maîtrise des Produits Non Conformes
  title: Processus d’Isolement, de Retouche et de Contre-Inspection des Produits Non Conformes
  subtitle: 'Chez Stavalk, un étau d’établi non conforme ne poursuit jamais son parcours. Tout produit ou composant qui échoue aux critères d’acceptation définis est identifié, enregistré contre un Rapport de Non-Conformité (NCR), étiqueté et isolé, évalué pour la portée affectée, et fait l’objet d’une disposition au bon niveau d’autorité. La retouche permise suit des instructions maîtrisées, les articles corrigés sont contre-inspectés selon les critères d’acceptation d’origine — y compris de nouveaux essais complets le cas échéant — et le produit n’est expédié qu’après signature qualité autorisée. Cette page présente notre norme maîtrisée selon l’ISO 9001:2015 Article 8.7 et les preuves de traçabilité qui la soutiennent.'
  actions:
    - text: Télécharger le SOP de Maîtrise NCP (PDF)
      variant: primary
      href: 'https://assets.Stavalk.com/site/downloads/non-conforming-product-control-sop-iso-8-7.pdf?dl=1'
    - text: Télécharger le Certificat de Mise à la Ferraille et de Destruction (PDF)
