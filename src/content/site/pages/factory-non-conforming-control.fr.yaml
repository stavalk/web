  subtitle: 'Le processus est conçu autour des questions que se posent réellement les acheteurs internationaux : les problèmes seront-ils cachés, la retouche partira-t-elle hors de contrôle, et les étaux réparés seront-ils re-vérifiés.'
  features:
    - icon: 1
      icon_bg: blue
      title: Uniquement des Instructions Maîtrisées
      desc: 'La retouche est strictement régie par des Instructions de Retouche Standard (SRI) autorisées. Les altérations de terrain non approuvées, le changement de spécifications ou la modification de l’œuvre sans autorisation écrite sont strictement interdits.'
    - icon: 2
      icon_bg: green
      title: Contre-Inspection Indépendante
      desc: 'Les étaux retouchés subissent une contre-inspection à 100 % par les contrôleurs AQ selon les critères d’acceptation d’origine. La retouche de traitement thermique ou de surfaces de serrage exige un cycle d’essai complet neuf de dureté et de force de serrage — jamais un re-contrôle partiel.'
    - icon: 3
      icon_bg: purple
      title: Signature Autorisée et Traçabilité
      desc: 'La libération d’expédition n’est permise qu’après documentation complète du NCR et signature QC autorisée, l’état du lot passant de HOLD à RELEASED. Les déviations systémiques ou répétées déclenchent automatiquement les flux de travail CAPA de cause racine.'

