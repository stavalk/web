nc_severity:
  tagline: Gravité du Défaut et Autorité
  title: Classification de Gravité et Autorité de Disposition
  subtitle: Toute non-conformité n’est pas traitée au même niveau — l’autorité de disposition évolue avec la gravité du défaut, de la signature au niveau de la ligne jusqu’au comité d’examen des matériaux et à la concession client.
  headers:
    severity: Gravité
    examples: Exemples Types
    authority: Autorité de Disposition et Maîtrise
    control: Condition de Libération
  rows:
    - severity: 'Mineur'
      examples: 'Coin de carton écrasé, légère imperfection décorative non critique, petite tache de rouille sur une surface non critique'
      authority: 'Responsable QC de section + superviseur de ligne, signature sur site, remplacer ou libérer'
      control: 'Enregistré sur le NCR ; aucun impact sur la fonction du produit ni sur les exigences client'
    - severity: 'Majeur'
      examples: 'Dureté de mâchoire inférieure à la spécification dans une zone d’essai, désalignement de mâchoires hors tolérance (>0,05 mm), accessoire manquant'
      authority: 'Le Responsable QC + l’Ingénieur Technique émettent une instruction de retouche maîtrisée (SRI)'
      control: 'Re-essai indépendant à 100 % de la caractéristique initialement non conforme et des caractéristiques affectées avant libération'
    - severity: 'Critique'
      examples: 'Fissure du corps moulé dans une zone portante, détérioration de vis/filetage, force de serrage inférieure à la capacité nominale, logo client mal imprimé ou déviation de couleur'
      authority: 'Décision du comité d’examen des matériaux (MRB) ; concession écrite du client le cas échéant'
      control: 'Aucune libération sans concession autorisée ; sinon destruction physique témoignée obligatoire'

nc_matrix:
  tagline: Matrice de Protocole d’Ingénierie
  title: Matrice de Disposition et de Contre-Inspection des Défauts de l’Étau
  subtitle: Protocoles d’ingénierie standard appliqués aux déviations de fabrication les plus courantes — les mêmes paramètres quantifiés que les clients peuvent vérifier lors des audits.
  headers:
    defect: Catégorie de Défaut
    protocol: Protocole de Disposition Maîtrisée
    validation: Contre-Inspection Indépendante et Validation
  rows:
    - defect: 'Défaut de Revêtement de Surface'
      protocol: 'Isoler l’étau. Décaper et re-préparer la surface à Sa2,5 avec un abrasif approuvé, ré-appliquer le revêtement poudre et cuire à 180°C ± 10°C.'
      validation: 'Inspection visuelle sous lumière du jour ; mesure avec appareil d’épaisseur de film en 3 points ; essai d’adhérence — épaisseur dans 55–85 µm, zéro zone découverte.'
    - defect: 'Dureté de Mâchoire Inférieure à la Spécification'
      protocol: 'Mettre le lot de poste en quarantaine. Re-traiter les inserts de mâchoire par traitement thermique maîtrisé : austénitisation 820–860°C, trempe à l’huile, revenu 150–200°C pour GCr15/Cr12MoV.'
      validation: 'Re-essai de dureté Rockwell à 100 % en 3 positions par insert — 58–62 HRC à toutes les positions ; contrôle métallographique de l’austénite résiduelle.'
    - defect: 'Désalignement des Mâchoires'
      protocol: 'Réaligner les mâchoires avec un gabarit de positionnement de précision ; re-fixer avec une fixation à couple maîtrisé ; vérifier le pas de filetage.'
      validation: 'Vérification de tolérance de jeu (parallélisme ≤ 0,05 mm), mesure au comparateur à cadran sur les faces des mâchoires, contrôle de filetage à 100 %.'
    - defect: 'Marquage / Logo Erroné'
      protocol: 'Arrêt immédiat de la ligne de marquage. Retenir toutes les pièces marquées. Examiner la révision vectorielle avec le client ; zéro altération non approuvée.'
      validation: 'Contrôle couleur au spectrophotomètre (ΔE ≤ 1,5) ; vérification visuelle à 100 % de l’alignement du texte contre le PDF vectoriel maître signé par le client.'
    - defect: 'Disparité d’Emballage / SKU Manquant'
      protocol: 'Mettre la palette d’exportation en quarantaine. Déballer et effectuer un contrôle de nomenclature détaillé à 100 % (étau, poignée, base, accessoires de montage, manuel).'
      validation: 'Validation à la peséeuse dynamique électronique en ligne (±30 g de variation) ; vérification au lecteur optique de code-barres 2D.'

nc_scrap:
  tagline: Zéro Fuite sur le Marché
  title: Mise à la Ferraille et Destruction Témoignée — Protocole Anti-Détournement Zéro Défaut
  body: |
    Les partenaires de marque internationaux ont besoin de la certitude que les étaux rejetés n’atteindront jamais le commerce de détail secondaire, les marchés gris ou les canaux e-commerce. Les étaux qui ne peuvent pas être rendus conformes sont détruits sous un protocole témoigné et enregistré :

    **1. Cisaillage des accessoires et de la structure.** Sous la supervision du Directeur AQ, une cisaille hydraulique retire la poignée, la base pivotante, les boulons de montage et tout l’équipement de serrage. La vis et la tige filetée sont coupées à la racine du corps, éliminant tout composant récupérable.

    **2. Sectionnement du corps et destruction du filetage.** Le corps en fonte est coupé transversalement avec de profondes entailles croisées et les surfaces de travail renforcées sont sectionnées en au moins 4 segments — détruisant définitivement la capacité de serrage et toute possibilité de réassemblage ou de réutilisation.

    **3. Coffre vidéo et photo.** La destruction est enregistrée en vidéo 1080p sans coupe avec des gros plans du code-barres de série, du processus de cisaillage, du sectionnement du corps et du tas de ferraille pesé final. La vidéo est hachée (SHA-256) et archivée sur un serveur maîtrisé pendant au moins 5 ans.

    **4. Élimination de la ferraille certifiée.** Tous les fragments de fonte et d’acier sont pesés, enregistrés dans le registre des sorties et transportés uniquement par des partenaires de recyclage des métaux qualifiés — aucun résidu ne quitte l’installation par tout autre canal.

    > **Garantie de protection de marque :** Stavalk garantit la destruction à 100 % des étaux hors spécification non retouchables. Zéro seconde qualité ou unité compromise n’entrera jamais sur le commerce de détail secondaire, les marchés gris ou les canaux e-commerce. Le Certificat de Mise à la Ferraille et de Destruction (VAT-QA-SCRAP-CERT-2026) enregistre le produit, le lot, la conclusion du MRB, les photos témoins et la double signature du Directeur AQ et du Responsable d’Usine.

