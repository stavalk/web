nc_intro:
  tagline: Maîtrise des Produits Non Conformes
  title: Que Se Passe-t-il Quand un Produit ne Satisfait Pas les Critères
  body: |
    Les produits ou composants qui ne satisfont pas aux critères d’acceptation définis sont identifiés et maîtrisés pour empêcher une utilisation non intentionnelle, toute transformation ultérieure ou toute expédition. Les critères d’acceptation applicables sont basés sur l’échantillon approuvé, la spécification technique, l’œuvre, la nomenclature, les exigences d’emballage et le plan d’inspection du projet.

    Les articles non conformes sont évalués pour déterminer la portée affectée et la disposition appropriée. Selon le problème, l’article peut être retenu, retouché sous instructions maîtrisées, remplacé, rejeté ou autrement traité par un processus approuvé. Les articles retouchés ou corrigés sont contre-inspectés avant la libération. La libération d’expédition n’est permise qu’une fois les enregistrements qualité pertinents complétés et que le produit satisfait aux critères d’acceptation applicables.

nc_flow:
  tagline: Boucle Fermée Standard en 7 Étapes
  title: De l’Identification à l’Action Corrective
  subtitle: 'Une boucle maîtrisée pour chaque non-conformité : identifier, mettre en quarantaine, examiner, retoucher ou remplacer, contre-inspecter, libérer ou rejeter, améliorer.'
  steps:
    - step: '01'
      title: Identifier
      desc: 'Toute non-conformité identifiée est enregistrée contre le produit, le lot ou le composant affecté et évaluée selon les exigences applicables du projet. La détection peut survenir à la matière entrante, au contrôle en cours, à l’essai final, à l’emballage ou à l’inspection client/tierce.'
    - step: '02'
      title: Mettre en Quarantaine
      desc: 'Les articles sont clairement identifiés et placés sous statut de retenue maîtrisée ou de quarantaine pour empêcher une utilisation non intentionnelle, toute transformation ultérieure ou toute expédition. Les étiquettes HOLD / QUARANTINE / REJECTED portent le numéro NCR, le SKU, le lot, la quantité, la description du défaut et la date.'
    - step: '03'
      title: Examiner
      desc: 'La portée affectée et la disposition appropriée sont évaluées : unité unique, lot de poste, lot complet ou lots multiples — à travers les lots de matière partagés, les révisions d’œuvre, les étapes de procédé et les révisions de document. Une contention supplémentaire ou une inspection renforcée est appliquée le cas échéant.'
    - step: '04'
      title: Retouche ou Remplacement
      desc: 'La retouche permise suit des instructions approuvées qui identifient l’article affecté, la méthode, les matériaux, les points d’inspection et les exigences de contre-inspection. Les modifications non approuvées de la spécification du produit, de l’œuvre, de la configuration des accessoires ou de l’emballage ne sont jamais autorisées. Les articles de remplacement repassent par les portes d’inspection applicables.'
    - step: '05'
      title: Contre-Inspection
      desc: 'Les articles retouchés ou corrigés sont contre-inspectés selon les critères d’acceptation applicables. La caractéristique initialement non conforme et toute caractéristique connexe potentiellement affectée par la retouche sont vérifiées avant la libération — par une AQ indépendante, et avec un cycle d’essai complet neuf de dureté et de force de serrage lorsque la retouche a touché le traitement thermique ou les surfaces de serrage.'
    - step: '06'
      title: Libérer ou Rejeter
      desc: 'Le produit n’est libéré qu’après réalisation de la contre-inspection requise et confirmation de conformité aux exigences applicables du projet par le personnel qualité autorisé. Les articles qui ne peuvent pas être rendus conformes sont rejetés, remplacés, retournés ou traités sous procédures maîtrisées — y compris la destruction physique témoignée.'
    - step: '07'
      title: Action Corrective
      desc: 'Les non-conformités répétées, significatives ou systémiques sont examinées pour la cause racine et l’action corrective (CAPA). Les améliorations peuvent inclure des mises à jour des instructions de travail, des maîtrises de matière, des points d’inspection, de la formation, de la gestion des fournisseurs ou de la maîtrise documentaire.'

