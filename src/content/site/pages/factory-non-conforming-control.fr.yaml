    - text: Demander une Revue Qualité
      href: /fr/contact

answer:
  label: 'Réponse directe'
  text: 'Les produits non conformes ne sont jamais cachés, retouchés informellement ou libérés sans vérification chez Stavalk. Chaque non-conformité identifiée est enregistrée contre le produit, le lot ou le composant affecté et liée à un NCR. L’article est étiqueté (HOLD / QUARANTINE / REJECTED), isolé physiquement, et la portée affectée est évaluée par lot, lot de matière, étape de procédé et révision de document. La disposition est décidée au niveau d’autorité correspondant à la gravité du défaut : les problèmes mineurs sont signés au niveau de la ligne, les problèmes majeurs exigent une disposition du Responsable QC + Ingénieur Technique avec instruction de retouche maîtrisée et contre-inspection indépendante à 100 %, et les problèmes critiques exigent une décision du comité d’examen des matériaux avec concession écrite du client le cas échéant — sinon destruction témoignée obligatoire. Les articles retouchés sont contre-inspectés selon les critères d’acceptation d’origine, les réparations de dureté et de force de serrage reçoivent un cycle d’essai complet neuf, et la libération d’expédition n’intervient qu’après signature qualité autorisée. Les problèmes répétés ou systémiques déclenchent une action corrective de cause racine (CAPA).'
  verified: '2026-09'

