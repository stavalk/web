label: Research
headline: '<strong>Contrôle qualité</strong> — Inspection en sept étapes, zéro compromis'
subtitle: 'De la matière première à la libération pré-expédition, chaque étau de banc passe les essais de force de serrage, dureté, couple et corrosion.'
seo:
  title: 'Contrôle qualité et normes des étaux de banc'
  description: 'Stavalk effectue une inspection en 7 étapes couvrant force de serrage, dureté 58–62 HRC, couple de pivot, durabilité 10 000+ cycles et brouillard salin 48 h par lot.'
body: >-
  Stavalk exploite un processus d''inspection en sept étapes documenté qui suit chaque étau depuis la matière première entrante jusqu''à la libération finale pré-expédition. Chaque lot de production est testé pour la force de serrage à la capacité nominale, la dureté de mâchoire par Rockwell C (58–62 HRC), le couple de la base pivotante et un essai de durabilité minimum de 10 000 cycles ouverture-fermeture. La résistance à la corrosion est validée par une exposition au brouillard salin minimum de 48 heures selon les normes applicables. Le système de qualité détient le marquage CE selon EN ISO 12100 et la Directive machines 2006/42/EC, ISO 9001:2015, ISO 14001 et conformité RoHS. Les inspections tierces de SGS, TÜV, Bureau Veritas et Intertek sont bienvenues et planifiées routinièrement à la demande de l''acheteur.
faqs:
  - q: 'Quelles certifications Stavalk détient-il et comment les acheteurs peuvent-ils les vérifier ?'
    a: 'Stavalk détient le marquage CE (EN ISO 12100, Directive machines 2006/42/EC), la gestion de la qualité ISO 9001:2015, la gestion environnementale ISO 14001 et la conformité RoHS. La portée et la validité des certificats peuvent être confirmées via le registre public de l''organisme de certification ou en demandant des copies directement à Stavalk.'
  - q: 'Les résultats d''essais sont-ils documentés par lot ?'
    a: 'Oui. Chaque lot de production est accompagné d''un rapport d''inspection incluant les mesures dimensionnelles, les lectures de dureté Rockwell, les valeurs de force de serrage, les données de couple de pivot et les résultats d''essai de brouillard salin, ainsi que des photos des étapes d''inspection clés. Les certificats de matière et rapports dimensionnels sont inclus dans la documentation d''expédition.'
  - q: 'Les échantillons Stavalk peuvent-ils être testés indépendamment par l''acheteur ?'
    a: 'Oui. Stavalk accepte l''inspection de première pièce (FAI) et les essais témoins sur demande. Les acheteurs peuvent envoyer leur propre inspecteur ou désigner un laboratoire tiers pour effectuer une vérification indépendante des échantillons de production avant la libération de l''expédition en volume.'
