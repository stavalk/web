    - 'fundición en arena de hierro gris'
    - 'fabricación de tornillos de banco'
hero:
  tagline: Equipo
  title: Equipos y maquinaria de fabricación
  subtitle: Equipos de grado industrial en fundición, mecanizado, acabado y ensamblaje
  back_label: Volver a la fábrica
  back_link: /es/factory
categories:
  - title: Fundición en arena
    items:
      - name: Línea automática de fundición en arena
        spec: Hierro gris HT200/HT250, colada supervisada
        desc: Línea de moldeo y colada totalmente automatizada para cuerpos, deslizaderas y bases de tornillos de banco. La química del metal fundido se verifica por colada con análisis espectroquímico antes de la colada.
      - name: Máquina de granallado
        spec: Multi-rueda, alimentación por lotes
        desc: Limpia arena, cascarilla y rebabas de las piezas tras el desmoldeo, preparando las superficies para el mecanizado y el acabado.

  - title: Mecanizado y CNC
    items:
      - name: Centro de mecanizado CNC de 5 ejes
        spec: '±0,01 mm, husillo refrigerado por agua, recorrido de 3 m × 2 m × 1 m'
        desc: Mecanizado de precisión de cuerpos, asientos de mordaza y guías de deslizadera en una sola configuración. Cambio de modelo rápido guiado por programa.
      - name: Torno CNC
        spec: Torneado de hasta 500 mm de longitud, herramienta motorizada
        desc: Torneado y roscado de deslizaderas, husillos y ejes de acero forjado 45# con tolerancias de rosca estrictas.
      - name: Centro de taladrado y roscado CNC
        spec: Roscado rígido, indexación del cabezal
        desc: Taladrado y roscado de orificios de pernos de mordaza, puntos de montaje del mango y roscas de mordazas de tubo para juegos de cadena y trípode.

  - title: Tratamiento térmico y temple
    items:
      - name: Máquina de temple por inducción
        spec: Alimentación automatizada, potencia programable
        desc: Temple y revenido por inducción de mordazas GCr15 / Cr12MoV a un 58–62 HRC constante, con distorsión mínima y dureza homogénea en profundidad.
      - name: Horno de revenido
        spec: Temperatura controlada, carga por lotes
        desc: Revenido posterior al temple para aliviar tensiones y estabilizar la dureza de las mordazas en todo el lote.

  - title: Acabado de superficies
    items:
      - name: Línea de recubrimiento en polvo
        spec: Electroestática, espesor de película de 60–80 μm
        desc: Recubrimiento electrostático en polvo multicolor para cuerpos y bases, con curado en horno y verificación del espesor del recubrimiento.
      - name: Línea de galvanizado en zinc
        spec: Tambor y cuba, pasivado
        desc: Galvanizado en zinc de husillos, mordazas, mangos y herraje con acabado brillante y protección anticorrosión de más de 48 h de niebla salina.

  - title: Ensamblaje y ajuste
    items:
      - name: Estación de ensamblaje de platos giratorios y mordazas de tubo
        spec: Modular ajustable, con control de par
        desc: Ensamblaje y alineación de platos giratorios y mordazas de tubo (juegos de cadena y trípode) sobre cuerpos mecanizados con fijadores retenidos.
      - name: Llave dinamométrica neumática
        spec: Calibrada, rango de par ajustable
        desc: Apriete con control de par de husillos, bloqueos de plato y pernos de retención de mordazas según especificación.
      - name: Estación de ajuste y esmerilado de tornillos
        spec: De banco, herramientas manuales
        desc: Desbarbado final, ajuste y regulación de apertura/cierre para garantizar un desplazamiento suave y caras de mordaza al ras.

  - title: Ensayos y control de calidad
    items:
      - name: Durómetro Rockwell
        spec: Escala 58–62 HRC, mordazas GCr15 / Cr12MoV
        desc: Verificación de dureza de cada lote de temple de mordazas tras el tratamiento térmico por inducción.
      - name: Banco de ensayo de fuerza de sujeción
        spec: kN/célula de carga, calibrado
        desc: Medición de la fuerza de sujeción de los tornillos ensamblados frente a la especificación del plano.
      - name: Comprobador de durabilidad de apertura/cierre
        spec: Programable, más de 10.000 ciclos
        desc: Ensayo automático de ciclos de apertura/cierre del husillo y la deslizadera para verificar la durabilidad a largo plazo.
      - name: Cámara de niebla salina
        spec: ISO 9227, exposición de más de 48 h
        desc: Ensayos de corrosión de piezas galvanizadas en zinc y recubiertas en polvo para la cualificación del acabado.

