quality_basis:
  title: Five Locked Quality Baselines
  subtitle: Every order is produced against the same five agreed baselines.
  items:
    - title: Material Grade
      description: HT200/HT250 gray cast iron and 45# forged steel verified by spectrometer before machining.
    - title: Jaw Hardness
      description: GCr15/Cr12MoV jaws oil-quenched and tempered to 58–62 HRC, verified by Rockwell.
    - title: Dimensional Accuracy
      description: Critical dimensions verified by CMM and calipers against the approved drawing.
    - title: Coating Durability
      description: Spray, powder-coat and Parkerizing finishes salt-spray tested for 48+ hours.
    - title: Performance Tests
      description: Clamping force, swivel torque, cycle life and safety checked per order.
tests:
  title: Tests & Procedures
  subtitle: The checks behind every Stavalk bench vise.
  items:
    - title: Clamping Force Test
      description: Confirms the screw and jaws hold the rated work load without slip or deflection.
    - title: Jaw Hardness Test
      description: Rockwell testing verifies 58–62 HRC across the hardened jaw surface.
    - title: Swivel Torque Test
      description: Verifies the base rotates and locks smoothly to the specified torque.
    - title: Cycle Life Test
      description: 10,000+ open/close cycles confirm the screw and slide wear life.
    - title: Salt-Spray Test
      description: 48+ hour exposure confirms coating and corrosion resistance.
    - title: Safety Compliance
      description: Designed to CE per EN ISO 12100 and MD 2006/42/EC.
qc_flow:
  title: 7-Stage Inspection Flow
  subtitle: A documented, per-order quality flow with records at every gate.
  obj_label: Inspection object
  method_label: Inspection method
  criteria_label: Acceptance criteria
  record_label: Record output
  stages:
    - stage: '01'
      title: Incoming Material
      summary: Raw gray cast iron and steel checked against material certificates.
      checks:
        - Grade and certificate of conformity verified
        - Spectrometer chemistry check on gray cast iron lots
      object: Incoming material lots
      method: Certificate review + spectrometer
      criteria: HT200/HT250 / 45# per spec
      record: Material intake record
    - stage: '02'
      title: Casting Inspection
      summary: Cast bodies checked for defects, dimensions and soundness.
      checks:
        - Visual and dimensional check of cast bodies
        - Defect screening for porosity and cracks
      object: Cast bodies
      method: Visual + gauge inspection
      criteria: No structural defects; dims per drawing
      record: Casting lot record
    - stage: '03'
      title: Machining Inspection
      summary: Jaw faces, spindles and bases verified after CNC machining.
      checks:
        - Critical dimensions measured with CMM/calipers
        - Surface finish and fit checked
      object: Machined parts
      method: CMM + caliper metrology
      criteria: Within drawing tolerance
      record: Machining inspection record
    - stage: '04'
      title: Heat Treatment
      summary: Jaw hardness verified after oil-quench and tempering.
      checks:
        - Rockwell hardness on hardened jaw surface
        - Batch process parameters logged
      object: Hardened jaws
      method: Rockwell hardness test
      criteria: 58–62 HRC
      record: Heat treatment record
    - stage: '05'
      title: Surface Coating
      summary: Coating adhesion and durability checked.
      checks:
        - Coating thickness and appearance
        - Salt-spray sampling for corrosion resistance
      object: Coated bodies and jaws
      method: Thickness gauge + salt-spray
      criteria: 48h+ no failure
      record: Coating inspection record
    - stage: '06'
      title: Assembly & Functional Test
      summary: Assembled vises run through functional and performance tests.
      checks:
        - Clamping force and swivel torque
        - Open/close cycle test
      object: Assembled vises
      method: Functional bench test
      criteria: Meets rated performance
      record: Functional test record
    - stage: '07'
      title: Final Inspection & Packing
      summary: Finished vises inspected, packed and readied for shipment.
      checks:
        - Cosmetic and completeness check
        - Packing, marking and paperwork verified
      object: Finished vises
      method: Final QC checklist
      criteria: Ready for FOB Qingdao
      record: Final inspection & packing list
