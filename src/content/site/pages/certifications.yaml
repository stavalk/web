content_certifications:
  title: Certifications at a Glance
  body: |
    Stavalk produces bench vises in compliance with **CE** (EN ISO 12100 and MD 2006/42/EC), **ISO 9001:2015**, **ISO 14001** and **RoHS**. The quality system is documented, measured and auditable — from material intake through a 7-stage inspection flow to third-party inspection and FOB Qingdao shipment.

    Scanned certificates with scope are available on request before order, and buyers can arrange SGS, TÜV, BV or Intertek inspection at the factory before shipping.
faqs:
  title: FAQs
  questions:
    - q: Which standards do Stavalk bench vises meet?
      a: CE (EN ISO 12100, MD 2006/42/EC), ISO 9001:2015, ISO 14001 and RoHS.
    - q: What hardness are the jaws?
      a: GCr15/Cr12MoV jaws are oil-quenched and tempered to 58–62 HRC.
    - q: Can I arrange third-party inspection?
      a: Yes — SGS, TÜV, BV or Intertek, arranged by you or us, at the factory before shipment.
    - q: Can I see quality records?
      a: Buyers with signed agreements can request anonymized traceability and QC records per order.
