material_notes:
  tagline: Material Notes
  title: How Each Grade Is Selected
  body: |
    **Gray cast iron — the standard.** HT200 and HT250 bodies are sand-cast in our own foundry, then normalized and stress-relieved. They give a bench vise the rigid, vibration-dampening body that holds work without "ringing", at a price that keeps standard series affordable. This is the most common body material for light and medium vises.

    **Ductile iron — for impact exposure.** Ductile iron has graphite nodules instead of flakes, which stop cracks from propagating. When a vise is used in busy shops, dropped, or takes off-axis loads, ductile iron resists chipping at edges and stress risers better than gray iron. We specify it for trade and light-industrial series that see harder daily use.

    **45# forged steel — for the heavy duty.** Forging 45# steel produces a denser, grain-aligned structure than casting. Combined with heat treatment it gives the tensile strength to sustain clamping forces in the multi-thousand-pound range without the body flexing — the reason our heavy-duty series with fixed anvil plates is built from forged steel, with jaws hardened up to 62 HRC and a replaceable screw assembly.

why_materials:
  tagline: Why It Matters
  title: Why Body Material Determines How a Vise Feels
  body: |
    Jaw width is the number printed on a vise; the body material is what a user actually feels. A gray-iron body resists bending when you clamp a large workpiece with the handle at full travel; a forged-steel body lets a heavy series develop force that would twist a lighter casting. Material also drives failure mode: brittle gray iron fails by cracking under sharp impacts, ductile iron and forged steel deform before they break — so the buyer can see a problem before a catastrophic failure.

    Material choice also interacts with machining. Gray iron machines cleanly to tight tolerances and self-lubricating surfaces, which is why the slide channels and guides are precision-machined to 0.05 mm positional accuracy. Forged steel requires heavier machinery but rewards it with a longer-wearing slide.

    If you are comparing vises of the same nominal size from different factories, ask which material grade the body actually is — identical jaw widths are not identical products.

faqs:
  tagline: FAQ
  title: Frequently Asked Questions About Vise Materials
  items:
    - q: 'Is cast iron or ductile iron better for a bench vise?'
      a: 'For standard bench use, gray cast iron is the proven, most economical choice — rigid, dampening and stable. If the vise will face hard shop conditions, dropped loads or off-axis force, ductile iron resists impact damage better. Both are used across the Stavalk range according to duty class.'
    - q: 'Which Stavalk vises use forged steel?'
      a: 'The heavy-duty series with fixed anvil plates is forged from 45# steel for maximum tensile strength, impact resistance and clamping capacity (up to 8,000 lbf on the largest units), with jaws hardened up to 62 HRC.'
    - q: 'How is the material grade verified?'
      a: 'Material certificates accompany each casting batch, covering chemical composition and mechanical properties. Certificate copies, hardness records and batch traceability are available on request under NDA.'
    - q: 'Can a custom vise use a different material?'
      a: 'Yes. Custom body castings, ductile iron upgrades and forged-steel bodies are developed through the OEM/ODM process. Material selection is finalized at the engineering review before tooling begins.'

