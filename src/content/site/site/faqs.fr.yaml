faqs:
  - q: Où se trouvent votre entreprise et votre usine ?
    a: >-
      Stavalk a son siège à Qingdao, en Chine, avec notre site de fabrication
      dans le district de Jimo. Les installations de 8 000 m² abritent la
      fonderie, l'usinage CNC, le traitement thermique, l'assemblage et le
      contrôle qualité sous un même toit. Les ventes, le support technique et
      la logistique d'exportation sont gérés depuis Qingdao ; toute la
      production est nationale en Chine.
  - q: Quels produits fabrique Stavalk ?
    a: >-
      Stavalk fabrique des étau de banc professionnels (bench vises). Nous
      proposons cinq gammes : des étaux légers de 4″–5″ pour ateliers
      domestiques et usage amateur, des étaux moyens de 6″–8″ pour garages et
      ateliers professionnels, des étaux lourds de 8″–10″ pour serrage
      industriel, des étaux à tube de 1/8″–2″ pour la plomberie et la
      fabrication de tuyauteries, et des modèles spéciaux incluant à
      libération rapide, à base rotative et à dos d'enclume.
  - q: Quelle est la capacité de production annuelle de Stavalk ?
    a: >-
      Notre usine emploie plus de 200 ouvriers qualifiés et produit plus de
      80 000 étaux de banc par an. Nous exportons actuellement vers plus de
      50 pays en Amérique du Nord, Europe, Moyen-Orient, Asie du Sud-Est et
      Amérique latine. La production est planifiée par lots saisonniers pour
      maintenir des calendriers de livraison cohérents dans toutes les régions.
  - q: Quels matériaux Stavalk utilise-t-il pour ses étaux de banc ?
    a: >-
      Les corps des étaux sont coulés en fonte grise HT200 ou HT250,
      offrant une grande rigidité et un amortissement des vibrations. Les
      mâchoires sont en acier forgé 45# pour la résistance structurale. Les
      inserts de mâchoire utilisent un acier à outils trempé GCr15 ou Cr12MoV,
      traité thermiquement jusqu'au Rockwell C 58–62 pour la résistance à
      l'usure lors de cycles de serrage répétés.
  - q: Quels processus de fabrication interviennent dans la fabrication d'un étau Stavalk ?
    a: >-
      La production commence par le moulage en sable, utilisant du sable vert
      et du sable résine. Les pièces coulées sont ensuite usinées aux
      dimensions finales par CNC. Le traitement thermique suit pour obtenir le
      profil de dure requis. La finition de surface est appliquée par
      pulvérisation de peinture, revêtement par poudre ou Parkerisation selon
      le modèle. L'assemblage combine un travail manuel de précision et un
      pressage hydraulique, et chaque unité passe par un processus
      d'inspection en 7 étapes avant l'emballage.
  - q: Comment Stavalk contrôle-t-il la qualité avant l'expédition ?
    a: >-
      Chaque étau est testé pour la force de serrage à la capacité nominale, la
      dureté des mâchoires par mesure Rockwell C 58–62, le couple de rotation
      pour les modèles à base rotative, et la durabilité cyclique dépassant
      10 000 opérations de serrage et desserrage. La résistance à la corrosion
      est vérifiée par des essais de brouillard salin de plus de 48 heures.
      Les unités défectueuses sont rejetées à chaque étape d'inspection, pas
      seulement au contrôle qualité final.
  - q: Quelles certifications Stavalk détient-il ?
    a: >-
      Les produits Stavalk sont conformes aux exigences CE selon EN ISO 12100
      et la Directive Machines 2006/42/EC. Notre usine possède les
      certifications ISO 9001:2015 de gestion de la qualité et ISO 14001 de
      gestion environnementale. La documentation de conformité RoHS est
      disponible pour tous les modèles. Nous accueillons les audits tiers de
      SGS, TÜV, Bureau Veritas et Intertek. Des copies des certificats
      peuvent être fournies aux acheteurs identifiés sur demande.
  - q: Proposez-vous de la fabrication OEM, ODM ou en marque privée ?
    a: >-
      Oui. L'OEM signifie que nous fabriquons des étaux selon vos
      spécifications et plans sur l'une de nos séries existantes — vous êtes
      propriétaire du design et de la propriété intellectuelle. L'ODM signifie
      que notre équipe d'ingénierie conçoit un nouvel étau de A à Z, du croquis
      conceptuel au modèle 3D, échantillon prototype et tests de validation
      avant la production en volume. La marque privée signifie que nous
      appliquons votre marque, couleur de peinture et emballage sur un modèle
      de production validé sans modification structurelle. Nous signons un NDA
      avant tout échange de fichiers et les coûts d'outillage sont amortis
      sur la première série de production.
  - q: Quelle est la différence entre OEM, ODM et marque privée ?
    a: >-
      OEM : vous fournissez le design ou le plan d'ingénierie et nous
      fabriquons selon vos spécifications. ODM : vous fournissez un brief
      marché ou un exigence de performance et nous développons le design
      complet de l'étau, gérant l'ingénierie, le prototypage et la
      validation. Marque privée : vous sélectionnez un modèle validé existant
      et personnalisez la marque, la finition et l'emballage sans changement
      de design. La plupart des projets se situent entre ces catégories et
      nous cotons la configuration correspondant au niveau de possession du
      design dont vous avez besoin.
  - q: Quelles sont vos quantités de commande minimales ?
    a: >-
      Le MOQ standard pour les étaux légers et moyens est de 50–200 pièces
      selon le modèle et la configuration. Les étaux lourds et spéciaux ont
      un MOQ inférieur de 20–50 pièces en raison de leur valeur unitaire plus
      élevée. Des commandes d'échantillons de 1–2 pièces sont acceptées pour
      évaluation, et des séries pilotes de 20–50 pièces sont disponibles pour
      la qualification de nouveaux produits avant de s'engager sur le volume
      complet.
  - q: Quel est le délai de livraison pour les échantillons et la production en vrac ?
    a: >-
      Les échantillons prototypes sont expédiés sous 7–14 jours une fois les
      spécifications confirmées. La production en vrac prend 25–35 jours à
      partir de la confirmation du bon de commande et de la réception de
      l'acompte. Si de nouveaux moules ou outillage sont requis, ajouter
      environ 15–20 jours pour le développement du moule et l'approbation du
      premier article. Des délais urgents peuvent être disponibles pour les
      commandes répétées avec outillage existant et stock de matériaux
      confirmé.
  - q: Comment les étaux de banc sont-ils expédiés et quelles sont les conditions de paiement ?
    a: >-
      FOB Qingdao est le terme d'expédition par défaut ; CIF et DDP sont
      disponibles sur demande. Un conteneur standard de 20 pieds contient
      environ 1 200–1 800 étaux légers et moyens de 4″–6″ selon la
      configuration des cartons et la densité d'emballage. Les conditions de
      paiement sont un acompte pour confirmer la production, le solde étant
      dû avant l'expédition. Les pourcentages spécifiques sont convenus par
      commande et inscrits dans le contrat.
  - q: Comment les étaux de banc sont-ils emballés pour l'exportation ?
    a: >-
      Chaque étau est enveloppé et placé dans des cartons ondulés
      personnalisés avec vos visuels de marque, numéro de modèle et marquage
      de carton selon les exigences du marché de destination. Les modèles
      lourds et industriels sont expédiés en caisses en bois contreplaqué
      renforcées. Chaque carton contient une notice d'instruction et une
      liste d'emballage de quincaillerie. Un échantillon d'emballage est
      approuvé avant le début de la production en volume, de sorte que ce
      que vous approuvez est exactement ce qui est expédié.
  - q: Quelle garantie Stavalk fournit-il sur les commandes en gros ?
    a: >-
      Les conditions de garantie sont inscrites dans chaque bon de commande.
      La couverture standard est de 12 mois à compter de l'expédition contre
      les défauts de matériaux et de fabrication, couvrant les corps fissurés,
      le décalage des mâchoires et les défaillances du mécanisme lors d'un
      usage normal. Les dommages dus à une mauvaise utilisation, une
      surcharge ou une modification non autorisée sont exclus. La durée de
      garantie et la procédure de réclamation sont indiquées sur le bon de
      commande, et non découvertes après coup.
  - q: Que se passe-t-il si les étaux arrivent endommagés ou avec des défauts de fabrication ?
    a: >-
      Signalez le problème dans la fenêtre de réclamation convenue
      (typiquement 7–15 jours après l'arrivée) avec des photos ou des
      preuves vidéo. Nous évaluons la réclamation par rapport aux registres
      d'inspection pré-expédition et aux photos QC conservées pour votre lot,
      puis proposons une remise en état, un remplacement ou un avoir selon
      le cas. Disposer de registres d'inspection documentés pour chaque unité
      rend ce processus rapide et équitable pour les deux parties.
  - q: Comment fonctionnent les frais d'échantillons et d'outillage ?
    a: >-
      Les frais d'échantillons couvrent le coût de production de 1–2 unités
      d'évaluation et sont généralement crédités intégralement sur la première
      commande de production une fois le volume convenu atteint. Les coûts
      d'outillage et de moules sont détaillés à l'étape du devis et amortis
      sur la première série de production plutôt que facturés comme des frais
      séparés à l'avance. Toutes les structures de frais sont confirmées par
      écrit avant tout engagement.
  - q: Stavalk accepte-t-il les audits d'usine ?
    a: >-
      Oui. Nous accueillons les visites sur site et les audits tiers des
      acheteurs et des agences d'inspection indépendantes. Notre site de
      8 000 m² est prêt pour les audits avec des processus documentés couvrant
      la fonderie, l'usinage, le traitement thermique, la finition,
      l'assemblage et l'inspection finale. Un dossier de documentation qualité
      comprenant certificat de conformité, certificats de matériaux, rapports
      d'inspection dimensionnelle et photos QC est disponible pour chaque lot
      de production. Des visites virtuelles de l'usine peuvent être organisées
      pour la qualification initiale.
  - q: Comment choisir la taille de mâchoire adaptée à mon application ?
    a: >-
      La largeur de mâchoire détermine la capacité de serrage et la plage de
      taille des pièces à travailler. Les mâchoires de 4″–5″ conviennent aux
      tâches légères comme la menuiserie amateur, les petits supports
      métalliques et les projets DIY. Les mâchoires de 6″–8″ gèrent le
      travail professionnel général incluant les pièces automobiles, la
      fabrication moyenne et l'usage en atelier de réparation. Les mâchoires
      de 8″–10″ sont pour le serrage industriel lourd comme les grands
      ensembles en acier, les dispositifs de soudage et les installations
      d'usinage lourd. Choisissez la taille de mâchoire en fonction de votre
      plus grande pièce prévue, plus une classe de marge pour la polyvalence.
  - q: Quelle est la différence entre un étau de banc et un étau à tube ?
    a: >-
      Un étau de banc a des mâchoires planes et parallèles et est conçu pour
      serrer des pièces planes ou rectangulaires sur un établi pour scier,
      limer, percer ou assembler. Un étau à tube a des mâchoires en forme de V
      ou courbées, spécialement conçues pour saisir du rond comme des tuyaux et
      des conduites sans les écraser ni les abîmer. Les étaux de banc sont
      polyvalents ; les étaux à tube sont spécialisés. La plupart des ateliers
      de fabrication possèdent les deux types.
  - q: Puis-je utiliser un étau électrique ou pneumatique au lieu d'un étau manuel ?
    a: >-
      Stavalk propose des options manuelles et assistées par énergie. Les
      étaux manuels utilisent une vis à filets ou un mécanisme de libération
      rapide actionné à la main. Les étaux pneumatiques ou hydrauliques
      utilisent l'air comprimé ou la pression de fluide pour un serrage plus
      rapide dans les environnements de production à haut débit. Les deux
      utilisent le même corps en fonte et les mêmes inserts de mâchoire
      trempés — la différence est dans le mécanisme d'actionnement. Les
      modèles assistés par énergie sont recommandés lorsque les opérateurs
      effectuent des centaines de cycles de serrage par quart de travail.
  - q: Comment construire une gamme complète d'étaux de banc avec Stavalk ?
    a: >-
      Nous supportons les programmes multi-SKU couvrant les cinq gammes sous
      un seul contrat d'usine. Commencez avec 2–4 modèles anchor adaptés à vos
      marchés cibles, puis développez des configurations spéciales comme base
      rotative, libération rapide ou dos d'enclume. Ajoutez des SKU de pièces
      de rechange incluant inserts de mâchoire de rechange, boulons de
      fixation, plaques de base et ensembles de poignée. Les systèmes
      d'emballage partagés et la marque cohérente sur toute la gamme réduisent
      les coûts d'inventaire par SKU et maintiennent votre catalogue cohérent.
  - q: Quelles pièces de rechange et accessoires Stavalk fournit-il ?
    a: >-
      Inserts de mâchoire de rechange (acier trempé, adaptés à chaque modèle),
      boulons de fixation et kits de quincaillerie, composants de base
      rotative, ensembles de poignée et plaques de base sont tous disponibles
      en pièces de rechange. Les pièces peuvent être commandées avec la
      production ou en petites commandes de réapprovisionnement. Il est
      particulièrement recommandé de garder des inserts de mâchoire de
      rechange en stock car ce sont les principaux composants d'usure
      susceptibles d'être remplacés pendant la durée de vie de l'étau.
  - q: Que dois-je préparer avant de demander un devis ?
    a: >-
      Indiquez votre marché cible et usage prévu, la gamme d'étau ou la taille
      de mâchoire souhaitée, la quantité et le prix cible, les besoins de
      marque et d'emballage, et votre calendrier souhaité. Si vous avez des
      plans ou des échantillons de référence, joignez-les. Plus le brief est
      spécifique, plus le devis est rapide et précis — notre formulaire de
      demande collecte exactement cette information pour éviter des allers et
      retours inutiles.
  - q: Stavalk peut-il fournir un programme de distribution clé en main ?
    a: >-
      Oui. Nous supportons des configurations de distribution complètes incluant
      le développement de catalogue multi-SKU, l'emballage et la marque
      cohérents sur toute la gamme, le stockage de pièces de rechange et la
      montée en volume progressive à mesure que votre marché croît. Notre
      équipe d'exportation gère la logistique FOB, CIF et DDP avec des plans
      d'expédition documentés alignés sur vos cycles d'inventaire. Les
      nouveaux distributeurs commencent généralement par une commande pilote
      de 20–50 pièces sur 2–3 modèles pour valider l'adéquation au marché
      avant de s'engager sur des quantités de conteneur.
  - q: Comment l'option de base rotative affecte-t-elle l'étau ?
    a: >-
      Une base rotative permet aux mâchoires de pivoter à 360° autour du
      montant de l'établi, vous permettant de présenter la pièce à n'importe
      quel angle pour limer, percer ou assembler sans repositionner la pièce
      à travailler. La base est verrouillée avec une poignée de blocage et
      est testée pour le couple de rotation afin de tenir sa position en
      charge. Choisissez une base rotative pour un travail d'établi qui
      bénéficie d'une orientation réglable ; une base fixe est plus solide et
      moins coûteuse si l'étau reste en position fixe en permanence.
  - q: Quelles finitions de surface sont disponibles sur les étaux Stavalk ?
    a: >-
      Les finitions standard sont le revêtement par poudre et la peinture par
      pulvérisation dans une gamme de couleurs, tous deux appliqués sur une
      surface préparée pour la résistance à la rouille. La Parkerisation est
      disponible sur demande pour les modèles industriels où une finition mate
      résistante à la corrosion est préférée et où la peinture n'est pas
      souhaitée sur les faces usinées. Le choix de la finition n'affecte pas
      les performances de serrage, et la finition sélectionnée est appliquée
      de manière cohérente sur toute votre commande afin que la couleur et la
      texture correspondent d'une boîte à l'autre.
