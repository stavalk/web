faqs:
  - q: Where is your company and factory located?
    a: >-
      Stavalk is headquartered in Qingdao, China, with our manufacturing campus
      in the Jimo district. The 8,000 m² facility houses casting, CNC machining,
      heat treatment, assembly, and quality control under one roof. Sales,
      engineering support, and export logistics are managed from Qingdao; all
      production is domestic in China.
  - q: What products does Stavalk manufacture?
    a: >-
      Stavalk manufactures professional bench vises (bench vices). We offer five
      product series: light-duty 2″–5″ jaw vises for home workshops and hobby
      use, medium-duty 6″–8″ vises for professional garages and workshops,
      heavy-duty 8″–10″ vises for industrial workholding, pipe vises with
      1/8″–2″ capacity for plumbing and pipe fabrication, and specialty models
      including quick-release, swivel-base, and anvil-back configurations.
  - q: What is Stavalk's annual production capacity?
    a: >-
      Our factory operates with 200+ skilled workers and produces 80,000+
      bench vises per year. We currently export to 50+ countries across
      North America, Europe, the Middle East, Southeast Asia, and Latin
      America. Production runs are planned in seasonal batches to maintain
      consistent delivery schedules for all regions.
  - q: What materials does Stavalk use for its bench vises?
    a: >-
      Vise bodies are cast from HT200 or HT250 gray cast iron, providing
      high rigidity and vibration damping. Jaws are made from 45# forged
      steel for structural strength. Jaw inserts use GCr15 or Cr12MoV
      hardened tool steel, heat-treated to Rockwell C 58–62 for wear
      resistance under repeated clamping cycles.
  - q: What manufacturing processes are involved in making a Stavalk vise?
    a: >-
      Production begins with sand casting using both green sand and resin sand
      molds. Castings are then CNC-machined to final dimensions. Heat treatment
      follows to achieve the required hardness profile. Surface coating is
      applied by spray paint, powder coating, or Parkerizing depending on the
      model. Assembly is performed using a combination of manual precision work
      and hydraulic pressing, with every unit passing through a 7-stage
      inspection process before packaging.
  - q: How does Stavalk test quality before shipment?
    a: >-
      Each vise is tested for clamping force at rated capacity, jaw hardness
      via Rockwell C 58–62 measurement, swivel torque for models with rotating
      bases, and cycle durability exceeding 10,000 clamp-and-release operations.
      Corrosion resistance is verified through salt-spray testing lasting 48+
      hours. Defective units are rejected at every inspection stage, not just
      at final QC.
  - q: What certifications does Stavalk hold?
    a: >-
      CE marking applies to models destined for EU markets under EN ISO 12100
      and the Machinery Directive 2006/42/EC (scope confirmed per project). Our
      factory maintains ISO 9001:2015 quality management and ISO 14001:2015
      environmental management certifications. REACH, RoHS and other
      market-specific compliance documentation is available where applicable.
      We welcome third-party audits from SGS, TÜV, Bureau Veritas, and Intertek.
      Copies of certificates can be provided to verified buyers upon request.
  - q: Do you offer OEM, ODM, or private-label manufacturing?
    a: >-
      Yes. OEM means we build vises to your specifications and drawings on one
      of our existing series — you own the design and intellectual property.
      ODM means our engineering team designs a new vise from scratch, from
      concept sketch through 3D model, prototype sample, and validation testing
      before volume production. Private label means we apply your brand mark,
      paint color, and packaging to a validated production model with no
      structural changes. We sign an NDA before any file exchange, and tooling
      costs are amortized across the first production run.
  - q: What is the difference between OEM, ODM, and private label?
    a: >-
      OEM: you supply the design or engineering drawing and we manufacture to
      your spec. ODM: you provide a market brief or performance requirement and
      we develop the complete vise design, handling engineering, prototyping, and
      validation. Private label: you select an existing validated model and
      customize the brand mark, surface finish, and packaging with no design
      changes. Most projects fall between these categories, and we quote the
      configuration that matches how much design ownership you need.
  - q: What are your minimum order quantities?
    a: >-
      Standard MOQ for light- and medium-duty vises is 50–200 pcs depending on
      model and configuration. Heavy-duty and specialty vises carry a lower MOQ
      of 20–50 pcs due to higher per-unit value. Sample orders are accepted at
      1–2 pcs for evaluation, and pilot runs of 20–50 pcs are available for
      new-product qualification before committing to full volume.
  - q: What is the lead time for samples and bulk production?
    a: >-
      Prototype samples ship within 7–14 days once specifications are confirmed.
      Bulk production runs 25–35 days from confirmed PO and deposit receipt.
      If new patterns or tooling are required, add approximately 15–20 days for
      pattern development and first-article approval. Rush timelines may be
      possible for repeat orders with existing tooling and confirmed material
      stock.
  - q: How are bench vises shipped and what are the payment terms?
    a: >-
      FOB Qingdao is the default shipping term; CIF and DDP are available on
      request. A standard 20ft container holds approximately 1,200–1,800
      light- and medium-duty 4″–6″ vises depending on carton configuration and
      packing density. Payment terms are deposit to confirm production, with
      the balance due before shipment. Specific percentages are agreed per
      order and written into the contract.
  - q: How are bench vises packaged for export?
    a: >-
      Individual vises are wrapped and placed in custom-printed corrugated
      cartons with your brand artwork, model number, and carton markings per
      destination market requirements. Heavy and industrial models ship in
      reinforced plywood cases. Each carton includes an instruction sheet and
      hardware packing list. A packaging sample is approved before volume
      production begins, so what you approve is exactly what ships.
  - q: What warranty does Stavalk provide on bulk orders?
    a: >-
      Warranty terms are written into each purchase contract. Standard coverage
      is 12 months from shipment against defects in materials and workmanship,
      covering cracked castings, jaw misalignment, and mechanism failure under
      normal use. Damage from misuse, overload, or unauthorized modification is
      excluded. The warranty period and claim procedure are stated on the PO,
      not discovered after the fact.
  - q: What happens if vises arrive damaged or with manufacturing defects?
    a: >-
      Report the issue within the agreed claims window (typically 7–15 days of
      arrival) with photos or video evidence. We assess the claim against
      pre-shipment inspection records and QC photos kept for your batch, then
      offer rework, replacement, or credit accordingly. Having documented
      inspection records for every unit makes this process fast and fair for
      both sides.
  - q: How do sample and tooling fees work?
    a: >-
      Sample fees cover the cost of producing 1–2 evaluation units and are
      typically credited in full against the first production order once it
      reaches the agreed volume. Tooling and pattern costs are itemized at
      quotation stage and amortized across the first production run rather than
      charged as a separate upfront fee. All fee structures are confirmed in
      writing before any commitment.
  - q: Does Stavalk accept factory audits?
    a: >-
      Yes. We welcome both on-site visits and third-party audits from buyers
      and independent inspection agencies. Our 8,000 m² campus is audit-ready
      with documented processes covering casting, machining, heat treatment,
      coating, assembly, and final inspection. A quality documentation pack
      including certificate of conformance, material certificates,
      dimensional inspection reports, and QC photos is available for every
      production batch. Virtual factory tours can be arranged for initial
      qualification.
  - q: How do I choose the right jaw size for my application?
    a: >-
      Jaw width determines clamping capacity and workpiece size range. 2″–5″
      jaws suit light-duty tasks like hobby woodworking, small metal
      brackets, and DIY projects. 6″–8″ jaws handle general professional
      work including automotive parts, medium fabrication, and repair shop
      use. 8″–10″ jaws are for heavy industrial clamping such as large
      steel assemblies, welding fixtures, and heavy machining setups. Match
      the jaw size to your largest expected workpiece, plus one size class
      of margin for versatility.
  - q: What is the difference between a bench vise and a pipe vise?
    a: >-
      A bench vise has flat parallel jaws and is designed for clamping flat or
      rectangular workpieces on a workbench for sawing, filing, drilling, or
      assembly. A pipe vise has V-shaped or curved jaws specifically shaped to
      grip round stock such as pipes, tubes, and conduits without crushing or
      marring them. Bench vises are general-purpose; pipe vises are specialized.
      Most fabrication shops carry both types.
  - q: Can I use an electric or pneumatic vise instead of a manual one?
    a: >-
      Stavalk offers both manual and power-assisted vise options. Manual vises
      use a leadscrew or quick-release mechanism operated by hand. Pneumatic
      or hydraulic vises use compressed air or fluid pressure for faster
      clamping in high-throughput production environments. Both use the same
      cast-iron body and hardened jaw inserts — the difference is in the
      actuation mechanism. Power-assisted models are recommended when operators
      perform hundreds of clamp cycles per shift.
  - q: How do I build a complete bench vise product line with Stavalk?
    a: >-
      We support multi-SKU programs covering all five series under a single
      factory agreement. Start with 2–4 anchor models matched to your target
      markets, then expand into specialty configurations like swivel-base,
      quick-release, or anvil-back models. Add spare-part SKUs including
      replacement jaw inserts, mounting bolts, base plates, and handle
      assemblies. Shared packaging systems and consistent branding across the
      line reduce per-SKU inventory costs and keep your catalog cohesive.
  - q: What spare parts and accessories does Stavalk supply?
    a: >-
      Replacement jaw inserts (hardened steel, matched to each model),
      mounting bolts and hardware kits, swivel-base components, handle
      assemblies, and base plates are all available as spares. Parts can be
      ordered alongside production or as small reorders. Keeping spare jaw
      inserts in stock is especially recommended since they are the primary
      wear component subject to replacement during the vise service life.
  - q: What should I prepare before requesting a quote?
    a: >-
      Provide your target market and intended use, preferred vise series or
      jaw size, quantity and target price, branding and packaging requirements,
      and your desired timeline. If you have drawings or reference samples,
      include them. The more specific the brief, the faster and more accurate
      the quotation — our inquiry form captures exactly this information to
      avoid unnecessary back-and-forth.
  - q: Can Stavalk provide a turnkey distribution program?
    a: >-
      Yes. We support complete distribution setups including multi-SKU catalog
      development, consistent packaging and branding across the full range,
      spare-parts stocking, and phased volume scaling as your market grows.
      Our export team handles FOB, CIF, and DDP logistics with documented
      shipment plans aligned to your inventory cycles. New distributors
      typically start with a pilot order of 20–50 pcs across 2–3 models to
      validate market fit before committing to container quantities.
  - q: How does the swivel-base option affect the vise?
    a: >-
      A swivel base lets the jaw rotate 360° around the bench post, letting you
      present the work at any angle for filing, drilling, or assembly without
      repositioning the workpiece. The base is locked in place with a locking
      handle and is tested for swivel torque so it holds position under load.
      Choose a swivel base for bench work that benefits from adjustable
      orientation; a fixed base is stronger and lower-cost if the vise sits at
      one position permanently.
  - q: What surface finishes are available on Stavalk vises?
    a: >-
      Standard finishes are powder coating and spray paint in a range of
      colors, both applied over a prepared surface for rust resistance.
      Parkerizing is available on request for industrial models where a
      matte, corrosion-resistant finish is preferred and where painting is
      not desired on machined faces. Finish choice does not affect clamping
      performance, and the selected finish is applied consistently across
      your full order so color and texture match from box to box.
