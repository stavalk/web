faqs:
  - q: ¿Dónde están ubicadas su empresa y su fábrica?
    a: >-
      Stavalk tiene su sede en Qingdao, China, con nuestra planta de
      fabricación en el distrito de Jimo. Las instalaciones de 8.000 m²
      albergan fundición, mecanizado CNC, tratamiento térmico, ensamblaje y
      control de calidad bajo un mismo techo. Las ventas, el soporte técnico
      y la logística de exportación se gestionan desde Qingdao; toda la
      producción es nacional en China.
  - q: ¿Qué productos fabrica Stavalk?
    a: >-
      Stavalk fabrica tornillos de bancada profesionales (bench vises). Ofrecemos
      cinco series de productos: tornillos ligeros de 2″–5″ para talleres
      domésticos y uso aficionado, tornillos medios de 6″–8″ para garajes y
      talleres profesionales, tornillos pesados de 8″–10″ para sujetación
      industrial, tornillos para tuberías con capacidad de 1/8″–2″ para
      fontanería y fabricación de tubos, y modelos especiales incluyentes de
      liberación rápida, base giratoria y respaldo de yunque.
  - q: ¿Cuál es la capacidad de producción anual de Stavalk?
    a: >-
      Nuestra fábrica funciona con más de 200 trabajadores cualificados y
      produce más de 80.000 tornillos de bancada al año. Actualmente exportamos
      a más de 50 países en Norteamérica, Europa, Medio Oriente, Sudeste
      Asiático y América Latina. La producción se planifica por lotes
      estacionales para mantener calendarios de entrega consistentes en todas
      las regiones.
  - q: ¿Qué materiales utiliza Stavalk para sus tornillos de bancada?
    a: >-
      Los cuerpos de los tornillos se funden en hierro gris HT200 o HT250,
      proporcionando alta rigidez y amortiguación de vibraciones. Las mordazas
      se fabrican con acero forjado 45# para resistencia estructural. Los
      insertos de mordaza utilizan acero de herramienta endurecido GCr15 o
      Cr12MoV, tratados térmicamente hasta Rockwell C 58–62 para resistencia
      al desgaste bajo ciclos de sujeción repetidos.
  - q: ¿Qué procesos de fabricación intervienen en la elaboración de un tornillo Stavalk?
    a: >-
      La producción comienza con fundición en molde de arena, utilizando tanto
      arena verde como arena de resina. Las piezas fundidas se mecanizan
      después por CNC hasta las dimensiones finales. El tratamiento térmico
      sigue para lograr el perfil de dureza requerido. El acabado superficial
      se aplica mediante pintura por pulverización, revestimiento en polvo o
      Parkerización según el modelo. El ensamblaje se realiza combinando
      trabajo manual de precisión e hidroprensado, y cada unidad pasa por un
      proceso de inspección en 7 etapas antes del embalaje.
  - q: ¿Cómo controla Stavalk la calidad antes del envío?
    a: >-
      Cada tornillo se prueba para fuerza de sujeción a capacidad nominal,
      dureza de mordaza mediante medición Rockwell C 58–62, par de giro en
      modelos con base giratoria, y durabilidad cíclica superando las 10.000
      operaciones de apriete y soltaje. La resistencia a la corrosión se
      verifica mediante pruebas de niebla salina de más de 48 horas. Las
      unidades defectuosas se rechazan en cada etapa de inspección, no solo
      en el control de calidad final.
  - q: ¿Qué certificaciones tiene Stavalk?
    a: >-
      El marcado CE se aplica a los modelos destinados a mercados de la UE según
      EN ISO 12100 y la Directiva de Máquinas 2006/42/EC (alcance confirmado por
      proyecto). Nuestra fábrica mantiene las certificaciones ISO 9001:2015 de
      gestión de calidad e ISO 14001:2015 de gestión ambiental. La documentación
      de cumplimiento REACH, RoHS y específica de mercado está disponible donde
      corresponda. Damos la bienvenida a auditorías de terceros de SGS, TÜV,
      Bureau Veritas e Intertek. Copias de los certificados pueden
      proporcionarse a compradores verificados bajo solicitud.
  - q: ¿Ofrecen fabricación OEM, ODM o de marca privada?
    a: >-
      Sí. OEM significa que fabricamos tornillos según sus especificaciones y
      planos en una de nuestras series existentes — usted es dueño del diseño
      y la propiedad intelectual. ODM significa que nuestro equipo de
      ingeniería diseña un tornillo nuevo desde cero, desde boceto conceptual
      hasta modelo 3D, muestra prototipo y pruebas de validación antes de la
      producción en volumen. Marca privada significa que aplicamos su marca,
      color de pintura y embalaje en un modelo de producción validado sin
      cambios estructurales. Firmamos un NDA antes de cualquier intercambio
      de archivos y los costes de utillaje se amortizan en la primera serie
      de producción.
  - q: ¿Cuál es la diferencia entre OEM, ODM y marca privada?
    a: >-
      OEM: usted proporciona el diseño o plano de ingeniería y nosotros
      fabricamos según sus especificaciones. ODM: usted proporciona un brief
      de mercado o requisito de rendimiento y desarrollamos el diseño completo
      del tornillo, gestionando ingeniería, prototipado y validación. Marca
      privada: usted selecciona un modelo validado existente y personaliza la
      marca, el acabado y el embalaje sin cambios de diseño. La mayoría de los
      proyectos se sitúan entre estas categorías y presupuestamos la
      configuración que se ajusta a la cantidad de propiedad del diseño que
      usted necesita.
  - q: ¿Cuáles son sus cantidades mínimas de pedido?
    a: >-
      El MOQ estándar para tornillos ligeros y medios es de 50–200 unidades
      según el modelo y la configuración. Los tornillos pesados y especiales
      tienen un MOQ menor de 20–50 unidades por su mayor valor unitario. Se
      aceptan pedidos de muestras de 1–2 unidades para evaluación, y están
      disponibles series piloto de 20–50 unidades para calificación de nuevo
      producto antes de comprometer el volumen completo.
  - q: ¿Cuál es el plazo de entrega para muestras y producción a granel?
    a: >-
      Las muestras prototipo se envían en 7–14 días una vez confirmadas las
      especificaciones. La producción a granel tarda 25–35 días desde la
      confirmación del pedido y recepción del depósito. Si se requieren nuevos
      patrones o utillaje, añadir aproximadamente 15–20 días para desarrollo
      de patrón y aprobación de primera pieza. Los plazos urgentes pueden
      estar disponibles para pedidos repetidos con utillaje existente y stock
      de material confirmado.
  - q: ¿Cómo se envían los tornillos de bancada y cuáles son las condiciones de pago?
    a: >-
      FOB Qingdao es el término de envío estándar; CIF y DDP están disponibles
      bajo solicitud. Un contenedor estándar de 20 pies contiene aproximadamente
      1.200–1.800 tornillos ligeros y medios de 4″–6″ dependiendo de la
      configuración del cartón y la densidad de embalaje. Las condiciones de
      pago son depósito para confirmar producción con el saldo pagadero antes
      del envío. Los porcentajes específicos se acuerdan por pedido y se
      escriben en el contrato.
  - q: ¿Cómo se empaquetan los tornillos de bancada para exportación?
    a: >-
      Cada tornillo se envuelve y coloca en cartones de corrugado
      personalizados con el arte de su marca, número de modelo y marcado de
      cartón según los requisitos del mercado de destino. Los modelos pesados
      e industriales se envían en cajas de madera contrachapada reforzadas.
      Cada cartón incluye hoja de instrucciones y lista de empaque de
      herrajes. Se aprueba una muestra de embalaje antes de que comience la
      producción en volumen, de modo que lo que usted aprueba es exactamente
      lo que se envía.
  - q: ¿Qué garantía ofrece Stavalk en pedidos por volumen?
    a: >-
      Los términos de garantía se escriben en cada orden de compra. La
      cobertura estándar es de 12 meses desde el envío contra defectos en
      materiales y mano de obra, cubriendo cuerpos agrietados, desalineación
      de mordazas y fallos del mecanismo bajo uso normal. Se excluyen daños
      por mal uso, sobrecarga o modificación no autorizada. El período de
      garantía y el procedimiento de reclamación se indican en la orden de
      compra, no se descubren después.
  - q: ¿Qué pasa si los tornillos llegan dañados o con defectos de fabricación?
    a: >-
      Informe del problema dentro de la ventana acordada de reclamaciones
      (normalmente 7–15 días de la llegada) con fotos o vídeo como prueba.
      Evaluamos la reclamación contra los registros de inspección pre-envío
      y las fotos de control de calidad guardadas para su lote, y ofrecemos
      remanufactura, reposición o abono según corresponda. Tener registros
      de inspección documentados para cada unidad hace que este proceso sea
      rápido y justo para ambas partes.
  - q: ¿Cómo funcionan las tarifas de muestras y utillaje?
    a: >-
      Las tarifas de muestra cubren el coste de producir 1–2 unidades de
      evaluación y normalmente se acreditan íntegramente contra la primera
      orden de producción una vez alcanzado el volumen acordado. Los costes
      de utillaje y patrones se detallan en la fase de cotización y se
      amortizan en la primera serie de producción en lugar de cobrarse como
      una tarifa separada por adelantado. Todas las estructuras de tarifas se
      confirman por escrito antes de cualquier compromiso.
  - q: ¿Acepta Stavalk auditorías de fábrica?
    a: >-
      Sí. Damos la bienvenida tanto a visitas presenciales como a auditorías
      de terceros de compradores y agencias de inspección independientes. Nuestras
      instalaciones de 8.000 m² están listas para auditorías con procesos
      documentados que cubren fundición, mecanizado, tratamiento térmico,
      revestimiento, ensamblaje e inspección final. Un paquete de documentación
      de calidad que incluye certificado de conformidad, certificados de
      material, informes de inspección dimensional y fotos de control de
      calidad está disponible para cada lote de producción. Se pueden organizar
      visitas virtuales a la fábrica para calificación inicial.
  - q: ¿Cómo elijo el tamaño de mordaza adecuado para mi aplicación?
    a: >-
      El ancho de la mordaza determina la capacidad de sujeción y el rango
      de tamaño de la pieza de trabajo. Las mordazas de 2″–5″ son adecuadas
      para tareas ligeras como carpintería de afición, pequeños soportes
      metálicos y proyectos DIY. Las de 6″–8″ manejan trabajo profesional
      general incluyendo piezas automotrices, fabricación media y uso en
      talleres de reparación. Las de 8″–10″ son para sujeción industrial
      pesada como grandes conjuntos de acero, dispositivos de soldadura y
      instalaciones de mecanizado pesado. Elija el tamaño de mordaza según
      su pieza de trabajo esperada más grande, más una clase de margen para
      versatilidad.
  - q: ¿Cuál es la diferencia entre un tornillo de bancada y un tornillo para tuberías?
    a: >-
      Un tornillo de bancada tiene mordazas planas y paralelas y está diseñado
      para sujetar piezas planas o rectangulares en una bancada para serrar,
      limpiar, taladrar o ensamblar. Un tornillo para tuberías tiene mordazas
      en forma de V o curvadas, específicamente moldeadas para sujetar
      material redondo como tubos y conducciones sin aplastarlos ni dañarlos.
      Los tornillos de bancada son de uso general; los de tuberías son
      especializados. La mayoría de los talleres de fabricación llevan ambos
      tipos.
  - q: ¿Puedo usar un tornillo eléctrico o neumático en lugar de uno manual?
    a: >-
      Stavalk ofrece opciones tanto manuales como asistidas por energía. Los
      tornillos manuales utilizan un husillo o mecanismo de liberación rápida
      operado a mano. Los tornillos neumáticos o hidráulicos usan aire
      comprimido o presión de fluido para un apriete más rápido en entornos
      de producción de alto rendimiento. Ambos utilizan el mismo cuerpo de
      hierro fundido e insertos de mordaza endurecidos — la diferencia está
      en el mecanismo de accionamiento. Los modelos asistidos por energía se
      recomiendan cuando los operarios realizan cientos de ciclos de sujeción
      por turno.
  - q: ¿Cómo construyo una línea completa de tornillos de bancada con Stavalk?
    a: >-
      Apoyamos programas multi-SKU que cubren las cinco series bajo un único
      contrato de fábrica. Comience con 2–4 modelos ancla adaptados a sus
      mercados objetivo, luego expanda a configuraciones especiales como base
      giratoria, liberación rápida o respaldo de yunque. Añada SKU de piezas
      de repuesto incluyentes insertos de mordaza de repuesto, tornillos de
      montaje, placas base y conjuntos de manillar. Los sistemas de embalaje
      compartidos y el marcaje consistente en toda la línea reducen los costes
      de inventario por SKU y mantienen su catálogo cohesivo.
  - q: ¿Qué piezas de repuesto y accesorios suministra Stavalk?
    a: >-
      Insertos de mordaza de repuesto (acero endurecido, adaptados a cada
      modelo), tornillos de montaje y kits de herrajes, componentes de base
      giratoria, conjuntos de manillar y placas base están disponibles como
      repuestos. Las piezas se pueden pedir junto con la producción o como
      pedidos de reabastecimiento pequeños. Se recomienda especialmente
      mantener insertos de mordaza de repuesto en stock ya que son el
      componente de desgaste principal sujeto a reemplazo durante la vida
      útil del tornillo.
  - q: ¿Qué debo preparar antes de solicitar una cotización?
    a: >-
      Proporcione su mercado objetivo y uso previsto, la serie de tornillo o
      tamaño de mordaza preferidos, cantidad y precio objetivo, requisitos de
      marca y embalaje, y su calendario deseado. Si tiene planos o muestras
      de referencia, inclúyalos. Cuanto más específico sea el brief, más rápida
      y precisa será la cotización — nuestro formulario de consulta captura
      exactamente esta información para evitar idas y venidas innecesarias.
  - q: ¿Puede Stavalk proporcionar un programa de distribución integral?
    a: >-
      Sí. Apoyamos configuraciones de distribución completas incluyendo
      desarrollo de catálogo multi-SKU, embalaje y marcaje consistentes en
      toda la gama, stock de piezas de repuesto y escalado de volumen gradual
      a medida que su mercado crece. Nuestro equipo de exportación gestiona
      logística FOB, CIF y DDP con planes de envío documentados alineados a
      sus ciclos de inventario. Los nuevos distribuidores normalmente comienzan
      con un pedido piloto de 20–50 unidades en 2–3 modelos para validar la
      adaptación al mercado antes de comprometer cantidades de contenedor.
  - q: ¿Cómo afecta la opción de base giratoria al tornillo?
    a: >-
      Una base giratoria permite que la mordaza rote 360° alrededor del poste
      de la bancada, permitiéndole presentar la pieza en cualquier ángulo para
      limar, taladrar o ensamblar sin reposicionar la pieza de trabajo. La
      base se fija con un manillar de bloqueo y se prueba el par de giro para
      que mantenga la posición bajo carga. Elija una base giratoria para
      trabajos de bancada que se beneficien de orientación ajustable; una base
      fija es más resistente y de menor coste si el tornillo permanece en una
      posición permanentemente.
  - q: ¿Qué acabados superficiales están disponibles en los tornillos Stavalk?
    a: >-
      Los acabados estándar son revestimiento en polvo y pintura por
      pulverización en una gama de colores, ambos aplicados sobre una
      superficie preparada para resistencia a la oxidación. La Parkerización
      está disponible bajo solicitud para modelos industriales donde se prefiere
      un acabado mate resistente a la corrosión y donde no se desea pintura en
      las caras mecanizadas. La elección del acabado no afecta el rendimiento
      de sujeción, y el acabado seleccionado se aplica de manera consistente
      en todo su pedido para que el color y la textura coincidan de caja a caja.
